<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educazione civica · Didattica</title>
<link rel="stylesheet" href="../assets/stile.css">
<style>:root { --accento: var(--educazione-civica); }</style>
</head>
<body data-materia="educazione-civica" data-base="../">
<div class="pagina">
  <header class="testata">
    <p class="briciole"><a href="../index.html">Materiali didattici</a></p>
    <h1>Educazione civica</h1>
    <p class="intro">Costituzione, cittadinanza, ambiente e vita in comunità.</p>
  </header>

  <main class="corpo">
    <div class="filtri">
      <div class="classi" role="group" aria-label="Filtra per classe">
        <button type="button" data-classe="tutte">Tutte</button>
        <button type="button" data-classe="prima">Prima</button>
        <button type="button" data-classe="seconda">Seconda</button>
        <button type="button" data-classe="terza">Terza</button>
      </div>
      <input id="cerca" type="hidden" value=""><!-- la ricerca è nel menu in alto (assets/barra.js) -->
    </div>
    <div id="materiali"></div>
  </main>

  <footer class="piede"><a href="../index.html">Torna a tutte le materie</a></footer>
</div>

<!-- Se le lezioni non compaiono (browser troppo vecchio o errore), mostra un avviso con il nome del browser -->
<script>
(function () {
  var errori = [];
  window.onerror = function (msg, file, riga) { errori.push(msg + (file ? " (" + String(file).split("/").pop().split("?")[0] + ", riga " + riga + ")" : "")); };
  function controlla() {
    var box = document.getElementById("materiali");
    if (!box) return;
    var caricato = (typeof MODULI !== "undefined");
    if (caricato && box.innerHTML.replace(/\s/g, "") !== "") return;
    var catalogo = caricato ? "caricato" : "NON caricato";
    box.innerHTML = '<div style="border:2px solid #B3412F;border-radius:8px;padding:12px 16px;background:#fff;color:#222;font-family:Arial,sans-serif">' +
      '<p style="margin:0 0 6px;font-weight:bold">Le lezioni non si sono caricate.</p>' +
      '<p style="margin:0 0 6px">Prova a ricaricare la pagina (Ctrl+F5). Se il problema resta, il browser di questo computer potrebbe essere troppo vecchio: usa Chrome, Edge o Firefox aggiornati.</p>' +
      '<p style="margin:0;font-size:13px;color:#555">Per chi gestisce il sito: catalogo ' + catalogo + '; browser: ' + navigator.userAgent + (errori.length ? '; errore: ' + errori.join(" | ") : '') + '</p></div>';
  }
  if (window.addEventListener) window.addEventListener("load", function () { setTimeout(controlla, 300); });
  else if (window.attachEvent) window.attachEvent("onload", function () { setTimeout(controlla, 300); });
})();
</script>
<!-- Il catalogo viene sempre scaricato aggiornato (niente copie vecchie nel browser) -->
<script>document.write('<script src="../materiali.js?v=' + Date.now() + '"><\/script>');</script>
<script src="../assets/sito.js"></script>
<script src="../assets/barra.js"></script>
</body>
</html>
