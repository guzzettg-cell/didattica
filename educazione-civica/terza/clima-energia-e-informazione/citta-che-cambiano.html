    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0Ei6GBTu2Z5NwR512YNMbYFDLdod4YAvEYyxCCr8n2TuPyvmD1yYu4S4f1ftgHkARl",
    text: `Quando la pioggia cade con violenza su Copenhagen, alcune piazze non si allagano: si riempiono. Lentamente, senza panico. Sono progettate così. Nel quartiere di Sankt Kjelds, il primo climate resilient district d’Europa, l’acqua non è un nemico da respingere, ma una presenza da governare. Le strade sono state ridisegnate per deviare il flusso meteorico verso giardini filtranti e cisterne sotterranee. Le aiuole assorbono, i marciapiedi drenano, le superfici rallentano. Qui l’adattamento climatico si tocca, si cammina, si attraversa. È spazio urbano che sa cosa fare quando arriva la tempesta. A Copenhagen, nulla è lasciato al caso. La sostenibilità non è una bandiera, ma un metodo. Si vive in quartieri densi ma accessibili, si viaggia in metropolitana automatica o in traghetti elettrici. Si nuota — in aree specificamente balneabili del porto — e si scia su un termovalorizzatore. Tutto convive in equilibrio, in una città che cresce senza dimenticare i suoi limiti. Con 650.000 abitanti e quasi 1,9 milioni nell’area metropolitana, Copenhagen punta a superare gli 800.000 entro il 2035. Ma la crescita è regolata: secondo il Kommuneplan 2024, nessun nuovo insediamento residenziale può iniziare senza che siano già realizzati i servizi pubblici essenziali. Questo vale ovunque: da Nordhavn a Ørestad, ogni nuovo quartiere deve garantire scuole, trasporti, aree verdi e spazi pubblici prima ancora che vengano autorizzati gli edifici. È una condizione vincolante. Il disegno urbano rispetta il Finger Plan, introdotto nel 1947 e aggiornato negli anni. Le cinque “dita” rappresentano direttrici di sviluppo lungo le linee ferroviarie, separate da corridoi verdi. La città cresce per addizione, non per salti. Ogni nuovo nucleo è compatto, accessibile, pensato per offrire tutto in 15 minuti a piedi o in bici. La metropolitana automatica — costruita da imprese italiane — collega ogni punto strategico con quattro linee, treni accessibili e frequenze fino a 90 secondi. Il biglietto è unico, valido per metro, treni, autobus e traghetti elettrici, e può essere caricato sulla Rejsekort, la tessera ricaricabile che calcola la tariffa in base alle zone attraversate. In superficie, oltre 400 chilometri di piste ciclabili protette collegano scuole, uffici e residenze. Il 62 per cento dei residenti usa la bici ogni giorno. L’acqua è una presenza costante. Il porto è balneabile solo in alcune aree sicure, ma rappresenta un’eccezione europea: una riqualificazione fondata su decenni di investimenti nella depurazione. Dopo la devastante alluvione del 2011, è nato il Cloudburst Management Plan, un piano da 11,5 miliardi di corone (circa 1,54 miliardi di euro), finanziato anche tramite le bollette dell’acqua. Oltre 300 progetti combinano drenaggio urbano, spazi verdi e bacini temporanei. A Sankt Kjelds e in molti altri quartieri, la città è stata fisicamente riconfigurata per accogliere e smaltire le piogge estreme e per il riuso dell’acqua piovana. Il verde urbano supera i 550 ettari e copre una media di circa 40 mq per abitante. Ogni distretto ha accesso a parchi, giardini scolastici, tetti verdi e spazi condivisi. Da Superkilen a Nørrebro, con arredi urbani provenienti da decine di paesi, fino alla riserva di Amager Fælled, il verde a Copenhagen è parte di un’infrastruttura diffusa e multifunzionale. La gestione dei rifiuti è un altro segno di coerenza. Ogni condominio è obbligato ad avere vani interni dedicati alla raccolta differenziata, con contenitori separati per carta, plastica, organico, vetro, metalli, tessili e RAEE. I bidoni in strada non esistono. I controlli sono accurati, le infrazioni rare. Il residuo secco finisce al termovalorizzatore pubblico di Amager Bakke (CopenHill), che produce energia elettrica per 30.000 abitazioni e calore per 150.000. Sul tetto, una pista da sci artificiale e un sentiero urbano aperto al pubblico. La città punta alla neutralità carbonica entro il 2035, almeno per le attività direttamente controllate dalla municipalità. Il bilancio ambientale per il periodo 2024–2027 è di 4,9 miliardi di corone (circa
660 milioni di euro). Gli investimenti principali riguardano il rafforzamento della mobilità sostenibile, l’efficienza energetica, l’adattamento climatico e l’edilizia a prezzi accessibili. Il 20 per cento degli alloggi di nuova costruzione deve essere riservato a fasce con redditi medi o bassi. A rendere tutto questo possibile non è solo la competenza tecnica, ma una cultura politica della trasparenza. Il portale degli open data, i dati aperti, raccoglie migliaia di dataset aggiornati su energia, mobilità, clima, popolazione, suolo, rifiuti. Ogni progetto è tracciabile: nome del responsabile, scadenze, finanziamenti. Gli open data non sono decorativi o fasulli come accade spesso nelle città italiane. Sono strumenti attivi di governo e verifica, usati da cittadini, ricercatori, giornalisti, tecnici. È una democrazia che si misura anche con le cifre. Nessuna città si governa da sola. Ma Copenhagen (Københavns Kommune) dimostra che un’amministrazione pubblica può costruire fiducia, giorno dopo giorno, progetto dopo progetto, contenitore dopo contenitore. Non è una città da cartolina. È una città che lavora, controlla, corregge. E nel farlo, fa spazio alla qualità della vita e alla bellezza. Lo racconta meglio di tutto la rete capillare di biblioteche di quartiere, aperte, vissute, frequentate ogni giorno da bambini che sciamano tra i libri, i giochi e le bici parcheggiate fuori. Qui si impara a leggere e ad andare in bicicletta prima ancora che a camminare. È così che si forma una cittadinanza: non per obbligo, ma per buone pratiche condivise.`,

    text: `Il passaggio pedonale davanti alla biblioteca Oodi sembra disegnato con cura artigianale. È rialzato, largo, attraversato da strisce bianche spesse, illuminate da una luce diffusa anche nelle ore più fredde. Le auto si fermano con naturalezza. Nessuno accelera. Nessuno suona. Il traffico segue un ritmo umano. In un anno, nessun morto sulla strada. Nessuna vittima per incidenti stradali. È successo qui, a Helsinki, l’unica grande capitale europea a chiudere l’anno senza lutti da traffico. La notizia è apparsa in prima battuta su qualche giornale locale, poi rilanciata da agenzie. Nessun annuncio ufficiale, nessun sindaco a rivendicarne il merito. Solo il dato. E la vita che continua. Helsinki (Helsingin kaupunki - Helsingfors stad - City of Helsinki), con i suoi 655.000 abitanti, è il cuore di un’area metropolitana che supera il milione e duecentomila residenti. Espoo, Vantaa e Kauniainen non sono sobborghi anonimi, ma città vere, ben collegate, con scuole, tram, centri civici. La regione funziona come un sistema, più che come un agglomerato. Non è un caso. È l’effetto di un’organizzazione urbana che ha saputo disinnescare i rischi con metodo. Qui i limiti di velocità si rispettano non per paura, ma per abitudine. In centro si circola a 30 km/h. I dossi, i cordoli, i marciapiedi rialzati sono parte del paesaggio, non barriere. La segnaletica è chiara, quasi discreta. I semafori pedonali non fanno aspettare minuti interi. E i controlli funzionano. La Finlandia è servita da una rete di oltre mille punti di controllo automatico della velocità, con decine di dispositivi fissi anche nel perimetro urbano. Le telecamere sono omologate per registrare ogni tipo di infrazione: semafori bruciati, velocità eccessiva, precedenze non rispettate. Le multe vengono notificate a casa. Non servono blitz, pattuglie in agguato o campagne di allarme. È il sistema che funziona, giorno dopo giorno, senza eccezioni. E funziona anche perché è percepito come equo. In Finlandia le sanzioni stradali sono proporzionali al reddito, calcolate in base alla dichiarazione fiscale. Chi guadagna di più, paga di più. Il principio è semplice: la punizione deve essere efficace per tutti, non solo per chi ha meno. Ma non è solo una questione di regole. È un assetto complessivo che tiene insieme urbanistica, trasporti, servizi, socialità. Helsinki non ha mai inseguito l’eccezionale. Ha preferito costruire una quotidianità solida, dove il sistema funziona per sottrazione: niente ostacoli inutili, niente tempi morti, niente ostentazioni. I tram tagliano la città con precisione. Sono silenziosi, accessibili, frequenti. Gli autobus arrivano puntuali anche con la neve. Le pensiline sono attrezzate, i tempi d’attesa visibili in tempo reale. La rete ciclabile si estende per oltre 1.600 chilometri, con percorsi separati, sicuri, manutenuti anche d’inverno. Il bike sharing non è un esperimento: è parte del sistema. Ogni quartiere è pensato per essere abitabile a piedi. Scuole, negozi, biblioteche e centri medici sono distribuiti in modo omogeneo. Le nuove costruzioni rispettano una logica di densità controllata: volumi alti ma integrati, spazi condivisi, cortili vivi. La crescita è guidata, non lasciata al caso. Il verde è parte strutturale. Non decorazione, ma infrastruttura. I parchi sono ovunque, non concentrati al centro. I giardini della pioggia gestiscono le acque meteoriche. I tetti verdi isolano gli edifici. Anche nei parcheggi, rari e spesso sotterranei, crescono alberi. Ogni spazio è pensato per mitigare il caldo, favorire l’incontro, accogliere la sosta. Le scuole pubbliche sono presidi civici. Alcune ospitano biblioteche, laboratori serali, spazi per l’infanzia. Gli asili sono integrati nel tessuto urbano, a volte dentro i parchi. I servizi di salute mentale funzionano per prossimità: centri leggeri, diffusi, aperti a tutti. I luoghi dell’abitare e quelli del curare non sono separati.
Anche la casa è una questione pubblica. Il 25 per cento degli alloggi è comunale o cooperativo. Le assegnazioni seguono logiche miste, per evitare segregazioni. Gli standard edilizi sono omogenei, senza segnali distintivi tra alloggi popolari e privati. Le residenze per studenti, migranti, anziani sono distribuite, non confinate. Sul fronte ambientale, Helsinki ha scelto la coerenza. Il teleriscaldamento centrale serve gran parte delle abitazioni, alimentato da fonti in parte rinnovabili. I rifiuti vengono raccolti in modo differenziato, con sistemi pneumatici in vari quartieri. Ciò che resta viene smaltito in termovalorizzatori ad alta efficienza, con recupero energetico. Non è una città perfetta. Ma è una città che funziona. A un incrocio, un anziano attraversa lentamente con un deambulatore. Il tram si ferma qualche secondo prima. Nessuno protesta. È normale. Qui, la normalità è già un traguardo.`,

  {
    num: 28, title: "Rotterdam, L’Acqua Disegna La Città", city: "Rotterdam", country: "Paesi Bassi",
    lat: 51.9244, lon: 4.4777, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0X8J1RHnuAkuevMWEtqvsJUKPXDZZb8ocgndND85xV3b3fFuQhBZRNV2UiDdmdprUl",
    text: `Ci sono città che si raccontano da sole, in superficie. Poi ci sono quelle come Rotterdam, che vanno ascoltate sottopelle. Dove l’asfalto è poroso, i tetti respirano e le piazze si riempiono d’acqua senza chiedere il permesso. Una città che non si guarda allo specchio, ma che ha imparato a funzionare. A stare al mondo. Senza esibirsi. Nel 1953 un’alluvione devastò l’Olanda sud-occidentale. Morirono 1.836 persone. Acque salate e fredde spezzarono dighe, costrinsero interi villaggi a salire sui tetti. Da allora, il piano Delta è diventato una missione nazionale. Ma Rotterdam, affacciata sull’estuario del Nieuwe Maas, ha scelto un’altra via: non respingere l’acqua, ma accoglierla. Integrarla nel paesaggio urbano. Trattarla come un’infrastruttura, non come un nemico. Così sono nate piazze drenanti, parchi inondabili, bacini nascosti sotto i parcheggi, giardini pensili su ogni nuovo tetto. Tutto ciò che può trattenere l’acqua è parte del disegno urbano. Una coreografia tecnica e sensibile che danza sul bordo della crisi climatica. Qui l’acqua non si limita a scorrere: prende parte alla vita della città. La Waterplein Benthemplein è l’immagine perfetta di questa logica. Una piazza scavata nella pendenza, con vasche geometriche che restano asciutte per lunghi periodi, diventano campi da basket, spazi per concerti, e si riempiono solo quando la pioggia lo richiede. Un sistema di tubi invisibili la collega ai tetti degli edifici vicini. È la città che anticipa l’imprevisto. Senza strepito. Più di 80.000 metri quadrati di tetti sono stati trasformati in superfici verdi. Assorbono acqua, trattengono calore, migliorano l’aria. Alcuni ospitano orti, altri colonie di impollinatori. L’architettura qui è viva, reattiva, quotidiana. Sotto il Museumpark, un parcheggio nasconde un enorme bacino di raccolta. Al Kruisplein, nel cuore cittadino, una cisterna da 10.000 metri cubi alleggerisce il sistema fognario durante i nubifragi. Infrastrutture silenziose, ma fondamentali. Sono le fondamenta della città che ha scelto di non affondare. Con oltre 650.000 abitanti in città e più di due milioni nell’area metropolitana, Rotterdam è anche una delle città olandesi con il più alto tasso di soddisfazione urbana: secondo l’ultimo sondaggio comunale, oltre il 75 per cento dei residenti si dice contento di vivere qui. Ma non tutto è risolto. Nei quartieri di Delfshaven e Charlois, molti lamentano l’aumento degli affitti, la qualità dell’edilizia sociale e l’impatto delle bollette energetiche. Il tasso di povertà resta superiore alla media nazionale, e la coesione sociale è ancora un lavoro in corso. E poi c’è il porto. Primo in Europa. Un ecosistema che si allunga fino al Mare del Nord, tra container, treni, chiatte, silenziosamente. Il Maasvlakte – piattaforma artificiale costruita nel mare – è uno dei progetti ingegneristici più ambiziosi del continente. E oggi ospita dune, uccelli migratori, piste ciclabili. Il confine tra industria e natura qui non è netto: si stratifica. Rotterdam non ha nascosto il suo passato portuale. Lo ha trasformato. Kop van Zuid, Katendrecht, Rijnhaven: ex moli diventati quartieri vivi. Scuole, case, ponti, funivie urbane. L’architettura contemporanea ha trovato qui il suo palcoscenico: l’Erasmusbrug di Ben van Berkel, le torri verticali di Mecanoo, la Rotterdam di OMA, il Markthal di MVRDV. Tutto si riflette sull’acqua. Tutto si misura con la realtà. È una città concreta. Ma con una visione ambientale forte. Il calore residuo delle industrie portuali alimenta la rete di teleriscaldamento urbano, che punta a raggiungere 500.000 abitazioni entro il 2030. Le nuove costruzioni sono passive o quasi-zero-energia. Anche i quartieri popolari incorporano pannelli solari, pompe di calore, facciate ventilate. Gli standard pubblici sono rigorosi. E rispettati.
Rotterdam ha ridotto sistematicamente lo spazio per le auto. Il centro è ZTL, i parcheggi sono sotterranei e costosi. Le piste ciclabili sono larghe, continue, sicure. I tram passano con cadenza da metropolitana. Con un’unica app – Maas, Mobility as a Service – si può pianificare e pagare ogni spostamento: treni, bici, autobus, traghetti, taxi elettrici. Ma è più di un’infrastruttura: è una cultura. Oltre il 60 per cento degli abitanti si muove ogni giorno in bici o mezzi pubblici. I parcheggi custodiscono migliaia di biciclette. I mezzi sono accessibili, con sistemi per ipovedenti. Gli studenti viaggiano gratis. Anche le periferie sono collegate, anche di notte. Nei quartieri popolari, la transizione ambientale è visibile. Cortili con vasche di raccolta, scuole con pavimenti drenanti, case isolate con tetti verdi. Nelle biblioteche si tengono incontri sull’adattamento climatico, con mappe animate del rischio alluvioni. L’aria è più pulita rispetto a vent’anni fa. Anche grazie a bus elettrici e traghetti a basse emissioni. I mercati rionali vendono ortaggi coltivati sui tetti. Il parco Dakpark – un chilometro verde costruito sopra un centro commerciale – è frequentato da famiglie, adolescenti, anziani. Nessuna retorica da cartolina: è un luogo che serve. E resiste. Rotterdam ha imparato a integrare. Le soluzioni tecniche non sono separate dalla vita. I bambini sanno cos’è una piazza drenante. Gli abitanti parlano dei tetti verdi come di cose normali. Gli ingegneri progettano con artisti e paesaggisti. Perché qui, la resilienza non è una parola alla moda: è il modo in cui si cammina, si pedala, si vive.`,
    spunti: "La storia delle grandi alluvioni come motore delle politiche di gestione dell'acqua; l'urbanistica dei Paesi Bassi sotto il livello del mare.",
    attivita: "Cerca informazioni sull'alluvione del 1953 nei Paesi Bassi: quali zone furono colpite e quante persone morirono? Localizza Rotterdam rispetto al livello del mare su una carta fisica.",
    summary: "Rotterdam è una città che va ascoltata sottopelle: l'asfalto è poroso, i tetti respirano, le piazze si riempiono d'acqua senza chiedere permesso. Dopo l'alluvione del 1953, che devastò l'Olanda sud-occidentale causando quasi duemila morti, la città ha imparato a convivere con l'acqua invece di combatterla soltanto con dighe."

  {
    num: 29, title: "Jerez, La Vite Che Protegge La Vita", city: "Jerez de la Frontera", country: "Spagna",

    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0eiQoZH1kLY8NJv75XMjSniJ6ZuLCKESHAgHkRYqZWHJGW4QhrW5GHZSBoYkFt6svl",
    text: `A mezzogiorno, in Calle Cadenas, si cammina rasente ai muri. Il sole cade dritto, senza ostacoli, e la pietra scalda l’aria come una stufa. Poi si passa sotto una pergola coperta di foglie, e qualcosa cambia. Non è solo l’ombra: è un’aria diversa, più lenta. Le piante non parlano, ma si fanno sentire. E a Jerez, quest’estate, stanno cambiando la città. Qualcuno le chiama ancora piante da cortile. Qui le chiamano parras. Sono viti rampicanti, varietà non fruttifera, che crescono in fretta e si aggrappano a griglie leggere. Il nome scientifico è Vitis riparia. In passato servivano a fare ombra nei patii. Oggi si usano per raffreddare le strade. Senza attendere approvazioni, un gruppo di abitanti ha cominciato a piantarle. Le prime vie coperte sono Calle Cadenas, Pozo Dulce, Rincón Malillo, Siete Revueltas. Non c’è un piano regolatore dietro. Solo l’idea che si può vivere meglio, anche d’estate, se si lascia crescere qualcosa sopra la testa. È un esempio limpido di cittadinanza attiva, in cui la comunità interviene sul proprio spazio con mezzi minimi ma effetti reali, spingendo l’amministrazione ad ascoltare e, infine, ad agire. Jerez de la Frontera conta poco più di duecentomila abitanti ed è candidata a Capitale Europea della Cultura 2031. La città si trova in Andalusia, nell’entroterra della provincia di Cadice. È conosciuta per il flamenco, per i cavalli e per le sue bodegas. Una di queste, González Byass, custodisce al suo interno la celebre Calle Ciegos, coperta da un pergolato di parras secolari. Le bodegas, a Jerez, sono molto più di semplici cantine: sono architetture produttive, spesso storiche, dove si affina e si conserva lo sherry, il vino liquoroso locale. Ed è proprio da lì, forse, che qualcuno ha preso spunto. A supportare l’azione, il laboratorio Fab Lab Jerez, ospitato in una ex scuola professionale, ha installato dieci sensori termici lungo le vie coinvolte. I sensori, posizionati sia sotto le parras che nelle aree scoperte, registrano differenze fino a otto gradi centigradi sulla superficie del suolo. Le misurazioni mostrano anche un miglioramento dell’umidità percepita e una riduzione dello stress termico secondo l’indice UITC. I risultati sono concreti e pubblici, aggiornati ogni settimana. Senza compensi, senza commesse. È un esempio raro ma efficace di cittadinanza attiva affiancata da un’adesione tecnica volontaria del settore privato: un binomio che, in questo caso, ha funzionato come leva civica e operativa allo stesso tempo. E proprio in questa alleanza tra spontaneità e rigore si intravede la forza replicabile del modello: interventi leggeri, a basso costo, facilmente adattabili ad altri contesti urbani, purché sorretti da una comunità attenta e da competenze tecniche disposte a collaborare senza protagonismi. Le viti, scelte proprio per la loro resistenza e assenza di frutto, non attraggono insetti né rilasciano residui. Le radici crescono in verticale e non interferiscono con i marciapiedi. Dopo una prima fase di irrigazione, diventano autonome. In due o tre stagioni creano un tetto verde permanente, senza costi elevati, senza disturbo visivo. E con un impatto tangibile sulla qualità dell’aria e del suolo. Naturalmente non tutte le strade hanno risposto allo stesso modo. In Calle Siete Revueltas, su quattordici viti piantate ne è sopravvissuta una sola. Qualcuna è stata rovinata dai gatti, qualcuna divelta da passaggi notturni. Ma nelle altre strade, la crescita è andata avanti. Alcuni cavi sono fissati direttamente alle pareti delle case, con il consenso informale dei residenti. Una signora, che all’inizio era contraria, ha raccontato che adesso si addormenta più facilmente la sera “perché il fruscio delle foglie copre il rumore del traffico”. Il gruppo che ha dato il via all’iniziativa si chiama Emparrados. Non è registrato, non ha statuto. Non ha mai chiesto un finanziamento. “Non volevamo fondare un’associazione,” racconta Juan, meccanico, uno dei promotori. “Volevamo solo piantare ombra.” Ana, pensionata di Calle Pozo
Dulce, racconta che pensava fosse una trovata effimera. “Poi ho iniziato a camminarci sotto. Anche il mio cane sceglie sempre quel lato della strada.” Il Comune, all’inizio estraneo all’iniziativa, ha osservato. Ma ora, di fronte ai risultati, ha deciso di includere il progetto nella candidatura culturale. È uno di quei rari casi in cui la proposta parte dal basso, funziona, e viene adottata dalle istituzioni senza stravolgerla, con un riconoscimento implicito del ruolo generativo delle pratiche civiche. L’obiettivo è estendere le parras a venti strade entro il 2031. Secondo l’architetto Sergio Rodríguez, dello studio sevillano Nomad Garden, l’iniziativa delle parras rappresenta una strategia urbana replicabile in contesti simili. “È una misura di salute pubblica. Un piano di adattamento al caldo che funziona soprattutto dove gli alberi non entrano, e dove non c’è tempo per aspettare dieci anni prima che crescano.” Intorno a queste strade, anche il resto della città si sta muovendo. Il mercato di Federico Mayo riaprirà a settembre con un progetto di riuso sociale. L’ex Cine Astoria sarà convertito in spazio multifunzionale per attività culturali. In molte piazze secondarie sono in corso lavori di pavimentazione sostenibile e rinnovamento dell’illuminazione pubblica. Il piano comunale per la rigenerazione del centro storico si muove su più livelli, ma la copertura vegetale resta il segno più visibile — e più semplice — del cambiamento in atto. Nel frattempo, Calle Ciegos continua a essere lavata a mano ogni settimana, per mantenere pulito il pergolato. È uno dei luoghi più fotografati della città. Ma chi vive a Jerez oggi sa che ci sono altre vie, meno note, dove l’ombra è nuova e le foglie crescono ogni giorno un po’ di più. Nessuna celebrazione, nessuna targa. Solo una vite che sale. E una città che comincia a camminare un po’ più lentamente.`,
    spunti: "Soluzioni tradizionali di raffrescamento urbano; il verde come infrastruttura contro le ondate di calore.",

    summary: "Camminando sotto il sole di mezzogiorno a Jerez, la pietra scalda l'aria come una stufa: ma appena si passa sotto una pergola coperta di foglie di vite (le \"parras\"), l'aria cambia. Quest'estate la città sta riscoprendo queste piante rampicanti tradizionali come strumento naturale contro il caldo estremo."

  {
    num: 30, title: "Bergen, La Città Che Fa Sparire I Rifiuti", city: "Bergen", country: "Norvegia",
    lat: 60.3913, lon: 5.3221, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02336ahuPxAG3awQtXK6XpymW8UN7A2qrQ6eDSXveQtaqJp7kJc5fAXRCpWsZPzQKMl",
    text: `Un click metallico, un tonfo ovattato, e poi il buio. L’aria afferra un sacchetto di rifiuti organici e lo spinge in avanti, rapido, sessanta all’ora dentro un tubo che serpeggia sotto un molo antico. Sopra, il passo lento dei turisti, dei cittadini e dei pescatori, il rumore delle scarpe sul legno, l’odore di pesce e catrame che sale dal porto. Bergen, costa occidentale della Norvegia, città di mare e di montagne, è adagiata tra sette cime e aperta all’Atlantico. Davanti si allunga Bryggen, il quartiere anseatico Patrimonio UNESCO, con le sue case ocra e rosse ricostruite dopo l’incendio del 1702, ancora oggi fatte di legno come secoli fa. Fino a pochi anni fa, qui i camion della nettezza urbana si infilavano tra le facciate, rimbombavano nei vicoli, si fermavano a svuotare cassonetti, lasciando dietro rumore e odori. Oggi non passano più. Il rifiuto sparisce in silenzio, sottoterra. Bergen conta 290mila abitanti nel comune e più di 430mila nell’area metropolitana servita dalla sua azienda pubblica, BIR Nett AS. La raccolta sotterranea, progettata e installata con il know-how tecnologico della svedese Envac Group, è iniziata nel 2008 e si è estesa a lotti, approfittando di ogni scavo per altri sottoservizi. I tubi, mezzo metro di diametro, corrono a quattro o sei metri di profondità. L’aria compressa spinge i sacchetti verso la stazione di raccolta fuori dal centro: pochi secondi di viaggio, e il vicolo resta pulito. Il conferimento avviene davanti a una colonna bassa, lucida, con tre bocchette: marrone per l’organico, blu per i riciclabili, grigia per il residuo secco. Si apre solo con una tessera elettronica RFID, Radio Frequency Identification, che registra l’utente, la frazione e il volume. Il rifiuto residuo si paga, organico e riciclabili no: la parte variabile della tariffa si calcola solo sul secco indifferenziato, mentre le altre frazioni non comportano costi aggiuntivi, così chi separa bene riduce la bolletta. Oggi la rete pneumatica di Bergen – il Bossnettet – copre circa sette chilometri quadrati del centro, servendo oltre dodicimila utenze domestiche e commerciali, pari a circa ventiquattromila persone. Bryggen ne è la parte più celebre, ma i tubi corrono anche sotto altri quartieri storici e commerciali. Fuori da quest’area, la raccolta resta tradizionale, ma l’obiettivo è connettere fino a trentamila abitazioni. Realizzarla non è stato semplice. Il sottosuolo del centro è un intrico di cavi, condotte idriche e fognarie, fibre ottiche. A Bryggen, i tubi passano sotto palafitte lignee del Seicento, vincolate dall’UNESCO. Qui si è lavorato con micro-tunnel scavati a mano, iniezioni di consolidamento per stabilizzare il terreno, deviazioni di tracciato per evitare fondazioni e reperti. In altre zone, la roccia affiora a pochi metri, obbligando a fresature lente e rumorose. Ogni nuovo tratto è stato posato approfittando di cantieri già aperti, per ridurre costi e disagi. La bocchetta si richiude. Un sensore di riempimento invia il segnale, la valvola si apre e, in un attimo, un sacchetto di rifiuti organici viene inghiottito. L’aria è un fiume invisibile che lo trascina lungo condotte che seguono l’andamento delle strade sopra di lui. Curva, rettilineo, curva. Ci sono brevi tratti in pendenza, accelerazioni, poi una lunga discesa. Le pareti interne del tubo sono lisce, studiate per ridurre l’attrito. Si sente il rumore profondo dei ventilatori industriali, il battito ritmico dei giunti. A tratti, attraverso griglie di manutenzione, filtra il rumore ovattato della vita in superficie: un portone che sbatte, un autobus che frena lontano. Il sacchetto di rifiuti organici arriva alla stazione di raccolta, un edificio anonimo alla periferia del centro. L’aria si separa da lui in un ciclone metallico; un impianto di filtraggio la purifica prima di restituirla all’esterno. Il sacchetto scivola in un container dedicato.
Altri contenitori raccolgono plastica, metalli, cartone. Il residuo secco prende un’altra via. Un sistema di controllo, lo SCADA – Supervisory Control And Data Acquisition – registra ogni movimento: peso, tempi, eventuali guasti. Sullo schermo di un operatore, decine di punti verdi e rossi raccontano in tempo reale la salute della rete. Da qui, il viaggio prosegue: l’organico va a un impianto di digestione anaerobica, dove batteri invisibili lo trasformano in biogas e fertilizzante. I riciclabili viaggiano verso i centri di selezione del distretto di Vestland. Il residuo entra in un termovalorizzatore, dove il calore prodotto scalda case e uffici e l’elettricità alimenta la rete. È qui che Bergen si distacca dalle visioni “zero waste” più rigide: in Norvegia oltre metà dei rifiuti urbani passa per impianti di recupero energetico, considerati parte della gerarchia di gestione e alternativa alla discarica, praticamente scomparsa. L’impatto è misurabile: millecento viaggi di camion in meno all’anno nel centro, novanta per cento di traffico pesante in meno nelle vie servite, meno ratti, meno blatte, meno odori, più sicurezza antincendio in quartieri di legno. Il costo iniziale per i primi lotti è stato di trentacinque-quaranta milioni di corone norvegesi, tre milioni di euro circa, pagati con tariffe e fondi comunali. Per il cittadino il beneficio è duplice: niente cassonetti sotto casa e una bolletta rifiuti in cui la parte variabile dipende solo dal residuo prodotto. Chi separa bene spende meno; non ci sono sconti spettacolari, ma una famiglia attenta può abbattere in modo sensibile la quota variabile annuale. Per mantenere il sistema, BIR Nett spende in media circa 1.200–1.400 corone norvegesi l’anno per utenza (100–120 euro), cifra che include energia per i ventilatori, manutenzione delle condotte e gestione della stazione di raccolta. È un costo leggermente superiore a quello della raccolta stradale tradizionale, ma compensato da minori spese per il trasporto, dall’assenza di cassonetti da sostituire periodicamente, dal valore energetico recuperato e dal vantaggio, non misurabile in bilancio, di preservare la bellezza dei luoghi. La rete pneumatica si adatta naturalmente a tutti i centri storici con strade strette, dove i camion non passano o passano male, e dove il valore estetico e turistico del contesto richiede di nascondere ogni traccia del rifiuto. Passeggiare per Bryggen oggi è diverso. Ci si muove tra botteghe e magazzini senza dover girare intorno a bidoni traboccanti, senza il rumore di un compattatore in retromarcia. Sotto i piedi, invisibile, una rete respira al ritmo della città: inghiotte e trasporta lontano ciò che non serve più.`,
    spunti: "Sistemi di raccolta rifiuti pneumatici nelle città storiche; il rapporto tra infrastrutture nascoste e paesaggio urbano.",

    summary: "Sotto un antico molo di Bergen, città di mare e di montagne adagiata tra sette cime, un tubo aspira i sacchetti di rifiuti organici a sessanta chilometri orari, portandoli via senza che i turisti e i cittadini che camminano sopra se ne accorgano: una raccolta invisibile e silenziosa."

    num: 31, title: "Cannes, Ciak Si Gira La Pulizia", city: "Cannes", country: "Francia",
    lat: 43.5528, lon: 7.0174, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0PYwbqC8gBMEmTeixK5Am35zHmXKcTkVHvW6qpqu2qcw5Qd6scdPSavRj5JXjTEfCl",
    text: `C’è un’ora, sulla Croisette, in cui Cannes appartiene solo ai suoi abitanti. Il sole non è ancora alto, le palme disegnano ombre sottili sull’asfalto, e i camerieri delle brasseries preparano i tavolini per la colazione. Le vetrine degli hotel sono già lucidate, le aiuole rifinite con precisione quasi maniacale. Non c’è traccia di sacchi d’immondizia, né di cassonetti in fila, né dell’odore acre che in molte città si insinua appena l’aria si scalda. Eppure, fino a pochi anni fa, la scena era diversa. Il lungomare più fotografato della Costa Azzurra era anche uno dei più impegnativi da mantenere pulito: camion che passavano anche sette volte al giorno per svuotare cassonetti e bidoni, soprattutto davanti ai ristoranti e ai bar. Nel pomeriggio, bottiglie e casse di vetro cominciavano ad accumularsi fuori dai locali, in attesa del turno di raccolta. Nei vicoli laterali, sacchi neri si accatastavano negli angoli, pronti a essere caricati in fretta e furia per non turbare troppo a lungo la cartolina. Nel 2020, l’Agglomération Cannes Pays de Lérins - l’ente che riunisce Cannes e quattro comuni vicini per gestire servizi condivisi come rifiuti, trasporti, urbanistica e ambiente - ha deciso che era tempo di cambiare approccio. Non bastava moltiplicare i passaggi: serviva ridurne la necessità. La soluzione è arrivata da sedici compattatori interrati installati nei punti più esposti e strategici. In superficie, colonnine in acciaio di poco più di un metro, discrete, integrate nel marciapiede. Sotto, vasche capienti che inghiottono i rifiuti e li comprimono fino a dieci volte il volume originale. All’interno, ci sono sensori che segnalano quando è il momento di svuotare. Così, dove prima c’era un via vai incessante di camion, oggi basta un ritiro ogni due settimane. Non è l’unica strategia invisibile della città. Oltre ai compattatori, Cannes ha disseminato il territorio di oltre 240 Punti di Apporto Volontario interrati (PAV) per indifferenziato, vetro, carta e imballaggi. Ciascuno è una botola elegante che nasconde un contenitore sotterraneo, sollevato da gru speciali e lavato regolarmente. L’accesso è facile, l’impatto visivo nullo. E nei quartieri dove i ristoranti sono più numerosi, il vetro non resta mai in strada: due passaggi porta a porta alla settimana, con turni aggiuntivi in alta stagione, lo fanno sparire prima che diventi parte dell’arredo urbano. Il percorso dei rifiuti è ordinato e preciso. L’indifferenziato viene inviato agli impianti di incenerimento di Antibes, Nizza e Vedène, dove produce energia. Gli imballaggi vengono selezionati in un centro a Cannes e poi avviati a cartiere, vetrerie e impianti per la plastica in Francia, Spagna e Germania. L’organico segue la strada del compostaggio a Carros e Fréjus. Gli ingombranti e i rifiuti speciali trovano posto nella rete di “déchèteries” coordinate dai consorzi locali. Gestire tutto questo ha un prezzo. Nel 2023, Cannes ha speso 58,98 milioni di euro per il servizio rifiuti: 38,9 milioni per la raccolta e 20 milioni per il trattamento. Sono cifre che non compaiono sui cartelli stradali, ma che si percepiscono nella pulizia dei marciapiedi e nella loro continuità visiva. È il costo di un ingranaggio che lavora in silenzio sotto i piedi di chi passeggia: compattatori, Punti di Apporto Volontario (PAV) interrati, squadre di manutenzione, calendari ben studiati. Di giorno, tra il via vai di turisti e congressisti in giacca leggera, nessuno pensa a cosa succede ai rifiuti di un hotel a cinque stelle o di un chiosco di gelati. Di notte, quando le luci si abbassano e il rumore del mare prende il sopravvento, le colonnine restano immobili, i sensori fanno il loro lavoro e la città dorme sapendo che, all’alba, non ci sarà nulla che disturberà l’olfatto e la vista. A Cannes la bellezza non è solo facciata. È un sistema sotterraneo che la protegge ogni giorno, invisibile e costante, come quei meccanismi d’orologio che nessuno vede ma che segnano sempre il tempo giusto.`,
    spunti: "Gestione dei rifiuti nelle città turistiche; l'immagine urbana come parte dell'economia del turismo.",
    attivita: "Cerca il calendario degli eventi del Festival di Cannes e rifletti su come il turismo internazionale influenzi le scelte urbane di una città. Confronta con una città turistica italiana.",
    summary: "Prima che il sole sia alto sulla Croisette, quando Cannes appartiene ancora solo ai suoi abitanti, non c'è traccia di sacchi d'immondizia né di cassonetti in fila: le vetrine sono già lucide, le aiuole rifinite con precisione quasi da set cinematografico, in una città che ha fatto della pulizia impeccabile un tratto distintivo."

  {
    num: 32, title: "Oslo, La Differenziata Che Non Punisce", city: "Oslo", country: "Norvegia",
    lat: 59.9139, lon: 10.7522, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0HRgVZuypCBfHcTw9nHW7gJpC5yn3eXUA6g38GvYz6JSqxibxqj948vAGTPmt7oRHl",
    text: `Nella cucina stretta di un appartamento a nord di Grünerløkka, a Oslo, il giorno finisce in silenzio. Ola Nordmann ha appena sparecchiato la tavola e messo le tazze di ceramica ad asciugare vicino al lavello. L’odore del caffè di dopo cena è già un ricordo tiepido. Sul pavimento, contro la parete, c’è un sacco verde gonfio d’aria che aspetta. Quasi come nella "Poubelle agréé" di Italo Calvino, la pattumiera “gradita” diventa parte di un patto tacito tra chi abita la città e la sua infrastruttura. Qui, come nel racconto, il contenitore non è solo un oggetto: è il segno di un ordine condiviso, pronto a consegnare all’infrastruttura pubblica il suo carico quotidiano. Ola scende le scale con il sacco verde in mano. L’aria dell’androne sa di legno e neve vecchia: qualcuno è rientrato con gli scarponi bagnati e ha lasciato un odore freddo. La porta d’ingresso si apre su una strada tranquilla. Accanto al marciapiede, un unico contenitore raccoglie insieme sacchi verdi, viola e trasparenti: la separazione avverrà più tardi, nel ventre della città. Poco dopo, un camion a due assi, vernice bianca e logo del Comune, si ferma a metà isolato. Il braccio meccanico solleva il bidone, lo inclina: i sacchi cadono nella bocca della vasca, un colpo sordo per ogni caduta. Il rumore si spegne subito, assorbito dalla plastica. Non c’è odore: i sacchi sigillati isolano il carico. L’autista annota sul terminale di bordo via, ora, peso stimato. Riparte, lento, fino a riempire la vasca con le fermate successive. Il viaggio prosegue verso Haraldrud, uno dei due impianti di selezione ottica della capitale norvegese. Qui, sotto la luce intensa di capannoni alti come cattedrali, i nastri trasportatori ricevono i carichi misti. Scanner e telecamere ad alta velocità leggono il colore di ogni sacco in meno di un decimo di secondo. Una lama d’aria spinge il sacco su una linea dedicata: verde verso sinistra, viola al centro, trasparente a destra. La capacità totale delle linee di Oslo è di circa 150.000 tonnellate l’anno, sufficiente a trattare il prodotto dell’intera città. Questa filiera serve tutti i 724.000 abitanti del Comune, senza eccezioni: dal centro compatto alle case sparse nelle colline. I sacchi verdi vengono convogliati su camion a tenuta stagna fino al Romerike Biogassanlegg, a Nes. Qui un digestore anaerobico, lungo più di trenta metri, lavora a temperatura controllata: batteri metanigeni trasformano la materia organica in biometano e in un fertilizzante liquido usato nelle campagne dell’Akershus. Ogni anno si producono circa 5 milioni di metri cubi di gas, abbastanza per alimentare centinaia di autobus urbani. Il flusso viola, invece, entra nelle bocche degli scanner NIR (Near Infrared): la plastica viene riconosciuta per polimero, separata in PET, HDPE, film poliolefinici. Un separatore a correnti parassite recupera i metalli non ferrosi intrappolati: è un rullo magnetico rotante che induce correnti elettriche nei frammenti di alluminio e rame, respingendoli fisicamente dal nastro. Le balle di plastica compressa sono poi spedite a riciclo meccanico: lavaggio, triturazione, granulazione. Il sacco trasparente è il più vario: carta sporca, tessuti, piccoli oggetti in metallo. Qui la tecnologia recupera quello che può. Anche in questo caso le correnti parassite sottraggono i metalli non ferrosi al flusso residuo, separandoli per l’avvio in fonderia. Il resto, materiale combustibile, va al termovalorizzatore di Klemetsrud, collegato alla rete di teleriscaldamento. È qui che si sta installando un sistema di cattura della CO₂ destinato a ridurre drasticamente le emissioni residue. L’intero ciclo ha un costo di investimento elevato: le linee ottiche a sacchi colorati richiedono circa 100–140 euro per tonnellata/anno di capacità in spese di impianto. Ma il sistema permette di risparmiare su logistica e contenitori: un solo bidone per tre frazioni, meno fermate, meno mezzi in circolazione. È progettato per funzionare anche se il cittadino sbaglia: un sacco viola in mezzo ai verdi non compromette l’intero carico.
Ma è un approccio diverso da quello esclusivamente punitivo adottato in alcune città del Sud Europa, dove non basterebbe un gendarme o una videocamera in ogni strada. Qui a Oslo si è consapevoli che non si può affidare solo alla virtù individuale ciò che può essere garantito da un sistema ben progettato. La mattina dopo, davanti allo stesso marciapiede, scorre un autobus blu e argento. Sul fianco, in piccolo, una scritta: “Denne busse kjører på biogass – Powered by food waste from Oslo”. Dentro il serbatoio c’è anche il respiro del sacco verde di ieri sera. Il cerchio si chiude, e la città riparte, da un gesto fatto in cucina.`,
    spunti: "Politiche pubbliche e comportamenti civici nella gestione dei rifiuti; modelli scandinavi di fiducia nei cittadini.",
    attivita: "Cerca le regole della raccolta differenziata nel tuo Comune: ci sono sanzioni per chi sbaglia? Confronta con l'approccio 'senza ansia' di Oslo e discuti in classe quale modello convince di più.",
    summary: "A Oslo la raccolta differenziata funziona come un patto tacito tra cittadini e città: niente sanzioni severe per chi sbaglia sacchetto, ma un sistema pensato per rendere naturale fare la cosa giusta, così che la differenziata non diventi fonte d'ansia nella vita quotidiana."

    text: `Chi arriva a València la prima volta nota un’assenza. Nei viali alberati e nelle piazze barocche non compaiono i cassonetti che ingombrano altre città. Nessuna fila di bidoni colorati a interrompere la prospettiva, nessun sacco bucato dai gabbiani, nessun odore che sale dalle bocche metalliche. È un vuoto eloquente, una sottrazione che cambia il paesaggio urbano. Come direbbe Calvino, “le città si leggono anche nei loro vuoti”. E qui il vuoto più evidente è quello della spazzatura. In realtà i rifiuti non sono spariti: si sono spostati sottoterra. Dal 2015 València ha iniziato a installare isole interrate in luoghi delicati del centro storico e nelle piazze principali. All’inizio erano poche, poi sono diventate ventitré con gli interventi del 2020 e del 2022, fino ai nuovi progetti approvati nel 2023. In superficie si vedono solo cilindri discreti, incassati nei marciapiedi; sotto, vasche da tre a cinque metri cubi collegate a sensori. Quando la vasca si riempie, un segnale parte verso il centro di controllo: la postazione entra nel giro notturno dei camion. Arriva il mezzo, un braccio meccanico aggancia il contenitore e lo svuota in pochi minuti. Al mattino la piazza è di nuovo sgombra. València non è una capitale immobile: cresce. 844.000 abitanti nel comune e oltre 1,6 milioni nell’area metropolitana che ruota attorno all’Horta, la pianura coltivata a orti e agrumeti. Numeri che avrebbero reso ingestibile il porta a porta spinto: troppo traffico di camion nelle ore diurne, troppa dipendenza dalla disciplina domestica dei cittadini. La città ha scelto un’altra strada, saltando una fase intermedia. Non ha insegnato a tutti a differenziare sacchetto per sacchetto: ha costruito un’infrastruttura che assorbe errori e imprevisti, trasformando il gesto quotidiano in un movimento semplice, quasi anodino. Il contenitore marrone dell’organico è stato l’ultimo a entrare in scena, completato nel 2021. Ma la vera svolta è arrivata nel 2023: per aprirlo serve una tessera magnetica o l’app dedicata. È una barriera che riduce gli errori di conferimento e prepara il terreno per un futuro molto prossimo, in cui la tassa rifiuti sarà calcolata in base a quanto ciascuno produce. Un incentivo pratico. Mentre si cala il sacchetto, il sistema registra il conferimento. Nel nord di Ciutat Vella, dove le strade sono strette e i palazzi storici impediscono l’uso di mezzi grandi, la raccolta avviene con contenitori mobili: vengono posizionati la sera per alcune ore, poi svuotati da camion elettrici di piccole dimensioni e rimossi. È una coreografia discreta: di giorno le vie restano libere, di notte il quartiere si svuota in silenzio. Il cuore del sistema, però, non è in superficie. È negli impianti dell’EMTRE, l’ente metropolitano che gestisce i flussi di decine di comuni dell’area vasta. A Los Hornillos, a Quart de Poblet, arrivano circa 400.000 tonnellate l’anno; a Manises altre 350.000. Qui l’organico diventa compost che torna nei campi dell’Horta e biogas utilizzato per energia o immesso nella rete; la parte non recuperabile va alla discarica di Dos Aguas, con volumi sempre più ridotti. Nel 2024 l’EMTRE ha trattato 566.175 tonnellate complessive, un ciclo industriale che pochi cittadini vedono, ma che regge la promessa di pulizia che si legge passeggiando in centro. Il nodo sono i costi, ma anche qui il dato sorprende. Ogni isola interrata costa in media 50.000 euro, cifra che sembrerebbe alta. Ma il saldo è positivo: i cassonetti non vanno sostituiti di continuo, i percorsi sono ottimizzati dai sensori, i camion lavorano di notte senza bloccare il traffico. La tariffa metropolitana Tamer nel 2025 varia da 40,80 a 283,20 euro all’anno per famiglia, a seconda dei consumi idrici; a questo si aggiunge la nuova tassa comunale per la raccolta, compresa fra 39 e 273 euro. Non esiste una media unica, ma resta una delle più basse fra le grandi città spagnole. E la forbice permette di calibrare il costo in base alle possibilità di ciascuno. All’inizio non tutti erano convinti. Gli anziani si lamentavano delle tessere elettroniche, altri della scomparsa dei cassonetti “sempre disponibili”. Ma i dati del Barómetro Municipal 2023 raccontano
un cambiamento: oltre il 70 per cento dei cittadini valuta positivamente il sistema, soprattutto per la pulizia e la riduzione degli odori. E l’indice di gradimento complessivo della vita urbana a València è tra i più alti di Spagna: 8,2 su 10. Le inondazioni dell’autunno 2024 non hanno interrotto i progetti sui rifiuti, ma hanno acceso un riflettore sui loro limiti nascosti. Cumuli di detriti, mobili e sacchi trascinati dall’acqua hanno mostrato quanto un’infrastruttura urbana debba essere pronta non solo alla quotidianità, ma anche all’eccezione. Da allora il dibattito cittadino si è allargato: non basta che i cassonetti spariscano alla vista, serve che l’intero sistema sappia resistere agli eventi estremi. Una città che funziona deve continuare a farlo anche sotto la piena. La città ha scelto di non affidare la riuscita del sistema alla virtù individuale. Ha costruito un’infrastruttura che lavora assorbendo errori e trasformando i rifiuti in materia e in energia. Il gesto quotidiano non è più spingere fuori un bidone o lasciare un sacchetto sul marciapiede, ma avvicinare una tessera a un cilindro. Da lì in poi è la macchina pubblica che si occupa del resto. Il porta a porta qui è archiviato come una tecnologia del passato: lenta, ingombrante, costosa. València dimostra che si può fare diversamente, e meglio. Una città che toglie dalla vista i propri rifiuti non per rimuoverli, ma per gestirli con razionalità industriale e restituire alla superficie un ordine urbano più leggibile. È un’assenza che si nota. E racconta molto di come funziona la città.`,
    spunti: "Il paesaggio urbano come specchio delle scelte di gestione dei servizi pubblici; il confronto tra città con e senza cassonetti in strada.",
    attivita: "Cerca immagini di piazze storiche di València (es. Plaza de la Virgen) e osserva l'assenza di cassonetti. Individua dove sono posizionati i cassonetti nel centro storico della tua città.",
    summary: "Chi arriva a València per la prima volta nota un'assenza: nei viali alberati e nelle piazze barocche non ci sono i cassonetti che ingombrano altre città. Nessuna fila di bidoni colorati, nessun sacco bucato dai gabbiani: un vuoto che cambia il paesaggio urbano e racconta un diverso modo di gestire i rifiuti."
  },

    num: 34, title: "Stoccolma, Differenziata Senza Angoscia", city: "Stoccolma", country: "Svezia",
    lat: 59.3293, lon: 18.0686, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02CwS4sjYiTKUC9XLJd6ZAtTkbNuqMUroxhgtfGVzoJGsVVYcQgWzx47Fcnw31hVa1l",
    text: `Nel cuore della Scandinavia, una capitale di quasi un milione di abitanti che si estende su quattordici isole e supera i due milioni e quattrocentomila nell’area metropolitana, ha scelto di sottrarre ai cittadini l’angoscia della differenziata perfetta. Qui non si impone la tirannia del sacchetto, non si minacciano castighi per un imballaggio o un orario sbagliato. L’errore domestico non diventa colpa, perché la città lo assorbe e lo corregge con le proprie infrastrutture. È un modello che costa, ma funziona. L’impianto di selezione inaugurato nell’agosto 2024 a sud della capitale, realizzato da Stadler Anlagenbau GmbH per Stockholm Vatten och Avfall, è costato circa 60 milioni di euro: una cifra che altrove si preferisce spendere in campagne di sensibilizzazione o in controlli di polizia. Qui invece l’investimento è in tecnologia, nella convinzione che siano le macchine a garantire risultati più affidabili della virtù individuale. Il percorso comincia nei quartieri, come ad Hammarby Sjöstad, dove più di settecento bocche di conferimento inghiottono ogni giorno i sacchi dei residenti e li trascinano sottoterra a oltre settanta chilometri orari. Non ci sono cassonetti né camion: venti tonnellate quotidiane finiscono direttamente nelle stazioni di raccolta, in silenzio, senza odori. Poi il flusso raggiunge l’impianto Stadler, una fabbrica dei rifiuti che lavora cinquanta tonnellate all’ora, centoventimila in un anno. È lì che l’imperfezione umana viene smontata e riorganizzata. Cinque pavimenti mobili, cioè grandi superfici che scorrono lentamente per distribuire i carichi, ricevono i rifiuti e li accompagnano alle linee successive. Lì li attendono i vagli balistici, tamburi inclinati che oscillano e separano ciò che rotola – bottiglie e lattine – da ciò che resta piatto, come carta e pellicole di plastica. Poi entrano in scena gli spettrometri NIR e VIS: sensori che usano la luce infrarossa e visibile per leggere i colori dei sacchi e riconoscerne il contenuto. In questo modo individuano al volo quelli verdi, pieni di organico, e li instradano verso la produzione di biogas. La plastica e i metalli finiscono invece in un percorso ancora più minuzioso. I magneti catturano il ferro, le correnti parassite respingono l’alluminio sfruttando campi elettromagnetici, mentre selettori ottici distinguono i diversi polimeri per colore e qualità. È una catena industriale che lavora senza pause, con una precisione che nessuna raccolta domestica potrebbe garantire: ciò che in cucina è esitazione e dubbio, qui diventa un automatismo, ripetuto migliaia di volte al giorno senza mai sbagliare. Quello che resta non si accumula in discarica: prende la strada di Högdalen, l’impianto che trasforma settecentomila tonnellate all’anno di scarti in calore per il teleriscaldamento. Tremila chilometri di tubazioni portano acqua calda e riscaldamento a oltre ottocentomila persone. È un calore invisibile, che scorre nei termosifoni e sotto le docce: un pezzo di vita quotidiana che nasce dal sacchetto sceso in strada la sera prima. Per i cittadini questo significa un sollievo tangibile. Si separano vetro, carta e lattine ma il sistema non pretende infallibilità. Non si affida alla buona volontà ciò che può essere garantito da un impianto ben progettato. Il costo della gestione, circa 280 euro l’anno per famiglia, include tutto: raccolta, selezione, energia di ritorno. Una cifra che, rispetto a molte città europee, si traduce in un servizio regolare, efficiente, privo di vessazioni. Così Stoccolma mostra una via diversa: investire in macchine che fanno meglio il lavoro della selezione, liberando i cittadini dall’ossessione del sacchetto perfetto. Non è ideologia, ma ingegneria. Non è propaganda, ma manutenzione quotidiana.`,
    spunti: "Geografia urbana su isole e organizzazione dei servizi; l'approccio scandinavo alla responsabilità civica condivisa.",

    summary: "Capitale che si estende su quattordici isole e sfiora i due milioni e mezzo di abitanti nell'area metropolitana, Stoccolma ha scelto di togliere ai cittadini l'ansia della differenziata perfetta: niente sanzioni per un sacchetto sbagliato, perché è la città stessa ad assorbire e correggere l'errore domestico."
  },

    num: 35, title: "Lagom, Armonia Della Mobilità Urbana", city: "Malmö", country: "Svezia",
    lat: 55.605, lon: 13.0038, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0veDgheKKRCTwScm4SBNTn7QenHdNSUH4jmLaLrFT2YbQkE6m5eur3FTG4BJhWipnl",
    text: `Una mattina d’autunno a Malmö, in Svezia, il quartiere si blocca per dieci minuti: niente auto davanti alla scuola, solo bambini che attraversano la strada da soli e genitori che chiacchierano ai bordi. È la “strada scolastica”, chiusa al traffico nelle ore di ingresso e uscita. Non è una festa eccezionale, ma una regola quotidiana. È lì che il concetto svedese di lagom diventa città. Significa “né troppo né troppo poco”, la giusta misura, l’equilibrio che dà solidità. In un Paese dove l’inverno è lungo e la luce breve, il concetto di lagom diventa un correttivo culturale contro gli eccessi. Oggi viene utilizzato anche come chiave per immaginare la città del futuro. Per oltre un secolo le città europee hanno deformato se stesse per accogliere l’automobile privata. Strade allargate, piazze trasformate in parcheggi, quartieri divisi da tangenziali. L’idea dominante era che la mobilità dovesse sempre crescere: più corsie, più flussi, più velocità. Ma se il lagom viene preso sul serio, la mobilità non è più una questione di quantità: diventa una questione di misura. Lo ricorda spesso Dan Hill, urbanista britannico oggi alla guida della ricerca di Vinnova, l’agenzia svedese per l’innovazione. Per lui il lagom non è nostalgia né marketing, ma un principio progettuale: adattare il trasporto al contesto, calibrare i mezzi e i servizi sul quartiere e sulle persone, non su un’astrazione statistica. A Göteborg il concetto prende forma nel car sharing di quartiere: non flotte sparse ovunque, ma auto condivise collocate dove la domanda è reale, integrate con il trasporto pubblico e con la rete ciclabile. Lagom significa evitare sia la scarsità sia l’eccesso. Il principio si estende oltre la Svezia. Oslo ha progressivamente eliminato le auto dal centro: niente misure traumatiche, ma un processo graduale fatto di parcheggi sostituiti da aiuole e panchine, autobus elettrici silenziosi, piste ciclabili continue. Nel 2019 gli incidenti stradali mortali si sono azzerati. Anche questo è lagom: non abolire la mobilità, ma ridarle una misura umana. A Gand, in Belgio, il Circulation Plan del 2017 ha spezzato l’anello di auto attorno al centro. I residenti hanno dovuto cambiare abitudini, i commercianti erano scettici. Ma i dati mostrano un calo netto del traffico e un aumento delle presenze in centro. Le biciclette sono cresciute di un terzo in pochi anni. Non un’esplosione caotica, ma un riequilibrio. A Vienna, i WienMobil Hubs integrano metro, bici, scooter, car sharing e colonnine elettriche in nodi pensati per la vita quotidiana. Non grandi terminali impersonali, ma piazze di quartiere con funzioni multiple. Anche qui lagom: tecnologia quanto basta, senza eccesso di complessità. Il lagom riguarda anche la dimensione digitale. A Stoccolma il geofencing permette di modulare i limiti di velocità in base al contesto, riducendo i rischi senza bisogno di cartelli permanenti o controlli pesanti. A Helsinki, invece, la piattaforma Whim rappresenta uno dei primi esempi compiuti di MaaS, Mobility as a Service: un sistema che integra biglietti e servizi in un’unica interfaccia. Non un ecosistema che sommerge, ma uno strumento che semplifica. In entrambi i casi, la regola è la stessa: usare la tecnologia per togliere complessità, non per aggiungerne. Ridurre l’attrito senza creare nuove barriere. È la versione digitale del lagom. La forza di questa filosofia sta nella sua apparente modestia. Non promette rivoluzioni spettacolari, non annuncia salti epocali. Propone invece di restituire alle città la loro scala naturale, calibrando i mezzi sul quartiere, il quartiere sulla comunità, la comunità sull’individuo. Lagom non significa meno mobilità. Significa mobilità più umana. Una strada troppo larga è tanto sbagliata quanto una pista ciclabile che finisce nel nulla. Un quartiere invaso dalle auto in sosta è tanto innaturale quanto una città che illude di potersi muovere solo con monopattini e biciclette (e gli anziani? E i disabili?). La misura giusta sta nel mezzo, nell’adattamento continuo, nell’ascolto delle persone che vivono ogni giorno quegli spazi.
In un tempo di promesse tecnologiche e di piani faraonici, il lagom offre un correttivo prezioso: ricordare che l’innovazione non si misura dal numero di sensori installati o dalle corsie aggiunte, ma dalla qualità della vita che produce. Non è un concetto neutro: richiede scelte politiche, investimenti pubblici, negoziazioni con gli abitanti. Ma proprio per questo è potente: perché rimette al centro non la quantità di veicoli, bensì la qualità dello spazio urbano. Forse la città del futuro non avrà un modello unico. Ma avrà una regola semplice e antica: cercherà la giusta misura.`,
    spunti: "Sicurezza dei percorsi casa-scuola; l'equilibrio tra automobili e spazio pubblico nei quartieri residenziali.",
    attivita: "Cerca cosa significa la parola svedese 'lagom'. Osserva la strada davanti alla tua scuola negli orari di ingresso/uscita e proponi una modifica per renderla più sicura per i pedoni.",
    summary: "Una mattina d'autunno, un quartiere di Malmö si blocca per dieci minuti: niente auto davanti alla scuola, solo bambini che attraversano da soli e genitori che chiacchierano ai bordi della \"strada scolastica\". È il concetto svedese di lagom, la giusta misura, applicato alla mobilità urbana quotidiana."

    num: 36, title: "Vitoria-Gasteiz, Gestione Rifiuti Da Primato", city: "Vitoria-Gasteiz", country: "Spagna",

    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02YWzwH5HHeLBnBorpRYPHG5NjEvKJgGedzkaSt6cKoYM196Y3hyGybPf3y9GDmFsZl",
    text: `Sono poche le città europee di medie dimensioni che hanno saputo trasformare la propria vulnerabilità climatica in un vantaggio quotidiano. Vitoria-Gasteiz lo ha fatto coltivando terreno, acqua e clima. Lo chiamano “Anillo Verde”, un sistema di parchi periurbani, zone umide restaurate e boschi riconnessi. In trent’anni la città ha recuperato cave, discariche e campi abbandonati trasformandoli in oltre mille ettari di spazi naturali. Oggi chi pedala o cammina dal centro può attraversare un parco, costeggiare un lago, seguire un sentiero di campagna e rientrare in piazza senza mai interrompere il percorso. Non è un giardino vetrina, ma una cintura viva che raffredda di due o tre gradi nelle giornate torride, assorbe l’acqua piovana e offre ombra costante. È un’infrastruttura climatica che i cittadini usano ogni giorno. Vitoria-Gasteiz conta circa 250.000 abitanti. In spagnolo è Vitoria, in euskara Gasteiz: due nomi per la stessa città, capitale dei Paesi Baschi. Il cuore medievale, con i suoi vicoli e le piazze irregolari, svanisce in poche pedalate quando si raggiunge Salburua, la pianura verde a est. Qui, su 160 ettari, si estende una zona umida rigenerata e oggi riconosciuta come area protetta internazionale. Le sue lagune ospitano aironi e cicogne, ma anche le scolaresche che vi vengono in visita. Salburua è insieme ecosistema e spugna urbana, attenua il rischio di allagamenti e regala alla città un serbatoio naturale di biodiversità. La misura della qualità urbana è semplice. Ogni abitante ha un parco a meno di 300 metri da casa, che significa 45 metri quadrati di verde pro capite, una quota che poche città europee raggiungono. Qui la normalità è uscire di casa e trovare una panchina ombreggiata, un sentiero ciclabile, una fontana. La soddisfazione dei cittadini è tra le più alte di Spagna, non per una retorica identitaria ma per l’esperienza concreta della vita quotidiana. La mobilità è pianificata come parte di questa trama. La metà degli spostamenti avviene a piedi e circa il 15 per cento in bicicletta. La città conta novanta chilometri di piste ciclabili continue, integrate con tram e autobus. Il tram leggero trasporta più di otto milioni di passeggeri all’anno collegando quartieri e periferie senza bisogno di auto. L’auto c’è ancora, ma resta ai margini con parcheggi di interscambio e corsie preferenziali che lasciano al pedone marciapiedi ampi e sicuri. Nei nuovi quartieri come Salburua e Zabalgana gli isolati nascono con edifici efficienti, dotati di coibentazione, pannelli solari e isolamento termico. Ogni blocco ha una scuola, un parco e una piazza. Non periferie dormitorio, ma frammenti urbani compatti che mantengono la continuità della città. Il Piano Urbano ha introdotto il modello delle “superisole”, supermanzanas in catalano, isolati organizzati per restituire spazio a chi cammina. Il traffico resta ai bordi e l’interno si apre a pedoni e biciclette. In 68 settori della città il rumore e l’inquinamento sono diminuiti, i bambini possono giocare in strada e gli anziani muoversi in sicurezza. È un modello che ha ispirato anche Barcellona. Anche la gestione dei rifiuti racconta la stessa logica di ordine urbano. Dal 2003 Vitoria-Gasteiz ha cominciato a installare sistemi di raccolta pneumatica progettati dalla svedese Envac. Oggi la rete conta sei centrali, oltre 1.200 bocche di conferimento distribuite nei quartieri e più di 50 chilometri di condotte sotterranee, con una capacità di servizio per circa 107.000 abitanti. Il sacchetto sparisce nella colonnina discreta sul marciapiede e viene aspirato fino alla centrale di raccolta, dove i camion prelevano il materiale già compattato. Le bocche di accesso sono attive 24 ore su 24. I vantaggi sono tangibili: strade senza cassonetti, meno odori, meno rumore. Il traffico dei compattatori si è ridotto fino all’80%. L’organico, conferito con un grado di purezza superiore al
95%, viene inviato a impianti provinciali di compostaggio e digestione anaerobica e trasformato in biogas e ammendante agricolo. La frazione non recuperabile va a Gardelegi, dove c’è un impianto meccanico-biologico costato oltre sette milioni di euro. La tariffa per i cittadini resta tra 80 e 100 euro annui per abitante, mentre un rapporto del cluster SmartCity stima che in Spagna i sistemi pneumatici evitino oltre 250.000 chilometri di camion e quasi 5.000 tonnellate di CO₂ ogni anno. Passeggiare per Vitoria-Gasteiz significa attraversare una città che ha a cuore bellezza, paesaggio e pulizia, vivibilità. L’anello verde che protegge dal caldo, i tram puntuali, i quartieri compatti, una gestione dei rifiuti da primato. È questa affidabilità urbana a renderla un modello raro in Europa.`,
    spunti: "Riconversione di aree degradate in cinture verdi urbane; le città medie come laboratorio di sostenibilità in Spagna.",
    attivita: "Cerca una mappa dell''Anillo Verde' di Vitoria-Gasteiz e calcola l'estensione in ettari rispetto a un parco della tua città. Individua cave o discariche dismesse vicino a te che potrebbero diventare aree verdi.",
    summary: "Vitoria-Gasteiz ha trasformato la propria vulnerabilità climatica in un vantaggio quotidiano coltivando terreno, acqua e clima: in trent'anni, il sistema di parchi periurbani \"Anillo Verde\" ha recuperato cave, discariche e campi abbandonati, trasformandoli in oltre mille ettari di spazi naturali intorno alla città."

    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02njeNqRHVm25MApKGZUobdarGhZw2AVGTV25128iJoKvNEbK9TtZgVk311Qikf1eCl",
    text: `A Saint-Martin-d’Hères, alla periferia di Grenoble, in Francia, hanno deciso che fosse il momento di sfruttare al meglio un bene gratuito e abbondante: la luce del sole. Nel 2022 è partita la comunità energetica rinnovabile BoucL Énergie, oggi la più grande del Paese. Sui tetti industriali e sulle coperture dei parcheggi sono stati installati 7692 pannelli fotovoltaici, per una potenza complessiva di 3 megawatt. La produzione annua stimata è di 3,5 gigawattora, sufficiente a coprire circa il 12% dei consumi elettrici locali. Non si tratta di un annuncio ma di una rete funzionante, che da tre anni fornisce elettricità prodotta e consumata sul posto. A guidare l’operazione è André May, presidente di BoucL Énergie, filiale del gruppo EverWatt, che ha convinto soggetti molto diversi a condividere lo stesso circuito. Sono artigiani e piccole imprese, il centro di ricerca CSTB, l’Université Grenoble Alpes, il Politecnico Grenoble INP, un supermercato Lidl e persino gli alloggi popolari gestiti da Alpes Isère Habitat. La presidente, Claire Debost, ha sostenuto il progetto senza esitazioni: “Non possiamo limitarci a dare un tetto — ha spiegato — dobbiamo aiutare chi ci vive a reggere anche i costi dell’energia. Una comunità energetica rinnovabile permette di abbassare la bolletta e ridurre la vulnerabilità sociale”. Il risultato è un intreccio di interessi diversi che trovano convenienza nella condivisione. Per le famiglie a reddito basso significa bollette più leggere; per le imprese, la possibilità di avere costi stabili; per le università e i centri di ricerca, un laboratorio urbano a cielo aperto. BoucL Énergie dimostra che la cittadinanza attiva può assumere la forma di una rete elettrica locale: ciascun attore mantiene la propria autonomia, ma una parte dell’energia è in comune. Grenoble aveva già preparato il terreno. È una città di 160 000 abitanti (450 000 nell’area metropolitana), incastonata tra Vercors, Chartreuse e Belledonne, con una lunga tradizione di politiche ambientali e cooperazione civica. L’ALEC – Agence Locale de l’Énergie et du Climat – da anni accompagna scuole, associazioni e municipi. Nel 2024 l’agenzia ha individuato una decina di nuovi impianti da destinare ad autoconsumo collettivo: parcheggi fotovoltaici, tetti scolastici, depositi di autobus. È un lavoro poco visibile, ma che crea le condizioni perché progetti come BoucL Énergie non restino eccezioni isolate. Il progetto non sarebbe nato senza un terreno politico favorevole. Grenoble è stata la prima grande città francese a eleggere un sindaco ecologista, Éric Piolle, nel 2014. Da allora la Métropole (la città metropolitana) ha fatto della transizione energetica un asse strategico. Non è il Comune a gestire direttamente BoucL Énergie, ma ha svolto un ruolo di facilitatore. Ha garantito che la rete fosse integrata nel quadro normativo, ha sostenuto gli studi dell’ALEC e ha incoraggiato il coinvolgimento di attori sociali come Alpes Isère Habitat. La presenza delle istituzioni locali all’inaugurazione del 2022 non era solo cerimoniale: era un modo per riconoscere la comunità energetica rinnovabile come parte integrante della politica urbana, non come iniziativa privata isolata. Il contesto nazionale ha accelerato. In Francia le operazioni di "autoconsommation collective" sono passate da 224 nel 2023 a 428 nel 2024, con oltre 625 progetti in sviluppo. Nel 2025 la legge di bilancio ha abolito l’accisa per gli impianti collettivi fino a 1 megawatt, eliminando uno dei principali ostacoli burocratici. Secondo Enogrid, tra giugno 2024 e giugno 2025 le comunità energetiche rinnovabili hanno registrato una crescita del 144%, con una potenza cumulata di 161 megawatt. Grenoble è parte di questo movimento, ma con un primato: ospita la comunità più importante del Paese, quella con il maggior numero di pannelli già connessi.
La dimensione sociale resta centrale. In Francia circa il 12% delle famiglie vive in povertà energetica. A Saint-Martin-d’Hères, una parte dell’elettricità solare prodotta viene destinata agli alloggi di Alpes Isère Habitat a tariffe calmierate. Non è un bonus simbolico: è energia che alimenta cucine e frigoriferi, riducendo la pressione sulle famiglie che più risentono del caro-energia. La comunità energetica rinnovabile diventa così uno strumento di solidarietà urbana, costruito con pannelli e contratti, non con comunicati stampa. Passeggiando tra i capannoni e i parcheggi coperti della zona, non si vede nulla di spettacolare. Ma in quelle superfici trasformate in centrali solari diffuse c’è un nuovo modo di intendere la città: non solo consumatrice, ma produttrice e redistributrice di energia. Grenoble dimostra che l’autosufficienza può essere praticata e misurata. Una comunità energetica rinnovabile si regge su fiducia civica e cooperazione quotidiana. Per la scala dell’impianto, il coinvolgimento sociale e il ruolo delle istituzioni locali, Grenoble è oggi considerata uno degli esempi più avanzati di comunità energetica rinnovabile in Europa.`,
    spunti: "Comunità energetiche rinnovabili gestite dai cittadini; la transizione energetica dal basso nei quartieri periferici.",
    attivita: "Cerca quanti pannelli fotovoltaici servirebbero per coprire il fabbisogno energetico della tua scuola. Localizza Saint-Martin-d'Hères rispetto a Grenoble e alle Alpi francesi.",
    summary: "A Saint-Martin-d'Hères, periferia di Grenoble, una comunità di cittadini ha deciso di sfruttare un bene gratuito e abbondante, il sole: dal 2022 la comunità energetica BoucL Énergie, oggi la più grande di Francia, produce elettricità da quasi ottomila pannelli fotovoltaici installati su tetti industriali e parcheggi."

    num: 38, title: "Pamplona E La Democrazia Energetica", city: "Pamplona", country: "Spagna",

    text: `Negli ultimi due anni il Comune di Pamplona, in Spagna, ha messo a disposizione dei cittadini nove impianti fotovoltaici installati su edifici pubblici, per una potenza complessiva di circa 1,065 megawatt. Non li ha affidati a una grande utility, ma alle comunità energetiche di quartiere. Cioè a gruppi di residenti, scuole, cooperative, piccole imprese che hanno scelto di condividere l’elettricità prodotta localmente. È un modo diverso di “prendere il toro per le corna”: la città che il mondo associa alle corse spericolate di San Fermín ha messo in atto un’altra sfida collettiva, quella dell’autosufficienza energetica. Pamplona è una città di circa 210.000 abitanti (330.000 nell’area metropolitana), capitale della Navarra. È una dimensione che la rende un laboratorio urbano interessante: non è una metropoli, ma nemmeno un piccolo centro. Qui la transizione energetica prende forma quartiere per quartiere, con comunità che gestiscono impianti solari ceduti dal Comune. Il caso più avanzato è a Mendillorri, quartiere popolare e multietnico a sud-est della città. Qui è nata la comunità energetica Kemendi, che utilizza due impianti solari montati sui tetti delle scuole El Lago–Mendigoiti ed Elorri. In totale circa 175 kWp, di cui una parte resta alle scuole e agli spazi civici, mentre 80 kW e 95 kW sono stati ceduti alla comunità. Oggi Kemendi conta 187 soci e 171 autoconsumatori effettivi, famiglie che vedono la bolletta alleggerita perché una parte dell’elettricità arriva direttamente dal sole del quartiere. Durante le lezioni, gli insegnanti mostrano ai ragazzi i dati di produzione in tempo reale: kilowattora trasformati in grafici che entrano nei programmi scolastici. È così che l’energia condivisa diventa anche educazione civica, un modo per far crescere consapevolezza e appartenenza. Un altro laboratorio di cittadinanza energetica è sorto a Rochapea, zona a nord del centro storico, segnata in passato da fabbriche e case popolari. Qui la comunità Arrotxa-E ha raccolto l’adesione di 74 cittadini e sette piccole imprese, con l’obiettivo di condividere l’energia prodotta dai tetti scolastici (Colegio Público Patxi Larrainzar) e dal grande parcheggio solare Cardenal Ilundáin, un impianto da oltre 1,1 MWp che è diventato la più grande infrastruttura fotovoltaica urbana della città. Non si tratta solo di pannelli: Arrotxa-E ha avviato anche un progetto di car sharing elettrico sociale. Alcuni nuclei familiari che non potevano permettersi un’auto propria hanno iniziato a utilizzare le vetture comuni, alimentate dall’energia del quartiere. È un esempio concreto di come la transizione possa legarsi a inclusione e solidarietà. In altri quartieri, le comunità sono in fase di avvio. A Txantrea, il progetto Ekibide ha visto il Comune cedere la disponibilità di un impianto fotovoltaico municipale, con assemblee pubbliche e raccolta di adesioni tra residenti e associazioni. A Iturrama–San Juan, la comunità Iturargi ha presentato un impianto da 100 kW previsto sul tetto del Colegio Público Iturrama, con incontri che hanno coinvolto centinaia di cittadini tra l’autunno 2024 e l’inizio del 2025. Altri gruppi sono in formazione nei quartieri di Milagrosa–Azpilagaña, Ermitagaña-Mendebaldea e nel centro storico. Il Comune di Pamplona non si limita a cedere impianti: ha creato un’Oficina de Transición Energética (OTC Pamplona) che accompagna ogni quartiere nella fase organizzativa e tecnica, con consulenze legali e supporto amministrativo. La Regione Navarra, tramite la società pubblica Nasuvinsa, ha istituito un registro regionale delle comunità energetiche e nel 2025 ha fondato l’agenzia ATENA per coordinare la transizione e i
bandi di investimento. L’idea è chiara: dare ai cittadini strumenti e regole per diventare protagonisti del sistema energetico locale. Il quadro normativo spagnolo ha avuto oscillazioni. A giugno 2025 un decreto del governo aveva annunciato l’estensione del raggio di autoconsumo condiviso da 2 a 5 km, ma il provvedimento non è stato convalidato dal Congresso e quindi non è entrato in vigore. Oggi Pamplona, come il resto della Spagna, opera ancora con il limite dei 2 km: ogni comunità deve avere impianto e utenti nello stesso raggio di prossimità. Una regola che non impedisce di organizzare reti locali robuste, ma che ne definisce con precisione la scala urbana. L’impatto sociale è il cuore di questo processo. In Navarra, come in molte altre regioni europee, la povertà energetica colpisce una parte rilevante della popolazione. Le comunità energetiche di Pamplona nascono anche per contrastarla: l’energia condivisa abbassa i costi, stabilizza le tariffe, riduce la dipendenza dal mercato all’ingrosso. In più, la partecipazione stessa — assemblee, adesioni, scelte collettive — rafforza i legami di quartiere. Non si tratta solo di produrre kilowattora, ma di ricostruire fiducia civica attorno a un bene essenziale. Passeggiando per Mendillorri o Rochapea si vedono tetti scolastici coperti di pannelli, tettoie fotovoltaiche che coprono i parcheggi, cartelli che invitano i residenti a unirsi. Sono segni ordinari, ma dietro c’è una trasformazione profonda: l’elettricità non arriva più soltanto da centrali lontane, ma dal quartiere stesso, e la comunità decide come utilizzarla. Pamplona dimostra che una città di medie dimensioni può diventare laboratorio di autosufficienza energetica urbana, partendo dai luoghi quotidiani — una scuola, un parcheggio, un edificio comunale — e affidando ai cittadini il ruolo di protagonisti.`,
    spunti: "Democrazia energetica e comunità di quartiere; il ruolo dei Comuni nella transizione verso le rinnovabili.",
    attivita: "Cerca cos'è una comunità energetica e come si può partecipare (chi può aderire, quali vantaggi). Verifica se nel tuo Comune esistono già progetti simili.",
    summary: "Negli ultimi due anni il Comune di Pamplona ha messo nove impianti fotovoltaici pubblici, oltre un megawatt complessivo, non nelle mani di una grande utility ma di comunità energetiche di quartiere: gruppi di residenti, scuole e piccole imprese che condividono l'elettricità prodotta localmente."
