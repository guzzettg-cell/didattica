<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Città che cambiano — Atlante d'Europa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101b1e;
    --panel:#17282c;
    --panel-alt:#1d3237;
    --line:#2a3e42;
    --ink:#ede6d6;
    --ink-dim:#9fb0ae;
    --acqua:#2fa0ac;
    --rifiuti:#c9932a;
    --verde:#4caf63;
    --energia:#e0b23c;
    --mobilita:#7b82d9;
    --calore:#e2704a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header{
    padding:18px 24px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px 24px;
    flex-shrink:0;
  }
  header .title-block h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:22px;
    margin:0 0 2px;
    letter-spacing:0.2px;
  }
  header .title-block p{
    margin:0;
    font-size:13px;
    color:var(--ink-dim);
  }
  .legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .header-controls{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .text-size-controls{
    display:flex;
    align-items:center;
    gap:2px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:2px;
    flex-shrink:0;
  }
  .text-size-controls button{
    background:var(--panel-alt);
    border:none;
    color:var(--ink-dim);
    width:28px;
    height:26px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Source Sans 3', sans-serif;
    font-size:12.5px;
    line-height:1;
    transition:color .15s ease, background .15s ease;
  }
  .text-size-controls button:hover{color:var(--ink); background:#24393e;}
  .text-size-controls button#textSmaller{font-size:10.5px;}
  .text-size-controls button#textBigger{font-size:14.5px;}
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 11px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel-alt);
    font-size:12.5px;
    color:var(--ink-dim);
    cursor:pointer;
    user-select:none;
    transition:border-color .15s ease, color .15s ease, opacity .15s ease;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .chip.active{color:var(--ink); border-color:currentColor;}
  .chip.dimmed{opacity:0.35;}

  main{
    flex:1;
    display:grid;
    grid-template-columns:1fr 400px;
    min-height:0;
  }
  #map{
    height:100%;
    width:100%;
    background:#e9e6da;
  }
  aside{
    border-left:1px solid var(--line);
    background:var(--panel);
    overflow-y:auto;
    padding:22px 24px 60px;
    --text-scale:1;
  }
  aside::-webkit-scrollbar{width:8px;}
  aside::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .intro h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:calc(19px * var(--text-scale));
    margin:0 0 10px;
  }
  .intro p{
    font-size:calc(14px * var(--text-scale));
    line-height:1.6;
    color:var(--ink-dim);
    margin:0 0 14px;
  }
  .progress{
    font-size:calc(12.5px * var(--text-scale));
    color:var(--ink-dim);
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:18px;
  }
  .progress b{color:var(--ink);}

  .city-list{list-style:none; margin:18px 0 0; padding:0;}
  .city-list li{
    padding:10px 0;
    border-top:1px solid var(--line);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:calc(13.5px * var(--text-scale));
  }
  .city-list li:hover{color:var(--ink);}
  .city-list .cname{color:var(--ink);}
  .city-list .count{color:var(--ink-dim); font-size:calc(12px * var(--text-scale));}

  .back-btn{
    background:none;
    border:none;
    color:var(--ink-dim);
    font-size:calc(13px * var(--text-scale));
    cursor:pointer;
    padding:0 0 16px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .back-btn:hover{color:var(--ink);}

  .city-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .city-header h2{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:calc(24px * var(--text-scale));
    margin:0;
  }
  .country-tag{font-size:calc(12.5px * var(--text-scale)); color:var(--ink-dim);}

  .ep-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:14px 0 18px;
  }
  .ep-tab{
    padding:6px 12px;
    border-radius:8px;
    background:var(--panel-alt);
    border:1px solid var(--line);
    font-size:calc(12.5px * var(--text-scale));
    cursor:pointer;
    color:var(--ink-dim);
  }
  .ep-tab.selected{color:var(--ink); border-color:var(--ink-dim);}

  .cat-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:calc(11.5px * var(--text-scale));
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .cat-pill .dot{width:7px;height:7px;border-radius:50%;}

  .brief-box{
    background:var(--panel-alt);
    border:1px solid var(--line);
    border-radius:8px;
    padding:13px 15px;
    margin-bottom:20px;
  }
  .brief-label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:calc(12px * var(--text-scale));
    color:var(--ink);
    margin-bottom:6px;
  }
  .brief-box p{
    margin:0;
    font-size:calc(13.3px * var(--text-scale));
    line-height:1.6;
    color:#d9d2c1;
  }
  .full-label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:calc(13px * var(--text-scale));
    color:var(--ink);
    margin-bottom:8px;
  }
  article h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:calc(17px * var(--text-scale));
    line-height:1.35;
    margin:0 0 10px;
  }
  article .source{
    font-size:calc(11.5px * var(--text-scale));
    margin-bottom:16px;
  }
  article .source a{color:var(--ink-dim);}
  article .body p{
    font-size:calc(13.8px * var(--text-scale));
    line-height:1.68;
    color:#d9d2c1;
    margin:0 0 13px;
  }

  .spunti-box{
    margin-top:20px;
    padding:14px 16px;
    background:var(--panel-alt);
    border-left:3px solid var(--verde);
    border-radius:4px;
  }
  .spunti-box h4{
    margin:0 0 6px;
    font-size:calc(12.5px * var(--text-scale));
    text-transform:none;
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-weight:600;
  }
  .spunti-box p{
    margin:0;
    font-size:calc(13px * var(--text-scale));
    line-height:1.55;
    color:var(--ink-dim);
  }
  .attivita-box{
    margin-top:14px;
    padding:14px 16px;
    background:var(--panel-alt);
    border-left:3px solid var(--energia);
    border-radius:4px;
  }
  .attivita-box h4{
    margin:0 0 6px;
    font-size:calc(12.5px * var(--text-scale));
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-weight:600;
  }
  .attivita-box p{
    margin:0;
    font-size:calc(13px * var(--text-scale));
    line-height:1.55;
    color:var(--ink-dim);
  }

  .leaflet-tooltip.city-tooltip{
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    padding:12px 13px;
    width:200px;
    white-space:normal;
    font-family:'Source Sans 3', sans-serif;
    opacity:1;
  }
  .leaflet-tooltip.city-tooltip::before{border-top-color:var(--panel);}
  .tooltip-city{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:13.5px;
    margin-bottom:6px;
  }
  .tooltip-ep-title{font-size:11.5px; font-weight:600; color:var(--ink-dim); margin-bottom:5px;}
  .tooltip-ep-summary{
    font-size:11.8px;
    line-height:1.45;
    color:var(--ink-dim);
    display:-webkit-box;
    -webkit-line-clamp:5;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .tooltip-hint{
    margin-top:8px;
    padding-top:7px;
    border-top:1px solid var(--line);
    font-size:10.5px;
    color:var(--ink-dim);
    font-style:italic;
  }
  .cluster-pin{
    border-radius:50%;
    border:2.5px solid #17282c;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#101b1e;
    font-family:'Source Sans 3',sans-serif;
    font-weight:700;
  }

  @media (max-width: 860px){
    main{grid-template-columns:1fr; grid-template-rows:42vh 1fr;}
    aside{border-left:none; border-top:1px solid var(--line);}
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Città che cambiano</h1>
    <p>Atlante d'Europa delle soluzioni urbane — dalla rubrica di Pino Bruno</p>
  </div>
  <div class="header-controls">
    <div class="legend" id="legend"></div>
    <div class="text-size-controls" role="group" aria-label="Dimensione del testo">
      <button type="button" id="textSmaller" title="Riduci testo" aria-label="Riduci testo">A&minus;</button>
      <button type="button" id="textReset" title="Dimensione normale" aria-label="Dimensione normale">A</button>
      <button type="button" id="textBigger" title="Ingrandisci testo" aria-label="Ingrandisci testo">A&plus;</button>
    </div>
  </div>
</header>

<main>
  <div id="map"></div>
  <aside id="panel"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
// ---------------------------------------------------------------
// DATI: ogni puntata è un oggetto con città, coordinate, categoria,
// testo e spunti geografici. Nuove puntate si aggiungono qui.
// ---------------------------------------------------------------
const CATEGORIES = {
  acqua:    { label: 'Acqua',                 color: 'var(--acqua)',    hex:'#2fa0ac' },
  rifiuti:  { label: 'Rifiuti',                color: 'var(--rifiuti)',  hex:'#c9932a' },
  verde:    { label: 'Verde e rigenerazione',  color: 'var(--verde)',    hex:'#4caf63' },
  energia:  { label: 'Energia',                color: 'var(--energia)',  hex:'#e0b23c' },
  mobilita: { label: 'Mobilità',               color: 'var(--mobilita)', hex:'#7b82d9' },
  calore:   { label: 'Calore urbano',          color: 'var(--calore)',   hex:'#e2704a' },
};

const EPISODES = [
  {
    num: 1, title: "La Sanisette Lumière", city: "Parigi", country: "Francia",
    lat: 48.8566, lon: 2.3522, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0iGvj1HaU3chrZeH86YrmQ7TSfh6PqdXcBBAMUi9gu9C22QfNVSNGMfxSMpQTkcYJl",
    text: `Dal vecchio (e puzzolente) pissoir all’avveniristica nuova sanisette, è un balzo per l’umanità che vive e frequenta Parigi. Un’evoluzione silenziosa ma concreta, che racconta come anche le funzioni più banali — fare pipì, chiudersi un momento in un piccolo e claustrofobico cubicolo — possano essere un banco di prova per la qualità della vita in una città. Parigi ne è consapevole e ha deciso di rimettere mano ai suoi bagni pubblici. Tra pochi giorni – entro il mese di maggio - saranno 435 le nuove cabine installate, completamente ridisegnate sotto il profilo tecnico, energetico e funzionale. Il progetto è stato affidato a JCDecaux, in collaborazione con il Comune (Ville de Paris), Enedis e EAU DE PARIS e i tempi sono stati rispettati. Le sanisette fanno parte del paesaggio urbano parigino dagli anni Ottanta. Cabine grigie, riconoscibili ma discrete, la cui fruizione è gratuita dal 2006. Si trovano nei parchi, lungo i boulevard, vicino alle fermate dei mezzi. Alcune sono molto frequentate, altre meno. Ma nel complesso svolgono una funzione essenziale: 15 milioni di utilizzi l’anno, secondo il Comune. Ogni nuova sanisette installata è più grande ed è accessibile anche a persone in carrozzina senza bisogno di assistenza. I comandi sono touchless. Il ciclo di pulizia automatica — tra un utilizzo e l’altro — dura 30 secondi. L’interno viene disinfettato completamente: pavimento, seduta, pareti. Il design è stato affidato a Patrick Jouin, lo stesso architetto che aveva firmato la versione del 2009. L’aspetto è stato semplificato. Forme curve, materiali opachi, nessun riferimento decorativo. Una struttura pensata per funzionare, non per essere fotografata. I nuovi modelli riducono i consumi di acqua del 66%, quelli elettrici di un terzo. Funzionano con energia 100% rinnovabile. L’integrazione con la rete municipale (Eau de Paris) garantisce la sostenibilità idrica. L’obiettivo è duplice: offrire un servizio migliore e ridurre l’impronta ambientale. Più che una rivoluzione, una manutenzione programmata del presente. Il bagno pubblico è un indicatore di qualità urbana. Spesso ignorato, ma fondamentale. Serve chi vive la città con continuità o per un breve periodo: studenti, lavoratori, turisti, persone senza fissa dimora, chi ha un bisogno improvviso. La sua presenza, il suo stato, la sua accessibilità raccontano molto sulla visione che una città ha di sé.`,
    spunti: "Servizi pubblici e qualità della vita urbana; confronto tra infrastrutture igieniche in diverse città europee; il ruolo del Comune nella gestione dei beni pubblici.",
    attivita: "Cerca online i dati sui bagni pubblici del tuo Comune: quanti sono, dove si trovano, sono gratuiti? Confrontali con i numeri di Parigi (435 nuove cabine, 15 milioni di utilizzi l'anno) e costruisci una tabella di confronto.",
    summary: "Parigi rinnova i suoi bagni pubblici: entro maggio saranno 435 le nuove “sanisette”, più grandi, accessibili alle carrozzine, con comandi touchless e pulizia automatica in 30 secondi. Consumano il 66% di acqua in meno e funzionano con energia rinnovabile. Dietro un servizio spesso ignorato si nasconde un indicatore concreto della qualità della vita urbana."
  },
  {
    num: 2, title: "Parigi, L’Acqua “Sporca” Pulisce La Città", city: "Parigi", country: "Francia",
    lat: 48.8566, lon: 2.3522, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0gAq8TwRXy6eUGL4nM1LQ7gU1E9qC9M3CZDvnnMTR4jK9NvDZFGnQjGtGb4TTdDrol",
    text: `Alle quattro del mattino, quando la città ancora dorme e i marciapiedi respirano, Parigi comincia a lavarsi da sola. Non è la scena di un film né una trovata tecnologica da smart city del futuro. È un sistema antico, nascosto sotto i piedi dei parigini, che ogni giorno, puntuale tra le 4 e le 6 del mattino, rilascia acqua non potabile dai chiusini lungo le strade. Si chiama "réseau d’eau non potable" e le sue bocchette, le cosiddette "bouches de lavage", sono circa 13.500, disseminate nei 20 arrondissement. Funzionano ancora oggi come le aveva immaginate Eugène Belgrand, il genio idraulico della Parigi haussmanniana. Il principio è semplice: usare l’acqua non potabile – derivata da canali e dalla Senna – per lavare le strade, irrigare parchi e alimentare fontane pubbliche. Nulla di nuovo: il sistema nasce nel 1850 e viene separato da quello potabile per motivi sanitari. Oggi, a 175 anni di distanza, continua a funzionare e a espandersi. Secondo "l’Atlas des usages du réseau d’eau non potable", pubblicato da APUR (Atelier parisien d'urbanisme) nel 2021, la rete copre 1.700 km e serve migliaia di bocchette attive, con una pressione controllata e una distribuzione pensata anche in funzione climatica. Ogni bouche de lavage è una valvola idraulica incassata nel marciapiede. Può essere attivata manualmente con una chiave a croce da un operatore della nettezza urbana, oppure, in alcuni tratti più recenti, azionata in remoto. Quando la valvola si apre, l’acqua scorre lungo il bordo della strada. In alcuni casi viene guidata da tappeti di gomma o tessuto stesi in diagonale, per spingerla verso le cunette. L’acqua trascina con sé la polvere, i rifiuti leggeri, e raffredda l’asfalto. Poi finisce nelle fogne. Il sistema è silenzioso, efficace, invisibile. Ma soprattutto economico: solo il 5 per cento dell’acqua non potabile viene sprecato. Il resto è riutilizzato per irrigazione e manutenzione del verde urbano. Il documento tecnico più aggiornato è l’Atlas 2021, scaricabile dal sito dell’APUR. Contiene mappe GIS, schede tecniche, tabelle sulle pressioni, sui diametri e sulle funzionalità di ciascun ramo della rete. Viene anche tracciato un percorso di ottimizzazione fino al 2034, con l’obiettivo di:
• ridurre il numero di bocchette poco utilizzate,
• migliorare la gestione dei flussi,
• integrare la rete con strategie di raffrescamento urbano per combattere le isole di calore. L’ultima revisione dello Schéma directeur indica che circa il 95 per cento delle bouches de lavage è ancora operativo. I modelli attualmente in uso – chiamati “Dauphine” o “Delphine”, prodotti da AVK – garantiscono tenuta e flessibilità anche in caso di variazioni di pressione. Tutto ciò, in una città che gestisce un doppio sistema idrico su scala metropolitana. La rete non potabile parigina è oggi una delle poche in Europa a essere così capillarmente mantenuta. Roma, Milano, Lione (con un sistema simile), Berlino e Barcellona non hanno una tale distinzione funzionale tra acque di servizio e potabili. Un’anomalia virtuosa, o meglio: un’intuizione ottocentesca che resiste all’obsolescenza. Il getto che scorre dolcemente ai bordi delle carreggiate appare come una vena che pulsa in sincrono con la città. Nel pieno del dibattito su sostenibilità e decarbonizzazione, il sistema parigino ricorda che spesso l’innovazione sta nel custodire ciò che già funziona. Le bouches de lavage sono l’esempio perfetto di una tecnologia civica, urbana, sostenibile: non chiedono attenzione, non fanno rumore, ma ogni mattina, prima che tutto cominci, rendono la città un po’ più pulita.`,
    spunti: "Il ciclo dell'acqua in ambiente urbano; storia dell'urbanistica ottocentesca (Haussmann); gestione delle risorse idriche e adattamento al cambiamento climatico (isole di calore); confronto tra reti idriche di diverse città europee.",
    attivita: "Su una mappa di Parigi prova a localizzare alcuni arrondissement e calcola quanti km di rete equivalgono a 1.700 km (per esempio confrontandoli con la distanza tra la tua città e un'altra). Poi cerca se la tua città ha reti idriche separate per usi diversi.",
    summary: "Ogni notte, tra le 4 e le 6 del mattino, Parigi lava le sue strade con una rete di acqua non potabile lunga 1.700 km, in funzione dal 1850. Circa 13.500 bocchette (“bouches de lavage”) rilasciano acqua presa dalla Senna per pulire i marciapiedi e raffreddare l'asfalto, sprecandone solo il 5%. Un sistema ottocentesco che oggi è raro in Europa e resta un modello di efficienza idrica."
  },
  {
    num: 3, title: "Il Palcoscenico Vegetale Di Copenhagen", city: "Copenaghen", country: "Danimarca",
    lat: 55.6761, lon: 12.5683, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid024LnAzMRmX78xak82K3TaGcUuGBvHPczavSLCMtgVkSFfht7dvGA6KA1tYM6kB4f1l",
    text: `Appena si attraversa la passerella che collega l’Operaen (il Teatro dell’Opera) alla sponda opposta, si ha subito la sensazione di entrare in un luogo sospeso. Non per l’altezza, ma per la visione che lo ha generato. Opera Park non è un semplice parco, ma un palcoscenico vegetale, un’isola botanica che si muove tra scenografia urbana e ingegneria ambientale. Nel cuore del porto di Copenhagen, la natura non si limita a crescere: recita, si dispone, si muove secondo un copione preciso. La storia di questo spazio comincia come molte altre in Europa: con un vuoto urbano. Per anni, il lotto tra la Royal Danish Opera House di Henning Larsen e la nuova Paper Island è rimasto inutilizzato, bloccato tra grandi visioni e piccole indecisioni. L’intervento della A.P. Møller Foundation, che ha donato allo Stato danese il sontuoso teatro dell’Opera, ha impresso una svolta. Nel 2019 un concorso internazionale, vinto dallo studio danese COBE, ha avviato la trasformazione. Il parco dell’Opera copre una superficie di circa 21.500 metri quadrati, quasi tre campi da calcio. È uno degli spazi verdi più estesi del centro di Copenhagen. Il progetto è stato sviluppato in tre anni, con una lunga fase di studio botanico e modellazione paesaggistica. COBE ha lavorato con ingegneri ambientali, idraulici, agronomi e paesaggisti per integrare natura, architettura e infrastrutture. Opera Park si basa su un’idea narrativa: è un racconto in tre atti paesaggistici che accompagna il visitatore lungo un percorso coreografico. Foreground è il primo piano, dove si trovano piante basse, fiori, materiali tattili. Stimola i sensi, invita a toccare e annusare. Middleground è il piano intermedio, con alberi di media altezza, sentieri sinuosi, variazioni di luce e ombra. Background è lo sfondo: le quinte arboree, la serra, l’Opera, il porto. Un orizzonte visivo coerente. Il parco ospita sei giardini tematici ispirati a paesaggi globali. La foresta nordamericana, con faggi rossi, aceri e conifere; il bosco danese, con pini, sorbi e ciliegi; la foresta nordica, con betulle e pini scandinavi; il giardino orientale, con ciliegi, bambù e arbusti zen; il giardino inglese, con sentieri romantici e aiuole miste; infine, la serra subtropicale, che racchiude un microclima controllato con piante tropicali e luce filtrata. Sotto la superficie, il parcheggio interrato a due livelli offre 300 posti auto, 48 stazioni AC e 2 fast charger DC per veicoli elettrici. Invisibile in superficie, è impermeabilizzato, ventilato e protetto dal rischio idraulico. Non è un parcheggio "sotto il mare" in senso letterale, ma un sistema raffinato costruito sotto un terreno rialzato. La costruzione, a ridosso del livello dell’acqua, ha richiesto palificazioni, barriere impermeabili e drenaggi controllati. E a Copenhagen, dove circolano più biciclette che automobili, i parcheggi interrati non sono una contraddizione ma una scelta urbanistica: togliere le auto dalla strada per restituirla a pedoni e ciclisti. Il parco funziona come un ecosistema urbano. L’acqua piovana raccolta dai tetti dell’Opera irriga la serra. I tetti verdi assorbono e rilasciano lentamente l’acqua. Le “Rain beds” sono le aiuole progettate per raccogliere e filtrare l’acqua piovana, e poi ci sono drenaggi intelligenti e pavimentazioni porose che prevengono il “run-off”, cioè il deflusso dell’acqua piovana che scorre sulla superficie del suolo. L’energia è in parte generata dai pannelli solari installati sul tetto dell’Opera House, e il suolo sopraelevato protegge l’intero sistema da eventuali mareggiate. Il caffè-serra è in vetro organico: una struttura leggera, trasparente, costruita con materiali plastici resistenti, in dialogo con il verde. Il locale è accogliente e serve ottimi smørrebrød. Si collega al teatro con una passerella paesaggistica. Tutti i materiali impiegati sono riciclabili, e i ricavi del parcheggio sostengono la manutenzione del parco.
Opera Park non è un semplice spazio verde, ma un dispositivo urbano complesso. Fonde paesaggio, ingegneria e architettura in una visione coerente, un gesto urbano che esalta il bene comune.`,
    spunti: "Rigenerazione urbana e riuso di aree dismesse; ruolo del verde pubblico nelle città; gestione sostenibile dell'acqua piovana; relazione tra architettura, paesaggio ed energie rinnovabili.",
    attivita: "Calcola quanti campi da calcio corrispondono a 21.500 mq (un campo regolamentare misura circa 7.140 mq). Poi cerca un'area dismessa vicino a te che potrebbe diventare un parco: fotografala o disegnala e proponi un progetto di rigenerazione.",
    summary: "A Copenaghen, un'area rimasta a lungo inutilizzata vicino al Teatro dell'Opera è diventata Opera Park: 21.500 mq di giardini tematici disegnati come un percorso in tre “atti” paesaggistici. Sotto il parco un parcheggio interrato con ricarica elettrica libera la superficie da traffico e auto, mentre tetti verdi e aiuole filtranti gestiscono l'acqua piovana, rendendo il parco un piccolo ecosistema urbano autosufficiente."
  },
  {
    num: 4, title: "Madrid, I Rifiuti Che Scompaiono Nel Vento", city: "Madrid", country: "Spagna",
    lat: 40.4168, lon: -3.7038, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0QUZfMU4vAefNwzukBfQX4n6JfUHYtPNnW3P8dvzfUojFactst9waX9ndFbtA68D8l",
    text: `Alle nove del mattino un bambino getta il cartoccio della merenda nella bocchetta blu. Alle undici una donna infila un sacchetto nella bocchetta gialla. Alle tre del pomeriggio, in una centrale ai margini del quartiere, i rifiuti vengono già compattati, separati, pronti per il trattamento. Nessuno si è accorto di nulla, nessuno ha sentito nulla. Il quartiere è nuovo, i marciapiedi larghi, gli alberi ancora giovani. Manca qualcosa, ma non si capisce subito cosa: non ci sono cassonetti. Nessun bidone lungo la strada, nessun camion che si infila tra le corsie all’alba. Eppure, la spazzatura scompare. Benvenuti a Valdebebas, Madrid, il primo quartiere della capitale spagnola in cui la raccolta dei rifiuti è automatica, pneumatica e invisibile. I sacchetti viaggiano nel sottosuolo, sospinti dal vuoto. È la città che si pulisce da sola, senza rumore, senza traffico, senza odore. Il principio è semplice, ma il risultato sorprende. Invece di essere raccolti manualmente, i rifiuti vengono inseriti in apposite bocchette stradali o condominiali, ciascuna collegata a una rete di tubi sotterranei. A orari prestabiliti, una corrente d’aria generata da turbine industriali li aspira a più di 70 chilometri orari verso una centrale di raccolta periferica. Qui vengono separati, compattati e destinati al trattamento. Il sistema, progettato da Envac Iberia – filiale spagnola dell’azienda svedese che ha ideato la tecnologia nel 1961 – serve oltre 100 ettari del quartiere, con decine di edifici pubblici e residenziali collegati. Le frazioni raccolte sono quattro: indifferenziato, organico, carta e plastica, ciascuna con il suo circuito. Il traffico dei mezzi pesanti è eliminato. Il rumore sparisce. Le bocchette sono integrate nel disegno urbano, a livello del marciapiede. La raccolta è continua, costante, silenziosa. Secondo Envac, il sistema riduce fino al 90 per cento le emissioni di CO₂ legate alla logistica della raccolta e consuma il 70 per cento in meno di energia rispetto ai metodi tradizionali. Anche la gestione è smart: i sensori avvertono quando i condotti sono pieni, attivano in automatico il ciclo di aspirazione, inviano segnalazioni in caso di guasti o ostruzioni. La manutenzione è specializzata, ma regolare. Il controllo, centralizzato. Il sistema nasce in Svezia, più di sessant’anni fa. Pensato inizialmente per ospedali e aeroporti, è stato applicato per la prima volta a una città nel 1965, a Sundbyberg. Oggi è diffuso nei paesi del Nord Europa, in Corea del Sud, in alcune città del Golfo e in alcuni quartieri-pilota europei. Madrid ha scelto di investire per integrare il sistema in fase di progettazione urbanistica (ebbene sì, ci sono città che adottano la progettazione urbanistica quando nascono nuovi quartieri, prima di costruire i palazzi). La rete di raccolta pneumatica dei rifiuti è stata integrata fin dall’inizio nella pianificazione del quartiere, e non aggiunta in un secondo momento. Valdebebas, sviluppato a partire dagli anni Duemila, è stato il primo esperimento su larga scala. Oggi, impianti simili sono attivi anche nella città di Majadahonda, dove coprono il 70 per cento della superficie urbana, e in alcune zone di Barcellona. Ci sono limiti evidenti. Il sistema costa molto di più nella fase iniziale rispetto alla raccolta tradizionale. Richiede spazio, progettazione, lavori civili importanti. Non è facilmente adattabile a centri storici o quartieri consolidati. Anche la manutenzione, per quanto programmata, è altamente specializzata. Comunque, dove è stato installato correttamente, i dati positivi sono inconfutabili: riduzione del traffico, aumento del decoro urbano, maggiore efficienza nella raccolta differenziata e una soddisfazione degli utenti che – a Majadahonda – supera il 94 per cento. Nel pieno del dibattito su sostenibilità e decarbonizzazione urbana, Madrid racconta una storia straordinaria: quella di una tecnologia che non chiede attenzione, non cerca visibilità, ma agisce nell’infrastruttura. È una forma di innovazione che non stupisce, ma scompare, lasciando dietro di
sé una città più ordinata, più silenziosa, più pulita. A Valdebebas, i rifiuti non sono un problema. Non perché non esistano. Ma perché nessuno li vede.`,
    spunti: "Pianificazione urbanistica di un nuovo quartiere; gestione dei rifiuti e tecnologie per la sostenibilità; confronto tra quartieri di nuova costruzione e centri storici; diffusione di una tecnologia dal Nord Europa al resto del continente.",
    attivita: "Confronta sulla carta la distanza tra Valdebebas e il centro di Madrid. Cerca poi se in Italia esistono quartieri di nuova costruzione con sistemi simili di raccolta rifiuti, e prepara una breve scheda comparativa costi/benefici.",
    summary: "Nel quartiere madrileno di Valdebebas i rifiuti non si vedono: niente cassonetti né camion, solo bocchette stradali collegate a tubi sotterranei che aspirano i sacchetti a 70 km/h fino a un centro di raccolta. Il sistema, di origine svedese, elimina il traffico dei mezzi pesanti e taglia le emissioni di CO2 fino al 90%. Il costo iniziale alto lo rende per ora adatto soprattutto ai quartieri di nuova costruzione."
  },
  {
    num: 5, title: "Norvegia, La Raccolta Differenziata Dei Rifiuti La Fanno Le Macchine", city: "Oslo (area)", country: "Norvegia",
    lat: 59.9578, lon: 11.0378, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02m2bGdbjujG55L3fJXkpbracdYM2JCBvND3jbWtrwdQMaqZWzzGYtcaCRjJiN9UGul",
    text: `NORVEGIA, la raccolta differenziata dei rifiuti la fanno le macchine (5) In alcune città della Norvegia la raccolta differenziata non si fa più nelle case, ma direttamente negli impianti. Plastica, vetro, carta: tutto finisce nello stesso sacco. Nessun bidone colorato, nessun calendario di esposizione, nessuna etichetta da interpretare. I cittadini conferiscono i rifiuti in modo indifferenziato, e il resto lo fa la tecnologia. Sembra controintuitivo, ma i risultati – ambientali, economici, operativi – sono concreti. E superiori a quelli ottenuti nei modelli tradizionali. A Skedsmokorset, alle porte di Oslo, l’impianto ROAF lavora 40 tonnellate di rifiuti all’ora per sette comuni. È una linea completamente automatizzata, con tamburi rotanti (trommel) e scanner a infrarossi (sorter ottici) che riconoscono i materiali e li separano con soffi d’aria. Ne usano sedici, prodotti dalla norvegese Tomra. La plastica è suddivisa in cinque sottotipi, l’organico viene captato in sacchi verdi e trasformato in biogas per i mezzi della raccolta. Anche la carta non è più raccolta separatamente. Gli impianti la intercettano direttamente nel flusso misto grazie alla tecnologia ottica, che sfrutta la diversa riflettanza dei materiali (cioè la luce riflessa) per identificarli. Giornali, cartoncini e imballaggi vengono così selezionati, pressati e avviati al riciclo con una purezza superiore al 95 per cento. Nel 2023 ROAF ha recuperato 3.600 tonnellate di plastica (contro le 2.500 del 2014) e oltre 11.500 di organico, con un taglio dei costi logistici vicino al 40 per cento. Nella regione di Stavanger, l’impianto IVAR IKS applica lo stesso principio su scala più ampia: dieci comuni, 350.000 abitanti, ventidue sorter ottici, linea di lavaggio della plastica e produzione diretta di granuli. Il recupero ha raggiunto l’82 per cento, il riciclo effettivo il 56,4, già oltre gli obiettivi UE. Le emissioni evitate superano le 33.000 tonnellate di CO₂ l’anno. Il costo (40 milioni di euro) è stato in gran parte coperto da fondi pubblici, ma i ricavi arrivano dalla vendita dei materiali e dal minore conferimento in discarica. Sono impianti operativi, non sperimentali. Superano la logica della separazione domestica e puntano tutto sull’efficienza industriale. Anche in Italia, seppure con un’impostazione diversa, ci sono segnali di trasformazione. A Torino, il nuovo impianto di selezione realizzato da Iren insieme all’azienda tedesca Stadler lavora fino a 100.000 tonnellate di plastica l’anno, utilizzando trommel, separatori balistici e una rete di sorter ottici in grado di riconoscere fino a 17 frazioni diverse. A Milano, presso lo storico impianto di Masotina, è in funzione un sistema robotico basato sull’intelligenza artificiale sviluppato da ZenRobotics, capace di selezionare automaticamente frazioni come il PET chiaro con una precisione superiore a quella manuale. In entrambi i casi, però, il processo parte ancora da una raccolta differenziata manuale a monte, cioè affidata ai cittadini. La tecnologia utilizzata sarebbe già oggi in grado di gestire flussi misti, come avviene in Norvegia. Per farlo servirebbe però un cambio di paradigma normativo e amministrativo (oltre che di senso civico ed efficienza amministrativa), che in Italia non è ancora stato affrontato. (Fonti e video sono nel primo commento)`,
    spunti: "Economia circolare e innovazione tecnologica nella gestione dei rifiuti; confronto tra i modelli nord-europei e quello italiano; obiettivi europei di riciclo; il ruolo della tecnologia nella transizione ecologica.",
    attivita: "Cerca i dati sulla percentuale di riciclo della tua città o regione e confrontali con l'82% di recupero raggiunto dall'impianto IVAR in Norvegia. Costruisci un grafico a barre comparativo.",
    summary: "In alcune città della Norvegia i cittadini non devono più differenziare i rifiuti in casa: buttano tutto insieme in un sacco, e sono gli impianti a separarlo con scanner ottici e getti d'aria. A Skedsmokorset, vicino Oslo, l'impianto ROAF lavora 40 tonnellate l'ora per sette comuni, con tassi di riciclo superiori all'80%. Una tecnologia già disponibile anche in Italia, ma non ancora applicata su questa scala."
  },
  {
    num: 6, title: "Parigi, Un Bosco Al Municipio", city: "Parigi", country: "Francia",
    lat: 48.8566, lon: 2.3522, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0GyMxK568TKnP1Hnv2g4uSVz6911NURAnDZzRChoVErw28EYrhFWegvZKbdJgnB1rl",
    text: `Nel cuore di Parigi, l’area antistante l’Hôtel de Ville - un tempo uno dei luoghi più inquinati a causa del traffico – si trasforma in uno spazio verde di 2.500 metri quadrati, di cui 1.000 in piena terra, con grandi alberi che raggiungono i 12 metri già al momento della piantumazione. Due boschetti lambiscono la piazza del Municipio, mentre sul perimetro un sottobosco di felci e arbusti completa l’intervento. Sono stati messi a dimora 49 alberi in piena terra e circa 100 alberi su basi e fontane: molti di essi hanno tra i 20 e i 30 anni, per assicurare fin da subito un forte impatto visivo e ambientale. Le fosse di piantumazione, profonde fino a due metri, sono state progettate con doppio strato: ghiaia di drenaggio sotto e substrato fertile sopra, impiegando circa 2.000 metri cubi di terreno per garantire stabilità e crescita nel tempo. I grandi alberi, coltivati in vivai olandesi e tedeschi, sono stati sottoposti a sette travasi per fortificare il sistema radicale, poi trasportati di notte e collocati con gru. L’area è stata arricchita con altre ventimila piante da sottobosco, per ricreare un vero ecosistema forestale urbano. Dopo la pedonalizzazione, l’intervento fa tornare permeabile il suolo della piazza, favorisce la ritenzione dell’acqua, riduce il rischio di allagamenti e migliora la capacità filtrante dell’aria. Il progetto è frutto di un investimento di circa sei milioni di euro del Comune di Parigi. L’impatto climatico atteso non riguarda solo l’effetto isola di calore, mitigato dall’ombra e dall’evapotraspirazione: gli alberi contribuiscono anche a purificare l’aria. L’intervento ha inoltre forti ricadute sociali: nuove sedute ombreggiate e un ambiente naturale conviviale offrono un piacevole luogo di sosta, incontro e benessere a cittadini e turisti. Non si tratta di greenwashing – come in alcune città dove si punta su piantine decorative o vernici riflettenti – ma di un cambiamento urbano autentico: ampia superficie verde, tecniche botaniche avanzate, manutenzione programmata e visione a lungo termine. Dice il Comune di Parigi che il concetto di bosco urbano è nato negli anni '90 per inverdire le città, con fitte piantagioni di alberi negli spazi pubblici con una superficie minima di circa 1.000 metri quadri. Un recente articolo pubblicato su ArchDaily da Olivia Poston (“Heat-Resilient Design: How City Leaders Use Building Materials to Fight Urban Heat”) sottolinea come molte città stiano affrontando l’effetto isola di calore puntando anche su materiali edilizi riflettenti e pavimentazioni a elevata albedo, cioè la misura della capacità di una superficie di riflettere la luce solare. Tuttavia, come si ammette nello stesso articolo, i materiali da soli non bastano: servono infrastrutture vegetali autentiche, in grado di creare ombra e restituire umidità all’ambiente urbano. Il progetto di Parigi si inserisce proprio in questo filone virtuoso, combinando architettura del paesaggio, ingegneria del suolo e pianificazione climatica. E non è un episodio isolato. C’è un percorso già avviato a place de Catalogne (470 alberi su 4.000 metri quadrati) e place du Colonel- Fabien (118 alberi su 1.460 metri quadrati), che si distingue per la capacità di restituire all’ambiente urbano suolo reale e vegetazione matura, non solo alberi. Parafrasando Magritte, “Ceci n’est pas un bois”, non un bosco finto, ma un vero bosco urbano, costruito con metodo, visione e impegno progettuale. (Fonti e documentazione tecnica nel primo commento. Foto di Sortir à Paris)`,
    spunti: "Rigenerazione urbana e riduzione del traffico nei centri storici; il verde pubblico come risposta al surriscaldamento delle città.",
    attivita: "Cerca una foto storica di Place de l'Hôtel de Ville prima della trasformazione e confrontala con una attuale. Individua nella tua città una piazza o incrocio che potrebbe diventare verde: motiva la scelta con una piantina.",
    summary: "Davanti all'Hôtel de Ville, un tempo tra le zone più trafficate e inquinate di Parigi, nasce un nuovo spazio verde di 2.500 mq, con 1.000 mq di piena terra e grandi alberi: un esempio di come restituire aria e ombra al cuore della città togliendo spazio alle auto."
  },
  {
    num: 7, title: "Amburgo, Città Rigenerata Dal Calore", city: "Amburgo", country: "Germania",
    lat: 53.5511, lon: 9.9937, category: "energia",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid023DUJdvTSWqW3UauejtvU6WyVAfZzg17VxomLJS118poapoxtthVifydVUdb1pxaBl",
    text: `Nell’inverno rigido di Amburgo, il calore viene prima. Prima delle case, delle strade, dei residenti. È scavato nel terreno prima ancora che gli edifici prendano forma. Non è un complemento tecnico, è un principio fondativo. Così nel 1996 nasce HafenCity, il più grande progetto di rigenerazione urbana d’Europa: un quartiere costruito su una ex area portuale, dove l’energia non è solo una risorsa ma un’infrastruttura collettiva, invisibile ma essenziale. Sotto i marciapiedi, una rete di tubazioni trasporta acqua calda a novanta gradi. Scorre silenziosa, tra le fondamenta e le cavità sotterranee, alimentando ogni edificio senza bisogno di caldaie. Nessun fumo, nessun rumore, nessun camino. Una città che comincia da sotto, dove il calore è urbanistica. HafenCity è un frammento urbano nato da un piano regolatore ambizioso, in un’area un tempo occupata da magazzini doganali e banchine commerciali. Al suo interno si mescolano architetture sperimentali, piazze pubbliche e un’estesa rete verde. Ma tutto ciò che si vede oggi è reso possibile da ciò che non si vede: una rete termica sotterranea progettata fin dall’inizio, che collega ogni nuovo edificio a una fonte di calore collettiva e modulare. Il calore viene distribuito attraverso un sistema ibrido, altamente efficiente, che combina più tecnologie in un’unica rete integrata. Alla base ci sono centrali cogenerative, alimentate prevalentemente a gas naturale e biomassa, che producono simultaneamente elettricità e calore recuperando l’energia termica normalmente dispersa. A queste si affianca un insieme di sonde geotermiche, installate a profondità che raggiungono i centotrenta metri, capaci di estrarre calore naturale dal sottosuolo anche nei mesi più freddi. Una parte significativa dell’energia termica proviene inoltre dal recupero del calore residuo generato da impianti industriali cittadini, come la fonderia Aurubis nell’area portuale. Tutto il sistema è regolato da una rete intelligente di sensori e valvole, in grado di monitorare la domanda termica in tempo reale, distribuendo l’energia secondo i bisogni effettivi degli edifici collegati. Le condutture, coibentate e posate nel sottosuolo già in fase di urbanizzazione, garantiscono una dispersione termica inferiore al cinque per cento. In ogni edificio, lo scambio di calore avviene attraverso scambiatori dedicati, senza fiamma, senza combustione, senza impianti visibili. Il risultato è una climatizzazione silenziosa, continua, sostenibile, condivisa. La rete è gestita da Hamburger Energiewerke GmbH, azienda di proprietà del Comune. Dopo un periodo di privatizzazione, nel 2019 la città ha scelto di riacquistare la maggioranza della utility, riaffermando un controllo strategico sulle proprie infrastrutture energetiche. È un caso raro di re- municipalizzazione riuscita, che oggi permette ad Amburgo di orientare gli investimenti verso obiettivi climatici di lungo termine e reinvestire localmente gli utili. Questo calore condiviso non è soltanto una risorsa efficiente, ma una componente culturale del progetto urbano. A HafenCity ogni edificio di nuova costruzione è progettato per dialogare con la rete, in un’ottica di ottimizzazione reciproca. Il calore non è più un fatto privato, ma parte di una struttura civica distribuita, in cui la riduzione dei consumi di uno ha effetti positivi sugli altri. L’energia termica diventa così un elemento della forma urbana, non solo del suo funzionamento. Dal punto di vista ambientale, il sistema consente una riduzione di oltre dodicimila tonnellate di CO₂ ogni anno. Ma i benefici non si esauriscono nei numeri. Camminando per il quartiere non si percepisce alcuna attività termica. Non si sente l’odore di combustione, non si avverte il ronzio delle caldaie, non si vedono ciminiere o condotti metallici sulle facciate. Il calore è presente, ma invisibile. È una condizione atmosferica urbana costruita artificialmente, eppure percepita come naturale. Un microclima urbano cucito su misura.
Ovviamente non mancano i limiti. Parte dell’energia utilizzata proviene ancora da fonti fossili, in particolare gas naturale, anche se in via di progressiva sostituzione. L’investimento iniziale è stato molto elevato, giustificato però dalla pianificazione a lungo termine. E l’integrazione nei quartieri storici della città risulta complessa, per ragioni tecniche, architettoniche e commerciali. Ma la direzione è chiara: Amburgo punta a uscire completamente dal carbone entro il 2030 e guarda all’idrogeno verde come futuro vettore termico, anche grazie alle sinergie con l’industria portuale. La rete di HafenCity non è solo un’infrastruttura tecnica. È un esperimento politico, sociale e ambientale. Una dimostrazione che anche l’energia può essere progettata come spazio condiviso, come parte della grammatica urbana. Una città che funziona ovunque, anche là dove non si vede. Anche sottotraccia. (Fonti e documentazione sono nel primo commento. Nella foto la sede centrale del gruppo editoriale Der Spiegel nel quartiere HafenCity di Amburgo).`,
    spunti: "Pianificazione urbanistica integrata di energia e edilizia; riconversione di aree portuali dismesse in nuovi quartieri.",

    num: 8, title: "Acqua Marina Contro Le Isole Di Calore", city: "Barcellona", country: "Spagna",
    lat: 41.3874, lon: 2.1686, category: "calore",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02g9jjAgydFi1NHyudEwKJhkvHp73EYwrPLWf6paGePmYSyDosSGF6PdeGcjmR5AMMl",
    text: `Le isole di calore urbane sono ormai un fenomeno strutturale: quartieri che, in estate, raggiungono temperature al suolo fino a sette gradi superiori rispetto alle aree verdi o costiere. In questo contesto, raffrescare è diventato un problema di strategia, non domestico. E se la risposta più immediata resta il condizionatore d’aria, in alcune città è l’acqua del mare a entrare nel sistema. Come sorgente termica, invisibile ma essenziale. Ecco il racconto di alcuni sistemi adottati in varie località europee. Sono pochi ma già operativi. Si tratta di tecnologie che usano l’acqua marina per raffreddare interi distretti — uffici, edifici pubblici, residenze, data center — attraverso reti e impianti che lavorano in modo silenzioso e sotterraneo, senza impatti visibili.
• Barcellona. Nel distretto 22@ del quartiere Poblenou, il sistema Districlima è attivo dal 2004 e serve più di 100 edifici tra uffici, hotel, scuole e musei. La rete, lunga 17 chilometri, distribuisce acqua fredda prodotta da centrali che usano l’acqua del porto come fonte per dissipare il calore. La centrale principale ha una capacità di raffrescamento sufficiente per decine di grandi edifici e lavora con un’ottima efficienza: ogni unità di elettricità consumata ne restituisce oltre quattro sotto forma di raffreddamento. È uno dei sistemi più estesi d’Europa, e rappresenta un modello di riferimento per il raffrescamento urbano alimentato dal mare.
• A Marsiglia, la rete urbana raffresca parte del distretto portuale Euroméditerranée con acqua del Mediterraneo. Il sistema, attivo dal 2016, pompa acqua di mare a circa sette metri di profondità e la utilizza per sottrarre calore da un circuito chiuso, che alimenta edifici pubblici e residenziali. Ogni secondo, oltre 500 litri d’acqua passano negli scambiatori. Anche qui, l’efficienza è elevata: con un solo kilowattora di elettricità, si producono più di quattro di raffrescamento. La rete serve hotel, uffici, un centro congressi e nuove abitazioni.
• A Sines, sulla costa atlantica del Portogallo, è già operativa la prima sezione di un data center progettato per diventare uno dei più grandi d’Europa. L’impianto utilizza l’acqua dell’oceano per raffreddare i server con tecnologie a liquido diretto e per immersione. Il calore dei processori viene trasmesso a fluidi che, a loro volta, cedono energia all’acqua marina, in un sistema chiuso e senza dispersioni. L’acqua arriva a 16–20 gradi. Una volta completato, il sito potrà ospitare una capacità informatica pari a 495 megawatt: una scala continentale. A Sines è l’oceano che raffredda il cloud.
• Anche a Nordhavn, quartiere portuale di Copenaghen riconvertito a distretto tecnologico e residenziale, l’acqua marina è entrata nel circuito. Alcuni data center impiegano scambiatori che prelevano acqua del canale a 8–14 gradi per assorbire il calore dei server, prima di reimmetterla nell’ambiente. Il progetto pilota del centro Hafnia, da 15 megawatt, ha raggiunto livelli di efficienza energetica tra i più alti del settore. In parallelo, la città valuta estensioni a edifici e servizi, con il supporto dell’Agenzia danese per l’energia. Anche qui, il mare lavora dietro le quinte.
• Nel Porto Antico di Genova, l’Acquario utilizza da anni l’acqua del mare non solo per le vasche espositive, ma anche per il raffrescamento degli ambienti tecnici. Una condotta dedicata preleva l’acqua del porto a pochi metri di profondità e la convoglia in un sistema a ciclo chiuso, che alimenta pompe di calore e impianti di climatizzazione. Si tratta di un’applicazione concreta, che copre una superficie di circa 12.000 metri quadrati con un’efficienza energetica media molto buona. È una realtà operativa, ma isolata.
Certo, raffrescare con l’acqua del mare non è semplice né immediato. I costi iniziali sono elevati: scavare condotte, installare scambiatori, costruire centrali. Le reti di raffrescamento urbano hanno bisogno di densità edilizia, coordinamento pubblico-privato e investimenti a lungo termine. E il ritorno economico per i singoli utenti è spesso meno evidente di quello ambientale o collettivo. Ma proprio per questo servono politiche pubbliche lungimiranti: incentivi, pianificazione, modelli di gestione condivisa. Dove sono stati realizzati, questi sistemi hanno dimostrato di funzionare. Hanno ridotto i consumi elettrici, abbattuto le emissioni, reso le città più resistenti alle ondate di calore. I benefici non sono solo energetici. Raffrescare con il mare non è una soluzione universale, ma è una possibilità concreta per molte città europee affacciate sull’acqua. Il nodo, ancora una volta, non è tecnico. È di visione politica. (Le fonti sono nel primo commento. Nella foto: la Centrale Districlima nel distretto 22@ di Barcellona).`,
    spunti: "Isole di calore urbane e mitigazione climatica; uso delle risorse marine come alternativa al raffrescamento tradizionale.",

    summary: "Contro le isole di calore urbane, che in estate fanno salire la temperatura del suolo fino a sette gradi in più rispetto alle aree verdi o costiere, alcune città mediterranee usano l'acqua del mare stessa per raffrescare gli edifici, invece del solo condizionatore."

    num: 9, title: "Atene, Strategia Contro Il Caldo", city: "Atene", country: "Grecia",
    lat: 37.9838, lon: 23.7275, category: "calore",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0SEZpKzdX79Wi2eAkCLz17nseQh5vaMxezUoW7pwPFvezy8Xyzeojp2Gm8YXX1XYQl",
    text: `Nel cuore di Atene, quando il termometro sfiora i 43 gradi e l’asfalto vibra di calore, c’è una porzione di città sempre meno marginale che sta imparando a raffreddarsi da sola. Niente miraggi futuristici, nessuna infrastruttura titanica. Solo alberi, pietra, acqua e una progettazione accurata del microclima urbano che ridimensiona la dipendenza dall’aria condizionata. Qui, in uno degli angoli più densi e antichi della capitale greca, la battaglia contro l’isola di calore è iniziata in silenzio più di dieci anni fa. Si chiama Rethink Athens e non è solo un progetto di pedonalizzazione. È uno dei primi esempi in Europa di rigenerazione climatica guidata da dati scientifici, modellazioni termiche avanzate e scelte ambientali precise. Il cuore dell’intervento è via Panepistimiou, arteria nevralgica tra il Parlamento e l’Università, dove ombra e traspirazione delle piante si combinano con materiali naturali e sistemi di raffrescamento passivo. In tutto, undici tra strade e piazze hanno ricevuto interventi, coinvolgendo decine di migliaia di residenti, pendolari e turisti. I risultati, misurati sul campo e simulati con il software ENVI-met, sono notevoli: temperatura dell’aria ridotta di almeno 1,5 gradi nei picchi estivi, superficie stradale più fresca del 5 per cento, comfort termico aumentato del 20 per cento. La semplice introduzione di pergolati, filari di alberi e vaporizzatori d’acqua ha ridotto del 20 per cento le ore in cui serve l’aria condizionata. Meno energia, meno stress termico, meno inquinamento. E un piccolo ma significativo passo verso una città più respirabile. Alla base di queste misure c’è una modellazione microclimatica condotta con ENVI-met, un software tridimensionale che simula l’interazione tra atmosfera, suolo, vegetazione e architettura urbana su scala locale. Ogni scenario parte da dati reali: velocità e direzione del vento, umidità relativa, radiazione solare, tipologie di suolo e materiali. Le simulazioni, verificate con misure raccolte in situ durante le estati più calde, hanno permesso di testare diverse combinazioni di ombra, evaporazione e riflessione fino a definire la configurazione più efficace. Uno degli indicatori chiave è il PET (Physiological Equivalent Temperature), che tiene conto non solo della temperatura dell’aria, ma anche di umidità, irraggiamento solare, ventilazione e metabolismo corporeo. È una misura del comfort reale percepito da una persona nello spazio pubblico. Dopo l’intervento, il PET è sceso in media di 4-5 gradi, con punte di oltre 10 gradi nelle ore più calde nelle zone ombreggiate. Per le fasce più vulnerabili della popolazione, come gli anziani, questo significa la possibilità di muoversi in città senza rischi immediati. La Fondazione Onassis, promotrice del progetto, non ha cercato effetti speciali ma soluzioni sistemiche. È in questa sobrietà ingegneristica che il modello ateniese si distingue. L’approccio è integrato ma replicabile. Una combinazione calibrata di elementi climatici e comportamentali, supportata da dati rigorosi e da una visione operativa: progettare il microclima per migliorare la salute pubblica, la vivibilità urbana e l’efficienza energetica. Secondo l’Organizzazione Mondiale della Sanità, ogni grado in meno durante le ondate di calore riduce del 3–5 per cento la mortalità legata a eventi estremi. In una città come Atene, dove le estati si allungano e i picchi termici diventano più frequenti, l’intervento non è un’opzione estetica ma una necessità sanitaria. Non a caso, la capitale greca è stata tra le prime a nominare un Chief Heat Officer. Eleni Myrivili, attualmente in carica, ha il compito di coordinare tutte le strategie anti-calore della città: dalla mappatura dei quartieri più esposti, all’ampliamento delle Cooling Stations, fino allo sviluppo di un’app pubblica che guida cittadini e turisti lungo percorsi termicamente più sicuri. È anche consigliera delle Nazioni Unite per l’adattamento climatico urbano, e lavora perché le politiche contro il caldo siano accessibili, equitative, concrete. “Il caldo uccide silenziosamente. Le
città non possono più reagire, devono anticipare”, ha dichiarato in un’intervista di un paio di anni fa. È anche grazie a questa visione operativa, strategica e gentile che Atene oggi prova a proteggere chi non può proteggersi da solo. Rethink Athens non è un prototipo, ma una realtà urbana consolidata. Le infrastrutture realizzate – dagli ombreggiamenti vegetali ai materiali riflettenti, dai sistemi evaporativi alla nuova pavimentazione – funzionano da anni e producono effetti misurabili sul clima urbano, sul comfort termico e sull’efficienza energetica. Quei risultati, oggi confermati sul campo, diventano la base di nuove strategie come il programma ASCEND, che estende l’approccio microclimatico ai quartieri più esposti della capitale. Così Atene prova ad affrontare la crisi climatica.`,
    spunti: "Adattamento al caldo estremo nelle città mediterranee; il ruolo del verde e dei materiali nella regolazione del microclima urbano.",
    attivita: "Individua Atene sul planisfero e calcola la sua latitudine: perché fa così caldo? Cerca tre materiali tradizionali (pietra, legno, terra cruda) usati nell'architettura mediterranea contro il caldo e collegali al territorio di provenienza.",

  {
    num: 10, title: "Anversa, La Città Sotto La Città", city: "Anversa", country: "Belgio",
    lat: 51.2194, lon: 4.4025, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02FBW5o7SJ9JBqu8EfArr3ba6ciHfqniUUBE1Qz4q2ZuFBUxNuivvZ1PR3vVctvruul",
    text: `Sotto la superficie di Anversa c’è un’altra città. Non è solo un cantiere, ma un’intera strategia urbana che ha scelto di farsi invisibile per essere efficace. Mentre la città portuale si confronta con traffico pesante, inquinamento e piogge sempre più intense, una delle più ambiziose operazioni infrastrutturali d’Europa sta prendendo forma sotto i piedi dei cittadini. Tunnel, vasche di laminazione, condotti idrici e nuovi corridoi verdi si intrecciano per trasformare la metropoli belga - 550mila abitanti, un milione con i comuni limitrofi - in un modello di trasformazione urbana. Il cuore del progetto si chiama Oosterweelverbinding, una rete di gallerie che chiude l’anello autostradale attorno alla città e trasferisce sottoterra gran parte del traffico merci e pendolare. È una cicatrice infrastrutturale che si richiude, liberando spazio in superficie e riducendo drasticamente l’inquinamento atmosferico e acustico. Ma è anche un’opportunità di rigenerazione climatica: sopra i tunnel nascerà il Ringpark, uno dei più estesi corridoi verdi sopraelevati d’Europa, con spazi pubblici continui, percorsi ciclabili e sistemi naturali di drenaggio urbano. Il tutto cucito da un nuovo paesaggio urbano, integrato e accessibile. Questa trasformazione non nasce da un solo progetto, ma da un incastro progressivo di interventi coordinati. Il primo strato è il più profondo: l’Oosterweelverbinding, o “collegamento Oosterweel”, è un sistema di tunnel che unisce la sponda sinistra e destra del porto, eliminando il passaggio in superficie attraverso il centro urbano. Quando sarà completato, nel 2030, consentirà di chiudere finalmente l’anello autostradale R1, deviare gran parte del traffico pesante e decongestionare uno dei nodi logistici più trafficati d’Europa. Alcuni tratti, come il Kennedy Tunnel, sono già attivi da anni; altri, come il nuovo tunnel sotto l’Escaut, sono in fase avanzata di realizzazione. L’ambizione non si ferma alla mobilità. Il secondo strato è ambientale. L’agenzia pubblica Lantis, che coordina il progetto, ha imposto un principio semplice: ogni metro quadro scavato sottoterra deve restituire valore in superficie. Così è nato Over de Ring, un programma di riconnessione urbana che trasforma le coperture dei tunnel in un sistema continuo di parchi, piazze, orti collettivi e piste ciclabili. Il risultato si chiama Ringpark, un nuovo paesaggio urbano sopra le infrastrutture, pensato per favorire l’incontro, l’ombra, il drenaggio e la ventilazione naturale. Una delle soluzioni più innovative riguarda le coperture verdi multifunzione dei tunnel: non solo assorbono CO₂ e calore, ma sono progettate per ospitare serbatoi drenanti e sistemi di accumulo dell’acqua piovana integrati sotto i parchi stessi. I tetti delle gallerie funzionano come sistemi spugna: filtrano l’acqua, ne rallentano il deflusso e la rilasciano nei canali urbani in modo controllato, prevenendo sovraccarichi nelle reti idriche. È una doppia infrastruttura: ecologica in superficie, idraulica in profondità. I materiali impiegati includono moduli prefabbricati di calcestruzzo drenante e rivestimenti riflettenti. La ventilazione dei tunnel è garantita da pozzi e torri passive integrati nel paesaggio urbano, spesso nascosti da rilievi erbosi o alberature. Questa visione si integra con il terzo strato: l’acqua. Anversa, come molte città portuali del Nord, è esposta al rischio combinato di piogge intense e falde elevate. Il Waterplan Antwerpen, adottato nel 2021 e aggiornato nel 2023, disegna una strategia multilivello per trattenere, filtrare e riusare l’acqua piovana. Include vasche di laminazione sotterranee, zone di infiltrazione nei nuovi spazi pubblici, e un sistema di monitoraggio urbano in tempo reale. Non è solo una risposta tecnica, ma un’infrastruttura di adattamento climatico. Le aree a nord del porto, storicamente soggette a inondazioni, sono le prime a beneficiarne. Tutti questi interventi sono frutto di un processo che ha messo insieme attori pubblici, progettisti, cittadini e imprese in un dialogo decennale. Il concorso internazionale promosso da Team Vlaams Bouwmeester ha selezionato studi capaci di coniugare urbanistica, ecologia e ingegneria. Oggi le porzioni di Ringpark già accessibili dimostrano che la strategia funziona: riduzione del rumore
urbano fino a 8 decibel, abbassamento delle temperature al suolo nelle giornate estive, e un incremento dell’uso quotidiano degli spazi pubblici misurato dalle autorità comunali. In fondo, la forza di Anversa non sta nell’annunciare una smart city, ma nel costruire una città che funziona, anche senza farsi vedere. Le gallerie, i serbatoi e i canali nascosti sotto il Ring non attirano turisti, ma servono chi vive, lavora e attraversa la città ogni giorno. È questa la peculiarità urbana che rende la città belga un modello.`,
    spunti: "Gestione del rischio idraulico nelle città portuali; infrastrutture sotterranee al servizio della resilienza climatica.",
    attivita: "Cerca una mappa del porto di Anversa e individua la sua posizione sul fiume Schelda. Rifletti: perché le città portuali hanno più bisogno di infrastrutture idrauliche sotterranee di altre?",

    lat: 40.4167, lon: 0.4256, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid093UhKduB6A5oZjAUkFzPFeo2X52cCYzQBETyiSQoBUuLfvYMTq7rov183xCxSq9dl",
    text: `Il caldo spacca le pietre, piove troppo, o non piove affatto. Nei centri urbani del Mediterraneo, la crisi climatica non conosce equilibrio. Le estati si allungano, moltiplicando giornate con temperature superiori ai 35 gradi e notti tropicali. Le piogge arrivano tutte insieme, scaricando in poche ore l’acqua di un mese. Le città non riescono più né a trattenere l’acqua né a raffreddare il suolo. Ed è proprio da questo doppio eccesso – idrico e termico – che Benicarló (Spagna, Comunità Valenciana) ha scelto di ripartire, trasformando la propria pavimentazione urbana in un’infrastruttura climatica quasi invisibile. Non è una soluzione esaustiva, ma è un esempio da raccontare. In questa cittadina che si affaccia sul Mediterraneo è nato LIFE CERSUDS, acronimo di Ceramic Sustainable Urban Drainage System, uno dei primi progetti europei a utilizzare piastrelle di scarto ceramico per costruire superfici urbane drenanti. Non prototipi da esposizione, ma un parcheggio reale di 3.000 metri quadrati riconvertito in piazza pedonale filtrante, in grado di assorbire fino a 34 litri d’acqua per metro quadro e restituirla lentamente al suolo senza sovraccaricare le reti fognarie. Il sistema si basa su una stratigrafia a tre livelli: uno strato superficiale in piastrelle porose recuperate dall’eccesso produttivo dell’industria ceramica locale, un letto drenante in materiali granulari, e un serbatoio di accumulo temporaneo. Durante le piogge, l’acqua filtra attraverso le fughe, viene rallentata nei livelli inferiori, e infine restituita al sottosuolo o ai canali urbani. Nelle giornate calde, invece, favorisce l’evaporazione e il raffrescamento passivo dell’area. Le piastrelle provengono dalla fabbrica Natucer, azienda ceramica di Onda (Castellón), partner tecnico del progetto e specializzata in gres porcellanato estruso. Un materiale destinato alla discarica si è trasformato in risorsa climatica. I benefici sono misurabili: il deflusso si riduce del 95 per cento in caso di pioggia, la temperatura della superficie scende fino a 4 gradi, e il comfort termico percepito migliora sensibilmente nelle ore più calde. La tecnologia è semplice, efficace e modulare. Tutti i materiali sono riutilizzati o facilmente reperibili. I costi, stimati in 70–80 euro al metro quadrato, si compensano con il risparmio su manutenzione, raffrescamento e drenaggi d’emergenza. Secondo i promotori, ogni euro investito genera tra 2,5 e 3 euro di ritorno economico in trent’anni di vita utile. Il progetto è stato realizzato tra il 2016 e il 2020 con fondi LIFE dell’Unione Europea, coordinato dall’Istituto di Tecnologia Ceramica (ITC) di Castellón, in collaborazione con il Comune di Benicarló, l’Universitat Politècnica de València e partner italiani e spagnoli. I dati raccolti sono pubblici, i manuali disponibili in più lingue, e la metodologia è già stata adottata altrove. Un primo esempio concreto arriva dal vicino comune di Benicàssim, dove la Calle Torre Sant Vicent è stata pavimentata con lo stesso sistema drenante adattato al traffico veicolare leggero. In un anno, ha trattenuto 1.060 metri cubi d’acqua e abbattuto fino all’80 per cento dei solidi sospesi, dimostrando un’ottima tenuta anche in eventi estremi. È la prova che la tecnologia può essere estesa anche in contesti urbani consolidati. Uno dei promotori del progetto, l’architetto Ignacio Gil Crespo, ha sottolineato in una recente intervista a Euronews (maggio 2025) che questi sistemi sono più efficaci se inseriti fin dall’inizio nei nuovi quartieri urbani: “È meglio applicare questi sistemi nei nuovi sviluppi urbani, perché c’è più spazio ed è più facile pianificare l’infrastruttura di drenaggio fin dall’inizio. Nelle aree consolidate, è più difficile e costoso”. Soluzioni analoghe stanno emergendo anche a Mechelen in Belgio, Radom in Polonia, Aveiro in Portogallo e Malmö in Svezia. In tutti i casi, il principio è lo stesso: integrare già in fase progettuale superfici drenanti e raffrescanti, rendendo più resistenti, efficienti e confortevoli i nuovi spazi urbani.
A raccontarlo così, sembra un intervento tecnico. Ma è anche un’idea culturale: una città che assorbe, che rielabora i propri scarti, che risponde all’emergenza non con muri o motori, ma con superfici intelligenti. Basta avere amministratori lungimiranti e mettere a terra le soluzioni giuste.`,
    spunti: "Materiali urbani e adattamento al clima; il doppio eccesso, idrico e termico, nelle città del Mediterraneo.",
    attivita: "Cerca cos'è una pavimentazione permeabile e confrontala con l'asfalto tradizionale: quali vantaggi e quali limiti ha? Individua sulla mappa la Comunità Valenciana e il clima tipico della costa mediterranea spagnola.",
    summary: "Nei centri urbani mediterranei il clima estremo porta insieme siccità e piogge violente: a Benicarló, in Spagna, nuove pavimentazioni permeabili aiutano le città ad assorbire l'acqua piovana invece di scaricarla tutta insieme, riducendo sia il rischio di allagamenti sia il surriscaldamento del suolo."
  },
  {
    num: 12, title: "Malmö, Vent’Anni Fa Era Già Futuro", city: "Malmö", country: "Svezia",
    lat: 55.605, lon: 13.0038, category: "energia",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid037oHeuzaijZKR4qsaiZBmMepo9Qv72jAeCzrEHqhyZqHUxF17kYb3EdaEmmx1QsTpl",
    text: `Malmö, capoluogo della Scania svedese, non ha un clima mediterraneo, ovviamente, ma il suo quartiere più celebre è nato dal sole. Quando Bo01 fu progettato, all’inizio degli anni Duemila, l’obiettivo era chiaro: dimostrare che anche una città del Nord Europa poteva costruire uno spazio urbano energeticamente autosufficiente, climaticamente equilibrato e socialmente abitabile. Non un eco-quartiere sperimentale, ma un pezzo di città vero, integrato, funzionante. Oggi Bo01 è considerato uno dei prototipi urbani più avanzati al mondo. E la sua lezione vale più che mai, anche per altre latitudini. Il nome, apparentemente tecnico, deriva dalla Bo-stad (città dell’abitare) inaugurata nel 2001: un ex insediamento industriale lungo il porto occidentale trasformato in quartiere a energia quasi zero. Dove c’erano capannoni e banchine ora ci sono 1.200 alloggi, spazi pubblici, giardini e un microclima urbano progettato fin nei minimi dettagli. La riconversione è partita da un principio semplice: tutto doveva funzionare insieme. Ed è questo, forse, il vero segreto di Bo01. Sul piano energetico, ogni edificio produce una parte della propria energia tramite pannelli solari integrati. Le abitazioni sono collegate a una rete di teleriscaldamento geotermico, alimentata da pompe di calore che attingono ad acque sotterranee. In estate, il sistema si inverte e consente il raffrescamento passivo degli ambienti. L’intero ciclo è gestito da una centrale locale, e il fabbisogno energetico degli edifici è ridotto al minimo grazie a standard costruttivi rigorosi, infissi performanti e materiali ad alta efficienza termica. Il sistema è connesso alla rete cittadina e consente di immettere energia in surplus o riceverla se serve. Il teleriscaldamento, integrato con solare termico, garantisce produzione efficiente e temperatura stabile. Sul piano idrico, la pioggia non viene incanalata, ma trattenuta e usata sul posto. Un sistema di canali a cielo aperto e bacini ornamentali guida e filtra l’acqua piovana fino a zone di fitodepurazione distribuite nel verde urbano. I tetti sono in gran parte verdi o riflettenti, capaci di ridurre il deflusso e abbassare la temperatura al suolo. L’intero quartiere funziona come una spugna: accumula, filtra, restituisce. Anche il verde è stato progettato come un’infrastruttura. Oltre il 40 per cento della superficie è permeabile. I giardini sono collegati in sequenza, garantendo ombra, ventilazione e percorsi ecologici per insetti e uccelli. La varietà botanica è elevata: si alternano arbusti locali, essenze resistenti al vento marino e piante capaci di trattenere umidità. Il risultato è un microclima più fresco e stabile rispetto al resto della città, soprattutto durante le estati anomale degli ultimi anni. La mobilità è un altro livello chiave. Le auto ci sono, ma in secondo piano: i parcheggi sono interrati, le strade sono pensate per pedoni e ciclisti, i collegamenti di trasporto pubblico con il centro sono rapidi e frequenti. Bo01 è quasi “car-free”: solo 0,7 parcheggi per alloggio, con aree di sosta gestite e car-sharing elettrico. Pedoni e ciclisti hanno la priorità, con fermate bus ogni sette minuti e navette elettriche. Il quartiere favorisce la prossimità e l’autosufficienza: la scuola, il supermercato, la biblioteca, gli uffici e gli spazi culturali sono tutti raggiungibili a piedi. Le emissioni da trasporto interno si sono ridotte del 70 per cento rispetto a quartieri analoghi. Anche la gestione dei rifiuti è parte della strategia integrata. Circa l’80 per cento dei rifiuti domestici viene differenziato e avviato al recupero, grazie a sistemi di raccolta pneumatici e centri di compostaggio locale. Il restante 20 per cento viene trattato in un impianto di cogenerazione fuori città, che produce elettricità e calore per la rete urbana. L’obiettivo è arrivare gradualmente al recupero completo dei materiali. Non è un quartiere per soli ricchi, almeno in teoria. Fin dall’inizio, Bo01 ha previsto una quota di edilizia convenzionata, anche se i prezzi medi restano elevati. Malmö ha cercato di compensare con altri progetti analoghi nella stessa area, come Fullriggaren e Flagghusen, aumentando l’offerta e la
varietà tipologica. La pianificazione urbana ha puntato su una mescolanza sociale, anche attraverso spazi pubblici ben distribuiti e accessibili a tutti. Il costo iniziale del progetto è stato elevato, ma i benefici accumulati nel tempo lo hanno reso sostenibile. La manutenzione è ridotta, il valore immobiliare stabile, le spese energetiche contenute. Secondo uno studio dell’Agenzia svedese per l’energia, l’investimento iniziale è stato ammortizzato in circa 12–15 anni, mentre gli effetti positivi sul clima urbano e sulla salute pubblica continuano a generare valore. Bo01 non è un’utopia nordica irraggiungibile. È un sistema coerente, replicabile, adattabile. E soprattutto, è reale ormai da due decenni. È una parte della città che non promette miracoli, ma funziona ogni giorno con un’idea forte: progettare tutto, insieme, fin dall’inizio pensando al benessere dei cittadini.`,
    spunti: "Quartieri pilota per la sostenibilità energetica; l'eredità dei progetti urbani sperimentali nel tempo.",
    attivita: "Cerca 'quartiere Bo01 Malmö' su una mappa satellitare: che forma ha il quartiere e come sono orientati gli edifici rispetto al sole? Confronta con un quartiere di nuova costruzione della tua città.",
    summary: "Il quartiere Bo01 di Malmö, progettato agli inizi degli anni Duemila, nasce con l'obiettivo di dimostrare che un'intera area urbana può funzionare con energia rinnovabile: vent'anni dopo resta un modello di riferimento per la progettazione energetica dei nuovi quartieri europei."

  {
    num: 13, title: "Tartu, La Città Che Pensa E Si Rinnova", city: "Tartu", country: "Estonia",
    lat: 58.3776, lon: 26.729, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02e7nojos2cTB7bRVDVKTTJsKcjNkY2yLhzir4ob4YRLuB5xbbcLi6qdRUpXq7PJspl",
    text: `A sud del Golfo di Finlandia, sulle rive del fiume Emajõgi, sorge una città dove il futuro ha radici profonde. Tartu - in Estonia - non ha la frenesia di Tallinn, né l’austerità baltica delle capitali nordiche. Con i suoi centomila abitanti, è una città raffinata e raziocinante. Qui nacquero il primo giornale estone, la prima Università del Paese, il primo teatro nazionale. E oggi, mentre si guarda alle eredità del 2024 – anno in cui Tartu è stata Capitale europea della cultura con il motto “Arts of Survival” – la città mostra un’altra primogenitura. Quella di un luogo che ha saputo rinnovarsi silenziosamente, trasformando i propri quartieri post-sovietici in spazi urbani vitali, sostenibili e collaborativi. Nel distretto di Annelinn, un sobborgo ereditato dagli anni Settanta, le facciate grigie dei palazzoni prefabbricati raccontano ancora una memoria collettiva. Ma dietro quelle facciate si muove una macchina organizzata di riqualificazione energetica, che coinvolge direttamente gli abitanti e si nutre di innovazione. Le case non sono semplicemente ristrutturate: vengono ripensate a partire dalla qualità dell’aria, dall’efficienza termica, dall’accessibilità e dalla semplificazione della vita quotidiana. Tra gli interventi più significativi spicca la riqualificazione profonda dei khrushchyovka, i tipici edifici a cinque piani dell’era sovietica. Diciassette condomini riscaldati a gas sono stati trasformati in edifici a basso consumo di energia. L’adozione di pannelli solari, ventilazione meccanica controllata (VMC), coibentazione avanzata, sensori ambientali e controlli digitali in tempo reale ha permesso di ridurre i consumi fino al 60 per cento. Alcuni residenti, intervistati durante il programma “People and Places” di Tartu 2024, raccontano un salto di qualità tangibile: “Prima eravamo al freddo con le finestre rattoppate, ora possiamo regolare la temperatura stanza per stanza e controllare la CO₂ dal pannello in cucina. Ci sentiamo protetti, ascoltati”. Ogni intervento è documentato in un portale digitale, accessibile a tutti, dove si monitorano i risparmi e si raccolgono suggerimenti dei cittadini. Il Comune ha lavorato con le cooperative di abitanti, le Università e i fondi europei per creare una rete di trasformazioni dal basso. Negli spazi tra gli edifici crescono orti collettivi, percorsi permeabili e giardini comunitari. A Maarjamõisa, un’ex zona marginale, le superfici asfaltate sono state riconvertite in aree di ritenzione delle acque, microserre condivise e aree gioco intergenerazionali. Un piccolo sistema di drenaggio urbano sostenibile che riduce il rischio di allagamenti e stimola la biodiversità. Anche la mobilità riflette una visione armonica. Il centro, un dedalo ordinato di strade acciottolate, è quasi totalmente pedonale. I mezzi pubblici sono elettrici e gratuiti per studenti e pensionati. Le piste ciclabili – più di cento chilometri – connettono i quartieri e le navette per l’aeroporto si ordinano via app dallo smartphone. Tartu è stata la prima città estone a introdurre un sistema di bike sharing a pedalata assistita alimentato a energia solare. Ma l’aspetto più sottile, e forse più incisivo, è quello culturale. Il programma Kultuurikompass ha creato una piattaforma civica per ripensare gli spazi comuni. Ex fabbriche e magazzini si sono trasformati in atelier, residenze d’artista, sale concerti. La Widget Factory, un vecchio complesso industriale, è oggi un ecosistema creativo dove coworking, performance e design dialogano tra loro. “Qui non si rigenera per costruire qualcosa di nuovo – ha spiegato l’urbanista Ingrid Teder alla rivista Maaleht nel 2024 – ma per far emergere ciò che già esiste: idee, memoria, voglia di vivere insieme”. Anche la dimensione tecnologica è trattata con equilibrio. Con il programma europeo SmartEnCity, il quartiere di Karlova è diventato un distretto sperimentale: sensori ambientali, facciate connesse alla rete elettrica, illuminazione adattiva. Tutto funziona con discrezione; la tecnologia accompagna senza invadere.
Nel 2024, anno in cui Tartu ha accolto l’Europa con il suo “Arts of Survival”, la città ha mostrato un equilibrio raro tra continuità e trasformazione. La memoria non viene imbalsamata, ma vissuta. L’innovazione non è dogma, ma possibilità. Ogni biblioteca, scuola, strada, mostra la capacità di una comunità di trasformarsi senza dimenticare chi è stata. È questo che rende Tartu una città viva e stimolante. Non tanto per ciò che espone, ma per come costruisce il domani a partire dalle sue fibre più recondite.`,
    spunti: "Rigenerazione urbana nelle città medie del Baltico; il rapporto tra patrimonio storico-culturale e sviluppo contemporaneo.",
    attivita: "Localizza Tartu sulla carta dell'Estonia e del Mar Baltico. Cerca cosa significa 'Capitale europea della cultura' e quali altre città l'hanno ottenuto negli ultimi anni.",
    summary: "Sulle rive del fiume Emajõgi, Tartu — centomila abitanti, prima università e primo giornale estone — ha saputo rinnovarsi restando fedele alla propria storia: dopo essere stata Capitale europea della cultura nel 2024, la città mostra come tradizione e innovazione urbana possano convivere."
