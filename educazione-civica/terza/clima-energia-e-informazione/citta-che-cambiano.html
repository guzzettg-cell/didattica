    lat: 36.7213, lon: -4.4213, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid025wAsQaJ15cjeDkJSGUC1DzVCwadDdBngquWH9V3qAVhQ8ZYc9mwvbwdVh3otK9WGl",
    text: `È un pomeriggio d’autunno a Málaga, in Spagna, e il cielo ha la limpidezza tagliente del Mediterraneo. Dal piazzale della grande centrale di El Atabal, che desalinizza e potabilizza l’acqua per mezza città, si vedono file ordinate di pannelli solari. Sono 5.531 moduli che riflettono la luce e alimentano pompe, filtri e serbatoi. Ogni anno producono oltre 5.200 megawattora di elettricità e riducono di circa 2.400 tonnellate le emissioni di CO₂. Qui l’energia solare non serve a illuminare simboli ma a garantire che l’acqua arrivi ogni giorno nei rubinetti dei malagueños. Málaga conta più di seicentomila abitanti, oltre un milione nell’area metropolitana. È una città che vive sospesa tra siccità e piogge improvvise e copiose, dove l’acqua rimane questione di sopravvivenza urbana. Bacini artificiali, condotte, impianti di trattamento compongono un palinsesto tecnico che viene sorvegliato e manutenuto con continuità. Quell’eredità oggi si ritrova nei servizi pubblici. EMASA, la municipalizzata dell’acqua, gestisce anche il più esteso parco fotovoltaico cittadino. Settantuno impianti coprono i serbatoi, gli uffici e le coperture dei depositi idrici. È energia che diventa risparmio strutturale e affidabilità del servizio. La stessa logica guida il Metro de Málaga, che scorre sotto la città con due linee leggere. Nei capannoni di Talleres y Cocheras, dove i convogli vengono ricoverati e manutenuti, nel 2025 è entrato in funzione un impianto da 2 megawatt di picco. Con 3.719 pannelli produce circa 3.100 megawattora l’anno e copre il 27 per cento del fabbisogno energetico della metropolitana. Nelle ore centrali i treni viaggiano interamente grazie al sole e la domanda elettrica alla rete scende a zero. Non è un’operazione isolata. Il Comune ha avviato un piano di decarbonizzazione del patrimonio pubblico che coinvolge scuole, centri sportivi e uffici. Gli edifici diventano superfici attive e apportano potenza solare ai consumi urbani. Decine di tetti piccoli e medi che, messi insieme, cambiano il bilancio energetico della città. In questo mosaico il ruolo della cittadinanza è meno visibile che altrove. Non ci sono cooperative di quartiere a gestire i pannelli. È l’amministrazione che investe direttamente nelle aziende pubbliche. I risultati però hanno ricadute positive su tutti. L’acqua che si beve viene pompata grazie al sole e la metropolitana abbassa i costi di esercizio perché produce parte della sua elettricità. Sulle alture che guardano verso la foce del Guadalhorce, la “Desalobradora de El Atabal” resta un presidio silenzioso. Qui EMASA prepara un ampliamento che aumenterà del 12,5 per cento la capacità di produzione e ridurrà la salmuera dal venti al dieci per cento. La salmuera è l’acqua residua, molto salata, che si produce negli impianti di desalinizzazione quando si separa l’acqua dolce da quella marina. Non si tratta di un annuncio vago. I progetti sono già definiti, con un investimento fino a quarantacinque milioni di euro coperto in gran parte da fondi europei e tempi di esecuzione stimati in quattro anni. Intanto, alla “Depuradora del Guadalhorce”, i fanghi diventeranno materia per generare biogas ed elettricità, rafforzando un circuito che unisce acqua ed energia. La stessa logica di efficienza governa la gestione dei rifiuti. Oggi la città affida il servizio a LIMASAM, società interamente municipale. Nel biennio 2022-2023 sono stati sostituiti oltre dodicimila contenitori, di cui quasi quattromila destinati all’organico. Sono numeri che raccontano una rete diffusa e rinnovata. Málaga dispone anche di circa quattrocento contenitori sotterranei che liberano spazio visivo e riducono odori. È un dettaglio che sembra minore, e invece alleggerisce il rapporto tra raccolta e vicinato. Nell’estate del 2023, durante un’ondata di calore che mette sotto pressione i servizi, LIMASAM mantiene regolari i turni grazie a una flotta di mezzi alimentati a gas naturale e a una pianificazione
che sfrutta gli intervalli notturni. È un esempio di manutenzione quotidiana applicata al servizio più fragile, quello che altrove si spezza sotto stress climatico. Nel 2023 la società ha recuperato oltre 21mila tonnellate di materiali selezionati attraverso raccolte dedicate, 9400 tonnellate di vetro e altrettante di carta e cartone. I dati non raggiungono le percentuali nord-europee ma mostrano una crescita costante. Málaga resta fedele al suo ruolo di laboratorio mediterraneo. Qui non si affida alla buona volontà individuale ciò che può essere garantito da un sistema ben progettato. Tra pannelli solari e convogli metropolitani, tra bacini idrici e depositi sotterrati, la città dimostra che si può funzionare non grazie a proclami ma con infrastrutture solide, investimenti regolari e fiducia civica.`,
    spunti: "L'interdipendenza tra risorsa idrica ed energetica; la desalinizzazione come risposta alla scarsità d'acqua nel Mediterraneo.",
    attivita: "Cerca cos'è la desalinizzazione e quali Paesi del Mediterraneo la usano di più. Calcola quanta energia servirebbe per potabilizzare l'acqua della tua regione, se fosse necessario.",
    summary: "Dal piazzale della grande centrale di El Atabal, che desalinizza e potabilizza l'acqua per mezza città, si vedono oltre cinquemila pannelli solari che alimentano pompe, filtri e serbatoi: a Málaga il sole del Mediterraneo produce l'energia che serve a garantire l'acqua potabile, riducendo migliaia di tonnellate di CO₂ l'anno."
  },
  {
    num: 42, title: "Saragozza, La Città Spugna Dell’Ebro", city: "Saragozza", country: "Spagna",
    lat: 41.6488, lon: -0.8891, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0Wc9oCb8Cn4Tm791KdBH2nyEZs9CtRTVR3DJVyr2YPcwgrgmj8UfjFaxoPym7pbxal",
    text: `Le alluvioni di questi giorni hanno confermato che a Saragozza l’acqua non è mai neutra: può scarseggiare con la siccità o traboccare con le piene dell’Ebro. La città ha imparato a trattarla con rispetto, a misurarla e gestirla con attenzione. Nel cuore dell’Aragona, dove la siccità mediterranea si alterna a piene improvvise, l’acqua è sempre una questione concreta: per gli abitanti significa avere o non avere un servizio affidabile, potersi fidare di un rubinetto che scorre e di una fognatura che non puzzi o trabocchi. Proprio per questo Saragozza ha scelto di trasformarsi in una città spugna. Nei quartieri di nuova costruzione come nelle rigenerazioni urbane, marciapiedi drenanti, piazze ribassate e giardini della pioggia raccolgono l’acqua in eccesso e la lasciano filtrare lentamente. L’ordinanza comunale per l’eco-efficienza nella gestione integrale dell’acqua promuove esplicitamente l’uso dei sistemi urbani di drenaggio sostenibile: è un approccio che alleggerisce la rete fognaria e riduce i picchi di ruscellamento quando piove forte. Il percorso che ha portato a questo modello non è improvvisato. Dopo l’Expo 2008, dedicata al tema “Acqua e sviluppo sostenibile”, Saragozza trasforma quell’esperienza in pratica quotidiana. Il Parque del Agua Luis Buñuel, sorto sull’area espositiva, è oggi un polmone urbano di circa 120 ettari e un laboratorio a cielo aperto: canali e zone umide sono curati come infrastruttura verde, con manutenzione e riusi tecnici che tengono insieme svago, ecologia e gestione idrica. A gestire il sistema c’è Ecociudad Zaragoza, l’azienda pubblica dell’acqua e delle acque reflue. Negli ultimi anni la città ha accelerato su telelettura, modellazione e ispezioni per ridurre le perdite e migliorare la tracciabilità della rete. È più corretto parlare di riduzione progressiva delle dispersioni, piuttosto che di un tasso minimo già raggiunto. Sul versante dei consumi, Saragozza mantiene valori molto contenuti: negli ultimi anni il domestico oscilla intorno a 103–105 litri per abitante al giorno, contro una media nazionale che si colloca intorno a 128. Sono cifre che raccontano efficienza di rete e una cultura del risparmio idrico sedimentata. Il sistema cittadino tratta ogni anno circa 67–68 milioni di metri cubi: la EDAR La Cartuja registra oltre 53 milioni e la EDAR La Almozara aggiunge volumi a doppia cifra di milioni. La filiera non si limita a depurare: alla EDAR La Almozara la cogenerazione a biogas copre fino a circa i due terzi del fabbisogno elettrico dell’impianto, riducendo l’uso di energia dalla rete. L’acqua rigenerata è impiegata per usi non potabili in diversi contesti della città e dell’area metropolitana; un esempio emblematico è la piattaforma logistica PLAZA, dove il trattamento terziario consente il riuso per il verde pubblico. Quando l’Ebro cresce e minaccia i quartieri più bassi, entra in funzione un sistema di difese che è diventato parte del paesaggio funzionale: argini rinforzati, rimodellazione di sponde, casse e canali di laminazione. Le piene del 2015 e del 2018 sono tra le più severe del decennio; gli interventi successivi, dentro il programma Ebro Resilience, hanno migliorato la sicurezza idraulica in più tratti sensibili del corso medio. Non è la fine del rischio, ma un modo più solido di contenerlo. Quanto all'energia, dal 2025 il Comune ha avviato un pacchetto fotovoltaico che prevede 6.160 moduli su 18 edifici municipali, tra cui il Cementerio de Torrero, per una produzione stimata di oltre 5,2 milioni di kWh all’anno e un investimento di circa 3 milioni di euro. È energia che si somma alla rete di autoconsumi pubblici già attivi e alleggerisce i costi dei servizi. A questo si aggiunge Barrio Solar, comunità energetica di quartiere realizzata con ECODES ed EDP: 100 kWp complessivi installati sui centri sportivi Siglo XXI e Actur V, con una produzione attesa di circa 150.000 kWh all’anno condivisa tra residenti e attività nel raggio di 500 metri,
includendo nuclei vulnerabili. Nel complesso, fra impianti municipali e di quartiere, si superano 5,3 GWh all’anno, equivalenti ai consumi elettrici di circa 1.500 famiglie. La cittadinanza non resta ai margini. Campagne pubbliche, sportelli e incontri nei centri civici spiegano tariffe, consumi e lavori; le scuole usano materiali didattici su acquedotto e depurazione per mostrare ai ragazzi come funziona il ciclo integrato e perché ogni litro conta. È un’educazione minuta che, nel tempo, cambia abitudini. Con circa 723.000 abitanti, Saragozza non si presenta come un laboratorio futuristico, ma come una città che ha imparato a convivere con la fragilità dell’acqua. Qui ogni infrastruttura — dai tubi ai giardini pluviali — fa parte di un equilibrio che tiene insieme sicurezza, servizio pubblico, energia rinnovabile e partecipazione civica. ***Questo articolo è dedicato all’architetto urbanista e paesaggista cinese Kongjian Yu (1963– 2025), teorico della “città spugna”, scomparso pochi giorni fa in un incidente aereo in Brasile***`,
    spunti: "Convivenza con i regimi fluviali irregolari; la gestione integrata di siccità e alluvioni nella stessa città.",
    attivita: "Localizza Saragozza sul fiume Ebro e ripercorri sulla carta il corso del fiume dalla sorgente al mare. Cerca la differenza tra un regime fluviale regolare e uno irregolare.",
    summary: "Le alluvioni degli ultimi giorni hanno confermato che a Saragozza l'acqua non è mai neutra: può scarseggiare con la siccità o straripare con le piene dell'Ebro. Nel cuore dell'Aragona, dove i due estremi si alternano, la città ha imparato a trattare l'acqua con rispetto, misurandola e gestendola con attenzione."
  },
  {
    num: 43, title: "Utrecht, La Città Che Semplifica I Rifiuti", city: "Utrecht", country: "Paesi Bassi",
    lat: 52.0907, lon: 5.1214, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid08XfSP5DbojpRA9uGYRJcsiVqZcnrzT2XtgFVfz9BsdBu2UrSYpo7pP4xr9iHvCLql",
    text: `A Utrecht la raccolta differenziata non si fa più tra le mura domestiche. Dal 2021 il Comune ha deciso di abbandonare la separazione del PMD (plastica da imballaggio, metalli leggeri e cartoni per bevande tipo Tetrapak) nelle abitazioni e di affidarla a impianti industriali di nuova generazione. La scelta è maturata dopo anni di sperimentazione e analisi. La raccolta “porta a porta” produceva materiali troppo contaminati e costava più del necessario, mentre i sistemi di separazione automatica a valle garantivano una resa migliore e un impiego più razionale delle risorse pubbliche. Utrecht, città universitaria di 376.735 abitanti nel cuore dei Paesi Bassi, ha scelto la semplicità come strumento di efficienza. Eliminare la raccolta domestica del PMD ha significato ridurre la logistica, evitare la moltiplicazione dei contenitori e limitare i costi operativi. Per i cittadini la differenza è concreta: niente calendari di conferimento, niente sacchetti speciali, nessun obbligo di selezione complessa. Per il Comune, meno viaggi di camion dedicati e più materiali riciclati in modo controllato. Oggi il cittadino di Utrecht si limita a tre gesti elementari: inserire carta e cartone nei contenitori blu, vetro nelle campane di quartiere, scarti organici nel bidone verde del GFT (groente, fruit en tuinafval, cioè verdura, frutta e rifiuti da giardino). Tutto il resto confluisce nel sacco grigio del residuo, che viene conferito nei cassonetti interrati disposti lungo le strade. In molti punti l’apertura è libera; dove il cassonetto è dotato di sistema a pressa occorre una tessera elettronica, la stessa usata per i trasporti o per il pagamento dei servizi comunali. Il percorso dei rifiuti prosegue a Rozenburg, nell’area portuale di Rotterdam. Qui la società AVR (Afval Verwerking Rijnmond) gestisce l’impianto che effettua la “nascheiding”, la separazione meccanica e ottica delle diverse frazioni. Sul nastro trasportatore, rulli, magneti e campi elettrostatici isolano metalli ferrosi e alluminio; sensori a infrarossi riconoscono i polimeri plastici e li deviano con getti d’aria calibrati; operatori specializzati controllano e rifiniscono la selezione. Il risultato è una serie di materiali omogenei: balle di PET, cartoni per bevande, lattine pronte per il riciclo. Ciò che non può essere recuperato alimenta i termovalorizzatori, che producono calore per le reti di teleriscaldamento di Rotterdam e L’Aia ed elettricità per la rete nazionale. In questo modo la discarica diventa un’eccezione marginale, meno del due per cento dei rifiuti totali secondo i dati dell’Agenzia europea per l’ambiente. Il sistema è finanziato interamente dalla tassa rifiuti, che nel 2025 ammonta a 313,05 euro per le persone sole, 400,80 per due componenti, 477,20 per tre e 542,55 per famiglie di quattro o più membri. Non esistono incentivi individuali per i cittadini che producono meno rifiuti: la tariffa è forfettaria per nucleo familiare, con possibilità di riduzione per chi ha bassi redditi. Gli incentivi economici agiscono invece sul piano collettivo: l’Afvalfonds, il fondo nazionale finanziato dai produttori di imballaggi e gestito da Verpact, riconosce ai Comuni rimborsi proporzionali alla quantità e alla qualità dei materiali effettivamente recuperati. Va sottolineato che la tassa rifiuti corrisponde a circa l’uno per cento del reddito medio netto. Qui stipendi e pensioni medi sono sensibilmente superiori a quelli italiani. La decisione di Utrecht si fonda su una logica semplice: ridurre la complessità per ottenere risultati migliori. Gli studi condotti da Wageningen University & Research hanno confermato che la qualità delle plastiche estratte dalla nascheiding è paragonabile a quella della raccolta selettiva domestica, con costi inferiori e minori perdite di materiale utile. In una città dove la fiducia nelle istituzioni è alta e i servizi funzionano, la gestione dei rifiuti diventa parte di un ordine quotidiano: discreto, efficace, verificabile. Il sacco grigio che scompare nel boccaporto non rappresenta una rinuncia, ma il segno di un sistema che ha scelto la semplicità come forma di intelligenza pubblica.`,
    spunti: "Efficienza dei sistemi di raccolta differenziata; il confronto tra separazione domestica e impianti centralizzati.",
    attivita: "Confronta i dati di riciclo prima e dopo il 2021 a Utrecht (cercali online) con quelli della raccolta differenziata del tuo Comune. Discuti in classe: meglio separare in casa o negli impianti?",
    summary: "Dal 2021 Utrecht ha smesso di chiedere ai cittadini di separare in casa plastica, metalli leggeri e cartoni per bevande: la raccolta \"porta a porta\" produceva materiali troppo contaminati e costava più del necessario, così il Comune ha spostato il lavoro di separazione verso impianti industriali di nuova generazione."
  },
  {
    num: 44, title: "Vienna, Il Parco Artistico Sull’Acqua", city: "Vienna", country: "Austria",
    lat: 48.2082, lon: 16.3738, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0gK8XZLnQXRbnXCtarMDxy4CRfXabutzTXhXQ7yZiFF72UV4m11QXjaqgDYqTym34l",
    text: `A Vienna la bellezza non è un lusso: è un diritto civico. Nella capitale austriaca che da secoli costruisce spazi pubblici come luoghi di convivenza, anche un nuovo parco può diventare un atto politico. È ciò che è accaduto qualche giorno fa lungo l’Alte Donau, nel quartiere di Floridsdorf, dove la città ha scelto di restituire ai cittadini un tratto di riva che per anni era rimasto frammentato, chiuso, occupato da recinzioni e giardini privati. Il Kunst-Park Mühlschüttel, inaugurato il 4 ottobre 2025, è la prova che l’urbanistica può ancora essere una forma di giustizia sociale. Lì dove c’erano cancelli e orti privati, oggi si stendono 2,8 ettari di verde pubblico: prati, alberi giovani, pontili sull’acqua e un percorso curvilineo che invita a camminare senza fretta. La riva torna accessibile, l’acqua di nuovo visibile, la bellezza condivisa. Prima dell’intervento, il terreno apparteneva a un mosaico di piccoli affittuari. Quando gli ultimi contratti sono scaduti, il Comune non ha venduto, ma ha scelto di ricompattare il suolo e restituirlo alla collettività. È un gesto che racconta molto dello spirito viennese: la convinzione che lo spazio pubblico sia una forma di welfare e che il decoro urbano non possa prescindere dall’equità. Il progetto nasce da una collaborazione tra il Comune (Stadt Wien) e UniCredit Bank Austria. Il Comune ha curato il terreno, la piantumazione di 150 nuovi alberi e 3.000 metri quadrati di arbusti. La banca ha sostenuto la parte artistica, affidando la curatela ad André Heller, l’artista multimediale austriaco noto per i suoi giardini poetici. Non è un dettaglio secondario: Heller, che aveva già realizzato parchi d’arte in Marocco e in Italia, firma qui il suo primo progetto austriaco. Il parco accoglie 14 opere di artisti di sette Paesi, tra cui Vienna Mountain di Ugo Rondinone, un totem di pietre colorate alto sette metri, e Die Wasserwächterin (La guardiana dell’acqua), creata dallo stesso Heller. Le sculture non sono monumenti isolati, ma presenze che dialogano con il vento, con le ombre degli alberi e con i riflessi del lago. L’arte diventa parte del paesaggio, non intrusione. Tutto è pensato per la fruizione libera: accesso gratuito, orari estesi, percorsi pedonali e ciclabili che si collegano alla rete urbana. Sulla riva si aprono quattro pontili per il bagno e cinque piattaforme sull’acqua, concepite come piccole piazze galleggianti. È la stessa logica che da anni guida la politica viennese di riapertura delle rive: togliere barriere, restituire spazi, fare del paesaggio un bene comune. Il dipartimento per le acque (MA 45) e quello per la pianificazione urbana (MA 21) hanno lavorato insieme, evitando la retorica delle “grandi opere”. Qui non si costruisce per stupire, ma per durare. Le pavimentazioni drenanti, i prati a bassa manutenzione e le specie arboree resistenti al calore — pioppi neri, platani, olmi — traducono in pratica l’adattamento climatico. Quando il parco è stato inaugurato, lo scorso 4 ottobre, migliaia di viennesi sono arrivati a piedi o in bicicletta. Famiglie, studenti, anziani, curiosi: nessuna cerimonia, ma una giornata di festa. C’era chi ascoltava le installazioni sonore, chi si tuffava dall’ultimo pontile, chi semplicemente sedeva sull’erba guardando la luce del pomeriggio. Era la rappresentazione più limpida di ciò che Vienna continua a essere: una città che non confonde il progresso con la privatizzazione, che ancora crede che il paesaggio possa essere pubblico, e che la bellezza, se condivisa, diventa servizio. Il Kunst-Park Mühlschüttel non è solo un parco d’arte. È un atto di fiducia nella capacità di una città di rigenerarsi senza perdere sé stessa. Dove altrove si costruiscono muri, palazzoni informi e centri commerciali, Vienna apre un giardino artistico. E dimostra che l’idea di bene comune non appartiene al passato, ma al futuro più concreto dell’Europa migliore.`,
    spunti: "Il diritto di accesso pubblico alle rive dei fiumi e dei laghi urbani; la riconversione di spazi privati in beni comuni.",
    attivita: "Cerca una mappa di Vienna e localizza l'Alte Donau rispetto al Danubio principale. Individua un tratto di fiume o lago della tua zona non accessibile al pubblico e proponi un progetto di riqualificazione.",
    summary: "Lungo l'Alte Donau, nel quartiere di Floridsdorf, Vienna ha restituito ai cittadini un tratto di riva rimasto per anni frammentato, chiuso da recinzioni e giardini privati, trasformandolo in un nuovo parco pubblico sull'acqua: per la capitale austriaca, che costruisce da secoli spazi di convivenza, la bellezza urbana è un diritto civico."
  },
  {
    num: 45, title: "Città Spugna E Pioggia Preziosa", city: "Copenaghen", country: "Danimarca",
    lat: 55.6761, lon: 12.5683, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid031otdeYQjRyzDxcVx3p17xQo1kXstYrrHRksZPjALxaG9mVkRssRHGkmu8QKDJu5Gl",
    text: `Visto da qui, il confronto con le città italiane è impietoso. Basta un acquazzone per paralizzare interi quartieri. Troppo asfalto, troppi parcheggi impermeabili, troppe colate di cemento su terreni che un tempo assorbivano e filtravano. Pochi alberi, spesso trascurati, abbattuti o lasciati morire per mancanza di cura. Spesso mancano le fogne bianche separate per l’acqua piovana, ed è raro trovare cisterne pubbliche o sistemi di recupero dell’acqua. Nelle regioni meridionali, dove le estati diventano sempre più aride, si continua a disperdere un bene prezioso. La risposta non può essere soltanto scavare nuove condotte o innalzare argini: serve una grammatica urbana diversa, capace di far convivere pioggia e città. A Copenaghen questa grammatica è già realtà. Da oltre un decennio la capitale danese costruisce una città che assorbe e riusa. L’idea nasce dopo il temporale del luglio 2011, quando in due ore cadono 150 millimetri di pioggia: tunnel e stazioni allagati, centrali elettriche bloccate, danni per centinaia di milioni di euro. L’amministrazione reagisce con una scelta di campo: trasformare il rischio in infrastruttura. Nel 2012 il Comune approva il Cloudburst Management Plan, che cambia il modo di concepire la pioggia. Non più un nemico da espellere, ma un elemento da accogliere e regolare. Strade, parchi e piazze diventano dispositivi idraulici a cielo aperto. Oggi i risultati sono visibili. Nel quartiere Vesterbro, il grande Enghaveparken è un bacino verde capace di trattenere fino a ventiduemila metri cubi d’acqua. A Østerbro, la piazza di Tåsinge Plads funziona come giardino drenante: depressioni, aiuole filtranti, pavimentazioni permeabili. E a Nordvest, il nuovo Grønningen-Bispeparken — completato l’anno scorso — ha già dato prova della sua efficacia. Una settimana dopo l’inaugurazione un violento temporale ha colpito la città. L’acqua ha trovato spazio nei bacini erbosi, ha seguito l’inclinazione del terreno e si è lentamente infiltrata, senza invadere le abitazioni. Nessun allagamento, nessuna emergenza. Il parco, firmato dallo studio SLA, è l’ultimo tassello di una rete di oltre trecento interventi diffusi in tutta la capitale. Il principio è semplice: usare il paesaggio come infrastruttura. Modellare il suolo perché raccolga, non respinga. Le strade sono ridisegnate con pendenze che guidano l’acqua verso aree sicure; i cortili scolastici diventano vasche temporanee; i marciapiedi lasciano filtrare; i tetti verdi e le cisterne alleggeriscono il carico sulle fognature. Ogni spazio pubblico è pensato per funzionare due volte: come luogo di vita quotidiana e come dispositivo idraulico durante la pioggia. La lezione più importante di Copenaghen non è tecnica, è culturale. La città ha scelto di convivere con l’acqua invece di combatterla, di trasformare la propria vulnerabilità in risorsa. Le infrastrutture del clima coincidono con gli spazi del vivere: i bambini che giocano nei bacini, i cittadini seduti sulle sponde erbose, i quartieri che respirano insieme. Una normalità silenziosa, dove funziona ciò che non si vede e la manutenzione diventa parte della vita civile. Per l’Italia, sospesa fra alluvioni improvvise e mesi di siccità, questa è la direzione necessaria. Servono città capaci di assorbire, rallentare, trattenere e riutilizzare. Città che non si difendono soltanto ma si adattano. Ogni progetto urbano dovrebbe chiedersi non come espellere l’acqua, ma come gestirla. Finché continueremo a costruire come se la pioggia fosse un incidente, continueremo a subirla.`,
    spunti: "Confronto tra modelli urbani italiani ed europei nella gestione delle piogge intense; le città spugna come risposta al dissesto idrogeologico.",
    attivita: "Cerca i dati sull'alluvione di Copenaghen del luglio 2011 (150 mm di pioggia in due ore) e confrontali con un evento meteorologico estremo avvenuto nella tua regione. Costruisci una linea del tempo.",
    summary: "Rispetto a molte città italiane, dove basta un acquazzone per paralizzare interi quartieri per troppo asfalto e poche cisterne, Copenaghen ha costruito da oltre un decennio una \"grammatica urbana\" diversa: dopo l'alluvione del luglio 2011, con 150 mm di pioggia in due ore, il Comune ha approvato un piano che trasforma il rischio in infrastruttura, città che assorbe e riusa l'acqua invece di scaricarla soltanto."
  },
  {
    num: 46, title: "Un Equilibrio Chiamato Stoccolma", city: "Stoccolma", country: "Svezia",
    lat: 59.3293, lon: 18.0686, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0vja32LfB4mWmcQnpvJ1JGYBLBbkmNhf7DuVpHNKg67qpdTmAFovaQuebFPcscXrTl",
    text: `A marzo 2024 nella stazione centrale di Stoccolma i pendolari alzano gli occhi verso i tabelloni digitali. C’è un nome nuovo: SJ AB, la società ferroviaria statale svedese. Dopo mesi di ritardi e convogli soppressi all’ultimo minuto, la rete suburbana dei “pendeltåg” – i treni regionali che collegano la capitale con i comuni dell’hinterland – cambia gestore. L’autorità regionale Region Stockholm revoca l’appalto alla compagnia privata MTR e stipula con SJ un “nödavtal”, un accordo d’emergenza. Tutto avviene in silenzio ma l’atto è quanto mai esplicito. In questa città i servizi non sono materia di opinione. Se qualcosa non funziona si cambia e si riparte. Il malcontento dei viaggiatori era arrivato al culmine: la soddisfazione nei confronti dei treni regionali era scesa al 59%, venti punti sotto la media generale del trasporto pubblico di SL (Storstockholms Lokaltrafik), l’azienda regionale che coordina bus, metro, battelli e treni. A Stoccolma non si lascia che la disfunzione diventi abitudine. La puntualità è un diritto civico e il trasporto un servizio che si misura ogni giorno. La città vive su quattordici isole, collegate da ponti, tunnel e battelli. Un mosaico di acqua e granito, dove le distanze si superano con metodo. La “tunnelbana”, la metropolitana, conta 100 stazioni e poco più di 100 chilometri di rete, ma il movimento non si ferma sottoterra. Nel 2024 i battelli pubblici hanno trasportato 5,8 milioni di passeggeri. Anche il mare qui è parte della logistica quotidiana. Quasi un milione di abitanti nel comune e 2,47 milioni nell’area metropolitana si muovono ogni giorno dentro un sistema che funziona come un unico organismo. Andare in bicicletta non è un gesto simbolico: ci sono 1.140 chilometri di piste ciclabili, e i tracciati si intrecciano con le stazioni, i terminal, i pontili. La continuità è la regola. E il verde non è un privilegio ma una condizione di base: secondo i dati della Commissione Europea, tra il 90 e il 95 per cento dei residenti vive entro 300 metri da un’area verde. È una misura che dice molto più di qualsiasi slogan. Perfino il calore dei termosifoni racconta la stessa logica di efficienza diffusa. La rete di teleriscaldamento gestita da Stockholm Exergi copre oltre il 90% degli edifici con un mix di energia recuperata da rifiuti e biomassa. Nel 2024 l’azienda ha ottenuto il via libera per il primo impianto BECCS (Bioenergy with Carbon Capture and Storage) su scala metropolitana d’Europa. Una centrale catturerà l’anidride carbonica prodotta dalla combustione del legno e la immagazzinerà sottoterra, trasformando una fonte di emissioni in un pozzo di carbonio. A sud, nel rione di Sickla, un altro esperimento cambia la materia stessa di cui è fatta la città: Stockholm Wood City. A ottobre 2024 sono partiti i cantieri del primo grande quartiere al mondo costruito interamente in legno ingegnerizzato: 2.000 abitazioni e 7.000 posti di lavoro distribuiti tra uffici, laboratori e spazi pubblici. Il legno lamellare, composto da tavole incollate a strati incrociati, pesa la metà del cemento e resiste al fuoco. Si monta a secco e trattiene il carbonio accumulato dagli alberi. Il primo lotto sarà completato nel 2026, ma la vera novità è il metodo. Giardini e trasporto pubblico arrivano insieme con le case, e le scuole vengono pianificate insieme agli uffici. A nord-ovest, intanto, la Linea Blu della metropolitana si estende da Akalla a Barkarby: due nuove stazioni, interscambio con i treni regionali e apertura prevista nel 2027. È un’infrastruttura pensata per assorbire la crescita senza alterare i ritmi della città. Tutto si muove con la precisione di un ingranaggio ben progettato: invisibile ma risolutivo.`,
    spunti: "La gestione pubblica o privata dei trasporti regionali; il pendolarismo tra capitale e comuni dell'hinterland.",
    attivita: "Cerca la differenza tra gestione pubblica e privata di un servizio di trasporto. Verifica chi gestisce i treni regionali della tua zona e da chi dipendono le decisioni su orari e tariffe.",
    summary: "Dopo mesi di ritardi e treni soppressi, nel marzo 2024 la regione di Stoccolma revoca l'appalto dei treni suburbani alla compagnia privata che li gestiva e affida il servizio alla società ferroviaria statale svedese SJ AB: un cambio di gestore per restituire puntualità ai pendolari che ogni giorno collegano la capitale con l'hinterland."
  },
  {
    num: 47, title: "Pilsen, La Città Che Si Aggiusta Da Sé", city: "Plzeň", country: "Repubblica Ceca",
    lat: 49.7384, lon: 13.3736, category: "energia",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0jZdLH9TQtdxv2oW9Po5DuxZFyNpgRzuf7Mg43NCgVwtGKmdeXGHVNbo6NQVijFhhl",
    text: `A Pilsen (Plzeň), in Boemia occidentale, la città della birra ha imparato a far fermentare anche i dati. Nel centro operativo della società municipale SITMP, i tecnici seguono in tempo reale il battito urbano: traffico, pressione dell’acqua, livelli dei fiumi, illuminazione, orari dei tram. Ogni sistema dialoga con gli altri. Quando un sensore segnala un’anomalia, l’allarme arriva prima del guasto. È un metabolismo che si regola da sé, costruito per prevenire, non per rincorrere. Pilsen, 181 mila abitanti a novanta chilometri da Praga, è un laboratorio di manutenzione digitale più che di tecnologia spettacolare. Da secoli combina precisione e ingegno: nell’Ottocento inventa la Pilsner-Urquell, nel Novecento forgia locomotive e turbine della Škoda. Oggi quella stessa cultura tecnica si traduce in efficienza amministrativa. Nel centro di controllo della SITMP (Správa informačních technologií města Plzně), ogni quartiere è un nodo su una mappa che si aggiorna di continuo. I dati arrivano dai semafori, dai sensori idrici, dalle linee del trasporto pubblico. Sul portale Open Data Plzeň chiunque può consultare le reti fognarie, le stazioni di ricarica elettrica, i punti luce, i cantieri in corso. I dataset si scaricano, si combinano, diventano strumenti di lavoro per imprese, ricercatori o cittadini. È una forma di fiducia istituzionale: rendere visibile l’invisibile. La municipalizzata dei trasporti, PMDP, utilizza un sistema cooperativo che dialoga con i veicoli e con l’infrastruttura semaforica. Tram e autobus ricevono priorità agli incroci, migliorano la puntualità e riducono i consumi. Pilsen è tra le prime città europee a sperimentare questa tecnologia nell’ambito del programma C-Roads, che connette i centri urbani attraverso protocolli di comunicazione veicolo-infrastruttura. In periferia, nei depositi di Slovany, un tram blu e giallo entra nel capannone e si muove da solo per le manovre interne: è il primo convoglio ceco con guida autonoma di deposito, sviluppato con l’Università Tecnica di Praga. Si arresta preciso sulla linea di manutenzione, le porte si aprono, il tecnico registra i dati sul tablet. È un esperimento già entrato nella routine: qui l’efficienza vale più dell’effetto. La Boemia occidentale è una regione industriale e agricola insieme, e Plzeň ne rappresenta il cuore tecnico. L’Università della Boemia Occidentale forma ingegneri, informatici e urbanisti che alimentano il sistema municipale. I laboratori collaborano con la Škoda Transportation, che continua a produrre treni e tram per l’Europa. La cultura della precisione meccanica si è trasformata in cultura dei dati: stessa pazienza, stessa responsabilità. Il portale mapy (dot) plzen (dot) eu, base cartografica della città, non è un progetto dimostrativo ma uno strumento operativo. Raccoglie modelli 3D, rilievi termici, piani di rischio idraulico, aggiornamenti sui servizi pubblici. Quando le precipitazioni superano una soglia o la pressione cala in un tratto di rete, il sistema notifica il problema e avvia automaticamente la catena di intervento. È la manutenzione come politica pubblica: nessuna spettacolarità, solo continuità. Gli open data del Comune sono ormai parte dell’ordinario: un’infrastruttura di servizio come l’acqua o la luce. Nel 2025 Plzeň risulta seconda in Repubblica Ceca per quantità e qualità di dataset pubblicati. Nell’indice sulla qualità della vita di Numbeo, la città si colloca al 55º posto al mondo, davanti a Bruxelles, Milano e Lione. In Europa le prime posizioni spettano a città come L’Aia, Zurigo o Copenhagen e il risultato di Plzeň conferma che anche nell’Est si può costruire una qualità urbana solida, misurabile, quotidiana. Nella vita quotidiana la tecnologia si nota poco. I semafori modulano i tempi in base al traffico, i lampioni variano l’intensità con la luce naturale, i pannelli alle fermate aggiornano gli orari in tempo reale. Tutto funziona in continuità, senza far rumore.
Pilsen dimostra che la modernità può passare attraverso la manutenzione quotidiana. In un’Europa che spesso confonde innovazione e comunicazione, questa città boema continua a lavorare con la pazienza dei suoi birrai e dei suoi tecnici.`,
    spunti: "Le città come sistemi interconnessi di infrastrutture; il monitoraggio in tempo reale dei servizi urbani.",
    attivita: "Cerca cos'è un 'centro operativo' o 'control room' di una città intelligente e quali dati vengono monitorati in tempo reale. Disegna uno schema delle infrastrutture della tua città che potrebbero essere collegate a un sistema simile.",
    summary: "Nella città della birra, Plzeň ha imparato a far \"fermentare\" anche i dati: nel centro operativo della società municipale SITMP, i tecnici seguono in tempo reale traffico, pressione dell'acqua, livelli dei fiumi, illuminazione e orari dei tram, così che un sensore segnali un'anomalia prima ancora che diventi un guasto."
  },
  {
    num: 48, title: "Il Sabato Del Villaggio Energetico", city: "Les Haies", country: "Francia",
    lat: 45.15, lon: 4.76, category: "energia",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0LEx5RffnGQ5dZt4JM2W23gjs8cMSxvzvgnrs5iNtsB4mPQyU6cwthSBrJ6C46WXYl",
    text: `Nel 2014, nel sud-est della Francia, tra le colline che costeggiano il Rodano, il piccolo comune di Les Haies – ottocento abitanti – diventa il punto d’origine di un esperimento destinato a diffondersi in tutto il Paese. È un sabato d’estate. Sul tetto della scuola elementare alcuni residenti montano pannelli fotovoltaici insieme ai tecnici. Dal cortile si vedono mani che passano cavi, scale che scricchiolano, bambini che contano le file dei moduli. È lì che comincia tutto. Un gruppo di abitanti decide di produrre elettricità pulita. Raccoglie i risparmi, costituisce una piccola società, affitta i tetti del municipio e di alcune case, ottiene un prestito dalla banca cooperativa La Nef. In poche settimane i pannelli entrano in funzione. Ma il risultato non è solo tecnico: è la nascita di una cittadinanza energetica, in cui la produzione è vicina, condivisa e trasparente. L’iniziativa si inserisce in un progetto più ampio avviato alcuni anni prima da cinque Parchi naturali regionali della Rhône-Alpes e da AURA-EE, l’Agenzia Regionale dell’Energia e dell’Ambiente. L’obiettivo è capire se i cittadini possano diventare protagonisti della transizione ecologica senza attendere direttive dall’alto. L’idea è tanto semplice quanto radicale: ogni villaggio, o gruppo di comuni, può costituire una propria società energetica locale, progettare impianti rinnovabili, amministrarli in autonomia e condividere i profitti sul territorio. Da quei primi esperimenti nasce la rete delle Centrales Villageoises, società a capitale diffuso partecipate da cittadini, enti pubblici e imprese locali. Le prime otto centrali sorgono tra il 2013 e il 2014, in zone rurali o di montagna dove i tetti pubblici sono pochi e i fondi limitati. Gli abitanti investono somme modeste – da cento a cinquecento euro – ma il gesto conta più del rendimento. È un modo per affermare che l’energia non appartiene solo alle grandi utilities, ma può tornare bene comune. Nel 2018 viene fondata l’associazione nazionale con sede a Villeurbanne, vicino a Lione. Fornisce consulenza, formazione e strumenti amministrativi a chi vuole avviare un progetto, predispone statuti-tipo, modelli di contratto, piani economici e accordi con Enedis, il gestore francese della rete elettrica (come il nostro GSE). Ogni gruppo locale può così partire da una base solida, evitando burocrazia e sprechi. Oggi, nel 2025, la rete è matura: 77 territori coinvolti, 8090 azionisti tra cittadini, comuni e piccole imprese, oltre sedici milioni di euro investiti e una potenza installata che supera i dieci megawatt. Le centrali alimentano scuole, uffici pubblici e abitazioni con energia prodotta a pochi metri di distanza. Ogni società è a capitale diffuso: in media, il settanta per cento appartiene ai residenti, e ogni socio dispone di un solo voto, indipendentemente dalla somma versata. Gli utili non vengono distribuiti: una parte copre la manutenzione, il resto si reinveste in nuovi impianti o in progetti sociali. L’elettricità è venduta attraverso contratti di acquisto garantito, previsti dal sistema pubblico francese (gestito da EDF Obligation d’Achat) oppure a fornitori cooperativi come Enercoop. In alcuni casi i produttori stipulano accordi diretti di lungo periodo con imprese locali, i cosiddetti “Power Purchase Agreements “(PPA). In questo modo il valore dell’energia resta sul territorio, rafforzando la coesione economica e la fiducia reciproca. In Savoia, dodici società locali gestiscono sessantaquattro impianti e producono ogni anno circa 3000 megawattora, sufficienti a coprire il consumo elettrico di base di un migliaio di famiglie. Gli impianti sono distribuiti su tetti di scuole, fattorie, cooperative agricole, municipi.
Nel 2025 tre centrali condividono un tecnico specializzato, cofinanziato dal programma LEADER e dagli enti locali: un posto di lavoro comune per gestire pratiche, manutenzione e attività didattiche. È il segno di una rete che si professionalizza senza smarrire la sua dimensione civica. I benefici sono concreti. Ambientali, perché l’elettricità è prodotta dove si consuma, con perdite di rete minime e impatti ridotti. Sociali, perché i cittadini si incontrano, discutono e decidono insieme, ritrovando una forma di coesione silenziosa. Economici, perché i ricavi restano sul posto: ogni euro investito genera nuovi interventi e riduce la dipendenza da operatori esterni. È una manutenzione quotidiana dell’indipendenza locale. Nel 2024, a Bruxelles, la rete delle Centrales Villageoises riceve il Premio europeo EUSEW – Local Energy Action. Non è un riconoscimento di circostanza, ma la conferma che un modello costruito dal basso può funzionare meglio di molte strategie calate dall’alto. Dieci anni dopo quel pomeriggio a Les Haies, il principio è rimasto lo stesso: fare insieme cose utili, un tetto alla volta, un contratto dopo l’altro. L’energia come bene comune, gestita con la stessa cura con cui si mantiene una fontana o un sentiero. E se imparassimo da loro?`,
    spunti: "Le piccole comunità rurali come pionieri della transizione energetica; la partecipazione diretta dei cittadini ai progetti locali.",
    attivita: "Cerca la popolazione di Les Haies (800 abitanti) e confrontala con un piccolo paese vicino a te. Calcola quanti pannelli solari servirebbero per un edificio scolastico delle dimensioni della tua scuola.",
    summary: "Nel 2014, tra le colline che costeggiano il Rodano, il piccolo comune francese di Les Haies (ottocento abitanti) diventa il punto di partenza di un esperimento che si diffonderà in tutto il Paese: un gruppo di residenti monta insieme ai tecnici i primi pannelli fotovoltaici sul tetto della scuola elementare, dando il via a una comunità energetica locale."
  },
  {
    num: 49, title: "Bruxelles E Il Riuso Del Ferro", city: "Bruxelles", country: "Belgio",
    lat: 50.8503, lon: 4.3517, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0NNgjaXRXwoMyWsNuytJkRY7drfXwhmH8gePZDr3iPuWubaSarzSuYk6jh2nV9uoVl",
    text: `Al mattino la luce entra di taglio, filtrata dalle travature d’acciaio. Sotto la grande volta della Gare Maritime di Bruxelles, dove un secolo fa scorrevano i treni del Belgio industriale, si muove oggi un traffico silenzioso di persone. L’aria ha un odore tiepido di metallo e legno nuovo. Siamo nel cuore dell’antico complesso di Tour & Taxis, a nord della città. Qui, tra il canale di Willebroek e la stazione di Bruxelles-Nord, si incontravano le rotte ferroviarie che collegavano Anversa e Rotterdam. Il ferro e la ghisa hanno resistito al tempo: dal 1907 al 1913 la stazione fu il principale scalo merci d’Europa, poi vennero il silenzio, la ruggine, le erbacce. Quando il gruppo Extensa ne assume la proprietà, sceglie la via più sobria e difficile: non costruire altrove, ma rimettere in vita ciò che c’era. Il progetto di Neutelings Riedijk Architects e Bureau Bouwtechniek non demolisce: restaura, ricuce, reintegra. Ogni trave viene sabbiata e rimontata, ogni lastra di vetro ripensata per trattenere la luce. All’interno si innestano sei padiglioni in legno lamellare incrociato (CLT), edifici autonomi sospesi sotto la grande navata di ferro e vetro. Non c’è contrapposizione: il legno accoglie la memoria del metallo, il metallo restituisce al legno la sua leggerezza. Il vecchio scalo ferroviario è diventato il baricentro di una zona che si rigenera. Ogni giorno migliaia di pendolari e studenti passano tra Molenbeek e il centro: a sud il canale, percorso da ciclisti e da chi raggiunge a piedi la stazione; a nord il parco di Tour & Taxis, che serve un quartiere popolare di case minute e cortili interni. La Regione Bruxelles-Capitale ha inserito questa porzione della città nel programma di recupero delle friches urbaines, le aree dismesse della cintura nord. Oggi vi abitano oltre centocinquantamila persone, in prevalenza a reddito medio-basso. La Gare Maritime ne è diventata un attraversamento necessario. Vi transitano più di cinquemila persone al giorno, il sessantadue per cento non per eventi ma per spostamenti quotidiani. Le corti interne ospitano mense, coworking, laboratori artigianali, mercati alimentari di produttori locali. I bambini giocano sotto le travi, i lavoratori del porto pranzano ai tavoli comuni. È una piazza coperta, dove l’uso pubblico è garantito da una clausola urbanistica: accesso libero, senza consumo obbligatorio. La temperatura resta costante, la luce scorre lungo il pavimento come acqua. Anche nei giorni di pioggia più fitta, la Gare Maritime mantiene un ritmo quieto e regolare: la vita ordinata di una città costruita per durare. L’energia proviene da 17.000 metri quadrati di pannelli fotovoltaici e da pompe di calore geotermiche che assicurano riscaldamento e raffrescamento. L’acqua piovana è raccolta nelle griglie del pavimento, filtrata e riutilizzata per irrigare e pulire. Tutto funziona con discrezione: impianti nascosti, clima stabile, ventilazione naturale che accompagna il passo di chi attraversa. Il complesso occupa 45.000 metri quadrati, ma nessun metro di suolo nuovo è stato consumato. Sorge su terreno industriale impermeabilizzato da un secolo: le superfici asfaltate sono state sostituite da pavimentazioni drenanti e corti verdi. Intorno, il Tour & Taxis Park – nove ettari di prato e alberi – collega l’area al quartiere di Laeken: un corridoio ecologico e sociale attraversato da famiglie, studenti, lavoratori. È il contrappunto all’interno coperto: lo spazio dell’aria dopo la solidità del ferro. Gli affitti degli spazi commerciali e terziari sostengono la manutenzione e gli eventi pubblici – fiere, mostre, festival dell’innovazione – mentre il Comune e la Regione garantiscono infrastrutture, trasporti e regole urbanistiche. Il privato investe e gestisce: un equilibrio stabile, in cui la rendita immobiliare coincide con la qualità urbana. Un investimento privato ma governato dal pubblico.
Dall’alto delle passerelle si vedono i vecchi binari che attraversano il parco, il profilo dei magazzini rigenerati, la linea del canale che riflette il cielo. Tutto partecipa di un ordine discreto, di una cura quotidiana che è la vera misura della civiltà urbana.`,
    spunti: "Il riuso del patrimonio industriale dismesso; la memoria urbana come risorsa per la rigenerazione delle città.",
    attivita: "Cerca la storia di Tour & Taxis e del Belgio industriale dell'Ottocento. Individua un edificio industriale storico della tua città e proponi un nuovo utilizzo per lo spazio.",
    summary: "Sotto la grande volta d'acciaio della Gare Maritime di Bruxelles, dove un secolo fa scorrevano i treni del Belgio industriale, si muove oggi un traffico silenzioso di persone: nel cuore dell'antico complesso di Tour & Taxis, l'archeologia industriale è stata recuperata invece di essere demolita, dando nuova vita a un pezzo di storia urbana."
  },
  {
    num: 50, title: "Come Fanno I Cartoni A Londra", city: "Londra", country: "Regno Unito",
    lat: 51.5233, lon: 0.1043, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0sVwuNA2N8LM9GCUMFQP1ZxjSNCQ7iAPcUCd9P4PtNzWiecPAuaJc2hcYUtERXLmKl",
    text: `A Barking Riverside, nella fascia orientale di Londra, dove un'area industriale dismessa sta diventando un nuovo quartiere per famiglie e classi medie, il cartone non finisce più nei cassonetti come accade nel resto della città. Entra in una macchina che lo afferra, lo sminuzza e lo immette nella rete sotterranea. La scatola viene piegata, introdotta nella bocca metallica larga quasi novanta centimetri, poi il meccanismo si chiude e le lame interne la riducono in fibre uniformi.
È uno "shredder", un trituratore di cartone, pensato per trattare gli imballaggi voluminosi dell'e-commerce e prepararli alla spinta pneumatica. Il materiale triturato scivola nel condotto e percorre poche centinaia di metri nel sottosuolo fino alla stazione di raccolta, senza più riaffacciarsi in superficie.
Barking Riverside occupa i terreni della vecchia Barking Power Station, affacciata sul Tamigi, dove Londra sta ridisegnando la crescita urbana a est. La Greater London Authority e la housing association L&Q hanno creato Barking Riverside Limited, la società che guida lo sviluppo del quartiere.
Qui la gestione dei rifiuti non dipende dagli spazi domestici o dai cortili dei condomini. L'impianto è definito a monte ed è parte dell'infrastruttura di base, come il molo per il bus acquatico e la stazione della metropolitana. La vita quotidiana si innesta su un sistema già progettato e costruito.
Il quartiere utilizza l'"Automated Waste Collection System" della multinazionale svedese Envac, operativo dal 2019. In superficie compaiono solo le torrette cilindriche di conferimento, distribuite tra gli edifici e i percorsi pubblici. Ci sono tre flussi separati per tipologia di rifiuti. Sotto l'asfalto corre una rete di tubazioni che collega ogni imbocco all'unica stazione di raccolta posta ai margini dell'area. Le torrette sono dotate di sensori che registrano il livello di riempimento.
Quando la soglia è raggiunta, la stazione avvia un ciclo di aspirazione che trascina i materiali lungo la condotta principale. La velocità è elevata e permette di superare curve e cambi di quota senza interruzioni. Tutto converge nel punto finale, dove le frazioni arrivano già separate grazie agli imbocchi dedicati e sono gestite in comparti distinti.
Il residuo segue la filiera ordinaria londinese, che prevede trattamento meccanico-biologico e, in ultima istanza, termovalorizzazione. Le altre frazioni vengono compattate e avviate al riciclo.
L'impatto urbano è immediato. Le 460 bocche di conferimento sostituiscono i cassonetti che, nei quartieri tradizionali, occupano cortili e marciapiedi. I camion non attraversano più le strade interne né si fermano davanti a ogni edificio. Il traffico operativo si concentra sulla sola stazione di raccolta, con benefici evidenti sul silenzio, sul decoro e sugli spazi pubblici.
Anche gli esiti ambientali migliorano. Le analisi disponibili indicano che Barking Riverside supera stabilmente il quaranta per cento di avvio al riciclo, con valori più che tripli rispetto alla media londinese degli edifici residenziali simili.
Lo "shredder", attivo dal 2024, risolve un punto debole della filiera. Gli imballaggi voluminosi, spesso causa di errori di conferimento, vengono ridotti in fibre regolari e immessi subito nella rete. Non intasano gli imbocchi né appesantiscono la linea del riciclabile secco. Il cartone triturato si muove con continuità nella rete e non crea ostacoli, riducendo i cicli di aspirazione. Secondo le stime dell'operatore, l'impianto evita che decine di tonnellate di cartone finiscano in smaltimenti non ottimali.
La governance completa il quadro. La partecipazione diretta della Greater London Authority nella società di sviluppo permette di trattare la gestione dei rifiuti come un'infrastruttura primaria. Il sistema è progettato insieme alle nuove fasi del quartiere e aggiornato con continuità.
Nel 2025 Barking Riverside Limited ed Envac hanno siglato un contratto per estendere la rete. La raccolta automatizzata è congeniale al quartiere. Nelle strade non ci sono contenitori, il rumore è minimo e la gestione avviene nel sottosuolo. Il cartone e gli altri rifiuti entrano nel sistema e ricompaiono solo negli impianti a distanza. È un approccio fondato sull'infrastruttura invisibile, che semplifica la vita quotidiana e libera lo spazio in superficie, senza cassonetti maleodoranti, ingombranti e brutti da vedere.`,
    spunti: "Riconversione di aree industriali dismesse in nuovi quartieri residenziali; le infrastrutture di raccolta rifiuti progettate fin dall'inizio nella pianificazione urbana.",
    attivita: "Localizza Barking Riverside sulla mappa di Londra, lungo il Tamigi. Confronta la vecchia Barking Power Station con il nuovo quartiere: cerca foto storiche e attuali del sito.",
    summary: "A Barking Riverside, nuovo quartiere sorto su un'ex centrale elettrica nella Londra est, anche il cartone segue una rete pneumatica sotterranea: uno speciale trituratore lo riduce in fibre che viaggiano nei tubi fino alla stazione di raccolta, senza passare per i cassonetti di superficie."
  },
  {
    num: 51, title: "La Città Ricucita Sulla Ferrovia", city: "Vilafranca del Penedès", country: "Spagna",
    lat: 41.3453, lon: 1.6995, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0DLuxDJ5KeVQ95gxpkSmbQApv4qtVm7roKjYEc76Yn679qD2vYBA4SCWxokXy8FNrl",
    text: `A Vilafranca del Penedès, in Spagna, la città era davvero divisa in due. Da una parte il centro storico, dall’altra i quartieri di Poble Nou e della Girada. In mezzo correva la ferrovia, a cielo aperto, con binari, catenarie, recinzioni e alcuni passaggi a livello che spezzavano la continuità delle strade e costringevano a lunghe deviazioni anche per gli spostamenti più semplici. Un taglio netto nel cuore urbano, una barriera di rumore, vibrazioni e ostacoli quotidiani. Oggi quel taglio non c’è più. Al suo posto si estende un parco lineare continuo costruito sulla copertura della ferrovia. Il progetto Eix de la Via è realtà. Il tratto completato misura circa 5,8 ettari, destinati a diventare undici con le fasi successive, una superficie pari a otto campi da calcio affiancati dove per decenni c’erano stati solo ferro, ghiaia e una sequenza ininterrotta di recinzioni. Siamo in Catalogna, nell’Alt Penedès, a una cinquantina di chilometri da Barcellona. Vilafranca ha poco più di 40.000 abitanti e una struttura compatta, organizzata intorno alla stazione e all’asse commerciale che attraversa la pianura vitivinicola. La ferrovia non lambiva la città. La tagliava. Da un lato la Girada, dall’altro il nucleo storico e Poble Nou. Una frattura da affrontare ogni giorno, non un’immagine. La trasformazione prende forma quando le linee di Rodalies e dell’alta velocità vengono interrate e coperte da una grande lastra. Ma quella copertura non è un regalo né un automatismo. È il risultato di un conflitto che è durato anni. Il Comune, sostenuto dai residenti dei quartieri interessati, chiede che la nuova infrastruttura non venga chiusa come una semplice trincea tecnica, ma diventi un piano continuo, capace di ricucire la città. Dall’altra parte c’è ADIF, la potentissima agenzia pubblica che gestisce l’infrastruttura ferroviaria in tutta la Spagna (come la nostra RFI). Per le Ferrovie la priorità è garantire sicurezza e funzionamento della linea. La lastra superiore è un’opera urbana, non necessaria al servizio dei treni, e dunque un costo e una responsabilità aggiuntiva. Si apre così un braccio di ferro. Il Comune insiste, ribadendo che le sorti urbanistiche della città devono essere decise dalla città e non da un tracciato ferroviario. ADIF procede con cautela, salvaguardando il perimetro tecnico e legale delle proprie competenze. Il contenzioso aperto sugli accordi dei primi anni Duemila segna per lungo tempo la vicenda. Solo nel 2023 arriva la svolta: le parti raggiungono un’intesa che chiude la disputa e sblocca anche la copertura del tratto residuo verso sud, fino al Pont de Moja. In questo contesto la cittadinanza è stata a lungo spettatrice. Nel 2007 il Comune avvia un processo pubblico dedicato alla futura copertura della ferrovia. Più di duemila persone partecipano, un numero straordinario per una città di queste dimensioni. La richiesta è netta: trasformare il corridoio ferroviario in un grande spazio verde continuo. Le associazioni di cittadinanza attiva tengono vivo il dibattito negli anni successivi, impedendo che la questione scivoli sullo sfondo e spingendo l’amministrazione a mantenere la rotta. Il progetto affidato a Batlleiroig Arquitectura non si limita a coprire una trincea. Trasforma lo spazio recuperato in un giardino ricco di biodiversità, compatibile con ciò che scorre sotto. I sentieri sono in terra battuta, affiancati da arbusti e superfici drenanti. Il prato centrale, ampio e unitario, è raro nel cuore di città compatte come Vilafranca. L’intera copertura funziona come regolatore bioclimatico. I materiali granulari e la vegetazione riducono il riscaldamento superficiale, trattengono l’acqua piovana e raffrescano l’aria grazie al rilascio naturale di umidità dal suolo e dalle piante. Una sorta di isola fresca che contrasta l’isola di calore urbana.
Il parco continuo è operativo dal 2023, dopo una successione di fasi culminate nel Parc de l’1 d’Octubre. Da allora gli attraversamenti tra la Girada, Poble Nou e il centro sono diventati diretti. Le cronache locali presentano l’Eix de la Via come il futuro grande parco urbano di Vilafranca. Ma la sua forza non sta nella dimensione. Sta nell’atto urbano che rappresenta. Ricuce ciò che la ferrovia aveva separato e restituisce continuità ai quartieri. Sovrappone a un vecchio corridoio infrastrutturale un nuovo connettivo urbano vegetale, più permeabile, più fresco e più leggibile. Una scelta di città, finalmente decisa dalla città.`,
    spunti: "Le infrastrutture ferroviarie come barriere urbane; la ricomposizione del tessuto cittadino diviso da grandi opere.",
    attivita: "Cerca Vilafranca del Penedès sulla mappa della Catalogna e la sua distanza da Barcellona. Individua nella tua città un'infrastruttura (ferrovia, tangenziale, canale) che separa due quartieri e proponi un modo per 'ricucirli'.",
    summary: "A Vilafranca del Penedès la città era divisa in due dalla ferrovia, che correva a cielo aperto tra binari, recinzioni e passaggi a livello, spezzando la continuità delle strade tra il centro storico e i quartieri di Poble Nou e della Girada: interrare o ricoprire quella linea ha permesso di ricucire il tessuto urbano diviso per decenni."
  },
  {
    num: 52, title: "Aarhus Si Scalda Con Il Calore Del Giurassico", city: "Aarhus", country: "Danimarca",
    lat: 56.1629, lon: 10.2039, category: "energia",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02NdknwGgGdXKxdwvnUzktzP2nFaWYkYVst9Rsyo29AkkdwH2AoW9rR7xMsVx6crekl",
    text: `L’acqua comincia a muoversi a circa due chilometri e mezzo sotto la superficie, dove le sonde raggiungono gli strati di arenaria del Giurassico, antiche sabbie marine riscaldate dal tempo e dalla pressione. È un’acqua intrappolata da tempi geologici. Una riserva termica naturale che oggi riemerge per scaldare la città. Siamo ad Aarhus, seconda città della Danimarca con circa 300.000 abitanti (oltre 350.000 nell’area urbana). È il baricentro economico dello Jutland e la più giovane tra le grandi città danesi. La fascia 20–29 anni è la più numerosa e un abitante su cinque è studente. La città si affaccia sul Kattegat e combina porto industriale, università e quartieri residenziali immersi nel verde. È qui che è entrato in funzione il primo impianto di quello che, a completamento, sarà il più grande sistema integrato di teleriscaldamento geotermico dell’Unione Europea, avviato il 31 ottobre 2025 dopo la fase di perforazioni e test iniziata nel 2023. Nel sito di Skejby, alla periferia nord, i due pozzi gemelli (uno di produzione e uno di reiniezione) raggiungono i 2.500 metri di profondità. Lì l’acqua geotermica arriva attorno ai 70 °C. Lo scambio termico trasferisce l’energia all’acqua della rete cittadina, che scorre per centinaia di chilometri sotto le strade di Aarhus. Il sistema è controllato da sensori e da piattaforme di monitoraggio digitale che modulano in tempo reale portata, pressione e rendimento energetico. L’acqua sale lungo un condotto d’acciaio, attraversa lo scambiatore termico nel quartiere di Skejby, cede la sua energia al fluido della rete urbana (innalzata da pompe di calore elettriche) e torna a sprofondare nel sottosuolo, reiniettata per mantenere in equilibrio la pressione del giacimento. Un circuito chiuso, senza combustione né fumi. Solo calore, movimento e tempo geologico. Sopra, la città vive la sua routine ordinata. I tram passano regolari, le biciclette scorrono sulle corsie ghiacciate, nei radiatori delle scuole e degli uffici l’acqua è calda. Nessuno la vede, ma quel calore invisibile proviene dal cuore della Terra. Quando l’intero complesso sarà completato, prima del 2030, la potenza installata raggiungerà i 110 megawatt termici. Abbastanza per coprire circa un quinto del fabbisogno di riscaldamento cittadino e per evitare l’emissione di fino a 165.000 tonnellate di anidride carbonica ogni anno. L’iniziativa nasce dalla collaborazione tra la società municipale Kredsløb, che gestisce il teleriscaldamento e i rifiuti urbani, e Innargi, fondata nel 2017 dal gruppo A.P. Møller Holding, lo stesso di Maersk, con la partecipazione di ATP e NRGi. Aarhus possiede una delle reti termiche più estese d’Europa. Più del 95 per cento delle abitazioni è collegato a un sistema di distribuzione urbana del calore. Finora la maggior parte dell’energia proveniva da centrali a biomassa e da impianti di combustione dei rifiuti (waste-to-energy). Adesso una prima quota arriva dal sottosuolo, destinata a crescere fino a coprire circa un quinto del fabbisogno entro il 2030. È una transizione silenziosa ma decisiva: meno dipendenza da legna e pellet importati, più sicurezza energetica e tariffe più stabili per i cittadini. Le prime perforazioni sono iniziate nel 2023 con una torre alta trentun metri, installata nel porto di Aarhus. I carotaggi hanno confermato la presenza di sabbie porose e saturate d’acqua calda nei livelli più profondi del giacimento giurassico. Da lì è partita la mappatura geologica che ha convinto gli ingegneri a spostare l’intervento nella zona di Skejby, dove le condizioni del sottosuolo garantiscono un flusso più regolare e temperature più elevate. Sulla superficie non cambia nulla. Solo la provenienza del calore. Nelle cucine e negli uffici, nei corridoi delle scuole e negli ospedali, l’acqua circola come sempre. Ma la sua origine è cambiata.
Non più soltanto il legno bruciato, i rifiuti inceneriti o i pellet importati dal Baltico, bensì anche un’energia sotterranea e costante. In un’epoca di ricerca spasmodica di alternative ai combustibili fossili, Aarhus ha scelto una fonte profonda e antica. Un calore che viene dal sottosuolo, pulito, silenzioso, regolare, non soggetto alle oscillazioni del vento e del sole e al riparo dai ricatti geopolitici del gas e del petrolio.`,
    spunti: "L'energia geotermica come risorsa rinnovabile; il sottosuolo geologico come fonte di calore per le città.",
    attivita: "Cerca cos'è l'era geologica del Giurassico e quando è iniziata e finita. Calcola quanto tempo impiega l'acqua a scaldarsi a 2,5 km di profondità e perché la geotermia è considerata energia rinnovabile.",
    summary: "A due chilometri e mezzo sotto Aarhus, seconda città della Danimarca, l'acqua intrappolata negli strati di arenaria del periodo Giurassico, riscaldata dal tempo e dalla pressione geologica, risale in superficie per alimentare la rete di teleriscaldamento della città: una riserva termica naturale vecchia di milioni di anni messa al servizio del presente."
  },
  {
    num: 53, title: "Rotterdam E Il Gemello Che Governa L’Acqua", city: "Rotterdam", country: "Paesi Bassi",
    lat: 51.9244, lon: 4.4777, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid09X7FAur9y6barXdm5rhv9Y7zFXk4rE2cBez1xGTMup1Nrg3vsNKTP587nn72pByKl",
    text: `A Rotterdam il margine di errore è sottile. Bastano pochi centimetri di innalzamento del livello dell’acqua, una perturbazione che accelera di un’ora, il passaggio di una nave fuori programma per alterare l’equilibrio di una città che vive sospesa tra canali, dighe e infrastrutture portuali. Qui il gemello digitale non è una suggestione futuristica. È uno strumento di governo, nato per mantenere stabile un territorio che stabile non è mai stato. Siamo nel sud-ovest dei Paesi Bassi, nel delta del Reno-Mosa-Schelda, a pochi chilometri dal Mare del Nord. Rotterdam ha poco più di seicentomila abitanti e il porto marittimo e fluviale più grande d’Europa. Una parte della città vive sotto il livello del mare, tra argini, polder (terre sottratte al mare e tenute all’asciutto dalle pompe), chiuse, stazioni di pompaggio. La topografia non è un fondale neutro. È una mappa di quote, flussi e vincoli che cambiano con la marea, con il vento, con il regime dei fiumi. Questo terreno instabile rende necessario un doppio digitale della città, capace di rappresentare in tempo quasi reale ciò che l’acqua e i movimenti quotidiani possono modificare in poche ore. Per capire che cosa fa davvero il gemello digitale bisogna partire dalla sua struttura. Rotterdam costruisce da anni un modello tridimensionale della città in cui ogni oggetto fisico ha un equivalente informatico. Edifici, ponti mobili, argini, canali, banchine, stazioni di pompaggio non sono solo forme disegnate sullo schermo. Sono entità che contengono attributi, dati storici, collegamenti ai sensori che misurano livelli, portate, velocità, stati di apertura o chiusura. Su questa base geometrica si innesta l’Open Urban Platform municipale, che aggrega flussi di dati provenienti da reti diverse e li rende disponibili ai modelli di calcolo e agli strumenti di visualizzazione. Il gemello digitale è l’incrocio di tre strati. Nel primo ci sono i dati grezzi che arrivano dalle reti fisiche e dai servizi (radar fluviali, sensori di livello nei canali e nei collettori fognari, pluviometri, stazioni meteo, rilevazioni sul traffico navale e stradale). Nel secondo ci sono i modelli matematici che usano questi dati, li combinano con la geometria della città e calcolano che cosa può succedere se le condizioni cambiano. Nel terzo ci sono le interfacce con cui tecnici e decisori vedono i risultati, li confrontano, li usano per pianificare interventi o per gestire situazioni critiche. L’esempio più chiaro è il gemello dell’acqua. Rotterdam utilizza modelli idrodinamici che simulano il comportamento congiunto della pioggia, delle maree, del vento e dei flussi nei corsi d’acqua e nelle fognature. Non è una semplice mappa di allagamenti potenziali. È un calcolo continuo che tiene conto della forma delle strade, delle pendenze, dei tombini, dei canali di scolo, delle capacità delle pompe. Ogni cella del modello “vede” quanta acqua cade, quanta riesce a defluire in superficie, quanta entra nelle reti sotterranee, quanta si accumula in un punto sensibile. In pratica segue il percorso di ogni goccia dall’atmosfera al suolo e poi verso i recettori finali. Quando i previsori segnalano un fronte temporalesco serio sull’estuario, il gemello inizia a lavorare in modalità scenario. Si impostano le combinazioni più plausibili di pioggia, marea e vento, si fanno girare le simulazioni, si osserva come si riempiono via via le zone depresse, quali sottopassi e quali tratti di strada vanno in sofferenza, quali linee di drenaggio si avvicinano alla saturazione. Da queste mappe dinamiche nascono le scelte operative. Si anticipa l’attivazione delle pompe in certe stazioni, si aprono o chiudono alcune chiuse, si predispongono deviazioni per i mezzi di soccorso nelle zone che rischiano di diventare impraticabili. La stessa infrastruttura serve anche per la pianificazione a lungo periodo, quando si devono valutare le conseguenze della costruzione di un nuovo quartiere, di una vasca di laminazione, di un innalzamento degli argini. Un altro fronte in cui il gemello entra in gioco è quello dei ponti mobili, che a Rotterdam non sono episodi scenografici ma elementi che condizionano l’intero ritmo urbano. Ogni apertura consente il
passaggio di navi che risalgono la Nieuwe Maas, ma blocca per alcuni minuti corridoi fondamentali del traffico stradale e, in alcuni casi, delle linee di trasporto pubblico. Nel modello digitale i ponti sono oggetti dotati di stato, orari, restrizioni operative, collegati ai dati sulle code che si formano agli approcci, sui flussi di veicoli e sui tempi di percorrenza. Prima di autorizzare una determinata sequenza di aperture, l’operatore può farla scorrere nel gemello. Il sistema calcola come si propagano le code lungo le arterie principali, quanto impiega il traffico a smaltirsi, quali incroci rischiano di andare in saturazione. Se la combinazione di manovre genera un collo di bottiglia eccessivo, si prova una diversa sequenza oppure si interviene sull’organizzazione delle deviazioni. La difficoltà non sparisce, ma viene resa prevedibile e più equamente ripartita sul territorio, con un livello di dettaglio che prima era impossibile ottenere. Il porto esterno aggiunge un ulteriore livello di complessità. Qui il gemello integra tracciamento delle navi, misure di corrente, profondità dei fondali, previsioni di marea e condizioni meteo- marine. Il modello consente di anticipare il momento migliore per l’attracco di una portacontainer, di stimare il margine di sicurezza sul pescaggio, di organizzare la sequenza degli arrivi in modo da evitare attese inutili in rada. La stessa immagine digitale mostra contemporaneamente infrastrutture, condizioni ambientali e logistica dei movimenti, e permette di ottimizzare tempi e consumi senza compromettere la sicurezza in quello che resta il principale nodo portuale d’Europa. Questo modo di lavorare cambia anche il rapporto tra tecnica e decisione urbana. Il gemello non sostituisce l’esperienza dei tecnici né la responsabilità degli amministratori. Fornisce una base comune su cui discutere, perché rende visibile l’intreccio tra fenomeni che, presi separatamente, sembrano semplici. Una decisione sulla gestione delle acque alte mostra subito le ripercussioni sui quartieri a valle. Una modifica a un programma di apertura dei ponti evidenzia in anticipo l’effetto sui tempi di spostamento dei pendolari. Un nuovo intervento infrastrutturale può essere confrontato con scenari alternativi prima di impegnare risorse e cantieri. Rotterdam non mette in vetrina questa tecnologia. La usa nel lavoro ordinario dei servizi che gestiscono acqua, traffico, protezione civile e porto. Il gemello digitale è uno degli strumenti con cui si preparano le manovre, si programmano gli interventi, si controllano gli effetti delle decisioni sui diversi pezzi di città. Quando le previsioni annunciano vento forte o piogge intense, o è previsto il passaggio di navi che impongono l’apertura dei ponti, i tecnici usano questo strumento per calibrare sequenze, deviazioni, attivazioni delle pompe. Il gemello digitale non risolve tutto, ma mette in mano ai decisori qualcosa che fino a pochi anni fa non esisteva. Fornisce un quadro coerente su cui basare le scelte operative e ridurre il margine di errore in una città che non può permettersene.`,
    spunti: "I gemelli digitali come strumento di governo del territorio; la gestione del rischio idraulico nelle città sotto il livello del mare.",
    attivita: "Cerca cos'è un 'gemello digitale' (digital twin) e in quali altri settori viene usato oltre l'urbanistica. Localizza Rotterdam rispetto al livello del mare e calcola di quanti metri è più bassa rispetto ad altre città europee.",
    summary: "A Rotterdam il margine di errore nella gestione dell'acqua è sottile: bastano pochi centimetri di innalzamento del livello del mare o il ritardo di una nave per alterare l'equilibrio di una città sospesa tra canali, dighe e porto. Per questo la città usa un \"gemello digitale\", una copia virtuale del territorio che aiuta ad anticipare e governare i rischi idraulici in tempo reale."

    num: 54, title: "Pendolari Della Funivia Urbana", city: "Créteil", country: "Francia",

    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0MrsW5CP4W7gLTm3R4tGwcbxjdCMSTPuCW7FhXx9B6bLFpsSAW6HUXnr4zM1fc4S5l",
    text: `Come si ricuce una frattura urbana nella mobilità, per riunire quartieri rimasti lontani per colpa di ostacoli naturali e soprattutto artificiali? Si sale in cabina e si vola sopra ciò che a terra blocca tutto. Siamo in Val de Marne, nella cintura sud est della regione parigina, tra Créteil e Villeneuve Saint Georges. Da Parigi ci separa una distanza breve (circa 11 km fino a Créteil, circa 16 km fino a Villeneuve Saint Georges), eppure qui la geografia quotidiana pesa molto di più dei chilometri. Il Câble C1 è entrato in servizio sabato scorso, il 13 dicembre 2025, e introduce nella rete dei trasporti una tecnologia che di solito associamo ad altri paesaggi: la telecabina. È la prima linea di trasporto a fune dell’Île de France. Corre per 4,5 km, ferma in cinque stazioni e collega direttamente il capolinea della metropolitana 8 (Créteil Pointe du Lac) con Limeil Brévannes, Valenton e Villeneuve Saint Georges (capolinea Villa Nova). Le stazioni intermedie hanno nomi che dicono subito dove si atterra (Limeil Brévannes Plage Bleue, Valenton Le Château, La Végétale Fontaine Saint Martin). Il senso del progetto sta nei suoi sorvoli, anche se qui non ci sono montagne, colline o dislivelli da superare. La linea scavalca grandi assi stradali, una linea ferroviaria ad alta velocità e la gare de triage di Valenton, cioè un insieme di barriere che a terra costringono a giri lunghi e a una dipendenza quasi obbligata dall’automobile. La telecabina richiede poche opere a terra, concentrate in stazioni e piloni, e il tempo di viaggio diventa prevedibile. Dire funivia è corretto ma fino a un certo punto. Tecnicamente è più giusto scrivere telecabina. La differenza è semplice. La telecabina è un impianto a fune con cabine che circolano in movimento continuo e rallentano in stazione per l’imbarco, mentre “funivia” indica in modo più generico il trasporto a fune. La documentazione tecnica del progetto parla di sistema monocavo portante e traente con pince débrayable (morsa sganciabile) e movimento continuo, quindi telecabina a tutti gli effetti. Qui l’immaginario da montagna viene reso urbano. Le cabine sono 105, ciascuna con 10 posti a sedere. In ora di punta l’attesa scende sotto i 30 secondi. Il viaggio completo richiede 18 minuti, contro tempi tipici intorno ai 40 minuti su gomma quando il traffico si addensa. È un mezzo costruito per la continuità, la regolarità, la normalità funzionante. In fondo bastano pochi giorni per abituarsi alla novità e gli utenti - pendolari dell’aria - nelle interviste si dicono entusiasti. Un agente in stazione accompagna l’imbarco, regola la velocità o arresta la cabina quando serve (passeggini, valigie, carrozzine). L’accesso è a raso, con pendenze dolci. A bordo ci sono porte automatiche, interfono per contattare il personale e videocamere a circuito chiuso. Il racconto dei primi passeggeri insiste su un dettaglio concreto (il silenzio, la sensazione di “bolla”, la cabina che si ferma per qualche decina di secondi per agevolare chi viaggia in carrozzina). Il Câble C1 viene dimensionato per circa 11.000 viaggiatori al giorno. Il territorio servito direttamente lungo l’asse conta oltre 20.000 abitanti e circa 6.000 posti di lavoro, con l’obiettivo pratico di togliere dalle strade l’eccesso di auto che creano ingorghi quotidiani. Il quadro economico è essenziale. L’investimento totale viene indicato in 138 milioni di euro. La parte infrastrutturale è quantificata in 132 milioni di euro ed è finanziata da Regione Île de France (49 per cento), Département du Val de Marne (30 per cento), Stato ed Unione europea (21 per cento). I costi di esercizio (personale, manutenzione, videosorveglianza, gestione) ricadono su Île de France Mobilités, come avviene per metro, tram e bus. Il progetto sceglie un sistema monocavo, più compatto in stazione e con ingombri minori in un tessuto già saturo. La linea usa 30 piloni (5 doppi) e adotta scelte acustiche mirate (cavo di nuova generazione quasi liscio, riduzione vibrazioni, isolamento in stazione), con un programma di
monitoraggio dei livelli sonori nel tempo. Anche la gestione meteo è codificata (riduzione velocità oltre 70 km orari di vento, chiusura oltre 90 km orari con bus sostitutivi). È manutenzione quotidiana tradotta in progetto. Non è solo questione di tecnologia, ma anche di sostenibilità concreta. Il Câble C1 ha ottenuto la certificazione HQE - Infrastructures Durables, un sigillo che garantisce il rispetto di criteri ambientali severi. Oltre a essere un mezzo a trazione elettrica a zero emissioni locali, l’opera ha permesso di deimpermeabilizzare migliaia di metri quadri di terreno e di mettere a dimora più di 400 nuovi alberi. Un’attenzione confermata dal dialogo con il paesaggio. Il tracciato si intreccia con la Végétale, il corridoio verde riservato a pedoni e ciclisti, disegnando una rete dove il trasporto veloce in aria supporta la mobilità lenta a terra. Il Câble C1 racconta una lezione semplice e ardita allo stesso tempo. Quando lo spazio a terra è già occupato, quando attraversare un fascio ferroviario o una grande arteria stradale significa consumare suolo e cantieri infiniti, l’aria diventa un corridoio urbano. Non per folklore, né per vista panoramica. Per necessità, per regolarità, per restituire continuità a un pezzo di metropoli dove la distanza si misura in tempo perso negli ingorghi.`,
    spunti: "Le funivie come soluzione di trasporto pubblico nelle periferie; la geografia degli ostacoli fisici nella mobilità urbana.",

    summary: "Tra Créteil e Villeneuve-Saint-Georges, nella cintura sud-est di Parigi, una funivia urbana collega quartieri che restavano lontani per colpa di ostacoli naturali e artificiali: pur distando pochi chilometri dalla capitale, qui la geografia quotidiana pesava più dei chilometri in linea d'aria, finché salire in cabina e volare sopra gli ostacoli non ha ricucito la frattura tra i quartieri."
