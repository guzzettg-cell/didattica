    num: 55, title: "Il Gemello Digitale Per Le Scelte Urbane Di Zurigo", city: "Zurigo", country: "Svizzera",
    lat: 47.3769, lon: 8.5417, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02x4zuxosDrBCPG7ZWvQyQFU1jnH5sJP8izScDXE8ZgvRcrt1Xr3QLcPSf7WyrGv3Wl",
    text: `Zurigo, 448mila abitanti, rende visibili le trasformazioni urbane prima che diventino discussioni astratte. All’Amtshaus IV lo fa con un plastico in scala 1 a 1000, aggiornato quando cambiano gli edifici. Sullo stesso principio costruisce anche il gemello digitale, che permette verifiche ripetibili su una base dati comune. Amtshaus IV è un edificio amministrativo della città, in Lindenhofstrasse 19, nel distretto centrale. Siamo nella parte storica, tra la Limmat (il fiume che attraversa Zurigo) e il Lindenhof (una piccola altura, oggi piazza alberata e punto di orientamento sopra la città vecchia). Dentro c’è la sala del plastico ufficiale della città (Stadtmodellraum). Scala 1 a 1000 e superficie di circa 100 metri quadrati. È una Zurigo “camminabile” con lo sguardo. I nuovi volumi entrano con tasselli aggiunti nel tempo, realizzati in legno d’acero massiccio. Il gemello digitale parte dalla stessa esigenza di chiarezza, ma sposta il problema su un terreno più rigoroso. Non è un video e non è una sequenza di render. È una base dati tridimensionale, il 3D Stadtmodell, prodotta e manutenuta dall’amministrazione e usata come riferimento comune. È il database di applicazioni come Zürich Virtuell, sviluppato dal centro GIS di Geomatik + Vermessung in collaborazione con l’ufficio che segue la pianificazione urbana (Amt für Städtebau). È lì che il modello diventa strumento, con funzioni che vanno dalla visione d’insieme fino al dettaglio del singolo edificio e con possibilità di analisi e visualizzazione. L’interfaccia che permette di trasferire queste informazioni nel dibattito urbano è Zürich 4D. Anche qui la città spiega a cosa serve. La webmap permette di visualizzare più di 50.000 edifici e di seguirne la trasformazione nel tempo. La mappa riproduce materiali urbanistici veri, non “idee”. Progetti di costruzione, Gestaltungspläne e concorsi di architettura conclusi. I dati vengono aggiornati quasi in tempo reale. Gestaltungsplan è una parola che sembra fatta apposta per escludere i non addetti ai lavori. Sono piani di dettaglio per aree delimitate che fissano in modo vincolante ciò che conta davvero quando un quartiere cambia, quindi numero, posizione, dimensioni esterne e destinazione d’uso degli edifici. La città chiarisce anche un altro elemento strategico. I piani possono essere redatti dall’amministrazione oppure proposti da privati, ma sono uno strumento di regolazione saldamente in mani pubbliche. Perché i decisori hanno bisogno di un gemello digitale? A cosa serve? Serve a togliere vaghezza alle istruttorie. Quando un progetto viene collocato nello stesso modello condiviso, misure e conseguenze della costruzione diventano controllabili. Distanze, altezze, allineamenti. Ombre e luce in momenti precisi del giorno e dell’anno. Non è un dettaglio estetico. È il modo in cui si evitano decisioni basate su impressioni e si costringe il confronto a restare nell’ambito dei fatti verificabili. Il progetto non resta solo un fascicolo. A che cosa serve a chi abita la città? Serve a capire visivamente di cosa si parla. Zürich 4D viene inserito dentro la città com’è oggi, così in cui produce effetti reali, su una via, su un cortile, su una facciata. Il dibattito, a quel punto, smette di girare intorno alle impressioni e diventa concreto. Se c’è un problema lo si vede in un dato verificabile, quante ore di sole perde una casa o un cortile, se un volume avanza rispetto all’allineamento, come cambia la sezione di una strada e quindi lo spazio destinato a pedoni, biciclette e alberi. Zurigo usa lo stesso approccio anche quando l’oggetto non è un nuovo edificio, ma una particolarità ambientale misurabile. Un esempio concreto è Strassenlärm 4D, la cartografia digitale comunale che mostra le zone in cui il traffico supera i limiti di rumore. La piattaforma rende visibili le
immissioni su circa 4.500 tratti stradali interessati e segnala le aree in cui i valori vanno fuori norma. La letteratura tecnica insiste su un punto che vale più di qualunque rendering. Il valore non sta nell’effetto visivo, ma nell’avere a disposizione una base dati stabile e affidabile, pronta a ospitare moduli diversi (analisi, scenari, consultazione) senza cambiare “sfondo” a ogni discussione, per valutare le diverse interazioni. Jürg Lüthy, capo della Direzione rilievi e dati geografici del Comune di Zurigo, quest’anno ha pubblicato un riepilogo del lavoro ventennale con cui la città ha messo in piedi la propria infrastruttura dei dati geografici, arrivata a più di 500 dataset. Il tecnico spiega come viene prodotto il 3D Stadtmodell, con livelli di definizione diversi e con metodi concreti, dalla fotogrammetria (ricostruzione tridimensionale da immagini) ai dati volumetrici degli edifici usati per generare oggetti 3D coerenti e confrontabili. Il plastico dell’Amtshaus IV serve a orientare l’occhio e a rendere immediato un ingombro. Il gemello digitale serve a rendere controllabili le conseguenze, perché obbliga tutti (uffici, progettisti, cittadini) a discutere sullo stesso riferimento. Quando la trasparenza non è una parola vuota bensì un metodo di lavoro basato sulla scienza e sulla tecnica.`,
    spunti: "Gli strumenti digitali a supporto della partecipazione urbanistica; la trasparenza delle decisioni sulla trasformazione della città.",
    attivita: "Cerca cos'è un plastico urbano in scala e a cosa serve nella pianificazione. Confronta questo strumento tradizionale con il gemello digitale: quali vantaggi ha ciascuno?",
    summary: "Nell'edificio amministrativo Amtshaus IV, nel cuore storico di Zurigo, un plastico in scala 1 a 1000 viene aggiornato ogni volta che cambia un edificio: sullo stesso principio la città costruisce anche un \"gemello digitale\", una base dati condivisa che rende visibili le trasformazioni urbane prima che diventino discussioni astratte tra cittadini e amministrazione."

  {
    num: 56, title: "A Bristol Il Futuro Ha La Forma Di Un Giardino", city: "Bristol", country: "Regno Unito",
    lat: 51.4545, lon: -2.5879, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0pdcwMVZcDpxpNAdgkt2hXmAa9bBRMoTrdeJoswX3dUCCsdsD2ge4QyBfRagCnZYnl",
    text: `Bristol inizia dal fango di Southmead. Qui i bambini della Little Mead Primary Academy analizzano l'asfalto impermeabile. Osservano la pioggia che non riesce a penetrare nel terreno. Quando il suolo sottostante raggiunge la saturazione, la terra smette di assorbire. L'acqua resta in superficie e scivola via veloce. È il fenomeno del ruscellamento, che trasforma le strade in torrenti e allaga le case. Per fermare questo processo è nata la nuova Embleton Road. Non è solo una strada riasfaltata. È un sistema di drenaggio naturale che usa i rain gardens come spugne. Questi giardini e queste aiuole rompono la barriera del cemento e filtrano la pioggia nel sottosuolo. I marciapiedi sono più larghi e la segnaletica riprende i disegni dei ragazzi. Il traffico rallenta e la sicurezza aumenta. Chi vive qui conferma il cambiamento. La strada è diventata un luogo dove l'acqua e le auto non fanno più paura. Bristol conta quasi mezzo milione di abitanti. Se si include la vicina Bath, la regione urbana arriva al milione. Bristol è un porto antico che oggi guarda avanti. Negli ultimi decenni ha ricucito il proprio rapporto con l’ambiente partendo da idee concrete. Il principio è semplice. Se un’infrastruttura cambia il paesaggio, i cittadini devono farne parte. È un patto tra cittadini, Comune e territorio. Ogni progetto viene spiegato, discusso e condiviso. A Lawrence Weston il cielo è dominato da un gigante bianco. La turbina eolica della comunità è entrata in funzione nel 2023. È un monumento tecnologico alto centocinquanta metri. Le sue pale tagliano l'aria con un diametro di 115 metri per produrre 4,2 megawatt. La vera rivoluzione però riguarda la proprietà. L’impianto appartiene al quartiere. I benefici economici sono immediati per un’area segnata da bassi redditi. Almeno centomila sterline all’anno tornano alla gente. Questi soldi servono per la formazione e per combattere la povertà energetica. Sui tetti delle scuole e dei centri civici brilla una costellazione diversa. È il mosaico della Bristol Energy Cooperative. Migliaia di pannelli solari coprono gli edifici della città. Qui vige la democrazia dell'energia. Un socio vale un voto, a prescindere dalla quota investita. La capacità installata supera ormai i tredici megawatt. La transizione energetica diventa concreta. Non è un piano industriale calato dall'alto ma un'assemblea permanente di cittadini. Si installa un pannello alla volta con capitali raccolti localmente. Il porto stesso si è trasformato in un laboratorio a cielo aperto. Presso Capricorn Quay, nel corso del 2024, sono state varate grandi piattaforme verdi. Ospitano migliaia di piante acquatiche e decine di alberi. Sono rifugi galleggianti progettati per rendere ospitale il cemento delle banchine. Il Comune punta alla biodiversità e alla qualità dell’acqua. Gli animali tornano dove trovano copertura, cibo e silenzio. Il porto non è più solo un luogo di scambio ma un habitat che rinasce. Il cerchio della sostenibilità si chiude ad Avonmouth. Qui l’energia nasce da ciò che si scarta. GENeco lavora sui fanghi di depurazione e sui rifiuti organici. Li trasforma in biometano attraverso un impianto all'avanguardia. Il gas prodotto finisce direttamente nella rete nazionale. Il celebre Bio-Bus del 2015 era solo un'anticipazione simbolica. Oggi quel processo è diventato una solida routine industriale. Bristol non spreca nulla. Trasforma il residuo in risorsa e il passato industriale in un futuro possibile.`,

    num: 57, title: "La Città Che Pedala Con I Dati", city: "Copenaghen", country: "Danimarca",

    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0MvoXrVYwvaBZq7Hok8wggnnU1tNZ56uQny6dtF55rep179rQNwzybxf7riTYCDqgl",
    text: `Copenhagen al dilucolo. I laghi di Sortedam e Peblinge sono immobili, tagliati dalla linea scura di Dronning Louises Bro. Le prime biciclette arrivano dai quartieri a nord, una ogni pochi secondi, poi in gruppi più fitti. In poco tempo il ponte si riempie e il flusso diventa continuo. I rilievi più recenti stimano attorno ai quarantamila passaggi al giorno, un dato che qui non sorprende nessuno. È l’andamento naturale del mattino, la misura concreta del risveglio della città. Il ponte non offre scorci particolari. È un’infrastruttura ampia, attraversata da biciclette, autobus, auto e pedoni. Eppure è uno dei punti più utili per comprendere la tenuta della rete ciclabile. Qui si colgono variazioni minime, rallentamenti improvvisi, affiancamenti troppo stretti. Se il flusso si inceppa, significa che altrove la rete sta già mostrando un limite. Pedalando verso il centro il movimento si riorganizza lungo Nørrebrogade. Il semaforo sincronizzato segue la velocità rilevata dai sensori sotto l’asfalto. La Green Wave, la pista verde, non è stata realizzata solo per esigenze ambientali e di paesaggio. È un dispositivo operativo che evita arresti superflui su un asse dove il traffico ciclabile rimane sostenuto per molte ore. Il sistema registra velocità media e densità dei passaggi e regola il semaforo di conseguenza. Niente coreografie, solo tecnica. Lungo le arterie compaiono i Bike Barometers. Sono totem che registrano i passaggi e mostrano quando un tratto si avvicina alla saturazione. I tecnici consultano i dati per capire dove intervenire. Una pista che cresce più del previsto richiede un allargamento. Un incrocio che rallenta puntualmente ogni mattina indica un punto critico. Le decisioni nascono da questi numeri, non da sensazioni. Uscendo dal centro la rete si apre sulle Cycle Superhighways. La mappatura dell’intera area metropolitana supera gli ottocento chilometri, considerando anche i tratti ancora in adeguamento. La qualità non è uniforme, ma le direttrici principali rispettano standard consolidati, tre metri di larghezza, separazione dal traffico e un bordo rialzato tra pista e carreggiata che oscilla fra otto e dodici centimetri, come indicano le linee tecniche del Comune. Nelle zone dove il traffico automobilistico è più intenso questo margine migliora la stabilità del flusso ciclabile e riduce gli attriti con i veicoli. Illuminazione continua, pavimentazione drenante e sgombero neve prioritario completano il quadro. Nei comuni più periferici emergono invece strettoie, attraversamenti complessi e segmenti che attendono ancora un adeguamento. La crescita dell’uso non sempre coincide con il ritmo dei cantieri. Nei nodi di scambio con il trasporto pubblico i limiti sono evidenti. Le piste arrivano davvero fino ai binari e agli ingressi della metropolitana e dei treni locali, ma i parcheggi restano insufficienti. Le rastrelliere sono sature già nelle prime ore del mattino. Molte biciclette vengono lasciate all’aperto, accatastate dove capita. Le lamentele dei residenti sono ricorrenti. La domanda cresce più velocemente dell’offerta e la città non riesce ancora a colmare il divario. Il funzionamento complessivo della rete si basa su un sistema digitale che registra velocità, rallentamenti e accumuli. I dati dei sensori vengono incrociati con quelli delle stazioni ferroviarie e dei nodi intermodali. Ogni variazione significativa viene analizzata. Una direttrice che tende a saturarsi richiede un intervento. Un incrocio che rallenta troppo spesso viene ricalibrato. È un lavoro continuo, più simile alla gestione di una rete di autobus che a un racconto sulla mobilità sostenibile. La manutenzione quotidiana segue la stessa logica. In caso di neve - come in questi giorni - le piste più frequentate vengono pulite per prime. Non sempre con la stessa rapidità e precisione. Alcuni tratti restano scivolosi nelle prime ore del mattino e le segnalazioni dei residenti lo ricordano ogni
inverno. La dimensione della rete e la variabilità dei comuni coinvolti rendono difficile un intervento omogeneo. La governance complessiva riunisce ventisette municipalità e la Regione della Capitale. Un segretariato tecnico cura standard, manutenzione e aggiornamento dei piani. Le differenze fra territori rimangono, ma la coerenza di fondo della rete è il risultato di questa supervisione continua. La costanza del lavoro pesa più di qualsiasi dichiarazione programmatica. Alla fine resta l’informazione che descrive meglio di tutto il funzionamento della città. A Copenaghen si percorrono circa 1,44 milioni di chilometri in bicicletta ogni giorno. Non è un motivo di vanto e non è un’etichetta. È l’esito di un sistema che regge, corretto quando serve, con punti già maturi e zone che richiedono ancora interventi. Una rete che permette alla bicicletta di svolgere il suo compito più semplice. Portare le persone dove devono andare. In sicurezza, su percorsi ragionati e ragionevoli.`,
    spunti: "La bicicletta come infrastruttura di trasporto primaria; l'uso dei dati per pianificare la mobilità urbana.",
    attivita: "Cerca quanti chilometri di piste ciclabili ha Copenaghen e confrontali con quelli della tua città. Calcola quante persone potrebbero passare su un ponte ciclabile della tua zona in un'ora, ipotizzando dati simili.",
    summary: "All'alba, sul ponte Dronning Louises Bro tra i laghi di Sortedam e Peblinge, le biciclette arrivano una ogni pochi secondi dai quartieri a nord, fino a diventare un flusso continuo: circa quarantamila passaggi al giorno, una cifra che a Copenaghen non sorprende più nessuno e che la città misura e usa per progettare la mobilità quotidiana."

  {
    num: 58, title: "Rifiuti, Il Cattivo Esempio Di Birmingham", city: "Birmingham", country: "Regno Unito",
    lat: 52.4862, lon: -1.8904, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0gkMizA8Lyc8CnjrdsvDkAKCLyFUADpsTroiS2KNUYMi91s8TZ48Q2BCmkPDK3K2Ll",
    text: `Birmingham non è solo la seconda città del Regno Unito. Con i suoi 1,2 milioni di abitanti rappresenta il motore economico delle West Midlands. Eppure, tra gennaio e marzo del 2025, questo gigante finisce in ginocchio. La città viene letteralmente inghiottita dalla spazzatura. Quella che nasce come una banale vertenza sindacale si trasforma presto in un disastro sanitario. Le strade finiscono sepolte sotto 17.000 tonnellate di immondizia. Non è la trama di un film distopico. È la cronaca di come una decisione amministrativa errata mandi in tilt i servizi essenziali di una metropoli europea. Tutto ha inizio un anno fa, il 6 gennaio 2025. Si accende la miccia dello scontro tra il Comune e il sindacato Unite. Il motivo del contendere è la cancellazione del Waste Recycling and Collection Officer. Le posizioni appaiono subito inconciliabili. Per gli amministratori comunali i conti sono in rosso e quel ruolo di caposquadra è un orpello inutile da tagliare. Per i lavoratori è l'opposto. Quella figura garantisce la sicurezza sui camion e rappresenta l'ultimo baluardo contro il taglio dei salari. Nessuno cede. Il conflitto diventa una guerra di trincea. L'11 marzo 2025 scatta lo sciopero a oltranza e la raccolta si ferma. Le conseguenze sono immediate. La politica locale si perde in un rimpallo di responsabilità mentre la città sprofonda nel degrado. La situazione diventa insostenibile. Il 31 marzo il Consiglio Comunale ammette la sconfitta e dichiara il "major incident". È l'ammissione formale che i rifiuti costituiscono ormai un pericolo per la salute pubblica. Non bastano più le parole. Serve la logistica di guerra. Arrivano i pianificatori dell'esercito e squadre di operatori privati per tamponare il fallimento della gestione ordinaria. In questo scenario la stampa gioca una partita decisiva. I giornali britannici non si limitano a contare i sacchetti abbandonati. Trasformano l'odore nauseabondo delle strade in un atto d'accusa politico. Il Guardian e altre testate nazionali non fanno sconti a nessuno. Descrivono Birmingham come il simbolo di una "disfunzione politica" totale. I media costringono il governo centrale a intervenire e svelano al paese intero l'incapacità della classe dirigente locale. È una gogna mediatica che accelera la caduta dei responsabili. Il fallimento gestionale si rivela così profondo da azzerare la catena di comando. Il governo invia i Commissari straordinari guidati da Tony McArdle, per esautorare l'amministrazione. La direttrice generale del Comune, Deborah Cadman, abbandona la nave lasciando un ente allo sbando. Anche la politica paga il conto. La vicesindaca Sharon Thompson annuncia il suo addio e diversi consiglieri stracciano la tessera del partito di maggioranza. Si consuma la decapitazione completa del vertice amministrativo e politico. Ma la frattura più grave resta quella con i cittadini. La gente è esasperata all'idea di pagare le tasse per vivere tra i ratti. Il patto sociale si incrina e il risultato è il crollo del senso civico. Il tasso di raccolta differenziata precipita sotto il 15%. Oggi, a gennaio 2026, l'emergenza acuta è rientrata e le montagne di rifiuti sono quasi del tutto scomparse. Ma la normalità resta un miraggio. Il servizio è ancora discontinuo. La promessa di una riorganizzazione operativa è attesa solo per giugno. Per molti cittadini suona come una beffa. Un anno di sofferenze per ottenere un servizio dimezzato. Questa storia ci consegna una lezione ineludibile. I servizi pubblici fondamentali non possono essere merce di scambio elettorale. Da essi dipende la salute di una comunità. Non possono essere affidati a figure scelte per fedeltà politica. Servono manager affidabili, competenza e visione. L'alternativa è lasciare che le città affoghino nella loro inefficienza. Come è successo a Birmingham.`,
    spunti: "I rischi di una gestione fragile dei servizi pubblici essenziali; il legame tra conflitti sindacali e crisi ambientali urbane.",
    attivita: "Cerca le notizie sulla crisi rifiuti di Birmingham del 2025: quanto è durata e come si è risolta? Rifletti su cosa succederebbe nella tua città se la raccolta rifiuti si fermasse per due mesi.",
    summary: "Birmingham, seconda città del Regno Unito e motore economico delle West Midlands con 1,2 milioni di abitanti, tra gennaio e marzo 2025 viene letteralmente sommersa dalla spazzatura: una vertenza sindacale sulla raccolta rifiuti si trasforma in un disastro sanitario, con le strade sepolte sotto 17.000 tonnellate di immondizia."

    num: 60, title: "Il Senso Di Lubiana Per I Rifiuti", city: "Lubiana", country: "Slovenia",
    lat: 46.0569, lon: 14.5058, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02YUpEBnYhEfdpwNH2voM1Mp1opNeRQQoZmXHCpZ7bi4BS7QwAMqzCpwWxjpexAyc3l",
    text: `Alle sette del mattino, lungo Slovenska cesta - la via principale che taglia il centro di Lubiana - i marciapiedi sono già puliti. Nessun sacchetto in vista, nessun bidone traboccante. Solo colonnine d'acciaio alte poco più di un metro, incassate nel pavimento. Un uomo si ferma davanti a quella verde, avvicina la tessera magnetica. Clic. Lo sportello si apre, il sacchetto sparisce sottoterra. Tre metri più in basso, un contenitore raccoglie. Sopra, un sensore registra. L'uomo riparte verso il mercato coperto. Lubiana conta poco più di 295.000 abitanti, capitale della Slovenia, un paese piccolo incastonato tra Italia, Austria, Croazia e Ungheria. Nel 2002 quasi tutto il suo rifiuto finiva in discarica. Oggi ne ricicla oltre il 68 per cento. È la prima capitale europea ad aver aderito alla rete Zero Waste. Ma il merito non sta nelle intenzioni. Sta nel fatto che qui hanno capito una cosa semplice: la gente non separa i rifiuti solo per amore dell'ambiente. Li separa se conviene, se è facile, se costa meno. Nel centro storico non ci sono più cassonetti tradizionali. Al loro posto, ottanta punti di raccolta con colonnine colorate: verde per il vetro, giallo per gli imballaggi, blu per la carta, marrone per l'organico, nero per il residuo. Sportelli che si aprono solo con tessera magnetica. Sottoterra, contenitori da diversi metri cubi. Il cittadino avvicina la tessera, lo sportello si apre, il sacchetto scende. Un gesto che registra utenza, data, frazione. Ogni conferimento lascia traccia. Chi produce più residuo paga di più. Chi separa meglio risparmia. Nessuna predica. Solo conti. Sotto la superficie, sensori a ultrasuoni misurano il riempimento ogni quindici minuti e trasmettono i dati via rete cellulare. Un software ricalcola ogni mattina gli itinerari dei camion in base a ciò che è effettivamente pieno. Niente giri a vuoto. Meno chilometri, meno emissioni, meno costi. La tariffa media per famiglia è circa 100 euro l'anno, ben sotto i 150 della media slovena. E tutto è pubblico: sul portale open data della città chiunque può scaricare i dati sui conferimenti per quartiere, i percorsi dei camion, i costi di gestione. Non propaganda. Numeri verificabili. Ma il centro con i suoi ottanta punti interrati è solo un pezzo del puzzle. La vera forza sta nella raccolta porta a porta che copre tutta la città e gli undici comuni limitrofi. Circa 380.000 residenti serviti. Una regola per tutti. Così si evita la migrazione dei rifiuti e il lancio del sacchetto per strada. Nel 2008 la differenziata era al 29 per cento. Nel 2016, quando Lubiana fu nominata Capitale Verde Europea, salì al 63. Oggi supera il 68. A qualche chilometro dal centro, il RCERO - Centro Regionale per la Gestione dei Rifiuti - serve oltre cinquanta comuni. Un terzo della popolazione nazionale passa di qui. L'organico finisce nei digestori anaerobici. Batteri al lavoro giorno e notte trasformano scarti in biogas e compost. Il biogas alimenta l'impianto stesso. Cerchio chiuso. Il compost, settemila tonnellate l'anno, torna nei parchi pubblici. La frazione secca passa attraverso vagli meccanici, separatori magnetici, lettori ottici. Metalli, polimeri, carta: tutto recuperato. Quello che resta, circa il cinque per cento, diventa combustibile solido secondario. Sessantamila tonnellate l'anno che prendono la strada dei cementifici, dove vengono bruciate al posto del carbone. Il rifiuto non scompare per magia. Si brucia altrove, in forni industriali che ci sono già. La svolta è arrivata tra il 2006 e il 2014. All'inizio i cittadini non separavano. La raccolta porta a porta dell'organico era stata tentata nel 2005 e fallita. Troppa resistenza, troppa confusione. Allora Voka Snaga, l'azienda pubblica che gestisce i rifiuti, ha cambiato strategia. Educazione già a partire dalle scuole materne. Media locali portati in discarica a vedere le montagne di plastica buttata per errore nell'indifferenziato. Tariffe ridisegnate: più residuo secco, più costi.
E trasparenza totale: ogni cittadino può scaricare le app di Voka Snaga, consultare i propri conferimenti, confrontarli con la media del quartiere, sapere dove portare un oggetto complesso. Il portale open data municipale pubblica tonnellate raccolte, percentuali di purezza, costi per frazione. Chi vuole verificare, verifica. Chi vuole contestare, ha i dati per farlo. Nelle strade del centro, accanto alle colonnine, distributori automatici forniscono detersivi sfusi e acqua potabile. La pulizia delle strade usa acqua piovana raccolta e tracciata. Il sistema non chiede fiducia cieca: la offre attraverso i numeri. Non sermoni. Informazioni chiare, accessibili, verificabili. Il modello non è replicabile ovunque. Lubiana ha dimensione media, tessuto urbano compatto, densità gestibile. Ma dimostra che la sostenibilità si costruisce con dati aperti, infrastrutture pubbliche solide, tariffe chiare. Non servono slogan. Serve un sistema che funzioni anche quando il cittadino non è perfetto. Ogni mattina alle sette, lungo Slovenska cesta, le colonnine d'acciaio attendono in silenzio. Il rifiuto sparisce sottoterra. La città ricomincia. E i dati continuano a scorrere, invisibili, dentro una macchina che non si ferma mai.`,

  {
    num: 61, title: "Odense Si Riscalda Con Facebook", city: "Odense", country: "Danimarca",

    text: `Sembra una fiaba e, d'altronde, siamo nella città natale di Hans Christian Andersen. Invece è una storia vera. Nel 2024 Odense spegne la sua centrale a carbone. Un anno prima del previsto. Non perché qualcuno glielo impone. Perché ha un'alternativa che funziona e costa meno. A duecento metri dal centro storico, Meta-Facebook gestisce un data center con 20mila server. Producono calore come scarto. Quel calore, invece di disperdersi nell'aria del Baltico, scalda dodicimila case. Il Comune non paga niente per il combustibile. Meta risparmia sul raffreddamento. È un contratto, non filantropia. Ma se Andersen fosse ancora vivo, sorriderebbe. Odense è la terza città della Danimarca, con 180mila abitanti. Fjernvarme Fyn, l'azienda municipalizzata del teleriscaldamento, serve oltre centomila abitazioni. Nel 2017 brucia ancora carbone per un terzo della produzione. L'obiettivo nazionale è chiudere le centrali entro il 2025. Serve sostituire quella capacità. Alle otto di sera, in una casa di Tietgenbyen, il termosifone scalda come sempre. La signora Larsen regola la manopola, il calore si diffonde nella stanza. Fuori fanno due gradi. Dentro, ventuno. Ma dietro quel calore c'è una catena invisibile. Il Comune non paga niente per produrlo. Niente carbone, niente biomassa, niente gas. Solo calore di scarto: centoquattordici gradi in uscita dai server di Meta, ventisette quando arriva alla centrale termica, settanta quando entra nei radiatori. Duecentoquindicimila megawattora all'anno. Zero euro di combustibile. Quando nel 2017 i tecnici di Facebook arrivano a Odense, il Comune mette sul tavolo una condizione chiara. Se Meta vuole costruire qui, deve collegarsi alla rete del teleriscaldamento. Nessuno sconto. Nessuna deroga. Meta accetta. Perché conviene anche a loro. Raffreddare 20mila server costa milioni ogni anno. Se qualcuno si prende il calore gratis e restituisce acqua fredda, il conto si alleggerisce. Meta risparmia circa tre milioni di euro l'anno. Il Comune ne risparmia otto. Il progetto viene affidato a Ramboll, società danese di ingegneria. Il problema: il calore dei server esce a 20-30 gradi, la rete cittadina richiede 70 gradi. La soluzione sono pompe di calore da quarantacinque megawatt, le più grandi mai installate in Danimarca. L'acqua fredda parte dalla centrale, attraversa la strada, entra nel data center. Assorbe il calore dai server, esce a 27 gradi, torna alla centrale. Le pompe la portano a 70 gradi. Entra nella rete. Arriva nelle case. Accanto alla centrale, un serbatoio alto venti metri funge da batteria termica. Il sistema attiva le pompe quando l'elettricità costa meno, immagazzinando acqua calda. Quando i prezzi salgono, le pompe si fermano e la rete attinge dalle riserve. L'infrastruttura si adatta alle tariffe che cambiano ogni ora. Il Tietgenbyen Energy Center entra in funzione a fine 2019. L'espansione del 2021 porta la capacità a 215mila megawattora all'anno. Sei per cento del fabbisogno termico cittadino. L'investimento di Fjernvarme Fyn per il recupero di calore residuo ammonta a 54 milioni di euro. Il progetto Meta ne richiede 25-30. Il calcolo è semplice. Produrre 215mila megawattora con carbone costerebbe tredici milioni. Con le pompe elettriche il costo operativo è cinque milioni. Differenza: otto milioni risparmiati ogni anno. L'investimento si ripaga in quattro-sei anni. Poi è guadagno netto. Il 22 aprile 2024, nel cortile della centrale termica, il ministro danese delle finanze Nicolai Wammen preme un pulsante rosso per fermare l'ultimo nastro trasportatore di carbone. La centrale Fynsværket, in funzione dal 1950, chiude definitivamente. Un anno prima dell'obbligo nazionale.
L'ultima unità attiva, convertita a gas nel 2022, lavora ormai solo nelle giornate più fredde. Cinquecento-mille ore l'anno. Il resto è coperto da biomassa, rifiuti, pompe di calore. Il mix energetico oggi è per tre quarti rinnovabile o di recupero. La chiusura elimina 150mila tonnellate di anidride carbonica all'anno. L'un per cento delle emissioni nazionali danesi. Per i cittadini l'impatto è contenuto: tre euro e trenta al mese in più. La tariffa resta tra le più basse della Danimarca. Il modello non è replicabile ovunque. Serve un data center vicino a una rete di teleriscaldamento, un'utility pubblica disposta a investire, una normativa favorevole. Ma altri paesi stanno seguendo: progetti simili sono attivi in Finlandia e Svezia, in pianificazione in Danimarca. Odense resta il caso più grande. L'unico in cui il calore di un data center di dimensioni industriali permette di chiudere una centrale a carbone un anno prima del previsto. Alle otto di sera, nella casa di Tietgenbyen, la signora Larsen non sa niente di pompe di calore, di megawatt termici, di contratti tra Comuni e multinazionali. Sa che il termosifone scalda. Che la bolletta non è aumentata. Che fuori fa freddo e dentro no. Il calore arriva, come sempre. Silenzioso. Invisibile. Affidabile. Il merito non è di Meta. È del Comune di Odense, che nel 2017 mette sul tavolo una condizione chiara e la fa rispettare. Venticinque milioni di euro investiti per un sistema che ne fa risparmiare otto ogni anno. Pochi amministratori avrebbero avuto la lungimiranza di imporre condizioni a una multinazionale. Ancora meno la fermezza di farle rispettare. Non servono slogan. Serve un tubo, una pompa, un contratto, e la volontà politica di far funzionare le cose.`,
    spunti: "Il riuso del calore di scarto dei data center; la transizione dal carbone alle fonti alternative di riscaldamento urbano.",
    attivita: "Cerca cos'è un data center e perché produce calore. Calcola quante case potrebbero essere riscaldate dal calore di scarto di un data center delle dimensioni di quello di Odense.",
    summary: "Nella città natale di Hans Christian Andersen, nel 2024 Odense spegne la sua centrale a carbone un anno prima del previsto: non per obbligo, ma perché ha trovato un'alternativa migliore. A duecento metri dal centro storico, il calore prodotto come scarto da un enorme data center di Meta-Facebook, invece di disperdersi, viene recuperato per riscaldare la città."

    text: `Margarete ha settantacinque anni e vive al quinto piano di un Gemeindebau a Seestadt Aspern, Vienna. L'appartamento è piccolo, cinquanta metri quadrati, ma la pianta circolare e le pareti scorrevoli le permettono di giocare a nascondino con il marito. Lo dice ridendo. Vivere qui è diverso perché l'architettura è diversa. Gemeindebau significa "costruzione comunale". Non è housing popolare. È proprietà pubblica permanente che a Stadt Wien attraversa un secolo e ospita una persona su quattro: cinquecentomila abitanti in 220mila appartamenti sparsi per tutti i 23 distretti, ovunque, non concentrati in periferia. Margarete si è trasferita qui nella primavera del 2024. Cercava porte larghe, bagno accessibile, ascensore. Ha trovato l'appartamento online, sulla piattaforma lanciata dal Comune nel maggio 2020, dove algoritmi pubblici e verificabili trovano soluzioni per bisogni reali considerando anzianità, reddito e urgenza sociale. I dati sono aperti, accessibili dal portale data gv at: oltre 300 applicazioni sono state sviluppate usando questi dataset, e l'"Open Data Implementation Model" viennese è stato scaricato migliaia di volte in tutta Europa. Nel palazzo abitano studenti, coppie con bambini, professionisti. Il canone medio per un bilocale in centro è di circa 600 euro al mese. Non è assistenza. È una città che ha deciso, cento anni fa, di non lasciare la casa solo nelle mani del mercato immobiliare. Il modello nasce nel 1919, quando il sindaco socialdemocratico Jakob Reumann introduce tasse sui beni di lusso per finanziare alloggi pubblici. Tra il 1923 e il 1934 vengono edificati 400 complessi con più di 64mila appartamenti. Ogni Gemeindebau storico ospita biblioteche, asili, ambulatori, lavanderie comuni, cortili verdi. Non è edilizia povera, bensì edilizia collettiva di qualità. Oggi il Comune possiede 1.800 complessi che non ha mai venduto. Dal 2015 ne costruisce di nuovi. L'accesso è regolato da criteri chiari. Due anni di residenza continuativa a Vienna, limiti di reddito che includono i tre quarti della popolazione. Una volta entrati, il reddito non viene più verificato. Se uno studente trova lavoro e progredisce nella carriera, può restare. La casa è trasmissibile ai figli. I tempi di attesa variano tra due mesi e due anni. Chi resta dentro accumula un vantaggio, chi resta fuori affronta affitti privati saliti di un terzo dal 2015. Ma il modello esiste, funziona, resiste. Ogni mattina Margarete scende al centro di quartiere, il Grätzl-Zentrum di Seestadt, gestito da Wohnpartner, un servizio municipale nato nel 2010 per tenere insieme il tessuto sociale dei Gemeindebau. Centocinquanta operatori distribuiti in nove team distrettuali mediano conflitti, organizzano attività e collegano gli abitanti con i servizi sociali della città. Margarete partecipa al laboratorio di giardinaggio comunitario. Ogni mercoledì si lavora con ortaggi, innaffiature, si discute. Non è tempo libero, ma costruzione di legami. I conflitti ci sono: rumore, rifiuti, uso degli spazi comuni. Il servizio li gestisce senza censurarli. Un'iniziativa comunale mette insieme operatori sociali, azienda delle case e polizia locale per rafforzare la sicurezza attraverso la presenza, non la sorveglianza. Nei centri si organizzano corsi di formazione, si installano distributori gratuiti di prodotti per l'igiene. È progettazione sociale mirata, non assistenzialismo. Max ha 28 anni e studia per un master. Paga circa 600 euro al mese senza deposito cauzionale e con contratto illimitato. È entrato grazie al programma per giovani al primo affitto. Non aveva figli, non aveva disabilità. In molti paesi europei non avrebbe avuto alcuna possibilità. A Vienna, la città lo ha corteggiato. Il punto non è fare beneficenza. È mantenere il mix sociale. Vienna vuole che nei palazzi comunali vivano insieme anziani, studenti, famiglie, professionisti, disoccupati.

    text: `Un secolo fa, nel sottosuolo di Parigi, qualcuno cominciò a scavare gallerie per portare il calore dove serviva. Non erano fognature, né metropolitane. Erano tubi d'acciaio che attraversavano la città come vene, alimentati da centrali che bruciavano carbone e trasformavano il vapore in riscaldamento domestico.

Non è una privatizzazione, non è una nazionalizzazione. È un riassetto. La città riprende la proprietà delle dodici centrali di produzione, affida la gestione per venticinque anni a un operatore misto, impone vincoli ambientali stringenti e si riserva il controllo finale.
L'operazione vale quindici miliardi di euro di investimenti previsti sull'arco della concessione. Servono per estendere la rete di altri centocinquanta chilometri, sostituire i tratti obsoleti, ridurre le perdite termiche, aumentare la quota di calore decarbonizzato.
L'obiettivo è raggiungere il 75% di energie rinnovabili e di recupero entro il 2030, il 100% entro il 2050. Oggi il mix è ancora al 45% da recupero di rifiuti, il resto da gas naturale e una quota crescente di geotermia profonda.
La rete parigina è una delle più grandi d'Europa. Serve circa 450.000 abitazioni, con cinquecento punti di consegna distribuiti nella capitale. Ma la sua forza non sta nelle dimensioni. Sta nella continuità. Un servizio che funziona ogni giorno da novantasette anni, che attraversa guerre, crisi, cambi di governo senza mai spegnersi.

    text: `L'ingegnere sposta il cursore su un isolato del Jordaan. Il tetto numero 4.512 lampeggia rosso. Orientamento perfetto, esposizione a sud, ma visibile dal ponte. Pannelli esclusi. Passa al palazzo accanto. Verde. Edificio anni Sessanta, tetto piatto, nessun vincolo. L'analisi dura tre secondi. Amsterdam deve trovare spazio per un milione e seicentomila pannelli solari entro il 2030. Target: 550 megawatt. La città conta 134.153 edifici con tetti superiori a venti metri quadri. Un algoritmo li ha analizzati tutti, uno per uno. Il gemello digitale si chiama 3D BAG. È una copia tridimensionale di dieci milioni di costruzioni in tutta l'Olanda. Ogni tetto ha una pendenza, un orientamento, una superficie netta. Il sistema calcola quanta luce solare riceve ogni sezione nell'arco dell'anno. Valuta quanta energia potrebbe produrre un singolo metro quadro di pannello. Tiene conto delle ombre: campanili, palazzi vicini, alberi. Tre monitor accesi nel dipartimento Pianificazione e Sostenibilità del Comune di Amsterdam disegnano una realtà parallela. Sul primo appare una mappa millimetrica di canali, strade e edifici disegnati con precisione assoluta. Il secondo mostra lo stesso quartiere visto dall'alto che prende vita in tre dimensioni. Sul terzo scorre una tabella con numeri che mutano mentre il cursore si sposta tra i tetti. Si tratta di una copia digitale perfetta della città, aggiornata ogni settimana e interrogata ogni giorno. Questo specchio tecnologico non è un semplice archivio di dati, ma un’infrastruttura civica che agisce nel silenzio. Lascia che la città continui a essere sé stessa mentre gli algoritmi si occupano di farla funzionare meglio. All'inizio solo l'otto per cento dei tetti risultava subito utilizzabile. Senza rimuovere camini, antenne, abbaini. Ma il sistema ha guardato meglio. Ha incluso le superfici parzialmente libere, le coperture dei monumenti invisibili dalla strada. Il potenziale è raddoppiato. Amsterdam dispone di 15,7 chilometri quadra     text: `Ci sono città che aspettano l'emergenza climatica per reagire. E poi c'è Berlino, che dal 2019 finanzia i propri cittadini per coprire le facciate degli edifici esistenti con piante rampicanti. Il programma si chiama GründachPLUS. Lo gestisce l'IBB Business Team GmbH, società pubblica della città. Copre fino al sessanta per cento dei costi. Non un prestito. Contributo a fondo perduto, fino a sessantamila euro per intervento. Regolamento aggiornato al dieci gennaio 2026, modulo da compilare, procedura da seguire. Il Comune paga perché i privati mettano piante sui muri. Tante piante. Altrove si costruiscono boschi verticali spettacolari per appartamenti da milioni di euro. Qui si pagano i cittadini “normali” perché coprano di rampicanti i propri muri. Non serve abitare in un grattacielo firmato. Basta avere una facciata e presentare domanda. Berlino ha quasi quattro milioni di abitanti, cresce, si adatta, si riorganizza. E ha capito che l'adattamento al caldo si costruisce prima, con incentivi strutturali ripetuti negli anni. Chi installa una facciata verde riduce il carico termico del proprio edificio. Ma il beneficio si diffonde: aria più fresca, meno isole di calore, acqua piovana trattenuta, polveri filtrate. Guadagno pubblico che giustifica investimento pubblico. In Adlershofer Straße, sud-est della città, l'Istituto di Fisica dell'Università Humboldt mostra cosa significa questa logica tradotta in mattoni e piante. Completato nel 2002. Oltre quattrocento metri lineari di vegetazione distribuiti su quattro piani. Centocinquanta vasche di coltivazione. Sistema di irrigazione automatico alimentato da cisterne che raccolgono l'acqua piovana. Nessun drenaggio esterno. Tutto quello che cade dal cielo resta nell'edificio. Si infiltra, nutre, evapora. Chi passa davanti vede piante rampicanti che salgono lungo cavi d'acciaio tesi tra i piani. Wisteria, Aristolochia macrophylla, specie resistenti al clima continentale. Infrastruttura, non decorazione. La Techni     text: `Per secoli le città europee hanno tombato i loro corsi d'acqua. Fiumi, torrenti, rogge chiusi in condotte sotterranee. Prima per ragioni igieniche, poi per espandere la municipalità, infine per fare spazio alle auto. L'acqua spariva sotto strade, parcheggi, edifici. Ma l'acqua non dimentica. Prima o poi torna a chiedere il suo spazio. E quando torna, travolge tutto. Lovanio, in Belgio, ha imparato la lezione. Invece di aspettare la prossima alluvione, ha fatto il contrario. Ha fatto riemergere il fiume. Dal ponte della Sluisstraat, la Dijle scorre tra gradinate di pietra e aiuole di lavanda. Un bambino lancia sassi nell'acqua. Un anziano sonnecchia su una panchina all'ombra. Un kayak passa lento sotto l'arco del ponte. Fino al 2017 qui c'erano capannoni, lamiere arrugginite, asfalto crepato. Il corso scorreva sepolto tre metri più in basso, intubato sotto i pavimenti della vecchia fabbrica della birra Stella Artois. Lovanio conta poco più di centomila residenti. Brabante Fiammingo, venticinque chilometri a est di Bruxelles. La Dijle allaga il centro ogni dieci, quindici anni. Novembre 2010, piove senza sosta. Il bacino di controllo a Egenhoven, appena a monte, si riempie fino all'orlo. Ancora un metro d'acqua e bisogna evacuare i quartieri lungo il corso. La municipalità trattiene il respiro. L'acqua si ferma a pochi centimetri dal limite. La scelta era stata discussa negli anni Novanta. Sul tavolo, due opzioni. Costruire tre bacini di cemento a monte - soluzione costosa - 5,6 milioni di euro in più della seconda. Oppure restituire spazio al fiume nelle pianure alluvionali naturali. Gli ingegneri calcolano che entrambe possono contenere un'alluvione centenaria. Ma la seconda offre benefici che vanno oltre la protezione. Migliora la qualità dell'acqua, sequestra carbonio, crea spazi pubblici. Valore stimato tra 29 e 330 milioni di euro. Viene scelta la seconda. Nel 1993 la Stella Artois chiude la storica fabbrica per trasferirsi in periferia. Restano decin La soluzione naturale protegge 125 ettari, un terzo del centro storico, il campus universitario, l'ospedale, le infrastrutture critiche. Costa 5,6 milioni di euro in meno dei bacini artificiali. I benefici aggiuntivi valgono decine di volte di più. Ma non tutto è risolto. Gli archi sotterranei che coprono alcuni tratti della Dijle, eredità di interventi urbanistici dei secoli scorsi, strozzano il flusso. Non si possono demolire senza sventrare il centro storico. Per questo la municipalità ha scelto di creare spazio a monte, nelle pianure alluvionali. Se il corso non può allargarsi in centro, deve poterlo fare prima di arrivarci. Ma la crescita urbana del dopoguerra ha occupato ampie porzioni di quelle pianure. I margini di manovra si riducono. I modelli climatici indicano che, in caso di eventi estremi, le misure attuali potrebbero non bastare. Il piano comunale prevede altri quaranta ettari di manto vegetale entro il 2030. Piazze deimpermeabilizzate, parcheggi trasformati in giardini, cortili scolastici con alberi. Tetti verdi, facciate vegetali, giardini della pioggia nei regolamenti edilizi. Tra il 2000 e il 2015, Lovanio aveva già aumentato gli spazi verdi da 200 a 300 ettari recuperando aree industriali abbandonate. Nel 2018 la Commissione Europea assegna a Lovanio il Green Leaf Award. Nel 2022 la municipalità viene selezionata tra le cento europee che dovranno raggiungere la neutralità climatica entro il 2030. Dal ponte della Sluisstraat, nel tardo pomeriggio, si sente l'acqua scorrere tra le pietre. Un suono continuo che si inserisce nel frastuono urbano senza sovrastarlo. Lovanio non ha costruito un simbolo. Ha costruito un argine che respira. Un corso che scorre dove cinquant'anni fa c'era solo cemento. Proteggersi dalle piene significa restituire spazio all'acqua, non toglierlo.`,

  {
    num: 69, title: "A Rennes Gli Open Data Sono Servizio Pubblico", city: "Rennes", country: "Francia",
    lat: 48.1173, lon: -1.6778, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02nzwARnwwjXQo2MH8HC8aeh4vXSNKeiLMxu9tRsPRPXjiCZN5RKFLGHdqVxWsZsFNl",
    text: `Da secoli a Place des Lices ogni sabato mattina i banchi delle ostriche aprono alle sette. Formaggi bretoni, pane di segale, sidro in brocche opache. La gente contratta, assaggia, si muove lenta tra le cassette. Nessuno pensa ai dati. Ma sotto questa piazza, sotto ogni fermata dell’autobus, sotto ogni contatore elettrico del quartiere, corre un’infrastruttura che Rennes ha costruito pezzo per pezzo nell’arco di quindici anni. Rennes conta circa 228.000 abitanti nel comune e 474.000 nell’area metropolitana. Capitale della Bretagna, città universitaria con 70.000 studenti, economia solida, disoccupazione sotto la media nazionale. Nel 2010 apre uno dei primi portali di open data in Francia: trasporti, consumi, urbanistica, bilanci. Un gesto allora di avanguardia, oggi quasi normale. Ma Rennes non si ferma lì. Prova a fare un passo che in pochi, in Europa, hanno fatto davvero: trattare i dati come un servizio pubblico. Il progetto si chiama RUDI – Rennes Urban Data Interface. Parte nel 2020 con cinque milioni di euro, per l’80% finanziati dall’Unione Europea attraverso Urban Innovative Actions. Dodici soggetti coinvolti: Rennes Métropole, Keolis, Enedis, GRDF, Ouest-France, laboratori universitari come l’IRISA, associazioni come Ouishare, il Conseil de Développement. Non un consorzio di facciata. Una rete con accordi firmati, obblighi reciproci, regole di condivisione. L’architettura è federata. Nessun archivio centrale. Ogni attore installa un nodo produttore, un software che rende i propri dati visibili attraverso RUDI senza spostarli. I dati restano dove sono. Chi li produce decide condizioni, accessi, durata. Le informazioni circolano dentro un perimetro definito, con regole negoziate. Già, ma a cosa serve tutto questo? Ecco un esempio. Qualche anno fa i dati di frequentazione della metropolitana hanno rivelato un picco insostenibile alla fermata dell'università, ogni mattina tra le sette e quaranta e le otto. Il gestore del trasporto e l'ateneo hanno incrociato quei numeri con gli orari dei corsi e li hanno scaglionati: primo e secondo anno alle otto e un quarto, gli altri alle otto e trenta. Le vetture si sono svuotate senza aggiungere una corsa. Nessun investimento. Solo un dato letto bene e utilizzato meglio. La versione beta viene presentata nell’ottobre 2021 al Couvent des Jacobins. L’inaugurazione ufficiale arriva nel febbraio 2023. Il codice è open source, pubblicato su GitHub. La piattaforma ottiene nello stesso anno il label etico Ekitia, certificato da Goodalgo. Qui, di solito, i progetti europei si fermano. Finisce il finanziamento, finisce la spinta. A Rennes no. Nell’ottobre 2023 Rennes Métropole avvia City Orchestra, un programma triennale sostenuto dalla Banque des Territoires nel quadro di France 2030. RUDI diventa la base tecnica e viene orientata alla transizione ecologica. I soggetti coinvolti salgono a diciassette: accanto ai primi entrano Brest Métropole, la Région Bretagne, il Département d’Ille-et-Vilaine, Air Breizh, il CSTB, l’Institut Agro. I casi d’uso sono quattro. Adattamento climatico: dati su vegetazione, acqua e biodiversità incrociati per individuare rifugi climatici e migliorare il comfort pedonale. Qualità dell’aria: le misurazioni di Air Breizh combinate con urbanistica e mobilità per capire dove intervenire. Efficienza energetica degli edifici pubblici: consumi reali, prestazioni, anomalie. Gestione del suolo: analisi coerenti con la legge Climat et Résilience, che impone l’azzeramento del consumo di suolo netto entro il 2050. A questo punto la piattaforma cambia natura: non è più un semplice portale, ma uno strumento di governo urbano. Il secondo evento annuale di City Orchestra si è tenuto al Couvent des Jacobins nel novembre 2025. A gennaio 2026 il progetto ha compiuto due anni. I materiali di lavoro sono pubblici.
Il cuore del sistema non è tecnologico. È contrattuale. Gli accordi definiscono cosa condividere, a quali condizioni, con quali garanzie. Per il cittadino significa controllo: attraverso un’interfaccia web può decidere quali dati personali rendere disponibili, verificare chi li utilizza, revocare il consenso. Non una clausola nascosta. Una funzione visibile. Anche la replicabilità resta aperta. Il software è disponibile, ma non basta installarlo. Ogni territorio ha equilibri diversi, relazioni da costruire, livelli di fiducia da consolidare. Quello che Rennes ha messo a fuoco è semplice e, proprio per questo, decisivo: il dato non è neutro. Quando resta concentrato in poche piattaforme private, una parte delle decisioni pubbliche si sposta altrove. Non sparisce, ma cambia sede. RUDI e City Orchestra sono un tentativo di riportare quella leva dentro uno spazio disciplinato, con regole pubbliche, controlli e risultati verificabili. Non contro il mercato ma insieme. Non è un sistema perfetto. Ha limiti, contraddizioni, risultati parziali. Ma è in funzione. E continua a evolversi.`,
    spunti: "Gli open data come infrastruttura civica; la trasformazione dei servizi urbani quotidiani in informazione condivisa.",

    text: `Il 4 luglio 1904, a Larderello, in Toscana, Piero Ginori Conti accende cinque lampadine utilizzando il vapore che sale dal sottosuolo. È la prima volta al mondo che il calore della terra produce elettricità. Sotto il territorio estense scorre una storia analoga. A Ferrara, negli anni Cinquanta, durante trivellazioni alla ricerca di petrolio, si scopre un altro tipo di energia. Nel 1990 la città inizia a distribuire quel calore attraverso una rete di teleriscaldamento che oggi serve circa 27.000 utenze. Centoventi anni dopo Larderello, quella storia continua a metà. L'Italia resta tra i protagonisti globali della geotermia elettrica - Larderello produce ancora circa 6 terawattora l'anno - ma utilizza in modo marginale ciò che ha scoperto più di un secolo fa: il calore del sottosuolo per scaldare le case. La geotermia non è una sola. C'è quella ad alta temperatura, oltre i 150 gradi, che produce elettricità. E c'è quella a bassa entalpia - il calore tiepido del sottosuolo, inferiore a 90 gradi secondo la normativa italiana, utilizzabile ovunque attraverso pompe di calore. In Italia la temperatura stabile del sottosuolo si attesta tra i 13 e i 18 gradi già a pochi metri di profondità. Stessa risorsa, uso diverso. Ed è qui che il sistema si inceppa. La geotermia a bassa entalpia rappresenta una quota minima del sistema termico nazionale, largamente inferiore all'1 per cento della potenza installata. In gran parte d'Europa la traiettoria è opposta. In Svezia le pompe di calore coprono oltre il 20 per cento delle abitazioni. In Polonia, dopo la crisi energetica del 2021, le installazioni sono raddoppiate in un anno, portando il paese al primo posto per crescita. Negli ultimi due anni il mercato ha rallentato, ma il segnale era chiaro. Una tecnologia matura, scalabile, pronta quando il contesto lo impone. In Italia resta una nicchia. Il paradosso si misura in metri cubi di gas. Un uso più esteso della geotermia - tra reti di teleriscaldamento e impianti domestici - potrebbe ridurre i consumi nazionali di 5-8 miliardi di metri cubi l'anno, pari al 7-10 per cento delle importazioni complessive. Non risolve tutto, ma cambia il profilo della dipendenza energetica. La geotermia è una fonte locale, continua, non soggetta ai mercati internazionali. E soprattutto è già disponibile. Il Politecnico di Milano stima un potenziale di sviluppo del teleriscaldamento geotermico nell'ordine dei 50 terawattora annui entro il 2030, una quota che potrebbe coprire tra il 15 e il 20 per cento della domanda termica civile. Il portale GeoThopica del CNR ha mappato le principali aree ad alta temperatura: una fascia che da Larderello attraversa il Lazio, i distretti vulcanici e arriva fino ai Campi Flegrei e al Canale di Sicilia. A Roma, l'acquifero del Tevere - tra i 30 e i 60 metri di profondità - mantiene temperature stabili intorno ai 18-19 gradi. A Napoli, Firenze, Siena e Grosseto, le sorgenti termali sono la prova visibile di un calore diffuso e accessibile. In Italia non esistono reti geotermiche diffuse comparabili a quelle del Nord Europa. L'unico caso di scala urbana consolidata resta Ferrara. Dal 2025 il Gruppo Hera, in partnership con Enel Green Power, ha avviato un progetto finanziato dal PNRR per il raddoppio della potenza geotermica. I lavori procedono con i ritmi nazionali. Le opere preliminari non saranno terminate prima di giugno 2026, la conclusione definitiva attesa per agosto. Quando arriverà, la geotermia coprirà circa metà del fabbisogno termico cittadino. Integrata con altre fonti, la quota rinnovabile si avvicinerà alla totalità. Altrove il quadro resta fermo. Oltre il 90 per cento del teleriscaldamento italiano è concentrato nel Nord e utilizza ancora in larga parte fonti fossili. La Toscana impiega la geotermia quasi solo per l'elettricità. Il Centro-Sud, dove il potenziale è maggiore, è quasi privo di reti. In Europa i modelli esistono. A Szeged, in Ungheria, ventisette pozzi geotermici trivellati tra il 2018 e il 2025 alimentano oggi il teleriscaldamento di oltre 27.000 appartamenti. La riduzione del
consumo di gas è di 10 milioni di metri cubi all'anno. Le emissioni di CO₂ sono calate di 20.000 tonnellate. Il progetto è costato circa 70 milioni di euro, di cui 23 dall'Unione Europea. Szeged non ha inventato nulla: ha sfruttato una rete di teleriscaldamento già costruita negli anni Settanta e l'ha alimentata con una fonte diversa. I costi sono consistenti ma non proibitivi. Un grande impianto urbano richiede decine di milioni di euro e tempi tra cinque e dieci anni. A livello domestico, una pompa di calore geotermica con sonda verticale costa tra 22.000 e 25.000 euro. I tempi di rientro possono scendere sotto gli otto anni con il Conto Termico, che prevede un rimborso fino al 65 per cento della spesa. In cambio, un'energia stabile e locale. Il vero ostacolo è altrove: rischio esplorativo, burocrazia, assenza di garanzie pubbliche. E soprattutto mancano le reti. Senza una rete di teleriscaldamento, ogni impianto domestico rimane isolato, meno efficiente, più difficile da ammortizzare. Con una rete, i costi si distribuiscono e il sistema diventa infrastruttura. Sotto le città italiane il calore c'è. La tecnologia anche. Manca la decisione politica.`,

    text: `A Feldheim, un piccolo villaggio nel Brandeburgo tedesco, la crisi energetica determinata dalla guerra scatenata da Stati Uniti e Israele contro l'Iran quasi non si avverte. Almeno per quel che riguarda le tariffe. In Germania, dall'inizio del conflitto a fine febbraio, il prezzo del gas alla borsa europea è raddoppiato, le tariffe elettriche per i nuovi contratti sono salite del 17 per cento in due mesi, e chi ha la tariffa base di default paga oltre 42 centesimi al kilowattora. A Feldheim l'elettricità costa 11,3 centesimi. Il calore per i termosifoni otto. Sono gli stessi numeri di un anno fa. E di cinque anni fa. E di dieci. Non è la prima volta. Nel 2022, quando l'invasione russa dell'Ucraina fece esplodere le bollette in tutta Europa, qui non cambiò nulla. "Eravamo perfettamente tranquilli", disse allora Borris Philipp, referente del Neue Energien Forum, l'associazione che gestisce il centro visitatori del villaggio. Potrebbe dirlo anche adesso. Feldheim è una frazione di Treuenbrietzen, sessanta chilometri a sudovest di Berlino. Circa centoquaranta abitanti, trentacinque famiglie, una cooperativa agricola, un allevamento di suini, campi piatti fino all'orizzonte. A vederlo dalla strada, sembra un villaggio qualunque della pianura brandenburghese. Poi si alzano gli occhi e si vedono le pale. Cinquantacinque aerogeneratori, 123 megawatt di potenza installata, 250 milioni di kilowattora prodotti ogni anno. Il villaggio ne consuma uno. Il resto va nella rete nazionale. La storia comincia negli anni Novanta, quando Michael Raschemann, studente di ingegneria civile nato a Zossen, convince il sindaco di Treuenbrietzen a installare le prime quattro turbine eoliche sui terreni agricoli intorno a Feldheim. L'idea non era l'autosufficienza. Era più semplice: produrre energia dove c'è vento e spazio. Poi è arrivata la biomassa. La cooperativa agricola Fläming, che gestisce l'allevamento di suini, aveva liquami da smaltire. Un impianto a biogas li trasforma in metano, il metano produce calore in un cogeneratore. Il calore scalda i maiali e, da lì, tutto il villaggio attraverso una rete di teleriscaldamento costruita ad hoc. Il passaggio decisivo è stato il più difficile. Per distribuire l'elettricità prodotta localmente senza passare per la rete del gestore nazionale, serviva una rete propria. Il monopolista si è opposto. Non esisteva un precedente. Ma nessuna legge tedesca vietava esplicitamente la costruzione di una rete elettrica privata. Raschemann e i suoi avvocati hanno trovato il varco giuridico. Nel 2010 Feldheim ha posato i propri cavi elettrici insieme a quelli del teleriscaldamento. Ha fondato la Feldheim Energie GmbH & Co. KG, in cui ogni famiglia collegata è socia accomandante, con un investimento inferiore ai duemila euro a nucleo. Il Comune di Treuenbrietzen ha rinunciato alle tasse di concessione. L'elettricità arriva dalla sottostazione del parco eolico senza attraversare la rete pubblica: niente tariffe di transito, niente oneri di sistema. Da quando la rete si è accesa, nell'ottobre del 2010, non c'è mai stata un'interruzione di corrente. Il sistema si è consolidato. Alle turbine e al biogas si sono aggiunti un impianto a cippato di legna per i picchi invernali, un parco solare a Selterhof e un accumulo a batteria da 10 megawatt che funge da regolatore di rete per l'operatore di trasmissione 50Hertz. La cooperativa agricola produce il digestato - un fertilizzante inodore, sottoprodotto del biogas - e lo usa sui campi. Tremila visitatori all'anno arrivano a vedere come funziona - scolaresche tedesche, delegazioni dal Giappone, dal Kenya, dalla Corea del Sud. Nel 2024 il Neue Energien Forum ha ricevuto il

    text: `Il 14 aprile 2026, al suo primo Consiglio straordinario, il nuovo sindaco di Parigi Emmanuel Grégoire ha annunciato la creazione di una "Brigade de protection du logement". Centocinquanta agenti, sette servizi accorpati, in collegamento con la polizia municipale e la procura. Compito: dare la caccia agli appartamenti fantasma. A Parigi 300.000 alloggi sono vuoti o usati come residenze secondarie. Un appartamento su cinque non è abitato in modo stabile. Il 40 per cento degli alloggi privati appartiene a multi-proprietari che possiedono almeno cinque immobili. Intanto 320.000 famiglie aspettano un alloggio sociale. Alcune aspettano da otto anni. L'opposizione di destra ha definito la brigade "una milizia". Grégoire ha risposto ribadendo il suo obiettivo. Rimettere sul mercato 100.000 alloggi oggi inoccupati. Non è un gesto isolato. È l'ultimo passo di una politica che dura da vent'anni. Il primo strumento è il meno spettacolare: costruire case pubbliche. La quota di alloggi sociali è passata dal 13 al 25 per cento delle residenze principali. Al primo gennaio 2024 erano 271.906, secondo l'APUR, l'Atelier parigino di urbanistica. Nei due mandati di Anne Hidalgo ne sono stati finanziati 57.437. Il Comune ha speso in media 400 milioni di euro l'anno. Nel biennio 2023-2024 ha investito 1,1 miliardi per acquistare alloggi privati e convertirli in sociali. È la strategia che Ian Brossat, allora assessore comunista al logement, chiamava "la conquista dell'Ovest". Portare le case popolari negli arrondissement dove non ce n'erano. Nel sesto, nel settimo, nel sedicesimo. Non ghettizzare. Mescolare. Il secondo strumento è il tetto agli affitti. Funziona dal luglio 2019. Si chiama encadrement des loyers. Ogni quartiere ha un affitto di riferimento al metro quadrato, calcolato dall'Osservatorio degli affitti dell'agglomerazione parigina. Il proprietario non può superare quel tetto di oltre il 20 per cento. Se lo fa, l'inquilino può segnalarlo direttamente al Comune. L'AP     text: `Molti ricorderanno quei giorni. Il 28 aprile 2025, alle 12:33, la penisola iberica è rimasta al buio. Spagna e Portogallo senza elettricità per ore. Sessanta milioni di persone. Treni fermi, ospedali attivi solo grazie ai generatori, semafori spenti. L'intera Europa ha trattenuto il fiato. L'indagine dell'ENTSO-E, l'associazione europea dei gestori di rete, non è ancora conclusa. Ma una cosa è chiara: la rete non ha retto. Non per colpa delle rinnovabili, come qualcuno si è affrettato a sostenere. Per colpa di una infrastruttura vecchia, sottodimensionata, incapace di gestire i flussi di un sistema elettrico che nel frattempo è cambiato. Lenin diceva: il comunismo è il potere dei soviet più l'elettrificazione di tutto il paese. Era il 1920. Un secolo dopo, la formula torna spogliata dell'ideologia e carica della stessa urgenza. L'Europa nel 2023 ha importato il 58 per cento della propria energia, pagando 380 miliardi di euro. Due crisi in quattro anni. Prima il gas russo, ora lo Stretto di Hormuz. E l'elettricità costa da due a cinque volte più che in America e in Cina. Nel 2025, per la prima volta, sole e vento hanno prodotto il 30 per cento dell'elettricità europea. Più delle fonti fossili, scese al 29. Le rinnovabili nel complesso coprono il 48 per cento della domanda. Il fotovoltaico è cresciuto del 22 per cento in un anno. Il carbone è al minimo storico. Eppure la quota di elettricità sui consumi finali, cioè l'energia che usiamo ogni giorno per scaldarci, spostarci, produrre, è ferma al 21 per cento da oltre dieci anni. La Cina è al 28. L'Europa produce energia pulita in quantità crescente. Ma non riesce a usarla. La rete è il collo di bottiglia. Più del 40 per cento delle linee di distribuzione europee ha oltre quarant'anni. Un rapporto Ember del primo aprile 2026 documenta che 120 gigawatt di progetti rinnovabili rischiano di restare bloccati per mancanza di capacità. Quasi 700 gigawatt sono in coda in dieci paesi. Nel 2024 sono stati buttati via 72 terawattora di energia pulita per congestione. Il consumo annuo dell'Austria. Prodotta e sprecata perché i cavi non reggono. La Commissione ha fissato gli obiettivi: 32 per cento di elettricità nei consumi finali entro il 2030, 50 entro il 2040. Sole, vento, acqua. Il Clean Industrial Deal include anche il nucleare, scelta tutt'altro che unanime in Europa e che non riguarda l'Italia, dove la questione è stata chiusa da due referendum. Il costo della transizione è alto: 660 miliardi di euro all'anno fino al 2030. I bilanci pubblici non bastano. Servono come leva per il capitale privato. Come ha scritto Draghi, non basta produrre energia pulita. Serve una rete che la trasporti dove serve. Una buona notizia c'è. L'elettrificazione combinata con i pannelli sui tetti e con sistemi intelligenti di gestione dei consumi può ridurre le bollette tra il 15 e l'80 per cento. Se ogni casa consuma meglio, il sistema regge con meno sforzo. In questo quadro si inseriscono le comunità energetiche rinnovabili. Cittadini, imprese, enti locali che producono e condividono energia. L'Europa ne conta migliaia. In Italia il decreto attuativo è arrivato nel gennaio 2024, con due anni di ritardo. Le domande crescono, i tempi di allacciamento le frenano. Non manca chi vuole produrre energia pulita. Manca la rete per distribuirla. Secondo Ember, tecnologie che migliorano l'uso della rete esistente senza costruirne di nuova potrebbero sbloccare fino a 185 gigawatt di capacità. Abbastanza per colmare il buco. Resta un ostacolo che non richiede tecnologia ma volontà politica. In molti paesi europei, Italia compresa, l'elettricità è tassata più del gas. Chi installa una pompa di calore paga più tasse per kilowattora di chi brucia metano nella caldaia.
L'Italia è l'esempio perfetto di questo stallo. L'analisi ENEA del 9 aprile 2026 fotografa un paese fermo: emissioni e consumi nel 2025 identici all'anno precedente. Le rinnovabili sui consumi finali sono al 20 per cento. Il PNIEC prevedeva il 25. Per centrare il 2030, le emissioni dovrebbero scendere del sei per cento ogni anno. Non è mai successo. Il prezzo dell'elettricità alla Borsa italiana, 108 euro a megawattora, è quasi il doppio di quello francese e spagnolo. E il dato più assurdo: 231 gigawatt di progetti rinnovabili hanno già l'allacciamento ma non sono operativi. Il 169 per cento della capacità installata. Abbiamo in coda quasi il doppio di ciò che già funziona. Non è un problema di sole. È un problema di cavi, permessi, burocrazia. Il blackout iberico lo ha dimostrato. La coda di 700 gigawatt che aspetta un cavo lo conferma. Ogni mese senza elettrificare è un mese esposto al prossimo shock. L'elettrificazione non è un'opzione. È la condizione per decidere da soli.`,

    summary: "Il 28 aprile 2025, alle 12:33, l'intera penisola iberica resta al buio: Spagna e Portogallo senza elettricità per ore, sessanta milioni di persone coinvolte, treni fermi e ospedali attivi solo grazie ai generatori. L'indagine dei gestori europei della rete non è ancora conclusa, ma una cosa è chiara fin da subito: non è colpa delle rinnovabili, bensì di una rete elettrica che non ha retto."

    text: `Il carciofo sta fermo, piegato dal vento. Sotto c’è Parigi. Sopra, il cielo. In mezzo, quindici metri d’aria e un tetto che fino a pochi anni fa non serviva a niente. Non c’è una caldaia. Il calore arriva da un data center. I server lavorano, scaldano. Il calore di scarto risale. La serra lo trattiene. Le piante crescono. Niente combustibile fossile. Niente rumore. Siamo a nord della città, poco oltre il perimetro turistico. Porte de la Chapelle. Linee ferroviarie, capannoni logistici, residenze nuove incastrate tra ciò che resta dell’industria e ciò che ancora deve arrivare. Chapelle International è uno di quei quartieri pensati per rimettere ordine (la chiamano rigenerazione urbana), ma ancora attraversati da contraddizioni. È qui che, su un tetto, crescono i carciofi. Sul tetto di un capannone logistico, nel 18° arrondissement, settemila metri quadrati producono cinquantamila chili di verdure l’anno. Insalate, valeriana, fiori commestibili. E carciofi. A Parigi. La ville lumière. Se questa cosa esiste non è perché qualcuno si è messo in testa di coltivare carciofi sui tetti. È perché, anni prima, il Comune ha deciso di occuparsi dei vuoti urbani e degli scarti della città. Il programma si chiama Parisculteurs. Parte nel 2016. Non è un progetto agricolo. È uno strumento amministrativo. Da allora sono partiti ottanta progetti, ventiquattro ettari coltivati. Alcuni reggono, altri no. Fa parte del conto. Il Comune individua superfici di cui dispone o che controlla: tetti, locali tecnici, sotterranei, ex aree industriali, infrastrutture inutilizzate. Le verifica dal punto di vista strutturale, chiarisce i vincoli giuridici, stabilisce cosa si può fare e cosa no. Poi le mette a bando con concessioni lunghe, dieci o quindici anni. In cambio chiede una cosa semplice: che quelle superfici tornino a produrre. Non solo cibo. Attività continue, lavoro, accesso. Il Comune non finanzia i progetti. Non è una scelta neutra. Un’amministrazione che funziona così accetta che certi tetti restino improduttivi per anni prima di entrare in equilibrio. Accetta che qualcuno fallisca. Accetta che il ritorno non sia immediato e non sia solo economico. È una politica dei tempi lunghi. Poco visibile. Il numero è il 37 di rue des Cheminots. La strada corre parallela ai binari. Camion in manovra, cancelli metallici, uffici ciechi. L’ingresso non promette niente. Nessuna insegna. Nessun cartello verde. Bisogna entrare e salire. Un montacarichi. Quindici metri. Quando la porta si apre, la città resta sotto. Il traffico scompare. Si vede il cielo. Il resto arriva dopo. L’orto occupa milleduecento metri quadrati in piena terra. Terra vera, portata fin quassù. Niente prodotti chimici. Il compost è fatto sul posto. Zucchine, peperoni, melanzane. I carciofi stanno in fondo, in file regolari. Nel Mediterraneo sono una consuetudine. Qui no. Ma crescono. Accanto all’orto c’è una serra, altri milleduecento metri quadrati. Le piante crescono in idroponica. Le radici non affondano, restano sospese in acqua arricchita di nutrienti. La temperatura è stabile. Il calore arriva dal piano di sotto, da un data center. Che produce dati, certo, ma anche calore. Anche questo è uno scarto urbano. Qui non viene disperso. Marguerite è un’ingegnera agronoma. Lavora tra le file di ortaggi. Dice che ha scelto questo posto perché qui l’agricoltura non è un’idea, ma un’infrastruttura. Organizza visite guidate, laboratori di semina. Il pubblico arriva dalle scuole, dalle aziende, a volte dal quartiere. Al centro del tetto c’è un ristorante. Lo chef si chiama Jimmy. Cucina quello che viene raccolto qui. Cucina vegetale ovviamente. Grilled cheese con melanzana marinata e formaggio di lupino, pesto al basilico con fiori di calendula, guacamole di zucchine con formaggio fresco di mandorla. La distanza tra campo e piatto è misurabile in metri.
Per arrivare fin qui sono serviti sei mesi di progettazione e dodici di cantiere. Quindici imprese coinvolte. Un permesso di costruire ottenuto introducendo regole nuove nel piano regolatore di Parigi. Oltre tre milioni di euro investiti. Tutto durante il Covid. La produzione agricola, da sola, non basta a sostenere economicamente un progetto di queste dimensioni. Il tetto si regge grazie a eventi aziendali, privatizzazioni, ristorazione. È da lì che arrivano i ricavi. Le verdure vanno in gran parte a ristoranti di fascia alta. Le consegne avvengono in bici-cargo. Chapelle International resta un quartiere popolare. Il progetto nasce da un bando pubblico. Ma l’economia del luogo guarda altrove. Il tetto è aperto a tutti solo nel fine settimana. Non è un caso isolato. È una costante dell’agricoltura urbana europea. Funziona quando diventa spazio, quando ospita, quando può contare su funzioni parallele. Non quando vende solo cibo. Dal punto di vista ambientale, però, il bilancio è chiaro. Il calore di scarto viene recuperato. Il suolo non viene consumato. I trasporti sono ridotti al minimo. La produzione è tracciabile. Il resto dipende dalle scelte delle amministrazioni per valorizzare vuoti e scarti urbani.`,

    num: 75, title: "Szeged, Il Calore Che Sale Dal Basso", city: "Szeged", country: "Ungheria",
    lat: 46.253, lon: 20.1414, category: "energia",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0CzVTdPwU3PC6iQoGgpDp32xWKdm8BkHsQUTNbfaAMsVxBiGQSMa5QiiSdXrhJsxbl",
    text: `A Szeged il riscaldamento arriva da duemila metri di profondità. Ventisette pozzi geotermici, nove per l'estrazione e diciotto per la reiniezione, alimentano il sistema di teleriscaldamento di questa città ungherese di 162.000 abitanti, a ridosso del confine con Serbia e Romania. È il più grande intervento di conversione geotermica del teleriscaldamento mai realizzato in Europa. L'ultimo pozzo è entrato in funzione nel gennaio 2025. Sette anni di trivellazioni, adeguamenti, collaudi. Oggi il 98 per cento dei 27.256 appartamenti allacciati alla rete riceve calore geotermico. Ogni pozzo produttivo preleva circa 70 metri cubi d'acqua all'ora, a temperature tra i 90 e i 94 gradi. L'acqua cede il calore attraverso scambiatori nelle centrali termiche, poi viene reiniettata nell'acquifero originario. Non entra mai nei termosifoni. Non tocca gli impianti domestici. Chi abita nei condomini di Tarján, Sziler o Rókus non ha dovuto cambiare nulla. Tranne la bolletta, che è scesa già dal 2022. A gestire tutto è SZETAV, l'azienda municipale del teleriscaldamento. Centocinquattaquattro dipendenti, 215 chilometri di rete sotterranea, 433 edifici pubblici serviti. Fino al 2018 l'intero sistema si reggeva sul gas naturale importato. L'Ungheria importa quasi tutto il gas che consuma. SZETAV era il più grande emettitore di CO2 della città. Oggi 20 milioni di metri cubi di gas sono stati sostituiti da 607.000 gigajoule di energia geotermica. Le emissioni sono calate di 39.000 tonnellate di CO2 all'anno. La produzione energetica resta invariata. Cambia la sorgente. L'investimento complessivo sfiora i 70 milioni di euro. Di questi, 23 milioni sono arrivati dall'Unione Europea. SZETAV ha impegnato tra i 13 e i 15 milioni di euro in otto anni per adeguare le centrali preesistenti. La sola centrale di Rókus è costata 4,2 milioni, il 60 per cento coperto da fondi europei. Le caldaie a gas non sono state smantellate. Restano operative come riserva e coprono i picchi invernali. Il sistema è bivalente: geotermico in condizioni normali, gas nelle emergenze. Se un pozzo si ferma, la città non resta al gelo. È pragmatismo energetico. La prossima frontiera è il freddo. Il progetto Danube GeoHeCo, finanziato da Interreg, sta sperimentando nella sede di SZETAV il raffrescamento geotermico. L'acqua reiniettata nei pozzi esce dagli scambiatori a 40-50 gradi. È ancora troppo calda per l'acquifero, ma abbastanza fredda per alimentare un sistema di raffrescamento degli uffici. Se il primo approccio funziona, lo stesso impianto che d'inverno scalda la città d'estate potrebbe raffreddarla. Il completamento è previsto per l'aprile 2027. In parallelo, un progetto finanziato dal Fondo Svizzero installerà separatori di metano sui pozzi produttivi, per catturare il gas disciolto nell'acqua geotermica prima che venga rilasciato in atmosfera. Stessa scadenza, il 2027. Nel frattempo, in Gogol utca, una delle vie che collegano il centro storico al quartiere commerciale, il Comune ha avviato un intervento di tutt'altra natura. Le vecchie acacie giapponesi, malate e con radici che spaccavano i marciapiedi, sono state abbattute. Sotto la nuova pavimentazione in klinker sta nascendo una rete di blocchi drenanti e tubi collegati alle grondaie degli edifici adiacenti. Il principio è quello della città spugna. Cioè trattenere l'acqua piovana nel suolo, rilasciarla lentamente alle radici degli alberi nuovi, evitare che defluisca nei tombini. Il Comune ha investito 450 milioni di fiorini, poco più di un milione di euro, interamente a proprio carico. Se funzionerà, il modello sarà esteso ad altre strade del centro. Sotto i piedi dei residenti di Szeged lavorano dunque due infrastrutture invisibili. L'una scalda, l'altra trattiene. Due problemi diversi, lo stesso metodo: usare ciò che già esiste nel sottosuolo, adeguare ciò che è già costruito in superficie. Budapest ha avviato nel 2025 un progetto analogo nel distretto di Zugló.
Secondo le stime europee, oltre un quarto della popolazione dell'Unione vive in aree geologicamente adatte al teleriscaldamento geotermico. Non è una soluzione universale. Serve la combinazione di risorsa, rete preesistente e densità abitativa. Ma dove questi fattori coincidono, l'opzione è già realtà. A Szeged lo è da sette anni. Pozzo dopo pozzo, inverno dopo inverno.`,
    spunti: "La geotermia come alternativa su larga scala ai combustibili fossili; la conversione energetica delle reti di teleriscaldamento esistenti.",
    attivita: "Localizza Szeged vicino al confine tra Ungheria, Serbia e Romania. Cerca quanti pozzi geotermici servirebbero, in proporzione, per riscaldare la tua città usando gli stessi dati di Szeged.",
    summary: "A Szeged, città ungherese di 162.000 abitanti vicino al confine con Serbia e Romania, il riscaldamento arriva da duemila metri di profondità: ventisette pozzi geotermici alimentano la rete di teleriscaldamento cittadina, nel più grande intervento di conversione geotermica mai realizzato in Europa, completato dopo sette anni di lavori nel gennaio 2025."
