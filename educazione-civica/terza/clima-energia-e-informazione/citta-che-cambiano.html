  {
    num: 14, title: "Vienna, Reinventarsi Con Sobrietà", city: "Vienna", country: "Austria",
    lat: 48.2082, lon: 16.3738, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02CmbzRVczuFYdybXkH3oZy7VLCibr6AurK6nayWvJ3atjPn9yj9aVCmi68qBq5sW9l",
    text: `A una manciata di fermate di metro dal cuore monumentale di Vienna, là dove un tempo c’erano solo campi e una pista d’atterraggio militare dismessa, vent’anni fa una città ha cominciato a sorgere quasi dal nulla. Una città pensata fin dall’inizio per essere sostenibile, accessibile, silenziosa. Una città dove ogni edificio risparmia energia, ogni strada invita a camminare, ogni scuola sembra progettata non solo per accogliere, ma per far crescere. Si chiama Seestadt-Aspern. Oggi vi abitano più di diecimila persone, e il numero è in costante aumento. Ma il dato più sorprendente non è demografico: è l’atmosfera. Seestadt è calma senza essere noiosa, ordinata ma piena di vita. I bambini arrivano a scuola da soli, attraversando strade senza auto. Le scuole - progettate anche insieme a loro - offrono aule flessibili, materiali naturali, spazi verdi accessibili. Vienna arriva al progetto in punta di piedi: non si è costruito su terreno vergine, ma si è riconvertito un ex aeroporto militare, evitando ulteriore consumo di suolo. In un paese dove ogni giorno vengono urbanizzati in media oltre 15 ettari, la capitale austriaca resta tra le più virtuose: solo 0,1 ettari consumati al giorno. Un risultato che riflette una pianificazione precisa, orientata alla qualità piuttosto che alla quantità. Situata a est della città, nel distretto di Donaustadt, Seestadt si estende su 240 ettari - una superficie pari al centro storico - e ospita un lago artificiale, ampi spazi pubblici, edifici ad alta efficienza energetica e una metropolitana che collega il quartiere al centro in meno di 25 minuti. È una città- nella-città, progettata per accogliere 25.000 residenti e creare altrettanti posti di lavoro. Il 40 per cento delle abitazioni è riservato all’edilizia sociale o a prezzi calmierati, garantendo un mix equilibrato di popolazione. Il cuore di Seestadt non batte per le auto. La linea U2 della metropolitana, attiva sin dall’inizio del progetto, ha fornito l’asse principale di mobilità. Le piste ciclabili si estendono in tutte le direzioni, il car sharing è integrato nei cortili condominiali, e il centro del quartiere è pedonale. I parcheggi sono relegati ai margini, per lasciare spazio al verde, alle relazioni, alla sicurezza. L’energia è locale e rinnovabile: impianti fotovoltaici, pompe di calore geotermiche, teleriscaldamento a bassa temperatura. Alcuni edifici producono più energia di quanta ne consumino, mentre la gestione dell’acqua piovana - raccolta, filtrata e riutilizzata - si integra con tetti verdi, orti condominiali e corridoi ecologici che favoriscono biodiversità e benessere urbano. Ma è nella qualità della vita quotidiana che Seestadt sorprende. Gli spazi comuni sono progettati per essere realmente condivisi: cucine collettive, lavanderie aperte, giardini interni, aree gioco intergenerazionali. Il programma Grätzelmanagement coordina residenti, negozianti, cooperative e istituzioni nella gestione partecipata degli spazi. E la cultura del “vivere insieme” si riflette anche nei percorsi educativi, nei cortili scolastici che si aprono al quartiere, nei mercatini temporanei, nei festival civici. È un quartiere pensato esplicitamente per essere accogliente, equo e vivibile, soprattutto per chi troppo spesso resta invisibile: donne, bambini, anziani. Le scuole, i centri gioco, le biblioteche, i consultori sono stati collocati nel cuore del quartiere, accanto alle fermate dei mezzi pubblici, in modo che tutto fosse raggiungibile a piedi o in bicicletta. Ogni angolo è stato disegnato pensando a chi si muove con un passeggino, a chi ha bisogno di un luogo tranquillo per allattare, a chi accompagna i figli a scuola prima di andare al lavoro. Non è un caso: Vienna è stata pioniera in Europa nell’integrare l’urbanistica di genere nelle proprie politiche abitative. A Seestadt, questo approccio ha trovato una forma concreta e replicabile, grazie alla visione di Eva Kail, un'urbanista pioniera che ha plasmato la vita in questa zona di Vienna per tre decenni.
Vienna investe ogni anno circa 600 milioni di euro per l’edilizia pubblica, e la sua politica abitativa ha permesso di mantenere accessibile il costo medio della casa in città. L’impianto urbanistico segue il principio del “mix funzionale e sociale”. Ogni lotto ospita una varietà di tipologie abitative, servizi e attività. Una parte consistente degli appartamenti è destinata all’edilizia sovvenzionata, come da tradizione viennese. Le cooperative edilizie hanno svolto un ruolo fondamentale, garantendo qualità architettonica e inclusione sociale. Gli spazi comuni sono co-progettati dagli abitanti, spesso prima ancora che gli edifici vengano costruiti. In molti casi, i futuri inquilini hanno scelto insieme arredi, colori, modalità di gestione. Seestadt non è priva di critiche. Alcuni lamentano l’eccessiva standardizzazione di alcuni edifici, altri una certa lentezza nel riempire gli spazi commerciali. Ma nella maggior parte dei casi, la vita quotidiana racconta una storia diversa: di quartieri in cui i bambini possono andare da soli a scuola, di cortili animati anche la sera, di donne che non devono scegliere tra lavoro e cura perché la città le sostiene. Vienna è da anni in cima alle classifiche mondiali di vivibilità. E Seestadt ne incarna la formula: sobrietà, innovazione, accessibilità. Alcuni critici segnalano un certo rischio di uniformità architettonica, e la crescita del valore immobiliare ha fatto scattare il campanello d’allarme sulla possibilità di future pressioni speculative. Finora la strategia di governance ha mantenuto saldo l’equilibrio tra pubblico e privato, privilegiando la tutela dei cittadini.`,
    spunti: "Pianificazione di nuovi quartieri su aree dismesse; la crescita ordinata delle città rispetto all'espansione incontrollata.",
    attivita: "Cerca immagini satellitari di Seestadt Aspern prima e dopo la costruzione del quartiere. Calcola quanti abitanti in più può ospitare un'area riconvertita rispetto a una completamente nuova costruita ai margini della città.",
    summary: "Dove vent'anni fa c'erano solo campi e una vecchia pista militare, a poche fermate di metro dal centro di Vienna, è sorto un intero nuovo quartiere: un esempio di come pianificare una città quasi da zero, con sobrietà, invece di espandersi senza criterio."
  },

    num: 15, title: "Lisbona, L’Altra Sponda Del Futuro", city: "Lisbona", country: "Portogallo",
    lat: 38.7223, lon: -9.1393, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid023Y37iNm8LadngAoMxb8cAw8HDJ36wuGC2TFhJ7yC9V8uUrqwT9vUgAJmZZbK22sJl",
    text: `Tra il centro barocco e le colline della capitale portoghese, c’è una Lisbona meno conosciuta. Marvila è un quartiere industriale che si affaccia sul Tago, ai margini del centro, dove magazzini, depositi e officine abbandonate hanno lasciato il posto a librerie indipendenti, cantine urbane, gallerie d’arte, start-up. Qui la città non si è reinventata in superficie ma ha agito in profondità, seguendo un ritmo più lento, artigianale, in dialogo con il proprio passato. Fino a qualche anno fa, Marvila era un vuoto urbano. Gli spazi produttivi del Novecento – silos, hangar, centrali elettriche – erano rimasti sospesi nel tempo, isolati tra la ferrovia e il fiume. Proprio questo isolamento ha reso possibile un altro tipo di approccio urbanistico. A partire dal 2010, senza grandi proclami né investimenti eclatanti, il Comune di Lisbona ha promosso bandi mirati per il riuso temporaneo e progressivo degli edifici dismessi, favorendo la nascita di un ecosistema culturale e produttivo informale. Oggi chi cammina lungo la Rua Capitão Leitão o la Rua do Açúcar non trova vetrine turistiche, ma laboratori tipografici, studi di architettura, caffè-biblioteche e spazi espositivi dove la sperimentazione convive con la memoria operaia. Tra le esperienze più significative, il polo Beato Creative Hub, ospitato nell’ex Manifattura Militare, riunisce designer, artigiani digitali, innovatori sociali e imprese culturali in un’architettura sobria e funzionale. Lo studio Aires Mateus ha curato parte della riconversione, mantenendo le strutture originali e valorizzando la luce naturale. A pochi passi, l’ex deposito di birra Fábrica do Braço de Prata si è trasformato in un centro culturale indipendente, dove concerti, letture e cinema d’essai scandiscono la vita serale di un quartiere che non vuole essere vetrina. La vicinanza al fiume ha permesso anche il recupero di alcuni moli industriali, ora parte di un percorso pedonale e ciclabile che connette Marvila a Santa Apolónia e al Parque das Nações, ampliando il sistema di mobilità dolce della città. Tra un paio di anni Marvila sarà raggiunta da una nuova linea di tram – la 16E – in corso di progettazione, con un investimento previsto di 160 milioni di euro. Il tracciato collegherà il quartiere al centro storico e al resto della rete urbana, con una stima di circa otto milioni di passeggeri l’anno. Un’infrastruttura leggera, a basso impatto ambientale, pensata per accompagnare la crescita senza congestionare. Non è solo una questione estetica o infrastrutturale. Marvila è diventata un banco di prova per la rigenerazione partecipata. Il Comune, attraverso l’Agenzia di Riqualificazione Urbana e il programma BIP/ZIP, ha attivato decine di microprogetti co-gestiti da abitanti, associazioni e istituzioni. L’obiettivo è stato quello di includere anche le fasce più fragili del quartiere, spesso residenti nei complessi abitativi di edilizia pubblica della zona orientale. Gli orti comunitari, i corsi di formazione, i laboratori condivisi non sono iniziative simboliche, ma strumenti di vera inclusione urbana. Sul fronte ambientale, il piano di adattamento climatico della città ha previsto in quest’area l’introduzione di infrastrutture verdi e blu. Il quartiere, insieme al centro nazionale di ricerca LNEC, prova sul campo sistemi di drenaggio urbano sostenibile: soluzioni che permettono all’acqua piovana di filtrare, scorrere, evaporare senza sovraccaricare le reti fognarie. Alcune cooperative edilizie hanno introdotto modelli abitativi a impatto quasi nullo, con pannelli fotovoltaici, ventilazione passiva e recupero dell’acqua piovana. Nel cuore del quartiere, la Biblioteca de Marvila è diventata un simbolo di rinascita: edificio contemporaneo immerso in un parco urbano, centro civico, laboratorio educativo, spazio aperto a famiglie, studenti, anziani. È lì che si incontrano le diverse anime di Marvila, tra scaffali, coworking e sale lettura affacciate sul verde.
In una città che lotta contro la gentrificazione e la perdita di identità, Marvila è un’alternativa possibile. Non è diventata una Silicon Valley iberica, né una vetrina di archistar. È rimasta un quartiere ibrido, in transizione, dove cultura e prossimità si intrecciano, senza spettacolarizzazione. Una città sottile – che denota acutezza, finezza d’ingegno, come si legge nei dizionari – che lavora per addizione e non per sostituzione, valorizzando ogni traccia invece di cancellarla. Tuttavia, la pressione immobiliare crescente e i grandi capitali in arrivo pongono un rischio concreto: che la prossima fase della trasformazione tagli fuori proprio i residenti storici, aprendo la strada a una gentrificazione silenziosa. Se Lisbona saprà mantenere la rotta inclusiva, Marvila potrà continuare a essere un laboratorio urbano e umano di grande valore e un esempio - e una speranza - per altre città.`,
    spunti: "Riconversione di quartieri industriali dismessi; lo sviluppo urbano lungo i fiumi delle città europee.",
    attivita: "Localizza Marvila sulla mappa di Lisbona e il suo rapporto con il fiume Tago. Cerca tre esempi di quartieri industriali riconvertiti in Italia (es. ex fabbriche, docks, aree ferroviarie).",
    summary: "Marvila, quartiere industriale lisbonese affacciato sul fiume Tago, tra magazzini e officine abbandonate, sta diventando la nuova frontiera della città: un esempio di come le aree dismesse ai margini del centro possano trasformarsi in spazi vivi senza cancellare la propria storia."
  },
  {
    num: 16, title: "Arabianranta, La Città Sensibile", city: "Helsinki", country: "Finlandia",
    lat: 60.199, lon: 24.98, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0h43rzzPqNj1V9UPivbDpQbTGDVCTAMEMdoLG3sqcdMUyFkS661cmXPSKDMDRmBjul",
    text: `Alle porte di Helsinki, là dove il fiume Vantaa incontra la baia, un quartiere ha anticipato la fusione tra innovazione digitale ed evoluzione urbanistica. Arabianranta, costruito a partire dagli anni Duemila sulle ceneri della storica manifattura di porcellane Arabia, è stato uno dei primi esperimenti urbani d’Europa a integrare tecnologie digitali, sostenibilità ambientale e progettazione partecipata. Oggi, a oltre vent’anni dalla nascita, non è solo un quartiere che funziona. È un pezzo di città che ha plasmato il modo di pensare l’urbanistica finlandese contemporanea. Siamo a nord-est della capitale della Finlandia, in un’area un tempo segnata dal ritmo delle fornaci, dei magazzini e dei binari industriali. Dove si producevano stoviglie e ceramiche, oggi sorgono alloggi dotati di sistemi digitali integrati, laboratori, scuole, biblioteche e startup. La trasformazione non è stata improvvisa. È l’esito di un progetto urbano visionario che ha unito pubblico e privato, cultura e impresa, studenti e cittadini. Helsinki, con il pragmatismo che la contraddistingue, ha scelto di partire da qui per sperimentare un nuovo modello di socialità urbana. Arabianranta è un laboratorio vivente. Tutti gli edifici sono interconnessi da una rete in fibra ottica a banda larga fin dalla costruzione, e vent’anni fa era quasi impensabile. Le famiglie possono monitorare i consumi domestici in tempo reale, prenotare spazi pubblici digitalmente o partecipare a consultazioni civiche da casa. Già nei primi anni Duemila, le lavatrici segnalavano automaticamente i guasti, i frigoriferi suggerivano la spesa settimanale, e le scuole dialogavano con i genitori tramite piattaforme condivise. Una rete invisibile ma capillare ha reso la vita quotidiana più fluida, meno burocratica, più ingegnosa. Il progetto HVV – Helsinki Virtual Village – è stato uno dei primi in Europa a connettere architettura, arte pubblica e rete digitale in un’unica piattaforma urbana. Il quartiere non è solo un’infrastruttura tecnologica. Camminando tra i viali si incontra arte ovunque. Chi costruisce qui è obbligato a destinare tra l’1 e il 2 per cento del budget edilizio a opere d’arte urbana. Murales, installazioni, oggetti scultorei, progetti interattivi. Arabianranta è diventato un museo a cielo aperto che mescola forme e linguaggi, arte e cittadinanza. Alcune installazioni, persino sonore, si attivano in certi orari o stagioni, accompagnando i passanti. Una “città dell’arte” che non ha paura di osare. L’Università di Arte e Design di Helsinki – oggi parte dell’Aalto University – ha da subito partecipato alla progettazione, portando con sé studenti, artisti e ricercatori. Questo ha dato forma a un tessuto urbano vibrante, dove le residenze si affacciano su spazi verdi curati e accessibili, percorsi ciclabili si intrecciano con quelli pedonali e il tram numero 6, esteso fin dall’inizio, collega il quartiere al centro storico. Anche bambini e ragazzi sono stati coinvolti in laboratori di co- progettazione, contribuendo alla nascita di scuole e parchi a misura di tutte le età. L’Arabianranta di oggi conta circa diecimila abitanti. Il 20 per cento degli appartamenti è destinato all’edilizia sovvenzionata o convenzionata, per evitare che il quartiere si trasformi in una enclave per soli benestanti. Il Comune ha imposto una soglia mista di residenti, aziende e studenti per garantire una vita urbana equilibrata. I principi del “design for all” hanno guidato fin dall’inizio la pianificazione, rendendo accessibili gli spazi pubblici anche nella segnaletica, nell’arredo e nei servizi digitali. Sul fronte ambientale, il quartiere sfrutta il teleriscaldamento centralizzato alimentato da fonti rinnovabili e il sistema di raccolta pneumatica dei rifiuti, che elimina i cassonetti in strada e riduce i costi logistici e le emissioni. Circa l’80 per cento dei rifiuti viene riciclato; il resto è destinato alla termovalorizzazione. L’acqua piovana viene recuperata e filtrata in laghetti artificiali, mentre tetti verdi e superfici permeabili mitigano l’effetto isola di calore. Tra gli edifici simbolo, il centro culturale e commerciale Arabiakeskus sorge accanto all’ex fabbrica, ora sede di uffici, atelier e negozi. La facciata in mattoni, con la storica scritta ARABIA, è
diventata un’icona identitaria. Poco più in là, l’edificio Portal – già sede di Sonera, oggi di diverse aziende creative e ICT – testimonia il passaggio dalla produzione materiale a quella immateriale. Il modello funziona, anche se con qualche ombra. Alcuni cittadini denunciano un’eccessiva regolazione tecnologica, mentre le nuove costruzioni hanno progressivamente innalzato i prezzi. La gestione dei dati personali è sotto continuo monitoraggio, in un paese molto attento alla privacy. Tuttavia, Arabianranta resta un esempio raro di coerenza tra pianificazione e visione, in grado di tenere insieme estetica, inclusione e innovazione. A Helsinki si continua a guardare a questo quartiere come a una lezione permanente: su come si possa costruire una città evoluta senza perdere l’anima, né il senso del tempo.`,
    spunti: "Riconversione di aree industriali in quartieri residenziali; il ruolo della tecnologia nella progettazione urbana.",
    attivita: "Cerca la posizione di Arabianranta rispetto al centro di Helsinki e al Mar Baltico. Rifletti sul collegamento tra rigenerazione urbana e innovazione digitale: quali servizi digitali potrebbero rendere più vivibile un quartiere?",
    summary: "Alle porte di Helsinki, dove il fiume Vantaa incontra la baia, il quartiere di Arabianranta è nato sulle ceneri di un'area industriale dismessa, anticipando la fusione tra innovazione digitale e nuova urbanistica: un modello di rigenerazione che unisce tecnologia e spazio pubblico."
  },
  {
    num: 17, title: "Cluj-Napoca, Città Universitaria", city: "Cluj-Napoca", country: "Romania",
    lat: 46.7712, lon: 23.6236, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid032RGugCwiDoqoZxvJnp81HtBSDf7Yk8qXeHsU7RJMH6wy3PrtgtUokT2NzD8D2PVml",
    text: `Nel cuore della Transilvania, a metà strada tra Bucarest e Budapest, Cluj-Napoca è la seconda città della Romania, capitale non dichiarata di un nord-ovest che guarda all’Europa e investe su sé stesso. Crocevia di popoli e culture, ha intrecciato per secoli storie romene, ungheresi e tedesche, lasciando impronte plurilingue nella toponomastica, nell’architettura e nella memoria collettiva. Negli ultimi vent’anni Cluj ha vissuto una trasformazione paziente ma radicale, da centro universitario e industriale post-socialista a laboratorio urbano in cerca di equilibrio tra innovazione, sostenibilità e memoria. Al censimento del 2021 contava 286.598 abitanti, ma secondo le stime più recenti ha già superato i 308.000. L’area metropolitana, che comprende 19 comuni circostanti, sfiora i 425.000 residenti. La fascia d’età tra i 20 e i 39 anni è la più rappresentata, anche grazie ai 40.000 studenti iscritti all’Università Babeș-Bolyai, la più grande del Paese. Sommando le altre istituzioni accademiche, la popolazione studentesca supera gli 80.000: quasi un quarto degli abitanti. Un profilo giovane, istruito, in movimento. Qui si sperimenta un’urbanistica che non punta sulla spettacolarità, ma sulla cura del tessuto esistente. Cluj è una città universitaria in senso pieno. L’Università Babeș-Bolyai, nata nel 1959 da istituzioni con radici austro-ungariche, è un polo trilingue (romeno, ungherese, tedesco), con corsi in inglese e francese, 21 facoltà, un ecosistema che intreccia ricerca, cultura e sperimentazione civica. Intorno a essa gravitano l’Università Tecnica, quella di Medicina e Farmacia, e altri centri di formazione superiore. Questo flusso giovane e transnazionale cambia il ritmo della città. Ogni settembre la riapertura delle lezioni segna un nuovo ciclo: mercatini nei cortili, cineforum, concerti nei club sotterranei, mostre nei caffè. Gli spazi pubblici diventano campus diffusi, dove si studia all’aperto, si lavora in remoto, si sperimentano nuove forme di coabitazione urbana. La creatività si innesta sull’eredità mitteleuropea, generando uno stile culturale che guarda a Berlino, Vienna, Lione, ma resta legato alla realtà romena. Molte iniziative partono da studenti e giovani ricercatori: digitalizzazione degli archivi, orti condivisi, progetti sull’economia circolare, inclusione linguistica. Festival come Jazz in the Park, il TIFF – Transilvania International Film Festival e le Zilele Culturale Maghiare nascono da questo humus. La dimensione universitaria qui è leva di cittadinanza attiva. Simbolo concreto di questo approccio è Someș Delivery, iniziativa civica nata nel 2015 per riconnettere la città al fiume Someșul Mic. Le sue rive, a lungo considerate un margine, sono diventate un asse continuo di spazi pubblici: passerelle, piste ciclabili, piattaforme in legno, parchi lineari. Non un grande cantiere, ma una sequenza di interventi modulari co-progettati con architetti, cittadini, scuole, artigiani. Alcuni tratti, come il parco tra Grigorescu e Parcul Rozelor, sono già punto di riferimento per la vita quotidiana. Altri stanno per essere completati, con fondi pubblici e sostegno dell’Unione Europea. Non è un progetto isolato. Il Comune ha incluso la riqualificazione del fiume nel piano urbanistico generale e ha creato nel 2017 il Centrul de Inovare și Imaginație Civică, un’agenzia pubblica che coordina le attività di rigenerazione urbana con un modello trasparente, partecipato e multilingue. I bandi prevedono budget progressivi, vincoli paesaggistici e clausole sociali. Ogni anno si apre un ciclo di ascolto nei quartieri, con passeggiate esplorative e prototipi temporanei che anticipano i cambiamenti. La sostenibilità a Cluj non è uno slogan, ma una trama di azioni. Oltre alle rive del fiume, sono stati riconvertiti tratti ferroviari dismessi in corridoi ecologici, attivata una rete ciclabile integrata e investito in tram e filobus di nuova generazione. Il verde e l’acqua sono parte del disegno urbano,
con attenzione ai flussi idrici e alle isole di calore. Il Parco Est, aperto nel 2022 dopo anni di attese, è un altro tassello essenziale: 45 ettari di natura recuperata, aree umide, percorsi pedonali, spazi educativi, realizzati grazie a un concorso vinto dallo studio romeno Practica. Anche il centro storico si rigenera silenziosamente. La pedonalizzazione di piazza Unirii, la riapertura dell’ex cinema ARTA, i cantieri sulla cittadella medievale seguono una logica di riappropriazione progressiva degli spazi urbani. Le scritte trilingui (romeno, ungherese, tedesco) sono ormai parte stabile della segnaletica pubblica, memoria di una città plurale. Cluj-Napoca ha saputo intercettare fondi europei con il programma Urban Innovative Actions e si è candidata alla rete NetZero Cities per la neutralità climatica. Tra le azioni concrete si segnalano tetti verdi sperimentali su nuovi edifici scolastici, giardini didattici, orti urbani in collaborazione con cooperative locali. Il percorso, però, non è privo di tensioni. Il boom immobiliare ha alzato i prezzi, aumentando il rischio di esclusione. Il centro si gentrifica, i quartieri crescono ai margini, talvolta in modo disordinato. Ma Cluj mostra di avere anticorpi civici e istituzionali. Il piano di sviluppo 2021–2030, discusso con centinaia di stakeholder, punta sulla densificazione, sul riuso, sull’accessibilità, più che sull’espansione. Cluj non si propone come modello ma è una città che impara e si trasforma. Il fiume che per decenni ha segnato una separazione oggi si fa cucitura. Una città sottile, che lavora per stratificazioni leggere e consapevoli, in dialogo con il proprio passato, il paesaggio, i suoi abitanti e i suoi studenti – forse la sua risorsa più preziosa.`,
    spunti: "Città universitarie come motore di sviluppo regionale; la posizione geografica della Transilvania tra Europa centrale e orientale.",
    attivita: "Individua Cluj-Napoca sulla carta della Romania e della Transilvania: quali sono le città più vicine in altri Paesi? Cerca quanti studenti universitari ha la città e confrontali con quelli della tua città o regione.",
    summary: "Seconda città della Romania, nel cuore della Transilvania a metà strada tra Bucarest e Budapest, Cluj-Napoca si è affermata come capitale non dichiarata di un nord-ovest che guarda all'Europa e investe su di sé, grazie anche alla sua grande popolazione universitaria."

  {
    num: 18, title: "Bilbao, Diritto Alla Mobilità", city: "Bilbao", country: "Spagna",
    lat: 43.263, lon: -2.935, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0XgBcdhpC6MK47BH2hy11PTQWsjrmgEXrhtYbx2wDmG5QatyrFQhhKpQ3Lp6cPq7Kl",
    text: `Per chi arriva in città dal capolinea dell’aeroporto, la prima cosa che colpisce è il silenzio. Il bus elettrico della linea A3247 entra nel centro di Bilbao senza rumore, senza strappi, senza clamore. Scende nel tunnel, rallenta, si ferma ordinatamente a due passi dalla stazione di Abando. Da qui tutto è a portata di passo: la metropolitana progettata da Norman Foster con i suoi accessi trasparenti, le linee di superficie, i tram, le scale mobili che collegano la parte alta della città, i parcheggi interrati, i marciapiedi larghi, le piste ciclabili. Non serve alzare la voce, né correre. Il trasporto pubblico è puntuale, frequente, continuo. Funziona. E tiene insieme l’intera struttura urbana. Bilbao non è una città di grandi estensioni. Con circa 345.000 abitanti nel comune e oltre un milione nell’area metropolitana, è il principale centro urbano dei Paesi Baschi. Eppure il suo sistema di trasporti è da metropoli evoluta. Il metro leggero, inaugurato nel 1995, si articola oggi in tre linee, gestite da Metro Bilbao: coprono oltre 50 chilometri e servono quasi 50 milioni di passeggeri all’anno. I treni sono lunghi, capienti, frequenti. Le stazioni, luminose e pulite, sono tutte accessibili. Il biglietto si può caricare sulla Barik, la tessera unica dei trasporti pubblici di tutta la Biscaglia: vale anche su autobus, tram, funicolari, treni e perfino sul metro marino. Già, perché lungo l’estuario del Nervión navigano i battelli della linea fluviale: collegano il centro di Bilbao con Getxo e il Ponte di Vizcaya, patrimonio Unesco. È un servizio regolare, giornaliero, pensato non solo per i turisti. Sul lato terra, invece, corre il tram EuskoTran, una linea leggera e silenziosa che attraversa il centro, toccando il Guggenheim, il Palazzo Euskalduna, l’Università di Deusto, i ponti storici e quelli contemporanei. È gestita da Euskotren, l’impresa ferroviaria pubblica del governo basco, che opera anche le linee suburbane e quelle verso San Sebastián. Il piano urbanistico della città si è modellato proprio attorno a queste direttrici. La trasformazione urbanistica di Bilbao, già compiuta, si fonda su una logica di continuità e cucitura degli spazi, più che su gesti eclatanti. L’area portuale dismessa lungo la Ría del Nervión è stata riconvertita in un sistema urbano articolato, che comprende residenze, uffici, spazi culturali e collegamenti ciclabili e pedonali. È il caso di Abandoibarra, dove sorgono il Guggenheim, la biblioteca dell’Università di Deusto, il parco lineare e il Palazzo Euskalduna: un asse continuo, che ha già cambiato la morfologia urbana della città. Il quartiere di San Francisco, un tempo marginale, è oggi oggetto di una rigenerazione già consolidata, con nuove pavimentazioni, illuminazione pubblica e servizi locali riattivati grazie all’intervento dell’agenzia municipale Surbisa. La stazione di Abando è già in fase di ristrutturazione funzionale e urbana, con una nuova copertura verde, collegamenti verticali e apertura verso il fiume. Il ponte pedonale Zubizuri, firmato da Santiago Calatrava, è ormai parte integrante del tessuto urbano, non solo come architettura iconica, ma come connettore tra rive e percorsi. Allo stesso modo, il sistema del tram EuskoTran corre su binari erbosi lungo la riva, integrandosi con parchi lineari, spazi pubblici e nuove centralità urbane. Tutti gli interventi sono già inseriti in un disegno di mobilità dolce, con zone 30 realmente in vigore in tutto il centro urbano, rete ciclabile funzionante e piena accessibilità pedonale. La presenza di parcheggi interrati, anche sotto le nuove piazze (come Plaza Euskadi), ha consentito la pedonalizzazione in superficie senza creare congestioni. Molto prima che si cominciasse a parlare di MaaS, Bilbao aveva già costruito un’integrazione effettiva fra i vari mezzi. La mobilità come servizio è già realtà: non c’è bisogno di app all’avanguardia, ma di una regia pubblica che garantisca efficienza e semplicità. ATB (l’Autorità del Trasporto di Bilbao) coordina l’intero sistema, pianifica, investe e controlla. E la cittadinanza
risponde: secondo i dati aggiornati, oltre il 60 per cento degli spostamenti avviene con mezzi pubblici, a piedi o in bicicletta. L’auto privata è minoritaria e non penalizzata, ma ordinata, regolata, spinta a non occupare spazio. Questa armonia tra mezzi pubblici e assetto urbano è il frutto di una visione lunga. Dopo la crisi industriale degli anni Ottanta e Novanta, la città ha scelto di non estendersi, ma di rigenerare. Non di costruire infrastrutture monumentali, ma di usare ogni metro quadro in modo coerente. Il diritto alla mobilità, qui, si esercita senza proclami. Basta salire su un tram. O attraversare un ponte.`,
    spunti: "Mobilità elettrica e qualità dell'aria urbana; il trasporto pubblico come diritto di cittadinanza.",
    attivita: "Cerca la distanza tra l'aeroporto di Bilbao e il centro città. Confronta il trasporto pubblico dall'aeroporto della tua città (se c'è) con quello di Bilbao: tempi, costi, mezzi disponibili.",
    summary: "A Bilbao un autobus elettrico entra in città senza rumore, senza strappi, senza clamore: un piccolo dettaglio che racconta una scelta più grande, quella di garantire un diritto alla mobilità silenzioso ed efficiente a chi arriva in città, a partire da chi viene dall'aeroporto."
  },
  {
    num: 19, title: "Zurigo Si Muove A Tempo", city: "Zurigo", country: "Svizzera",
    lat: 47.3769, lon: 8.5417, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0GnzCwpPYG4zt6hKtd1DtF4xxMLEeEdowMKXhsvgCTsvSMqpznwRdEE4iXTfkSLj9l",
    text: `A Zurigo, il tempo non si misura in minuti d’attesa, ma in frequenze. Sei sul binario e il tram arriva. Sali, scendi, cambi linea, continui a piedi, prendi un battello o una funicolare. Tutto è già lì, già previsto. Non ci sono annunci, non c’è ansia. La mobilità è uno sfondo costante, affidabile, silenzioso. Un diritto che si esercita con naturalezza, senza gesti speciali. Il sistema di trasporto pubblico zurighese è uno dei più capillari e integrati d’Europa. Ogni giorno, in un’area metropolitana di circa 1,5 milioni di abitanti, si compiono quasi due milioni di spostamenti con i mezzi pubblici. La rete ZVV – Zürcher Verkehrsverbund – collega tram, autobus, treni suburbani (S-Bahn), battelli, funicolari e ferrovie di montagna in un unico schema orario cadenzato, con integrazione tariffaria completa e frequenze altissime. Durante le ore di punta, i tram passano ogni 5–7 minuti sulle linee principali, gli autobus ogni 10–15, la S-Bahn ogni 15 da tutte le direzioni. Non serve consultare un orario: si arriva e si parte. Ma la rete non è solo un’infrastruttura tecnica. È un progetto urbano. Dal 2004 al 2024, la città ha investito oltre 7 miliardi di franchi svizzeri – circa 7,14 miliardi di euro – in estensioni di rete, nuove linee della S-Bahn, stazioni intermodali, percorsi pedonali e piste ciclabili. I nodi principali – come Stadelhofen, Hardplatz o la stazione centrale – sono diventati snodi urbani complessi, dove convergono tram, treni, bus, biciclette e flussi pedonali. Ogni punto è pensato come una porta di accesso al territorio. Zurigo ha scelto di non costruire una metropolitana classica, puntando invece su una S-Bahn ad alta frequenza, che unisce il centro alla cintura urbana in meno di 20 minuti. Le gallerie come quella del Weinberg Tunnel, aperta nel 2014, hanno permesso di quadruplicare i passaggi dei treni e decongestionare la stazione centrale, oggi usata da oltre 400.000 persone al giorno. Anche gli spazi pubblici sopra e attorno alle stazioni sono stati rigenerati: piazze, parchi, percorsi ciclopedonali. La mobilità non è mai separata dall’urbanistica. Intorno alla stazione centrale è nato uno dei progetti più simbolici della nuova Zurigo, Europaallee. Un intero quartiere costruito su ex binari, oggi popolato da uffici pubblici, alloggi per studenti, una scuola superiore, residenze, caffè, piazze e marciapiedi ampi. Tutto accessibile, tutto affacciato sulla rete dei trasporti. Non c’è barriera tra ferrovia e città, solo continuità spaziale. Gli spazi verdi si alternano a servizi pubblici e luoghi di socialità. In pochi metri convivono mobilità, cultura e vita quotidiana. Nella zona ovest, un tempo industriale, il quartiere Zürich-West è diventato un laboratorio di rigenerazione. Ex magazzini, centrali elettriche e capannoni si sono trasformati in spazi culturali, housing sociale, ristorazione e coworking. La linea di tram 4 attraversa l’intero quartiere, e i percorsi pedonali sono punteggiati da opere d’arte pubblica, giardini temporanei, piazze flessibili. Qui, mobilità e trasformazione urbana vanno di pari passo: senza grandi eventi, ma con continuità amministrativa e regole trasparenti. Alcuni edifici recuperano energia attraverso sistemi geotermici, mentre i nuovi interventi seguono criteri NZEB – Nearly Zero Energy Buildings. Il verde pubblico è una presenza costante, non decorativa ma funzionale, progettata per il comfort termico e la permeabilità dei suoli. Nel centro città i tram sono la spina dorsale. Le 15 linee urbane si diramano come un sistema nervoso elettrico, silenzioso, puntuale. I veicoli sono bassi, accessibili, larghi. Le fermate sono tutte dotate di pannelli informativi in tempo reale, percorsi tattili per ipovedenti, rampe o marciapiedi ribassati.
Anche le linee di bus notturni – le Nachtlinien – coprono la città fino alle tre del mattino nei fine settimana. Nei quartieri collinari entrano in funzione le funicolari, come la storica Polybahn, attiva dal 1889, che collega la Limmatquai al Politecnico, con corse ogni tre minuti in orario di lezione. Ma la rete è anche orizzontale e acquatica. Sul lago operano battelli urbani in servizio regolare, utilizzati da pendolari e studenti. Ci sono pontili con orari e biglietti integrati, proprio come una fermata del tram. In alcune zone, come Waid o Rigiblick, ci sono ascensori urbani gratuiti che collegano strade a diversa quota. Piccoli dettagli, ma rivelatori di una città che considera l’accessibilità parte del paesaggio quotidiano. Il risultato è evidente: oltre il 41 per cento degli spostamenti urbani avviene con mezzi pubblici, il 30 per cento a piedi, il 9 per cento in bicicletta. L’auto privata è sotto il 20 per cento. Una mobilità non solo efficace, ma democratica, usata da ogni fascia sociale, comprese persone anziane, famiglie, lavoratori pendolari, studenti. I biglietti sono scalabili per zona, tempo e target: esistono tariffe giornaliere, settimanali, mensili, annuali. Gli abbonamenti combinati con le Ferrovie Federali consentono di viaggiare in tutta la Svizzera con un’unica carta. I parcheggi interrati sono integrati nei Mobility Hub, strutture che combinano auto, cargo-bike, colonnine di ricarica e deposito bici. Il piano comunale 2040 prevede la progressiva eliminazione dei parcheggi in superficie nelle zone centrali, sostituiti da isole verdi e nodi intermodali. La rete di ciclabili, finora meno estesa rispetto ad Amsterdam o Copenaghen, è in espansione. Il progetto “Velostrategie Zürich 2030” prevede quasi 200 chilometri di nuove corsie protette entro i prossimi cinque anni. Le scuole, i centri sanitari, i servizi sociali e le strutture culturali sono tutti raggiungibili con i mezzi pubblici. La pianificazione urbana si è orientata verso la prossimità, riducendo le distanze funzionali. Tutto funziona perché tutto è collegato. Anche l’informazione è parte della rete. L’app ZVV, così come il sistema nazionale di pianificazione Swiss Travel System, consente di pianificare ogni spostamento, acquistare biglietti, calcolare tempi e coincidenze in tempo reale, con aggiornamenti anche per persone ipoudenti o con disabilità cognitive. Muoversi a Zurigo non è solo un atto pratico. È un’esperienza culturale, una manifestazione quotidiana di ordine, attenzione, investimento pubblico. Le tecnologie sono invisibili, il servizio è presente, la città risponde. Anche il tempo a Zurigo è una forma di infrastruttura.`,
    spunti: "Sistemi di trasporto pubblico integrato; la pianificazione della mobilità su scala urbana e regionale.",
    attivita: "Cerca l'orario dei mezzi pubblici della tua città e valuta se esiste un sistema a 'frequenza garantita' come a Zurigo. Prova a disegnare una mappa semplificata delle linee di trasporto integrato di un quartiere a scelta.",
    summary: "A Zurigo il tempo non si misura in minuti d'attesa ma in frequenze: si sale sul tram, si cambia linea, si prosegue a piedi o in battello, e tutto è già previsto in un sistema di trasporto pubblico integrato che rende superflua la pianificazione individuale degli spostamenti."
  },
  {
    num: 20, title: "Lubiana Si Prende Cura Di Sé", city: "Lubiana", country: "Slovenia",
    lat: 46.0569, lon: 14.5058, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02cLayZ3zuTwivfMGqFrTwnb8H9yM85Qfao7bgcwXT5kKPQxDHLwzHUZcRK2tCdFLgl",
    text: `Ci sono città che crescono consumando e città che crescono curando. Lubiana, capitale della Slovenia, appartiene alla seconda specie. Ha costruito un modello urbano che rigenera anziché espandere, include anziché isolare. La Tobačna, ex fabbrica di tabacchi, è oggi il simbolo di una metamorfosi concreta, dove si intrecciano innovazione, arte, clima, memoria e comunità. Per decenni, la Tobačna è stata sinonimo di lavoro e stabilità. Migliaia di persone, soprattutto donne, confezionavano sigarette tra binari, capannoni e uffici. Quando la produzione si è fermata nei primi anni Duemila, su quei cortili è calato il silenzio. Ma Lubiana ha deciso di restituire loro una nuova funzione. Il primo segnale è arrivato dal basso. L’Accademia di Belle Arti ha aperto laboratori nei padiglioni in disuso, piccoli collettivi teatrali hanno trovato spazi per prove e spettacoli. Da quel fermento è nato Second Chance, progetto del Comune con fondi europei per riattivare un luogo sopito. Corridoi occupati, eventi informali, dibattiti, la fabbrica ha ripreso a pulsare. Oggi la Tobačna è uno spazio urbano aperto. Il cuore pulsante è il Center Rog, inaugurato nel 2021, con laboratori artigianali, coworking, una biblioteca pubblica, giardini condivisi e un parco urbano. Meta Štular, fondatrice di RogLab, lo definisce un’officina viva, dove stampanti 3D e tessuti sostenibili convivono con artigiani e iniziative sociali. Non una vetrina, ma un’esperienza. Secondo i dati ufficiali, Center Rog attrae migliaia di persone ogni anno. Luka Piškorič, ideatore del coworking Poligon, ha ricordato l’impatto del pubblico: graffiti originali, stampanti 3D e una biblioteca, in un contrasto vivo tra storia e futuro. Il masterplan, firmato dallo studio Scapelab, avanza per fasi. I dormitori ottocenteschi sono diventati residenza studentesca a impatto zero, con legno, vetro e impianti geotermici. La vecchia caldaia industriale è oggi nodo del teleriscaldamento da fonti rinnovabili. Geotermia, tetti verdi, raccolta dell’acqua piovana e pannelli solari riducono i consumi e migliorano la qualità ambientale. Tobačna è parte della strategia Ljubljana Circular City 2045, un piano urbano che ha coinvolto oltre cento soggetti pubblici e privati. Gli edifici rigenerati garantiscono un taglio dei consumi fino al 60 per cento rispetto a uno standard passivo. Complessivamente sono stati riconvertiti 30.000 metri quadrati, di cui circa il 40 per cento destinati a spazi sociali o culturali. La stessa filosofia ha ispirato altre trasformazioni in città. Diciassette ettari di parcheggi in centro sono stati convertiti in aree pedonali. La rete degli autobus LPP collega ogni angolo con corse frequenti utilizzando una flotta in parte a gas naturale e in parte ibrida. Sono in sperimentazione anche navette elettriche autonome nel centro storico. Il sistema BicikeLj, con 830 biciclette condivise e 83 stazioni attive, si integra con 310 piste ciclabili. L’intermodalità è facilitata dalla smart card Urbana, che consente di accedere a mezzi pubblici, bike sharing e servizi civici. Le tariffe restano contenute: meno di 30 euro al mese, gratuito per studenti, pensionati e disoccupati. Oltre il 40 per cento degli spostamenti avviene senza auto. Anche nella gestione dei rifiuti Lubiana è pioniera. Prima capitale dell’UE a formalizzare l’obiettivo zero waste, ha una raccolta differenziata porta a porta e un sistema di tracciamento. I rifiuti organici diventano compost e biogas, mentre il residuo secco alimenta l’impianto pubblico di termovalorizzazione RCERO. Il tasso di raccolta ha superato il 70 per cento nel 2023. Il piano municipale punta a ridurre i rifiuti con riuso, mercati dell’usato e laboratori di riparazione nei quartieri. Lubiana è anche tra le capitali europee con la maggiore dotazione di verde urbano pro capite. Secondo i dati ufficiali, ogni abitante dispone di circa 542–560 metri quadrati di verde, tra parchi,
boschi e spazi naturali, che coprono il 46–75 per cento del territorio comunale. Una cifra impressionante, se si considera che la città conta poco meno di 300.000 residenti. Elemento chiave è stata la partecipazione. IPOP – Inštitut za politike prostora – ha facilitato il dialogo tra istituzioni, studenti, artigiani e associazioni. Se l’architettura si vede nelle forme, l’anima si costruisce con chi vive quei luoghi. Feste di cortile, concerti, cinema all’aperto, formazione e cultura diffusa. Tobačna oggi respira una consapevolezza collettiva frutto di un processo lento e condiviso. Non tutto è risolto. Poligon ha chiuso nel 2019. Alcune comunità segnalano il rischio che la rigenerazione attiri speculatori e restringa gli spazi liberi. Anche il piano Ljubljana Circular City riconosce la sfida: rendere la città più verde e tecnologica, ma anche più accessibile. È un equilibrio delicato, che Lubiana cerca di governare con scelte silenziose ma incisive.`,
    spunti: "Modelli di crescita urbana sostenibile; rigenerazione contro consumo di suolo nelle capitali europee.",
    attivita: "Localizza Lubiana sulla carta della Slovenia e cerca la sua posizione rispetto alle Alpi e ai Balcani. Confronta la crescita demografica di Lubiana con quella di una città italiana simile per dimensioni.",
    summary: "Ci sono città che crescono consumando territorio e città che crescono curando quello che hanno: Lubiana, capitale della Slovenia, appartiene alla seconda categoria, con un modello urbano che rigenera invece di espandersi e include invece di isolare."
  },
  {
    num: 21, title: "Barcellona E I Suoi 360 Rifugi Climatici", city: "Barcellona", country: "Spagna",
    lat: 41.3874, lon: 2.1686, category: "calore",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid028eynzfXSR21GABtAubvDN9vB4BdtiaXpwEGQRruqgqrfqBB6CYanM5vqViVx6WxRl",
    text: `Le previsioni lo avevano detto: il termometro salirà ben oltre le medie estive. Per Maria, però, la temperatura reale è un numero da ignorare. Non perché non ne senta il peso. La pelle brucia anche sotto la camicetta leggera, le gambe si muovono lente, la schiena suda appena esce di casa. Ma da qualche anno a questa parte, a Barcellona, anche le giornate più roventi si possono attraversare senza paura. Basta sapere dove camminare, dove fermarsi, dove respirare. La signora Maria ha settantacinque anni e vive nel quartiere di Sant Antoni da quando era bambina. Ha visto sparire i vecchi autobus a gasolio, ha salutato il mercato restaurato, ha sopportato la lunga cantierizzazione del superbloc. Oggi ringrazia quei disagi. Cammina piano lungo la via pacificata. Niente auto, solo biciclette e passeggini. La strada è diventata una piazza lineare, con sedute in legno, giochi d’acqua, platani giovani che già offrono ombra. Sotto le suole, l’asfalto è stato sostituito da superfici drenanti chiare, che riflettono il sole. È ancora caldo, sì, ma meno insopportabile. Lo dicono anche i dati. In questi tratti la temperatura percepita può scendere di oltre un grado e la qualità dell’aria è migliorata del venti per cento. Cifre dell’Agenzia europea per l’ambiente, non di un volantino elettorale. La prima tappa della mattina è la biblioteca Sant Antoni – uno dei 360 rifugi climatici attivati dal Comune. Non ha l’aria condizionata a palla, non è un bunker termico. È semplicemente un luogo pensato anche per chi ha più bisogno: sedute comode, ventilazione incrociata, luci naturali, silenzio. Maria sfoglia il giornale, osserva gli altri. Sono giovani in cerca di connessione, studenti, bambini con i nonni, pensionati che attendono il fresco come si aspetta il pane. È un luogo pubblico, gratuito, accessibile. Ed è anche una rete. In caso di allerta rossa, le biblioteche, i centri civici, le scuole aperte d’estate diventano presìdi. Le autorità sanitarie locali identificano le persone più a rischio – anziani soli, pazienti cronici – e attivano visite domiciliari, distribuzione di ventilatori, piccoli accompagnamenti. Non è assistenza eroica, è cura quotidiana. Nel 2024, l’elenco ufficiale dei refugis climàtics contava 315 strutture, oggi sono 360. Sono distribuiti su tutti i dieci distretti della città, con maggiore densità nei quartieri ad alta vulnerabilità climatica e sociale: Nou Barris, Sant Martí, Sants-Montjuïc, Sant Andreu. Il sito ufficiale del Comune fornisce una mappa navigabile, aggiornata in tempo reale, con filtri per categoria e accessibilità. Alcuni esempi? La biblioteca Jaume Fuster a Gràcia, il centro civico Can Basté a Nou Barris, la piscina Sant Jordi a Eixample, il parco Joan Miró nelle ore fresche. Il piano municipale prevede che ogni cittadino possa raggiungere un rifugio in meno di dieci minuti a piedi. Attualmente, l’89 per cento degli abitanti è coperto da questa rete. E gli abitanti registrati a Barcellona sono 1,6 milioni. A sostenere questo sistema c’è anche una rete di trasporto pubblico capillare e climatizzata. La metropolitana di Barcellona – con le sue 8 linee, quasi tutte sotterranee – consente di raggiungere in pochi minuti quasi ogni angolo della città. I convogli sono dotati di ventilazione controllata, e tutte le stazioni più frequentate sono ora attrezzate con aree ombreggiate all’esterno. Anche i 1.100 autobus della flotta TMB sono climatizzati, a bassa emissione e progressivamente elettrificati. Maria non guida più da anni, ma non ne sente la mancanza: ha diritto alla gratuità, e si muove combinando bus e metro senza affanni. In caso di ondate di calore, i canali ufficiali (app, sms, radio) consigliano le linee meno congestionate, segnalano i centri di refrigerio raggiungibili con il minor sforzo. Quando Maria esce dalla biblioteca il sole è già alto. Ma la mappa mentale che ha costruito negli ultimi anni la guida lungo un percorso intelligente: marciapiedi alberati, cortili scolastici trasformati
in oasi urbane, una fontanella appena restaurata. Sa dove fermarsi per riempire la borraccia, dove sedersi all’ombra, dove incrociare qualcuno che conosce. Non è una città più facile, è una città più gentile. E soprattutto più consapevole. A Barcellona, il rischio climatico è stato affrontato con serietà, dopo le ondate di calore che hanno ucciso centinaia di persone. Nel 2022, la città ha registrato oltre trecento decessi legati al caldo estremo. Due terzi erano anziani. Da allora, l’adattamento non è più stato un capitolo accessorio. È diventato un asse della politica urbana. Anche il mare è diventato parte di questa strategia. Barcellona ha attrezzato sei spiagge urbane con passerelle in legno, docce accessibili, punti di refrigerio e ombrelloni gratuiti per gli over 65. Maria ogni tanto prende la L4 e scende a Nova Icària: lì trova una pergola ventilata, sedute comode, e persino una piccola biblioteca estiva. Alla Barceloneta, da quest’anno, c’è uno spogliatoio inclusivo con doccia fresca e assistenza per il bagno in mare. Sono piccoli dettagli, ma in giornate così calde fanno la differenza tra restare chiusi in casa o vivere la città. L’Ufficio del Clima ha integrato gli interventi urbani nel piano “Barcelona pel Clima” e nel Piano d’azione per l’Equità climatica. La città è stata suddivisa in celle di rischio, combinate con indicatori sociali (età, reddito, densità) e ambientali (isole di calore, inquinamento, copertura arborea). Ogni nuova area pedonalizzata o verde viene valutata in funzione del beneficio che produce sugli abitanti più vulnerabili. Gli esperti parlano di green equity index, ma Maria non conosce questi termini. Sa però che ora può camminare più a lungo senza sentirsi male. Il pomeriggio Maria lo trascorre al Casal de Gent Gran, il centro per anziani del quartiere. Non è un ricovero, non è un ghetto dorato per vecchi. È un luogo vivo. Si gioca a carte, si fanno laboratori di cucina, si discute di come rendere ancora più sicura la zona durante l’estate. Qui, ogni mese, arriva qualcuno del Comune o del distretto sanitario per aggiornare, ascoltare, correggere. Non si decide nulla senza consultare chi vive davvero queste strade. Anche questo fa parte dell’equità climatica: progettare con, non solo per. Alle sei di sera, la temperatura supera ancora i trentotto gradi. Ma la luce è meno feroce, e Maria si concede un giro nel superblocco. Osserva i bambini che giocano sotto i nebulizzatori, le madri che si scambiano notizie sui corsi estivi, i cani che cercano l’ombra. Lei si siede sulla sua panchina preferita, accanto a una fioriera piena di lavanda. Respira. E pensa a com’era, solo dieci anni fa. Le auto in fila, i clacson, il caldo intrappolato nell’asfalto. Ora, la temperatura dell’aria è scesa di un altro mezzo grado, secondo le stime dell’Università Autonoma di Barcellona. Ma ciò che conta non è la cifra: è la possibilità concreta di star bene, anche d’estate, anche da anziani. Non c’è retorica in questa trasformazione. Solo una buona amministrazione, un uso intelligente dei dati, un’alleanza tra urbanistica, sanità e partecipazione. I tecnici parlano di “DALYs evitati” – acronimo di Disability-Adjusted Life Years – un indicatore che misura quanti anni di vita in buona salute vengono salvati grazie a un intervento. Significa non solo morire più tardi, ma vivere meglio: meno ricoveri per colpi di calore, meno aggravamenti di patologie respiratorie, meno solitudini amplificate dalla paura. È il modo con cui la salute pubblica quantifica il successo di una città che protegge i più fragili. Maria, invece, parla poco. Ma mentre rientra a casa, con il passo stanco ma sereno, sa che la sua città ha fatto qualcosa di giusto. Non ha costruito cattedrali climatiche o piazze-spettacolo. Ha solo capito che la prima linea della crisi climatica passa per le vite più fragili. E che proteggerle è il miglior investimento per tutti.`,
    spunti: "Diseguaglianze sociali di fronte al caldo estremo; le politiche pubbliche di adattamento climatico nelle grandi città.",
    attivita: "Cerca sulla mappa di Barcellona dove si trovano alcuni dei 360 rifugi climatici (parchi, biblioteche, musei). Rifletti su quali edifici della tua città potrebbero diventare rifugi climatici in caso di ondate di calore.",
    summary: "Quando il termometro sale ben oltre le medie estive, a Barcellona non serve andare lontano per trovare sollievo: la città ha costruito una rete di 360 rifugi climatici, spazi pubblici climatizzati o ombreggiati pensati per chi non può permettersi di restare a casa con l'aria condizionata."
  },
  {
    num: 22, title: "Karlsruhe, Città Senza “Rotture”", city: "Karlsruhe", country: "Germania",
    lat: 49.0069, lon: 8.4037, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02MAgTjPjqS3VZ4xZiVaFM1nTyboRRUHNzCyZhTWET3fQv3bzMXgKtynKearyuWt26l",
    text: `Negli anni Settanta gli emigrati italiani la chiamavano “Calzarola”. Il nome tedesco era difficile da pronunciare, ma bastava quella storpiatura bonaria per evocare una città concreta, ordinata, con tante possibilità di lavoro e una qualità urbana già superiore alla media. Oggi Karlsruhe ha quasi 310.000 abitanti e conserva quell’impronta funzionale e accogliente. Poco distante dal confine francese, a un’ora di treno da Strasburgo, è una città della mobilità e della tecnica, dove il trasporto pubblico non è solo efficiente, ma pensato per semplificare la vita quotidiana. Il cuore del sistema è il cosiddetto Karlsruhe Modell, un’integrazione avanzata tra treni regionali e tram urbani. I convogli del tram-treno possono viaggiare sia sui binari delle linee suburbane che su quelli cittadini, senza le cosiddette “rotture di carico”. Cioè un passeggero può salire nel centro storico e raggiungere i comuni dell’area metropolitana senza mai cambiare mezzo. Il modello è stato adottato fin dagli anni Novanta, e oggi collega oltre 400 chilometri di binari, con corse frequenti e una rete capillare. La stazione centrale è un nodo intermodale efficiente, da cui partono anche linee ICE ad alta velocità e treni regionali. Ma è sotto la superficie che la trasformazione recente ha preso forma. Tra il 2010 e il 2021, Karlsruhe ha realizzato un ambizioso progetto di interramento delle linee tranviarie nel centro storico. I cantieri, finanziati con risorse pubbliche, hanno permesso di liberare le piazze principali dal passaggio in superficie, restituendo spazio ai pedoni, al verde e alla vita urbana. I tram passano oggi in tunnel sotterranei, con stazioni moderne e accessibili. La Kriegsstraße, uno dei principali assi urbani, è stata completamente riqualificata. Invece dei binari, una promenade verde e una corsia per il bus a transito rapido, mentre la linea tranviaria si muove sottoterra. Il risultato è uno spazio urbano più leggibile, ordinato e vivibile. Karlsruhe non ha mai inseguito la retorica delle smart city, ma ha investito con costanza su una mobilità pubblica integrata. La rete è gestita da KVV – Karlsruher Verkehrsverbund – e si estende su tram, bus e ferrovie suburbane. Il sistema tariffario è unificato, con biglietti integrati (Mobility as a Service) anche per le bici e le navette. Le app mobili consentono di pianificare i viaggi e acquistare i titoli di trasporto, e sono disponibili in più lingue. L’accesso è facilitato anche da abbonamenti agevolati per studenti, anziani, lavoratori e persone a basso reddito. Gli spostamenti avvengono con cadenze regolari e tempi affidabili. Non mancano i parcheggi interrati, soprattutto nei pressi delle stazioni e delle aree pedonali del centro. Sono concepiti come supporto alla mobilità pubblica, con tariffe differenziate e accesso diretto ai percorsi urbani. Alcuni sono dotati di stazioni di ricarica per veicoli elettrici e di servizi bike & ride. L’obiettivo dichiarato è ridurre la pressione delle auto in superficie, non proibendo, ma ordinando. La trasformazione della Kriegsstraße ha incluso anche nuovi parcheggi sotterranei, collocati strategicamente lungo l’anello viario. La vocazione alla sperimentazione tecnica è sostenuta anche da una solida infrastruttura della conoscenza. A Karlsruhe ha sede il Fraunhofer-Institut für System- und Innovationsforschung ISI, centro di ricerca internazionale, che collabora con enti pubblici e imprese per studiare scenari urbani, politiche energetiche e sistemi di mobilità integrata. Il contributo scientifico dell’istituto si riflette nella qualità delle politiche urbane locali, pensate non per stupire, ma per funzionare. Il bilancio della città, secondo le analisi della Süddeutsche Zeitung e della Frankfurter Allgemeine Zeitung, è quello di un modello sobrio ma replicabile. Nessuna rivoluzione estetica, ma un’attenzione costante ai dettagli, alla manutenzione, all’equilibrio tra funzioni. Le piste ciclabili sono continue, i marciapiedi ampi, gli attraversamenti sicuri. I servizi civici sono tutti accessibili anche online, e la pubblica amministrazione ha ridotto drasticamente i tempi di risposta grazie a un
sistema informatico unificato. Le linee di autobus L-Bus coprono i quartieri meno densi con corse regolari, e sono in corso sperimentazioni con navette elettriche in alcune zone scolastiche. Karlsruhe non è una città da copertina, ma è una città che funziona. Il suo centro è vivo, abitato, attraversato senza sforzo. I suoi spazi pubblici sono frequentati da famiglie, studenti, pensionati, ciclisti, pendolari. La domenica mattina, tra i caffè e i mercati, si sente parlare anche italiano. Forse qualcuno ancora la chiama “Calzarola”, ma oggi è una città tedesca dove la mobilità non è solo un’infrastruttura, ma una forma di civiltà urbana.`,
    spunti: "Il modello Karlsruhe di tram-treno; l'integrazione tra trasporto urbano e regionale.",
    attivita: "Cerca cos'è un tram-treno e come funziona tecnicamente (scartamento dei binari, alimentazione). Disegna uno schema che colleghi centro e periferia della tua città con questo sistema.",
    summary: "Karlsruhe, città tedesca ordinata e ricca di possibilità di spostamento, è nota per aver inventato il modello del tram-treno: veicoli che viaggiano sia sui binari cittadini sia su quelli delle ferrovie regionali, eliminando le \"rotture\" di percorso tra centro e periferia."
  },
  {
    num: 23, title: "Brno, Il Valore Del Brownfield", city: "Brno", country: "Repubblica Ceca",
    lat: 49.1951, lon: 16.6068, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02jJ9LrdkRhUZpDfaRBqQu84cmfuoJWJUbVFCNQSSU6iVUMqULvUaSBwaamZ8Lp7Yl",
    text: `Brno non ama ostentare. Non si affaccia sulle copertine, non cerca riflettori. Eppure, sotto la sua pelle urbana scorre una rete infrastrutturale che ne fa una delle città più avanzate e coerenti dell’Europa centrale. Energia, mobilità, rifiuti, rigenerazione urbana: tutto si tiene, come un tessuto pregiato che non ha bisogno di dichiararsi tale. Siamo in Moravia, nella seconda città della Repubblica Ceca, a due ore di treno da Vienna. Brno, con i suoi circa 403.000 abitanti e oltre 730.000 nell’area metropolitana, si estende tra i bracci dei fiumi Svratka e Svitava, su un territorio segnato dalla memoria industriale e da quartieri densi ma non congestionati. Non si espande ma si riempie e agisce per continuità. Brno conserva una delle reti tranviarie più estese dell’Europa centrale: dodici linee, oltre settanta chilometri di binari, duecento milioni di passeggeri all’anno. Il sistema è gestito dall’azienda pubblica DPMB ed è parte di un’infrastruttura multimodale integrata. Autobus, filobus e treni regionali funzionano in sinergia grazie alla rete IDS JMK, con un biglietto unico valido per novanta minuti. Le frequenze sono alte, anche nei fine settimana. I nuovi convogli Škoda ForCity offrono comfort, pianale ribassato, accessibilità e recupero di energia in frenata. Alla stazione centrale una ciclostazione sotterranea custodisce fino a trecento biciclette. Intorno, un sistema di parcheggi di interscambio alleggerisce l’ingresso delle auto. Anche gli spazi urbani si riconfigurano attorno alla rete. Nel cuore della città, tra il centro storico e la stazione, si trova l’area di Špitálka. Per decenni ha ospitato una centrale termica alimentata a gas, ancora oggi attiva e integrata nel sistema di teleriscaldamento cittadino. L’area è oggi al centro di un progetto di trasformazione urbana sostenuto dal programma europeo RUGGEDISED: non una demolizione, ma una rigenerazione. La centrale resta, e intorno prende forma un nuovo quartiere. Alcuni edifici sono già in uso, mentre altri sono in costruzione o in fase di progettazione. Il masterplan, firmato dallo studio Atelier 8000, prevede spazi abitativi e educativi, uffici, funzioni pubbliche, e una connessione più forte con il fiume. L’obiettivo è farne un distretto a energia positiva, capace di produrre più di quanto consuma, attraverso pannelli solari, pompe di calore, recupero termico da data center, tetti verdi e facciate isolate. Alcuni di questi elementi sono già predisposti, altri ancora da completare. Il tram continua a passare nel cuore dell’area. Špitálka è solo una delle tessere del mosaico. Accanto alla stazione centrale, su un’ex area militare e produttiva, è in corso la trasformazione di Nová Zbrojovka. È un vasto comparto dismesso riconvertito in residenze, uffici, coworking, parchi pubblici e percorsi ciclopedonali. Anche qui il tram ha un ruolo centrale, attraversa l’area, connette, dà forma alla trasformazione. Brno non cresce per grandi salti. Cresce per stratificazione. Ha censito tutte le aree dismesse, le ha mappate, aperte al pubblico, raccolte in una banca dati digitale. I brownfield – vuoti urbani, aree già edificate da rigenerare senza nuovo consumo di suolo – non sono ferite, ma riserve. L’urbanistica al 2050 punta alla densificazione dei vuoti interni, al mix funzionale, alla porosità degli spazi pubblici. Ogni nuovo intervento nasce come nodo di una rete di trasporto, di energia, di relazioni. Sul piano ambientale la città lavora in parallelo. La municipalizzata SAKO gestisce un impianto di incenerimento con recupero energetico che trasforma ogni anno oltre 220.000 tonnellate di rifiuti in elettricità e calore, coprendo fino al 30 per cento del fabbisogno termico urbano. I filtri avanzati riducono le emissioni, il recupero dei metalli e dei residui è automatizzato. Nei quartieri, come Židenice o proprio Špitálka, si sperimentano sistemi PAYT – Pay As You Throw – con cassonetti dotati di sensori che registrano peso e frequenza, premiando i comportamenti virtuosi. Il centro per il riuso di Židenice, attivo dal 2023, raccoglie mobili, abiti, materiali edilizi e li reinserisce in circuito anche attraverso iniziative sociali.
I dati parlano chiaro. Oltre il 58 per cento degli spostamenti urbani avviene con mezzi pubblici, il 28 per cento a piedi o in bicicletta, meno del 14 con l’auto privata. L’accessibilità è garantita anche nei quartieri collinari. Gli studenti rappresentano una quota significativa dell’utenza. Ogni giorno oltre 20.000 giovani si spostano con i mezzi tra campus, biblioteche e alloggi. Anche gli over 65 usano tram e filobus con abbonamenti agevolati e infrastrutture pensate per l’accesso diretto. Brno è una città che riusa, ricuce, connette. Per questo è una storia da raccontare.`,
    spunti: "Riconversione dei brownfield industriali; lo sviluppo urbano nell'Europa centrale post-industriale.",
    attivita: "Cerca cosa significa 'brownfield' in urbanistica e individua un esempio vicino a te (fabbrica dismessa, area industriale abbandonata). Localizza Brno sulla carta della Repubblica Ceca.",
    summary: "Brno non cerca i riflettori, ma sotto la sua pelle urbana scorre una rete infrastrutturale che la rende una delle città più avanzate dell'Europa centrale, capace di trasformare aree industriali dismesse (i \"brownfield\") in nuove risorse per la città invece che in terreni abbandonati."
  },
  {
    num: 24, title: "Nantes, Il Ferro Batte La Gomma", city: "Nantes", country: "Francia",
    lat: 47.2184, lon: -1.5536, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0qTM15J2DksrPMWaRBkz3qJQpL9DG3kHCzUHSrBbxxVkQDTrPAnxJHfjoPs3CUfNRl",
    text: `Nantes si distende tra i bracci della Loira, poco prima che il fiume si apra all’Atlantico. È una città d’acqua e di ponti, costruita su isole fluviali, incrocio tra la Bretagna storica e i Paesi della Loira, nell’ovest della Francia. Non è una metropoli, ma ha il passo delle città che si sono riorganizzate con metodo. Qui, da oltre quarant’anni, la mobilità non è solo un sistema di trasporto, ma una scelta urbanistica. Passeggiare nel centro vuol dire attraversare piazze senza auto, sentire il lieve sibilo dei tram che scivolano tra le vetrine, salire in bicicletta o prendere un battello per attraversare il fiume. Tutto è collegato, frequente, leggibile. Il movimento diventa una pratica collettiva, quotidiana, silenziosa. Tra la città di Nantes e i 23 comuni che formano Nantes Métropole vivono circa 650.000 persone, di cui oltre 320.000 nel solo capoluogo. È una città in espansione ma non caotica. Il turismo è cresciuto in modo costante, trainato da eventi culturali, progetti artistici diffusi e una qualità urbana che attira anche residenze temporanee. A reggere l’impatto, evitando congestioni e pressioni eccessive sul centro, è soprattutto la rete di trasporto pubblico. La crescita di Nantes non ha prodotto solo più mobilità, ma anche una nuova forma urbana. Fin dagli anni Duemila, la città ha scelto di rigenerare piuttosto che espandere. Emblema di questa strategia è l’Île de Nantes, ex zona portuale e industriale trasformata in un quartiere misto sotto la direzione del progettista Jean-Luc Charles. Qui coesistono edilizia sociale e residenze private, scuole, poli sanitari, incubatori digitali, arte pubblica e spazi aperti. La densificazione è guidata e compatta, con edifici di media altezza, cortili condivisi e una rete di percorsi pedonali e ciclabili continua. Anche nei quartieri di Bottière-Chénaie e Erdre Porterie si applica la stessa logica: cucire, densificare, rendere abitabili gli interstizi urbani. Lo spazio pubblico diventa struttura portante, non cornice: non solo piazze e parchi, ma slarghi, passaggi, fronti stradali ridisegnati per la vita quotidiana. Nantes non cresce verso l’esterno, ma si ricompone su sé stessa. Il verde è parte di questa strategia. A ogni intervento corrisponde un incremento della vegetazione urbana: non solo alberature lungo le strade, ma veri e propri corridoi ecologici che accompagnano linee tranviarie, assi ciclabili e rive fluviali. Il Plan Canopée prevede la messa a dimora di 25.000 alberi entro il 2026, con priorità nei quartieri più densamente abitati. L’acqua è gestita in superficie, attraverso trincee drenanti e giardini di bioretention, come nel Jardin des Fonderies o nel Parc Crapa. Le sponde della Loira e dell’Erdre diventano spazi continui per il cammino, l’ombra, la ritenzione idrica. Il paesaggio non è decorativo, ma funzionale. Ogni giorno, secondo i dati ufficiali, oltre 500.000 spostamenti avvengono tramite mezzi collettivi: tram, bus, navette fluviali, treni suburbani. Senza quest’infrastruttura capillare, l’equilibrio sarebbe fragile. Ma qui ogni tratta è pensata per essere accessibile, frequente, integrata. Il movimento non è una conseguenza del turismo, ma la sua condizione di possibilità. Il primo gesto risale al 1985, quando Nantes è stata la prima città francese a reintrodurre il tram moderno dopo decenni di smantellamento dei binari. Quel segnale — allora controcorrente — ha dato origine a una trasformazione continua. Oggi la città dispone di tre linee tranviarie principali, per un totale di oltre 43 chilometri, con corse ogni 3–6 minuti nelle ore di punta. La rete è interconnessa con bus, traghetti urbani, biciclette condivise e treni suburbani. Tutto ruota attorno a Naolib, il sistema unificato che consente di pianificare il viaggio, acquistare i biglietti e monitorare i tempi reali da un’unica interfaccia. È un modello maturo di MaaS, Mobility as a Service, che integra mobilità dolce, tecnologia e accessibilità. L’aeroporto Nantes Atlantique è collegato alla città da una navetta dedicata, attiva ogni venti minuti, che raggiunge il centro in meno di mezz’ora. La stazione centrale, rinnovata nel 2020 con una
nuova copertura vetrata e accessi semplificati, è collegata direttamente alla linea tram 1. Chi arriva in treno può muoversi in pochi minuti, senza attraversamenti complicati. Il cuore urbano è servito dalla fermata “Commerce”, nodo intermodale dove convergono tram, navette e percorsi pedonali. Il sistema è pensato per rendere superflua l’auto privata. I parcheggi non scompaiono, ma sono interrati o collocati lungo il perimetro, a servizio dei pendolari. Già da anni sono attivi parcheggi di scambio attrezzati, collegati al centro tramite tram e bus a transito rapido su corsie dedicate. La linea Busway, inaugurata nel 2006, è stata una delle prime esperienze di BRT in Francia. Oggi mostra i segni della propria obsolescenza, e per questo è in corso la sua riconversione in linea tranviaria, con cantieri previsti entro il 2026. È il ferro che torna a prevalere sulla gomma: una scelta coerente con l’impostazione della città. Gran parte del centro è oggi pedonalizzato o accessibile solo a mezzi pubblici e residenti. L’espansione della ZTL è oggetto di una consultazione pubblica avviata nel 2024, che prevede nuove restrizioni al traffico e una maggiore continuità pedonale tra le piazze principali. Le fermate del tram, come “Place du Cirque” o “Bouffay”, si aprono su spazi pubblici ridisegnati per la sosta, la socialità e il commercio. Lo spazio urbano non è sottratto, ma restituito. Non si vieta di arrivare in auto, ma si privilegia chi sceglie mezzi collettivi, attivi o leggeri. Anche il sistema tariffario riflette questa impostazione inclusiva. I trasporti urbani sono gratuiti nei fine settimana, eccetto la navetta aeroportuale. L’accesso alla mobilità non è lasciato al mercato, ma governato da criteri di equità. Nantes è una città che ha lavorato per gradi, senza salti spettacolari ma con coerenza. I suoi punti di forza sono la regia unificata, l’intermodalità reale, la chiarezza delle priorità. Tra le debolezze, la pressione immobiliare crescente, alcune disuguaglianze territoriali e la necessità di rendere pienamente inclusivi anche i servizi digitali e le reti ciclabili. Ma la traiettoria è netta: meno auto, più accessibilità, più spazi pubblici di qualità. Un equilibrio costruito nel tempo, a partire dalle infrastrutture ma pensando all’uso. Muoversi a Nantes non è solo un fatto tecnico. È una forma di cittadinanza. Camminare, pedalare, attraversare il fiume in battello o salire su un tram silenzioso diventano gesti ordinari, ma dentro una città che si è rimessa in movimento proprio cambiando scala, logiche e priorità.`,
    spunti: "Il ruolo del trasporto su ferro nella mobilità urbana; la geografia fluviale come vincolo e risorsa per la città.",
    attivita: "Localizza Nantes alla foce della Loira su una carta della Francia. Confronta i chilometri di rete tranviaria di Nantes con quelli della tua città (se presente) o di una città italiana con il tram.",
    summary: "Nantes, distesa tra i bracci della Loira poco prima che il fiume si apra all'Atlantico, ha scommesso sul trasporto su ferro rispetto a quello su gomma: una scelta di mobilità che valorizza tram e treni urbani nella città d'acqua e di ponti tra Bretagna storica e Paesi della Loira."
  },
  {
    num: 25, title: "Aarhus, Il Parcheggio Che Non Si Vede", city: "Aarhus", country: "Danimarca",
    lat: 56.1629, lon: 10.2039, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0NXkSv7RjAKTC7qYUp9Ct3xDhMxq5hGHXjM4ddJ6hYNgo3BoVHbXyfpeZ1nHKxJLsl",
    text: `Sul lungomare di Aarhus, la città si muove piano. Non c’è fretta, ma nemmeno lentezza. I tram arrivano regolari, le biciclette passano numerose e silenziose, le auto scorrono senza rumore. Qui i ciclisti non fanno i talebani delle due ruote e gli automobilisti non pretendono la supremazia dell’asfalto. È una città che ha trovato un compromesso di civiltà. Ognuno sa che ha spazio, ma non tutto lo spazio. Lars arriva a Dokk1 poco prima delle otto. È lunedì. Cielo basso, vento dal mare, e quelle gocce leggere che non bagnano ma restano. Ha fretta, ma non si agita. Sa che ci vorranno meno di due minuti. Svolta a sinistra seguendo il cartello discreto: «Automatisk parkering». Lo stesso da anni. Nessuna insegna luminosa, nessuna rampa. Solo vetro, cemento e un’aria sospesa, come se la città trattenesse il fiato. L’auto si ferma davanti a una cabina numerata, chiusa da vetri trasparenti. Lo sportello scorre, la voce guida lo invita a spegnere il motore. Lars scende, prende la sua borsa e fa tre passi indietro. Il vetro si chiude. Un lieve sibilo, poi niente. L’auto scompare. Da quel momento, è tutta questione di meccanica invisibile. In profondità – tre livelli sotto la piazza – una rete di shuttle robotizzati, silenziosi, si muove lungo binari elettrificati. Posizionano ogni veicolo in un sistema dinamico, senza corsie, senza pilastri, senza spazi vuoti. Ogni auto ha il suo posto, ma non per diritto: per logica. Con i suoi 972 posti su una superficie compatta, è il più grande parcheggio automatizzato sotterraneo d’Europa. Nessun altro impianto ha la stessa capacità in un’area così ridotta. Nessun altro si inserisce con questa precisione sotto una biblioteca pubblica, un nodo del tram, una piazza urbana. Il sistema è stato sviluppato e installato dalla tedesca Lödige Industries, specializzata in logistica automatizzata. Siamo ad Aarhus Kommune, seconda città della Danimarca, affacciata sul Kattegat, con oltre 360.000 abitanti e una regione metropolitana da 1,3 milioni. È una città che ha scelto di funzionare senza clamore. Urbanistica senza proclami, tecnologie senza euforia. Dokk1 ne è il cuore simbolico: biblioteca, centro civico, terrazza sul mare, e sotto tutto questo – come una spina dorsale – un sistema ingegneristico che riorganizza il rapporto tra l’auto e la città. Il parcheggio è entrato in funzione nel 2015, dopo sette anni di progettazione e cantieri. È costato circa 60 milioni di euro, parte del più ampio progetto Urban Mediaspace da 305 milioni. Una decisione coraggiosa, presa non per creare un’attrazione, ma per liberare spazio in superficie, ridurre il traffico, restituire alla città il suo fronte d’acqua. Nel vecchio porto, dove un tempo si caricavano container e si scaricavano macchinari pesanti, oggi si cammina, si pedala, si leggono libri. Aarhus è una città bella nella sua sobrietà, fatta di case in mattoni rossi, cortili ordinati, edifici moderni ben disegnati. L’aria è pulita, i rumori tenui, la luce spesso diffusa. Il traffico automobilistico è ridotto. Più del 40 per cento degli spostamenti urbani avviene in bicicletta, con una rete ciclabile che supera i 1000 chilometri. In molte strade centrali, i ciclisti sono più numerosi delle auto. Lars lo sa bene. A volte usa l’auto, altre il tram, spesso la bici. Tutto dipende da dove deve andare. La città non impone uno stile, ma lo rende possibile. La rete di tram – la Aarhus Letbane – è moderna, capillare, ben integrata. Collega il centro con i quartieri esterni, l’università, l’ospedale, la costa nord. Nei quartieri meno serviti, circolano autobus elettrici in corsie riservate. Le frequenze sono alte, gli orari rispettati. Ogni mezzo è accessibile, ogni fermata leggibile. Nessun proclama, solo infrastrutture solide. Il parcheggio sotto Dokk1 non è solo tecnologico. È anche sostenibile. Non ha rampe, non ha ventilazione forzata, non ha illuminazione continua. Nessuno vi circola a piedi. I consumi sono
ridotti del 60 per cento rispetto a un parcheggio tradizionale. L’energia viene in parte dai pannelli fotovoltaici sul tetto. Non ci sono fumi, né rumori. Solo movimento preciso, regolare, programmato. Il sistema è interamente automatizzato, monitorato 24 ore su 24. Oltre il 99 per cento delle anomalie viene risolto da remoto. La gestione è pubblica, ma a basso impatto operativo. Le tariffe sono moderate, calcolate a tempo. Non esistono abbonamenti. Il messaggio è chiaro: puoi venire in auto, ma non fermarti troppo. La città ti accoglie, ma ti invita a muoverti in altro modo. Lars torna a prendere la sua auto nel pomeriggio. Passa il badge. Dopo 90 secondi, la cabina si apre. L’auto è lì, pronta. Nessun rumore. Nessuna corsa. Nessun clacson. Sale, accende, riparte. Alla sua destra, un tram arriva. Sulla pista ciclabile ben protetta, un gruppo di bambini in fila indiana va a casa sulle due ruote. Il parcheggio è sotto. La città è sopra. E ognuno sa dove deve stare.`,
    spunti: "Convivenza tra mezzi di trasporto diversi nello spazio urbano; i parcheggi interrati come strumento di pianificazione.",
    attivita: "Cerca quanti parcheggi sotterranei ci sono nel centro della tua città. Calcola quanto spazio in superficie potrebbe essere liberato se venissero spostati sottoterra.",

  {
    num: 26, title: "Copenhagen, La Forza Dei Dettagli", city: "Copenaghen", country: "Danimarca",
