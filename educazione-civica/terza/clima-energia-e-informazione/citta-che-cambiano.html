  {
    num: 91, title: "Zurigo Prova A Fare La Città Spugna", city: "Zurigo", country: "Svizzera",
    lat: 47.3769, lon: 8.5417, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0zYruM7SvEUuTeFVPvm3ELTYEoYhqGofq8XGmcg1aPvf4Avs8K6wUDnwaNFWYaxtZl",
    text: `L'acqua corre allo scoperto, in mezzo alle case. Un canale di ghiaia largo pochi passi, ad Albisrieden, ai margini di Zurigo. Scende dal fianco boscoso dell'Uetliberg e taglia il quartiere per due chilometri e mezzo, tra un prato e una fila di arbusti. Per gran parte dell'anno è un filo d'acqua. La gente ci passa accanto, ci corre. È l'Albisrieder Dorfbach. Trent'anni fa qui non c'era niente da vedere: scorreva sottoterra, in un tubo, insieme alla fogna. Poi arriva una di quelle estati che ormai ben conosciamo. Settimane di afa e temporali che allagano una città in mezz'ora. Il canale aperto fa due cose che il tubo non faceva. L'acqua scoperta raffresca l'aria del quartiere. E quando il cielo si rovescia, la piena sfoga lì, nell'alveo largo e nelle zone che possono allagarsi senza danni, invece che nelle strade. Il nesso è semplice, e vale per ogni città. Il clima che cambia porta due cose insieme: più caldo e piogge più brutali. La città asfaltata è fatta apposta per subirle entrambe. Il cemento trattiene il calore come un forno e crea isole di calore. La pioggia non trova terra da penetrare: scivola via in superficie, gonfia le fogne, allaga. In Svizzera il 60 per cento del suolo costruito è impermeabile. La risposta ha un nome: città spugna. Rompere l'asfalto, ridare terra e verde, riportare l'acqua in vista, così che il suolo la beva quando piove e la restituisca fresca quando fa caldo. Verde e blu al posto del grigio. Riaprire un ruscello è una di queste mosse. Zurigo non l'ha fatto per il clima. Nel 1988, prima che una legge lo imponga, l'ufficio delle fognature fa un calcolo. L'acqua pulita finita in fogna carica i depuratori e costa. Meglio separarla, raccogliere a parte la pioggia pulita e mandarla dritta nel fiume. Il fresco d'estate e il verde tra le case vengono dopo. Nel 1991 una legge federale trasforma quella scelta in obbligo per tutti i comuni svizzeri. Riaprire il ruscello divide i flussi: l'acqua pulita torna in superficie, il depuratore tratta solo ciò che è sporco. I ruscelli già riaperti tengono fuori dall'impianto tra 220 e 310 litri d'acqua pulita al secondo. Intorno al 1850 nei quartieri di Zurigo scorrevano 160 chilometri di ruscelli aperti. La città cresceva, li trovava d'intralcio, li sotterrò uno a uno. Il Bachkonzept riscrive quella pagina al contrario. Dei 44 chilometri fuori dai boschi, nel 1988 ne restavano in superficie solo 16. Oggi 34. Ne dormono ancora 27 sottoterra, e solo 4 si possono riportare alla luce senza spese eccessive. Il metodo ha un nome, mappe, manuali, ed è copiato altrove, da Dortmund a Seul. Perché una città rimetta i ruscelli in strada, bisogna vederla d'estate. Al Letten ci si tuffa nella Limmat, ci si lascia portare dalla corrente per 400 metri, si esce, e chi vuole risale in tram e si ributta. A mezzogiorno c'è chi mette la roba nel sacco impermeabile e nuota un tratto di fiume per rientrare. Quaranta bagni pubblici, la densità più alta del mondo. Qui il rapporto con l'acqua è quotidiano, fisico. Il ruscello sotto casa è lo stesso gesto, in piccolo. Da vicino, però, il ruscello mostra cos'è. Il letto è argilla e ghiaia, modellato a mano. All'ingresso del quartiere un raccoglitore ferma ghiaia, legno e foglie. Non è un torrente selvaggio, è un canale. E riaprire l'acqua non basta a far tornare la vita. Perché un ruscello si ripopoli di insetti, piante e pesci, servono piante e animali che scendano da un tratto sano più a monte. L’ingegnere capo comunale non lo nasconde: oggi rinaturalizzare è molto più difficile che negli anni Novanta, perché i tratti facili sono già stati fatti e restano quelli incastrati tra strade e case.
Resta un nodo che non è tecnico. Un ruscello con alberi e panchine rende bello il quartiere, e un quartiere bello costa di più. Salgono gli affitti, salgono i prezzi delle case. Chi ci abitava da anni, spesso, non può più permetterselo e se ne va. Così un'opera pensata per tutti finisce per premiare chi arriva dopo, con i soldi. E poi c'è il prezzo in denaro pubblico. Nel 2025, per riaprire un tratto di torrente in un quartiere sul lago, la città restringe la strada, toglie l'asfalto ai lati, mette alberi e panchine, cancella 14 posti auto. Solo per quell'intervento stanzia 43 milioni di franchi, quasi 46 milioni di euro, di lavori distribuiti dal 2026 al 2030. E ogni anno la semplice manutenzione dei ruscelli aperti costa 1,25 milioni di franchi, circa 1,33 milioni di euro. Il lusso non è il ruscello riportato alla luce. Il lusso è fidarsi ancora di un tubo interrato, disegnato per un clima che non esiste più. E il conto per quella fiducia arriva comunque. In Svizzera i due terzi dei danni da acqua vengono dalla pioggia che corre sull'asfalto, non dai fiumi che straripano. Si paga in cantine allagate e strade roventi. L'acqua è ancora lì, sotto le strade. Tenerla sepolta non è un destino, è una scelta.`,
    spunti: "Il ritorno in superficie dei corsi d'acqua tombati; le città spugna come strategia di adattamento al cambiamento climatico.",
    attivita: "Cerca cos'è una 'città spugna' (sponge city) e quali altre città europee la citate nella mappa hanno adottato questo modello. Verifica se nella tua città esistono corsi d'acqua tombati che potrebbero tornare in superficie.",
    summary: "Ad Albisrieden, ai margini di Zurigo, un canale di ghiaia largo pochi passi scende dal fianco boscoso dell'Uetliberg e taglia il quartiere per due chilometri e mezzo: trent'anni fa lì non c'era niente da vedere, perché l'acqua scorreva sottoterra in un tubo. Oggi l'Albisrieder Dorfbach è tornato in superficie, primo passo di un piano più ampio per fare di Zurigo una \"città spugna\"."
  },
];

const TOTAL_PLANNED = 91;

// ---------------------------------------------------------------
// Raggruppa le puntate per città
// ---------------------------------------------------------------
function groupByCity(episodes){
  const map = new Map();
  episodes.forEach(ep => {
    const key = ep.city;
    if(!map.has(key)) map.set(key, { city: ep.city, country: ep.country, lat: ep.lat, lon: ep.lon, episodes: [] });
    map.get(key).episodes.push(ep);
  });
  return Array.from(map.values());
}
const CITIES = groupByCity(EPISODES);

// ---------------------------------------------------------------
// Mappa Leaflet
// ---------------------------------------------------------------
const map = L.map('map', { zoomControl: true, minZoom: 3, maxZoom: 16 }).setView([51, 10], 4);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, FAO, NOAA, USGS',
  maxZoom: 16,
}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16,
}).addTo(map);

function makeIcon(color){
  const size = 20;
  return L.divIcon({
    className: '',
    html: `<div class="cluster-pin" style="width:${size}px;height:${size}px;background:${color};"></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
  });
}

function makeClusterIcon(cluster){
  const childMarkers = cluster.getAllChildMarkers();
  const color = childMarkers[0].options.catColor;
  const count = cluster.getChildCount();
  const size = 30;
  return L.divIcon({
    className: '',
    html: `<div class="cluster-pin" style="width:${size}px;height:${size}px;background:${color};font-size:12px;">${count}</div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
  });
}

// Assegna a ogni puntata una piccola posizione distinta intorno al centro
// della città, così i pallini si separano avvicinandosi con lo zoom.
function assignMarkerPositions(episodes){
  const byCity = new Map();
  episodes.forEach(ep => {
    if(!byCity.has(ep.city)) byCity.set(ep.city, []);
    byCity.get(ep.city).push(ep);
  });
  byCity.forEach(group => {
    const n = group.length;
    const R = 0.012; // ~1.3 km, abbastanza per separarsi con lo zoom sulla città
    group.forEach((ep, i) => {
      if(n === 1){
        ep.markerLat = ep.lat; ep.markerLon = ep.lon;
      } else {
        const angle = (2 * Math.PI * i / n) - Math.PI / 2;
        const latFactor = Math.cos(ep.lat * Math.PI / 180) || 1;
        ep.markerLat = ep.lat + R * Math.sin(angle);
        ep.markerLon = ep.lon + (R * Math.cos(angle)) / latFactor;
      }
    });
  });
}
assignMarkerPositions(EPISODES);

let clusterGroup = null;
function renderMarkers(activeCats){
  if(clusterGroup) map.removeLayer(clusterGroup);
  clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 70,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    iconCreateFunction: makeClusterIcon,
  });

  EPISODES.filter(e => activeCats.has(e.category)).forEach(ep => {
    const color = CATEGORIES[ep.category].hex;
    const marker = L.marker([ep.markerLat, ep.markerLon], { icon: makeIcon(color), catColor: color });
    const tooltipHtml = `
      <div class="tooltip-city">${ep.city}</div>
      <div class="tooltip-ep-title">${ep.num}. ${ep.title}</div>
      <div class="tooltip-ep-summary">${ep.summary || ep.text.slice(0,140).trim()+'…'}</div>
      <div class="tooltip-hint">Clicca per il testo completo &rarr;</div>
    `;
    marker.bindTooltip(tooltipHtml, { className: 'city-tooltip', direction: 'top', offset: [0, -6], sticky: false, opacity: 1 });
    marker.on('click', () => showCity(ep.city, ep.num));
    clusterGroup.addLayer(marker);
  });

  map.addLayer(clusterGroup);
}

// ---------------------------------------------------------------
// Legenda / filtro categorie
// ---------------------------------------------------------------
let activeCats = new Set(Object.keys(CATEGORIES));
const legendEl = document.getElementById('legend');
Object.entries(CATEGORIES).forEach(([key, cat]) => {
  const chip = document.createElement('div');
  chip.className = 'chip active';
  chip.innerHTML = `<span class="dot" style="background:${cat.hex}"></span>${cat.label}`;
  chip.style.color = cat.color;
  chip.addEventListener('click', () => {
    if(activeCats.has(key)) activeCats.delete(key); else activeCats.add(key);
    chip.classList.toggle('dimmed', !activeCats.has(key));
    renderMarkers(activeCats);
  });
  legendEl.appendChild(chip);
});

// ---------------------------------------------------------------
// Pannello laterale
// ---------------------------------------------------------------
const panel = document.getElementById('panel');

// ---------------------------------------------------------------
// Controlli dimensione testo (accessibilità)
// ---------------------------------------------------------------
const TEXT_SCALE_MIN = 0.85, TEXT_SCALE_MAX = 1.6, TEXT_SCALE_STEP = 0.15;
let textScale = 1;
try {
  const saved = localStorage.getItem('cittaCheCambiano_textScale');
  if (saved) textScale = parseFloat(saved);
} catch (e) {}

function applyTextScale(){
  panel.style.setProperty('--text-scale', textScale);
}
function persistTextScale(){
  try { localStorage.setItem('cittaCheCambiano_textScale', String(textScale)); } catch (e) {}
}
document.getElementById('textBigger').addEventListener('click', () => {
  textScale = Math.min(TEXT_SCALE_MAX, +(textScale + TEXT_SCALE_STEP).toFixed(2));
  applyTextScale(); persistTextScale();
});
document.getElementById('textSmaller').addEventListener('click', () => {
  textScale = Math.max(TEXT_SCALE_MIN, +(textScale - TEXT_SCALE_STEP).toFixed(2));
  applyTextScale(); persistTextScale();
});
document.getElementById('textReset').addEventListener('click', () => {
  textScale = 1;
  applyTextScale(); persistTextScale();
});
applyTextScale();

function showIntro(){
  const done = EPISODES.length;
  panel.innerHTML = `
    <div class="intro">
      <h2>Un atlante da costruire insieme</h2>
      <p>Ogni pallino sulla mappa è una città raccontata da Pino Bruno: clicca per leggere come affronta acqua, rifiuti, energia, mobilità o rigenerazione urbana. Usa i filtri in alto per isolare un tema.</p>
      <div class="progress">Puntate inserite finora: <b>${done} di ${TOTAL_PLANNED}</b></div>
      <ul class="city-list">
        ${CITIES.map(c => `<li data-city="${c.city}"><span class="cname">${c.city}</span><span class="count">${c.episodes.length} puntat${c.episodes.length>1?'e':'a'}</span></li>`).join('')}
      </ul>
    </div>`;
  panel.querySelectorAll('.city-list li').forEach(li => {
    li.addEventListener('click', () => showCity(li.dataset.city));
  });
}

function showCity(cityName, epNum){
  const city = CITIES.find(c => c.city === cityName);
  if(!city) return;
  const ep = epNum ? city.episodes.find(e => e.num === epNum) : city.episodes[0];
  const cat = CATEGORIES[ep.category];

  panel.innerHTML = `
    <button class="back-btn" id="backBtn">&larr; Tutte le città</button>
    <div class="city-header">
      <h2>${city.city}</h2>
      <span class="country-tag">${city.country}</span>
    </div>
    ${city.episodes.length > 1 ? `
      <div class="ep-tabs">
        ${city.episodes.map(e => `<div class="ep-tab ${e.num===ep.num?'selected':''}" data-num="${e.num}">${e.num}. ${e.title.length>28?e.title.slice(0,28)+'…':e.title}</div>`).join('')}
      </div>` : ''}
    <div class="cat-pill" style="background:${cat.hex}22; color:${cat.hex};">
      <span class="dot" style="background:${cat.hex}"></span>${cat.label}
    </div>
    <article>
      <h3>${ep.num}. ${ep.title}</h3>
      <div class="source"><a href="${ep.link}" target="_blank" rel="noopener">Post originale su Facebook &rarr;</a></div>
      ${ep.summary ? `
      <div class="brief-box">
        <div class="brief-label">In breve</div>
        <p>${ep.summary}</p>
      </div>` : ''}
      <div class="full-label">Testo completo</div>
      <div class="body">${ep.text.split('\n').filter(p=>p.trim()).map(p => `<p>${p}</p>`).join('')}</div>
      <div class="spunti-box">
        <h4>Spunti geografici — Terza media</h4>
        <p>${ep.spunti}</p>
      </div>
      ${ep.attivita ? `
      <div class="attivita-box">
        <h4>Attività di ricerca e approfondimento</h4>
        <p>${ep.attivita}</p>
      </div>` : ''}
    </article>
  `;
  document.getElementById('backBtn').addEventListener('click', showIntro);
  panel.querySelectorAll('.ep-tab').forEach(tab => {
    tab.addEventListener('click', () => showCity(cityName, parseInt(tab.dataset.num, 10)));
  });

  map.flyTo([ep.markerLat, ep.markerLon], 12, { duration: 0.6 });
  // trova il marker di questa puntata dentro il cluster e apre il suo tooltip
  let targetMarker = null;
  clusterGroup.eachLayer(m => {
    if(m.getLatLng().lat === ep.markerLat && m.getLatLng().lng === ep.markerLon) targetMarker = m;
  });
  if(targetMarker){
    setTimeout(() => {
      if(typeof clusterGroup.zoomToShowLayer === 'function'){
        clusterGroup.zoomToShowLayer(targetMarker, () => targetMarker.openTooltip());
      } else {
        targetMarker.openTooltip();
      }
    }, 650);
  }
}

renderMarkers(activeCats);
showIntro();
</script>
</body>
</html>
