    num: 39, title: "L’Energia Comunale Sui Tetti Di Parigi", city: "Parigi", country: "Francia",
    lat: 48.8566, lon: 2.3522, category: "energia",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0gnykB2EwFzfQj7nHBkwwXwCzCvGTJkjJhQ7gMQzNYEFg3Uzvzx6njoA7GkaTjqbUl",
    text: `Il 4 luglio 2019 la sindaca di Parigi Anne Hidalgo sale sul tetto del Collège Georges-Brassens, nel 19ᵉ arrondissement. Non c’è palco, non c’è fanfara né nastri da tagliare: ci sono cittadini, insegnanti e tecnici che si scambiano attrezzi da lavoro, guardano il cielo, discutono dell’inclinazione dei moduli. Davanti a loro sta per essere collocato un pannello solare. È il primo modulo della centrale solare “cittadina” di Parigi. Quel gesto è il punto di partenza: scuole, quartieri e amministrazione si mettono insieme per produrre energia e, allo stesso tempo, far nascere comunità. Pochi mesi dopo, a giugno 2020, la cooperativa EnerCit'IF avvia la fase operativa. Sul tetto del Centre d’animation Louis-Lumière nel 20ᵉ arrondissement vengono installati 112 pannelli per una potenza di 36 kWc (chilowatt di picco è la potenza massima che l’impianto può generare in condizioni ottimali di irraggiamento solare). In poco tempo il progetto passa dalla carta alla produzione reale. È la dimostrazione che l’energia condivisa non resta un’idea astratta, ma si traduce in pratica concreta. Tra il 2020 e il 2022, EnerCit’IF lancia 15 piccole centrali su scuole, palestre e edifici popolari; nel 2023 ne aggiunge una sedicesima a Rungis. Quel primo lotto raggiunge 827 kW di potenza installata, con una produzione stimata di 748 MWh l’anno. È sufficiente a coprire il fabbisogno elettrico di base (esclusi acqua calda e riscaldamento) di oltre seicento persone. Alle assemblee partecipano più di 350 soci, fanno domande, prendono decisioni. Persone come Jean-Baptiste, Hannah, Emmanuelle, Jacques, Gilles e Nicolas compaiono nei “témoignages citoyens” (testimonianze dei cittadini). Raccontano le loro motivazioni personali, la voglia di agire, di non restare a guardare, di partecipare al cambiamento. A giugno scorso l’équipe di EnerCit’IF ha tenuto una lezione di sensibilizzazione sulla gestione dell’energia con una classe di 23 alunni della scuola Parmentier. Per i ragazzi, che proprio in questi giorni stanno cominciando le lezioni al collège, è stato un momento di crescita collettiva. Quegli studenti hanno imparato che il tetto della scuola può produrre elettricità, che l’energia non è lontana, può essere condivisa, che loro possono fare parte del progetto. La storia di queste comunità e fatta di successi, insuccessi, piccole e grandi sfide. Come quando, nella primavera del 2022, una tempesta mediterranea portò la sabbia del Sahara fin sui tetti di Parigi, causando danni anche alle piccole centrali solari. In quei giorni polvere e granelli di sabbia ricoprirono i pannelli e ne ridussero l’efficienza. La risposta dei soci fu immediata e spontanea: si rimboccarono le maniche, si procurarono l’attrezzatura necessaria e ripulirono i moduli. Ovviamente EnerCit’IF non è solo volontariato. Ci sono strumenti di monitoraggio continuo, interventi programmati di manutenzione, regole condivise. Il progetto Energieculteurs, approvato nel 2024, prevede la realizzazione di 12 nuove centrali su tetti municipali (circa 4.000 metri quadrati di pannelli) con potenza prevista di 750 kWc, da installare entro il 2026. L’elettricità che genereranno sarà consumata localmente, sia negli edifici che ospitano i pannelli, sia in quelli vicini, nel tessuto urbano. Per questo obiettivo la cooperativa ha avviato una raccolta fondi che ogni giorno vede nuove adesioni di cittadini che partecipano con entusiasmo, anche con quote minime. Parigi dimostra che l’energia di vicinato non è uno slogan vuoto. È un racconto costruito giorno dopo giorno, fatto di incontri nei quartieri, assemblee, ragazzi che imparano, volontari che puliscono, comunità che decide. Quelle stesse comunità che oggi guardano i tetti non solo come spazi inutilizzati, ma come parte del loro potere civico. (Nella foto scattata il 4 luglio 2019, la sindaca di Parigi Anne Hidalgo sul tetto del Collège Georges- Brassens con i soci della prima cooperativa energetica cittadina.`,

  {
    num: 40, title: "Helsingborg, Tre Tubi Per Riusare L’Acqua", city: "Helsingborg", country: "Svezia",
    lat: 56.0465, lon: 12.6945, category: "acqua",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0357zU12zJRyu5DjeRd6eDfq37YFHFHEUMXmrqYePVSqKgEmqHVgXVqgdKar9K2tTzl",
    text: `A Oceanhamnen, il quartiere nuovo affacciato sul porto di Helsingborg, la vita domestica comincia da un dettaglio insolito: sotto i pavimenti gli scarichi non sono uno, ma tre. Chi si trasferisce qui scopre che il lavello della cucina ha un trituratore che manda gli avanzi in un condotto dedicato, che il wc funziona con un risucchio simile a quello degli aerei e che l’acqua di docce e lavatrici prende un’altra strada ancora. Gesti quotidiani, identici a quelli di sempre, ma con un esito diverso: ogni flusso viene separato fin dall’origine per essere riutilizzato. Helsingborg è una città svedese di circa 150.000 abitanti, nella Scania meridionale, affacciata sullo stretto dell’Øresund di fronte a Helsingør, in Danimarca. Oceanhamnen nasce su terreni ex portuali e oggi è un innovativo laboratorio urbano con circa duemila residenti. È qui che la città sperimenta un modo nuovo di trattare acqua e rifiuti, non come scarto da eliminare, ma come risorsa da trasformare. Il cuore del sistema è RecoLab, il centro di trattamento e ricerca che riceve i tre flussi separati. Gli scarti alimentari diventano biogas e fertilizzante. Le acque nere, molto concentrate grazie ai wc a vuoto (come quelli degli aerei, per intenderci), permettono di recuperare nutrienti come azoto e fosforo. Le acque grigie, già meno inquinate, sono filtrate per il riuso tecnico. L’impianto non è nascosto alla vista: al contrario ospita laboratori didattici. Qui scolaresche e famiglie entrano per osservare tubi, serbatoi e display con i dati in tempo reale. I numeri confermano l’efficacia. I wc a vuoto usano circa un litro d’acqua per scarico, contro i 4–6 litri di un modello tradizionale. Ogni famiglia risparmia decine di migliaia di litri all’anno. La resa del biogas è più alta perché la frazione organica arriva pura. I fanghi risultano più stabili, con costi di gestione più bassi. Nei report pubblici, NSVA e RecoLab indicano un potenziale di produzione energetica sufficiente ad alimentare centinaia di abitazioni e parte del trasporto pubblico locale. Dietro c’è una regia pubblica severa. Quando il Comune ha messo all’asta i lotti di Oceanhamnen, ha imposto come condizione l’allaccio al sistema a tre tubi. Nessun costruttore poteva sottrarsi. Così la sperimentazione è diventata quartiere e il quartiere laboratorio urbano. Nel 2022 l’esposizione H22 City Expo ha mostrato il progetto al mondo: per settimane le case campione sono state aperte ai visitatori, con i tecnici a spiegare i tre tubi e i residenti a raccontare la loro esperienza. L’innovazione non si limita a Oceanhamnen. A nord, il bacino del Lussebäcken trattiene le acque piovane con zone umide artificiali. In tutta Helsingborg si diffondono SuDS, sistemi di drenaggio sostenibile che rallentano i flussi e riducono il rischio di allagamenti. A sud, a Råå, il sobborgo marinaro, la valle del torrente Råån è un corridoio naturale protetto: sentieri e prati umidi accolgono passeggiate e manutenzione condivisa. La città spugna prende forma per frammenti, con soluzioni tecniche che diventano spazi pubblici. La dimensione sociale è parte integrante. I residenti non devono differenziare manualmente, ma sono coinvolti attraverso incontri, questionari e dati accessibili. Le scuole portano classi di ragazzi a RecoLab: nel 2023 più di 1.000 studenti hanno seguito laboratori sul ciclo dell’acqua e dell’energia. Nei feedback raccolti dal Comune dopo l’Expo, molte famiglie hanno sottolineato la semplicità del sistema: “Non facciamo nulla di diverso, ma sappiamo che i nostri scarti hanno un valore”. Episodi concreti mostrano cosa significa convivere con tre tubi. Durante i primi mesi, alcuni residenti hanno segnalato rumori insoliti dai wc a vuoto. NSVA ha organizzato incontri condominiali per spiegare il funzionamento e raccogliere osservazioni, correggendo piccoli difetti.
In altri casi, studenti di ingegneria hanno usato i dati di Oceanhamnen per tesi universitarie, misurando rese e confrontandole con sistemi tradizionali. RecoLab, in questo modo, diventa un luogo di apprendimento collettivo, non solo un impianto tecnico. Oggi Oceanhamnen ospita centinaia di famiglie già collegate, e il sistema è dimensionato per migliaia di abitanti equivalenti. È studiato da università e centri di ricerca, come Eawag in Svizzera, e citato come buona pratica dalla Commissione Europea. Delegazioni da Germania, Paesi Bassi e Singapore hanno visitato RecoLab per capire come adattare il modello. È esportabile, ma non ovunque: funziona bene in quartieri nuovi o grandi rigenerazioni, meno nei centri storici già consolidati. A RecoLab si capisce che nulla si perde e tutto si trasforma. Helsingborg ha fatto in modo che questa catena fosse non un’eccezione, ma una normalità condivisa. La lezione non è solo tecnica, ma politica. Servono regole chiare, volontà amministrativa e comunicazione trasparente.`,
    spunti: "Separazione delle acque reflue negli edifici di nuova costruzione; l'acqua come risorsa da gestire già a livello domestico.",
    attivita: "Cerca lo schema di una rete fognaria domestica tradizionale e confrontala con il sistema a tre tubi di Helsingborg. Rifletti su quali usi dell'acqua in casa tua potrebbero essere separati e riutilizzati.",
    summary: "Nel nuovo quartiere di Oceanhamnen, ad Helsingborg, sotto i pavimenti delle case gli scarichi non sono uno ma tre: uno per gli avanzi di cucina, uno per il wc a risucchio, uno per l'acqua di docce e lavatrici. Gesti quotidiani che permettono di separare e riutilizzare l'acqua fin dalla sua origine."
