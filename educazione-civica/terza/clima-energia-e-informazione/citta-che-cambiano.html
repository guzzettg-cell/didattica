  {
    num: 76, title: "Chambéry, L’Automobile Resta Sottoterra", city: "Chambéry", country: "Francia",
    lat: 45.5646, lon: 5.9178, category: "mobilita",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0h7TuTGHhF4NMxC4Q33JEsSzbX8FwPTHVgLrC8HkhW8L6NZVBtzE2rpWVEUvdAjeYl",
    text: `Quando negli anni Novanta arrivavi in auto a Chambéry, non avevi alternative. Le indicazioni stradali ti portavano giù, nel ventre della città, dentro un parcheggio sotterraneo. Poi l'ascensore ti restituiva in superficie, tra i portici medievali e le facciate savoiarde. Nessun'altra città europea di medie dimensioni osava tanto. Era un modo netto per dire che le strade appartenevano ai cittadini, non alle automobili. La geografia spiega molte cose. La città sorge in un imbuto naturale, schiacciata tra la Chartreuse e le Bauges, attraversata dalle vie che collegano Torino a Ginevra e Lione. Poco più di 60.000 abitanti, 141.000 con l'area metropolitana. Louis Besson, sindaco socialista eletto nel 1989, capì che bisognava agire con decisione. Deviare i flussi, sotterrare i parcheggi, pedonalizzare le vie storiche. I commercianti di Place Saint-Léger temevano la rovina. "Senza auto non verrà più nessuno", dissero. Accadde il contrario. La piazza divenne un salotto urbano. Caffè e bistrot si riempirono. Il fatturato dei negozi salì. Oggi è ancora così: vie lastricate, passaggi coperti medievali riaperti, spazi continui da percorrere a piedi senza interruzioni. La trasformazione non è rimasta in superficie. Nel marzo 2024 il sistema di teleriscaldamento della città ha raggiunto un traguardo raro in Europa. Il Réseau de Chaleur de la Cluse de Chambéry, gestito da Dalkia, produce il 94 per cento della sua energia da fonti rinnovabili e di recupero. È il tasso più alto per una rete di queste dimensioni in Francia. Il calore arriva da tre centrali a biomassa alimentate con legno delle foreste vicine, dal recupero termico dell'incenerimento dei rifiuti urbani, dal calore di scarto di una fabbrica di lastre in gesso e da un serbatoio di accumulo da 400 metri cubi che copre i picchi di consumo mattutini e serali. Il sistema serve quattro comuni, Chambéry, La Motte-Servolex, Cognin e Bassens, ed evita l'emissione di 75.000 tonnellate di CO2 l'anno. La ciclabilità cresce con lo stesso pragmatismo. Oltre 90 chilometri di piste collegano la stazione TGV, il campus universitario di Jacob-Bellecombette e i quartieri residenziali. Il Dipartimento della Savoia ha varato un piano ciclabile da 60 milioni di euro, cinque volte la media nazionale per abitante. A Chambéry si sta costruendo la rete delle "Pistes Bleues", percorsi continui e protetti che collegano tutti i comuni dell'agglomerazione. A giugno 2025 è stata inaugurata una consigne à vélos, un deposito custodito da 100 posti, al parcheggio scambiatore de La Trousse. L'associazione ciclista Roue Libre, che organizza manifestazioni annuali per accelerare i lavori, ha pubblicato un osservatorio cittadino che traccia metro per metro lo stato di avanzamento di ogni tratta. La mobilità pubblica segue la stessa logica. Autobus elettrici e a metano, un sistema tariffario semplice, intermodalità con il treno ad alta velocità che porta a Parigi in tre ore e a Torino in poco più di due. La stazione, rinnovata, è a dieci minuti a piedi dal centro pedonale. Chambéry è anche una città d'acqua. Il Leysse, il torrente che scende dai Bauges, un tempo canalizzato e nascosto, è stato riportato a cielo aperto in alcuni tratti, con passeggiate e giardini lineari. Le fontane storiche sono restaurate una a una. Nei giardini pubblici non ci sono aiuole ornamentali, ma zone ombreggiate con specie resistenti alla siccità. Un adattamento che oggi appare lungimirante. La forza di questa città non sta nelle grandi opere. Sta nelle piccole infrastrutture: i passaggi coperti riaperti, i cortili scolastici ombreggiati, i piccoli giardini condominiali recuperati. Chambéry funziona perché mantiene il legame con la propria scala. Niente grattacieli, niente boulevard artificiosi. Continuità tra quartieri, memoria e innovazione silenziosa.
Nel palmarès "Villes et villages où il fait bon vivre", Chambéry è stabilmente tra le prime dieci città medie di Francia. Qui la qualità della vita non si misura in eventi spettacolari. Si misura attraversando il centro senza traffico, riscaldandosi d'inverno con energia locale, camminando fino alla stazione, respirando all'ombra dei platani nei giardini savoiardi. È questa normalità, conquistata con scelte radicali decenni fa e mantenuta con coerenza da allora, che racconta la sostanza di Chambéry.`,
    spunti: "Il parcheggio interrato come scelta politica sull'uso dello spazio pubblico; la pedonalizzazione dei centri storici medievali.",
    attivita: "Cerca come si viveva nei centri storici medievali prima dell'arrivo delle automobili. Individua una via pedonale della tua città e confrontala con Chambéry.",
    summary: "Negli anni Novanta, arrivare in auto a Chambéry significava scendere direttamente in un parcheggio sotterraneo e risalire in ascensore tra i portici medievali: nessun'altra città europea di medie dimensioni aveva osato tanto, ma il messaggio era chiaro, le strade appartengono ai cittadini, non alle automobili."
  },

    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0WWcThUmeMxTMoKh265uv8wzgqbxxc6XieFHohbkQRjWVU3itq2QLBxJhZfxstpBfl",
    text: `A Cenon, nella periferia est di Bordeaux, il collège Jean Jaurès ha quarantadue ciminiere sul tetto. Non fumano. Non consumano elettricità. Captano l’aria esterna attraverso un sistema di alette, la convogliano fino a griglie nel soffitto delle aule, e spingono fuori l’aria calda e viziata sfruttando la convezione termica naturale. Niente motori, niente gas refrigeranti. Il progetto è partito nel 2019. L’edificio era fatiscente, costruito nel 1956. Il Conseil Départemental de la Gironde ha finanziato l’intera ristrutturazione con 20,6 milioni di euro. L’obiettivo era ambizioso. Il dipartimento voleva un edificio a energia positiva e basse emissioni, con ventilazione interamente passiva nelle 42 aule distribuite sui piani superiori dei 7.500 metri quadrati di superficie. I lavori sono finiti nel settembre 2021. La scelta tecnica, affidata al bureau d’études Less is more incaricato della missione ambientale, è caduta sul sistema Windcatcher della Kingspan Light + Air. Ogni torretta è dotata di un sensore di CO2. Quando il tasso supera 1.500 parti per milione, le persiane si aprono a gradini del venti per cento, fino a quando il livello non scende sotto 1.300. Il sistema corregge da solo, senza intervento umano. Il principio fisico ha tre millenni. Si chiama badgir in persiano, malqaf in arabo. Una torre che cattura il vento, crea una differenza di pressione tra le aperture, genera un flusso d’aria che raffredda l’interno senza consumare energia. In Andalusia funziona ancora oggi. Le strade dei centri storici sono strette per tenere sempre un lato in ombra. Le facciate sono bianche, per riflettere i raggi del sole. I muri arrivano a un metro di spessore. E poi ci sono i patios: corti interne dove l’aria fresca si accumula in basso per stratificazione naturale, mentre quella calda sale ed esce. Studi condotti nelle università spagnole hanno misurato riduzioni fino a dieci gradi rispetto all’esterno durante le ondate di calore. Juan Manuel Rojas Fernández, architetto e professore all’Escola Tècnica Superior d’Arquitectura di Siviglia, le chiama strategie bioclimatiche a lungo considerate arcaiche. Oggi la loro efficacia è dimostrata scientificamente. I termitai africani funzionano con lo stesso meccanismo. Mantengono la temperatura interna costante, anche quando fuori ci sono quaranta gradi, attraverso una rete di camere e condotti che sfrutta la differenza di densità tra aria calda e aria fredda. L’Eastgate Centre di Harare, in Zimbabwe, costruito nel 1996 dall’architetto Mick Pearce, ha copiato i termitai. Un edificio di trentamila metri quadrati, uffici e negozi, che consuma il novanta per cento di energia in meno rispetto a un edificio tradizionale di pari dimensioni. Il filo che collega le strade strette di Cordova, i termitai dello Zimbabwe e le aule di Cenon passa per il Cairo. Hassan Fathy, architetto egiziano nato nel 1900, ha dedicato la vita a recuperare le tecniche di raffrescamento passive dell’architettura vernacolare nordafricana (cioè l’approccio costruttivo tradizionale locale, con materiali e tecniche del posto). Nel libro “Construire avec le peuple” ha descritto la madyafa, un riparo esterno che genera brezza attraverso un principio controintuitivo: l’apertura più piccola deve stare sopravvento, quella più grande sottovento. La differenza di pressione crea un effetto Venturi. Cioè, l’aria accelera e la temperatura percepita scende. Clément Gaillard conosce bene Fathy. Urbanista e designer, dottore in urbanistica all’Università Paris 1 Panthéon-Sorbonne, fondatore del bureau d’études Freio a Montpellier, Gaillard ha costruito la sua ricerca sul raffrescamento passivo degli spazi urbani a partire da quel patrimonio dimenticato.
A marzo 2026 ha pubblicato “Habiter un climat”, un saggio che ripercorre come le architetture del passato abbiano risposto al caldo senza motori, senza gas refrigeranti, senza bollette. Il suo progetto di ricerca sulle abrises, arredi urbani ispirati alla madyafa da installare nelle piazze delle città francesi, è ancora sulla carta. Gabriel Verd, architetto a Siviglia, indica una sola via d’uscita: solo il pubblico può integrare queste tecniche in progetti a grande scala. A Cenon l’hanno fatto. Il tempo stringe. Météo-France stima che entro il 2050, con un riscaldamento di 2,7 gradi rispetto all’era preindustriale, le ondate di calore in Francia saranno cinque volte più frequenti rispetto agli anni Novanta. Fino a cento notti tropicali l’anno nel Sud. Il numero di climatizzatori nel mondo potrebbe passare da 1,6 a 5,6 miliardi entro la stessa data. Ogni condizionatore scalda l’aria intorno a sé mentre raffredda l’interno. Il problema si autoalimenta. In Spagna l’estate 2025 è stata la più calda mai registrata. Quasi quattromila morti attribuibili al caldo. Il Conseil Départemental de la Gironde ha speso 20,6 milioni di euro per ristrutturare un collège di periferia. Una scelta tecnica che guarda al futuro.`,
    spunti: "Il raffrescamento passivo negli edifici scolastici; le soluzioni a basso consumo energetico per il comfort estivo.",
    attivita: "Cerca il principio fisico della convezione termica naturale e come viene sfruttato nelle ciminiere solari. Verifica se la tua scuola ha sistemi di ventilazione naturale o solo condizionatori.",
    summary: "Al collège Jean Jaurès, a Cenon nella periferia est di Bordeaux, quarantadue ciminiere sul tetto non fumano e non consumano elettricità: captano l'aria esterna e la spingono nelle aule sfruttando solo la convezione termica naturale, senza motori né gas refrigeranti, rinfrescando l'edificio scolastico costruito negli anni Cinquanta."
  },
  {
    num: 78, title: "Riabitare I Vuoti Urbani", city: "Roubaix", country: "Francia",
    lat: 50.6942, lon: 3.1746, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0du9nPWiBSp3AJv6AEvQJMbQ1r4GFoStnjm2QFhmtzdcCnxNQLzTGUtfzjRg51CGzl",
    text: `In Francia ci sono nove milioni di metri quadrati di uffici vuoti e quattro milioni e centomila persone che vivono in condizioni abitative inadeguate. Il problema non è la mancanza di mattoni. È la mancanza di volontà di usare quelli che esistono già. A Roubaix, nel Nord della Francia, c’è chi ha deciso di riabitare i vuoti urbani. Roubaix, area metropolitana di Lille, a pochi chilometri dal confine belga. Città industriale, operaia, costruita intorno alle fabbriche tessili. Uno dei comuni più poveri di Francia per reddito pro capite. Nel 1857 un incendio divampa in uno stabilimento a gas nel quartiere dell’Épeule. In una città così densa, un impianto del gas che esplode può radere al suolo un intero quartiere. L’industriale Henri Desclée fa un voto: se lo stabilimento scampa all’esplosione, costruirà un convento. L’esplosione non c’è. Il convento viene completato nel 1876 dall’architetto Jean-Baptiste Béthune. Le Clarisse vi conducono una vita frugale per più di un secolo. Nel maggio 2008 le ultime quattro suore lasciano Roubaix. Il Comune acquista l’edificio nel 2009. Per undici anni non sa cosa farne. Nel novembre 2019, un gruppo di architetti entra in quel monastero con gli attrezzi da lavoro e qualche materasso. Non sono stati chiamati per restaurarlo. Sono stati chiamati per abitarlo. Quando le fabbriche avevano chiuso, negli anni Ottanta e Novanta, Roubaix aveva perso lavoro, popolazione e pezzi interi di tessuto urbano. Il monastero era uno di quei pezzi. Il complesso occupa 6.500 metri quadrati nel quartiere dell’Épeule. Dal 2010 è classificato monumento storico. Nel 2019 il Comune lancia un bando. Lo vince Zerm, un collettivo di giovani architetti. Con il supporto dell’associazione “Yes We Camp”, trasformano il convento in un luogo conviviale e sperimentale. Il progetto si chiama Saisons Zéro. Gli architetti vi abitano come residenti stabili. Intorno a loro prendono forma un ostello, spazi di lavoro condiviso, sale per associazioni e attività culturali, un mercato di quartiere. Tecniche semplici ed economiche, riuso dei materiali, condivisione degli spazi. Nel settembre 2024, dopo cinque anni, Zerm ha passato la mano. Oggi è l’associazione Saisons Zéro a gestire l’ex monastero. Quello che Zerm ha fatto a Roubaix, Nicola Delon lo teorizza da vent’anni. Co-fondatore del collettivo di architettura Encore Heureux, 32 persone tra Parigi, Marsiglia e Mayotte, Delon ha costruito la sua pratica su un’idea poco accettata: ristrutturare non costa più che ricostruire. Se si pensa il contrario, è perché si continuano a sovvenzionare industrie inquinanti che abbassano artificialmente il costo dei materiali nuovi. I dati, dice Delon, lo confermano. Conservare la struttura portante di un edificio esistente taglia della metà le emissioni legate ai materiali rispetto a una costruzione nuova. Demolire e ricostruire ha un costo ambientale reale, che non appare nei bilanci ma che esiste. Il quadro normativo si muove, ma lentamente. Nel maggio 2024 una legge per facilitare la conversione di uffici in abitazioni è stata approvata all’unanimità dall’Assemblea Nazionale e poi dal Senato. I risultati, per ora, sono irrilevanti. Solo il 2% dei metri quadrati vacanti è effettivamente in fase di riconversione. Nel frattempo, a fine ottobre 2025, erano in cantiere 1,3 milioni di metri quadrati di uffici nuovi. Nuovi uffici. Mentre quelli vecchi restano vuoti. Plateau Urbain, la cooperativa che da tredici anni ridà vita a edifici abbandonati per offrire spazi accessibili al terzo settore, ha appena pubblicato “Des villes en mieux”, un libro collettivo uscito il 19 febbraio 2026. Raccoglie testimonianze, critiche, prese di posizione. Il titolo suona come una promessa. Ma chi lo sfoglia capisce subito che è anche un atto di accusa.
A Roubaix, nel monastero delle Clarisse, qualcuno sta riparando una finestra. Altri annaffiano il giardino. L’edificio non è restaurato nel senso che si intende di solito. È abitato. Di nuovo. Per ora è sufficiente.`,
    spunti: "Il riuso degli edifici vuoti come risposta alla crisi abitativa; le ex città industriali del Nord Europa e la loro riconversione.",
    attivita: "Cerca i dati sugli uffici vuoti nella tua città o regione. Confronta con i 9 milioni di mq vuoti in Francia: che percentuale rappresenterebbe nella tua città?",
    summary: "In Francia ci sono nove milioni di metri quadrati di uffici vuoti e oltre quattro milioni di persone che vivono in alloggi inadeguati: a Roubaix, ex città industriale e operaia dell'area metropolitana di Lille, si è scelto di riabitare gli spazi vuoti invece di costruirne di nuovi, trasformando edifici dismessi in nuove case."
  },
  {
    num: 79, title: "I Libri Del Riciclo", city: "Copenaghen", country: "Danimarca",
    lat: 55.6761, lon: 12.5683, category: "rifiuti",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid06S2tPmDiNSQ4ieyjxbH32VpUSY2wjUSTovP8AhUQYhCH32TijiH32JjXpB2jDbUil",
    text: `Alle dieci del mattino il Nordhavn Nærgenbrugsstation, il centro per il riciclo del moderno quartiere copenhaghese, apre i cancelli. Helsinkigade 26, a duecento metri dall’acqua. Non entrano automobili. Si arriva a piedi o in bicicletta. La piazzola è un cerchio: si cammina lungo il bordo e si lascia ogni rifiuto al suo posto. La prima cosa che si vede è uno scaffale di libri, ordinati per categoria. Si lascia quello che si è finito di leggere, si prende quello che si vuole. Senza pagare. Più in là c’è la stanza dello scambio: mobili, stoviglie, giocattoli, vestiti sulle grucce. Chi non ha più bisogno di un oggetto lo lascia lì, purché sia sano e funzionante. Chi ne ha bisogno lo porta via. Accanto, un banco per riparare la bicicletta o prendere in prestito un attrezzo, e un angolo che alcuni volontari hanno trasformato in biblioteca. Sulle pareti c’è un racconto per oggetti. Tubi trasparenti riempiti di carta, plastica colorata, trucioli di legno. Il materiale differenziato è bene in vista. Dal 2020 ogni famiglia danese divide i rifiuti in dieci tipi, uguali in tutto il Paese. Cibo, vetro, carta, cartone, plastica, metallo, cartoni per bevande, tessili, rifiuti pericolosi e indifferenziato. I tessili sono obbligatori dal primo luglio 2023. I cartoni del latte e dei succhi hanno un contenitore tutto loro: cartone fuori, pellicola dentro, sono trattati con macchine diverse. L’obiettivo del Comune è riciclare il settanta per cento dei rifiuti domestici. Quello che resta va a sud, sull’isola di Amager. Un edificio alto ottantacinque metri, con una pista da sci sul tetto. Si chiama Amager Bakke, ma tutti lo conoscono come CopenHill. L’ha disegnato lo studio di Bjarke Ingels: brucia il rifiuto residuo e ne ricava elettricità e calore. I numeri li dà chi gestisce l’impianto. Nel 2024 ha bruciato 610.000 tonnellate di rifiuto, il tre per cento in più dell’anno prima. Nel 2023, con 590.000 tonnellate, ne aveva ricavato corrente per 94.000 famiglie e calore per 87.000 appartamenti. Il ciclo non finisce nel forno. Le ceneri pesanti diventano sottofondo stradale, al posto di sabbia e ghiaia. I metalli recuperati sono diecimila tonnellate l’anno, l’acqua recuperata dai fumi un centinaio di milioni di litri. La strada che porta all’impianto è fatta, in parte, di ciò che l’impianto ha bruciato. Sul tetto, intanto, si scia. Nel 2021 CopenHill è stato votato come edificio dell’anno al World Architecture Festival. Il termovalorizzatore non sta dietro un muro in periferia. È a due chilometri dal palazzo reale, e la domenica ci salgono i bambini con gli sci ai piedi. Non tutte le promesse sono state mantenute. Copenaghen voleva essere la prima capitale a emissioni zero entro il 2025. L’impianto per catturare l’anidride carbonica dal camino si è fermato nel 2022, escluso dai fondi statali. Nel marzo 2025 ARC e la tedesca E.ON hanno firmato un nuovo accordo, CopenCapture, per catturarne 400.000 tonnellate l’anno e stoccarle nel sottosuolo a partire dal 2030. Alle quattro del pomeriggio la stazione di riciclo di Nordhavn chiude. C’è chi è entrato con una sedia e una pila di libri. È chi è uscito con un trapano in prestito e tre romanzi. La sedia è rimasta sul ripiano, in attesa. Domani mattina qualcun altro la troverà e la porterà a casa.`,
    spunti: "I centri di riciclo come spazi di comunità; il riuso diretto degli oggetti come alternativa al semplice smaltimento.",
    attivita: "Cerca cos'è un centro del riuso (diverso da un centro di raccolta rifiuti tradizionale) e se esiste qualcosa di simile vicino a te. Localizza Nordhavn rispetto al centro di Copenaghen.",
    summary: "Al Nordhavn Nærgenbrugsstation, il centro per il riciclo del moderno quartiere portuale di Copenaghen, non entrano automobili: si arriva a piedi o in bicicletta, si cammina lungo un percorso circolare e si lascia ogni oggetto al suo posto. La prima cosa che si vede è uno scaffale di libri, ordinati per categoria, pronti per essere presi da chi vuole leggerli: il riciclo come luogo di scambio, non solo di smaltimento."
  },
  {
    num: 80, title: "Il Metodo Siviglia Per Le Ondate Di Calore", city: "Siviglia", country: "Spagna",
    lat: 37.3891, lon: -5.9845, category: "calore",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0ioKLSrXm4gQYtJSUB2AmheFh1oSsDXM6c1gC26DdefA2yDniMqZd4fFSMce3t4o2l",
    text: `La chiamano la padella di Spagna. Siviglia l'anno scorso ha contato trenta giorni sopra i quaranta gradi, contro una media di dodici e otto nel decennio prima. E il caldo in Europa arriva sempre prima che cominci l'estate vera e propria. Il 25 maggio 2026 a Londra, il termometro di Kew Garden ha segnato trentaquattro e otto gradi centigradi. Il giorno di maggio più caldo mai registrato nel Regno Unito, due gradi sopra il vecchio primato. Lo stesso giorno la Francia superava i suoi record di maggio e il Portogallo sfiorava i quaranta gradi. Un'ondata a fine primavera, dodici, sedici gradi sopra la media stagionale, quando l'estate sul calendario doveva ancora arrivare. Gli scienziati dicono che è la crisi climatica a rendere queste ondate più frequenti, più lunghe, più letali. Le avvisaglie, quest'anno, si sono viste a maggio. Siviglia con il caldo ha un conto aperto da tempo. Era già stata la prima città al mondo a dare un nome alle ondate di calore, come si fa con le tempeste, Zoe nel 2022, poi Yago. Adesso prova un altro approccio. Sotto il livello della strada, in un luogo che si chiama CartujaQanat, corrono tubi neri lungo il soffitto di cemento. Si innestano in condotti azzurri e verdi, poi nelle pompe d'argento. Gli schermi di una stanza laterale segnano la temperatura, l'umidità, il vento di sopra. Fuori l'aria si avvicina ai quaranta gradi. Qui sotto no. Siamo dove nel 1992 c'era l'Expo. Oggi è un quartiere di uffici, università e musei frequentato ogni giorno da trentamila persone. L'idea viene dai qanat persiani, gallerie sotterranee che captano e incanalano l'acqua di falda. Ma a Siviglia l'acqua scorre nel sottosuolo da molto prima di questo progetto. I Caños de Carmona, l'acquedotto che i romani costruiscono sotto Giulio Cesare e che gli Almohadi rimaneggiano nel dodicesimo secolo, hanno dissetato la città fino al 1912. Lo ha ricordato a El País Ramón Velázquez, il professore emerito che progettò il sistema per regolare il microclima dell'Expo 92. I qanat, ha spiegato, esistevano già in ogni antica giudecca dell'Andalusia. Il sistema lo avevamo già, solo che nessuno lo aveva più utilizzato nell'urbanistica moderna. Il meccanismo è sempre lo stesso. L'acqua si raffredda di notte, al buio, sottoterra. Di giorno torna in superficie e raffredda l'aria, spinta poi nei dotti delle piazze. Adesso una parte sale sui tetti attraverso pompe a energia solare, viene nebulizzata in un velo sottile, ridiscende. Niente compressori, niente gas refrigeranti. I numeri di CartujaQanat li ha misurati l'Università di Siviglia. Nell'estate 2025 negli spazi interni è stata registrata una temperatura inferiore di dodici gradi rispetto a quella esterna. I pannelli solari sul tetto, trecentottanta metri quadri, hanno prodotto 55mila kilowattora. Le pompe ne hanno consumati 42mila. Il bilancio è in attivo. Il sistema produce più energia di quanta ne consumi per raffreddare. Il budget è di cinque milioni di euro, l'80 per cento finanziato dall'iniziativa Urban Innovative Actions dell'Unione Europea. Il caldo in Europa non è solo un disagio. È la prima causa di morte per eventi meteorologici estremi. Il rapporto Copernicus e Organizzazione Meteorologica Mondiale, pubblicato il 29 aprile 2026, stima circa 63mila morti per il caldo nel continente nel 2024. In Spagna, solo tra maggio e luglio dell'anno scorso, l'Istituto Carlos III ne ha attribuiti al caldo circa 1180. L'aria condizionata è la risposta facile. Ma consuma corrente, scalda la strada e soprattutto alimenta la stessa febbre che dovrebbe spegnere. Il qanat fa il contrario. Recupera una tecnica che i Mori usavano in Andalusia secoli fa, all'Alhambra di Granada, e la rimette al lavoro.
Funziona dove l'aria è secca, perché si regge sull'evaporazione. In una città umida non servirebbe a niente. Questo i ricercatori lo dicono per primi. CartujaQanat intanto si è riempita. All'ora di pranzo gli impiegati ci vengono a respirare. I ragazzi ci portano lo skateboard. Ci sono corsi di ballo frequentati da decine di persone, dove prima c'era una strada che d'estate si svuotava. Delegazioni di osservatori arrivano dalla California, dalla Germania, da Dubai. Guardano, prendono appunti. L'anno prossimo il sistema dei quanat sarà applicato a una fermata d'autobus, in una piazza e in una scuola del quartiere Macarena. L'estate è appena cominciata, un'altra ondata di calore è in arrivo. Sotto CartujaQanat l'acqua continua il suo giro. Di notte si raffredda nel buio, di giorno risale in superficie e mitiga il caldo. Semplice acqua fresca.`,
    spunti: "La classificazione delle ondate di calore come rischio nominato; il confronto tra fenomeni meteorologici estremi e la loro comunicazione pubblica.",
    attivita: "Cerca la scala di classificazione delle ondate di calore usata a Siviglia (nomi e livelli). Confronta le temperature estive di Siviglia con quelle della tua città negli ultimi 10 anni.",
    summary: "Chiamata \"la padella di Spagna\", Siviglia l'anno scorso ha contato trenta giorni sopra i quaranta gradi, contro una media di dodici nel decennio precedente: la città è stata la prima al mondo a dare un nome e una classificazione alle ondate di calore, come si fa con gli uragani, per comunicare meglio il rischio e attivare per tempo le misure di protezione."
  },
  {
    num: 81, title: "Come Si Raffredda Una Città Umida?", city: "Parigi", country: "Francia",
    lat: 48.8566, lon: 2.3522, category: "calore",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0366NcYqZxQEkazyuvFSb6GbgPJTyyjuovtFSxicrA4MgNCoawYG87W6Y7QEiY7nRgl",
    text: `Nell'ottavo arrondissement di Parigi, sul marciapiede davanti al Pont des Invalides, c'è una piastra di ghisa che pare un tombino. Sotto, una scala a chiocciola sprofonda nel buio per diversi piani. In fondo, dove la città non arriva, l'aria sa di metallo bagnato. Corrono tubi grossi come tronchi, serpeggiano condotte verdi e azzurre, ronzano le pompe. Dentro scorre acqua presa dalla Senna e raffreddata. Di sopra l'asfalto scotta. Laggiù si fabbrica il freddo. Fa quasi tutto il fiume. La sua acqua passa negli scambiatori, cede il proprio fresco alla rete e torna indietro tiepida, di pochi gradi, senza che pesci e correnti se ne accorgano. D'inverno, quando la Senna scende a uno o due gradi, il freddo si trasferisce da solo, e le macchine quasi riposano. È un principio antico, lo stesso della cantina interrata e del pozzo, rapportato in scala a una capitale. Perché tutto questo a Parigi e non a Siviglia? Nel capoluogo andaluso l'aria è secca e l'acqua che evapora strappa via il calore. Dove l'aria è già satura, sulla pianura padana, sulle coste, a Parigi nelle notti che non rinfrescano, l'evaporazione è lenta e stentata. Si cerca il fresco dentro gli edifici, stanza per stanza, e non all'aria aperta dove l'umidità è quasi palpabile. La rete parigina di raffrescamento è la più estesa d'Europa, la prima per quantità di chilometri, l'undicesima al mondo. I numeri sono di fonte statale. Centotré chilometri di condotte sotto il selciato, più di novecento edifici allacciati, tra cui il Louvre e l'Assemblea nazionale, otto grammi di anidride carbonica per ogni kilowattora di freddo, una frazione di quanto ne emette un impianto a gas. Niente apparecchi alle finestre, niente ronzio sui cortili, niente calore rovesciato in strada. Il condizionatore raffredda una stanza e scarica il calore all'esterno, dove si somma a quello di mille altri. La rete del freddo no, il calore lo restituisce al fiume. Non lavora gratis, la corrente la consuma, ma meno e in altro modo. La gestisce "Fraîcheur de Paris", controllata da Engie e dalla RATP, l'azienda pubblica dei trasporti regionali. A Milano l'acqua non arriva da un fiume. Viene dal sottosuolo. La città posa su una falda che da anni risale, perché le fabbriche che un tempo la prosciugavano hanno chiuso i loro pozzi, e l'acqua si è ripresa lo spazio. Per non vederla allagare cantine, garage e gallerie del metrò, bisogna pomparla via senza sosta. Esce a quindici gradi, costante in ogni stagione, e di norma si butta. Nella zona sud, tra i Navigli e la Bocconi, A2A la cattura dai pozzi di guardia del parco della Resistenza e la convoglia in tre edifici, il Centro civico di viale Tibaldi, la scuola Giambologna e un condominio di via Balilla che bruciava gasolio. Il progetto sperimentale dell'azienda energetica prende il nome dalla strada, Balilla. È costato 453.933 euro, ottenuti grazie a un bando europeo. Il sistema nasce per scaldare. Una pompa di calore solleva l'acqua della falda, a quindici gradi, fino a riscaldare le stanze d'inverno. D'estate la stessa macchina inverte la direzione e raffresca, restituendo alla rete il calore che sottrae, con una frazione dell'energia elettrica che servirebbe per alimentare un condizionatore. Tre soli edifici, non un intero quartiere, ma è la dimostrazione che si può fare con l'acqua che prima nessuno usava.
Pochi chilometri più a ovest, a SeiMilano, il freddo nasce in un altro modo. Qui sta sorgendo un quartiere nuovo, mille case, uffici, un parco di sedici ettari, e A2A lo raffresca senza acqua fredda e senza condizionatori. Il lavoro lo fa l'assorbitore, una macchina che produce freddo a partire dal calore. D'estate la rete di teleriscaldamento di Milano Ovest ha calore in eccesso, quello che d'inverno scalda le case e nella stagione calda non serve più. L'assorbitore lo cattura e lo trasforma in acqua fredda per i condizionamenti, fino a 6,4 megawatt. È il principio del frigorifero a gas dei camper, che fa ghiaccio con una fiamma. Sono due Milano diverse, e va detto. Balilla riusa l'acqua di scarto sotto un parco, per un condominio che prima scaldava a gasolio. SeiMilano è un quartiere nuovo di pregio, con un impianto integrato progettato fin dall'inizio. Strade lontane, ma la stessa rinuncia al vecchio condizionatore, che raffresca la stanza e intanto scalda la città. A volte sembra che Milano abbia dimenticato di essere nata sull'acqua. Nel 1288 Bonvesin de la Riva ne lodava un fossato che non chiudeva palude o stagno marcio, ma acqua viva di sorgente, fitta di pesci e di gamberi. Di tanta abbondanza si crede resti solo il riflesso dei Navigli. Eppure è ancora lì, pochi metri sotto i piedi. La si tira su ogni giorno, si paga per tirarla su. Lasciarla scorrere via senza usarla è il vero spreco. C'è infine l'approccio più antico, che funziona sia con l'aria secca sia con quella umida. L'ombra. Gli alberi lungo i marciapiedi, le tende sopra le vie strette, i muri chiari che respingono il sole invece di assorbirlo, la porta aperta di un locale fresco dove chiunque può entrare. Non raffredda la città, raffredda chi la attraversa. E quando l'evaporazione non basta, resta la sola difesa per chi non ha un condizionatore o non ha i soldi per tenerlo in funzione. A Parigi chi gestisce la rete del freddo mette in guardia da un rischio. Raphaëlle Nayral, segretaria generale di Fraîcheur de Paris, dice che il fresco può diventare un privilegio, una linea che separa chi si ripara da chi resta a cuocere durante le sempre più lunghe e frequenti ondate di calore. È qui che la posta in gioco smette di essere solo tecnica. Sotto il selciato di Parigi e nel sottosuolo di Milano, la vera domanda è un'altra. Se l'acqua fredda che scorre invisibile sotto i piedi arriverà anche all'asilo e alla casa di riposo, oppure soltanto agli uffici e alle case con la vista migliore.`,
    spunti: "Le reti urbane di raffrescamento centralizzato; l'uso dei fiumi cittadini come risorsa per il comfort termico estivo.",

    text: `A Malaga ogni albero ha un numero. Sono 110mila, di oltre 400 specie, e di ciascuno il Comune conosce la posizione esatta e il nome botanico. Un cittadino apre la mappa sul suo telefono e li vede tutti, punto per punto, sul tessuto della città. E può vedere anche altro. Settantaquattro spazi all'aperto dove l'ombra, il pavimento chiaro, una fontanella e qualche panchina rendono l'aria più sopportabile. Diciannove edifici pubblici, biblioteche, musei, centri civici, freschi tutto l'anno, con l'acqua e un posto a sedere. Ottantacinque corridoi d'ombra per attraversare la città a piedi, come il Paseo del Parque o l'avenida de Andalucía. Málaga è una città media, seicentomila abitanti, la più grande della Spagna a non essere capitale di regione. Non una metropoli con risorse illimitate. Eppure questo non è un gioco per turisti. È un catasto del fresco. Lo studio che l'ha prodotto è costato 12.300 euro, affidato a una società di forestazione urbana insieme con la Cattedra sul Cambiamento Climatico dell'Universidad de Málaga. Una cifra modesta, perché qui la spesa non è in cemento. È in conoscenza coordinata e messa a disposizione di tutti. Conviene dire subito cosa Malaga non è. Non è una città fresca. È andalusa, e d'estate cuoce come le altre. Ha pure un nemico in più, il terral, il vento secco che scende dall'interno, si comprime e si scalda, e trasforma l'aria in un getto di phon. Quando soffia, i termometri schizzano e la notte non rinfresca. Sta dentro la stessa fornace di Siviglia, di Cordova, di tutto il sud della penisola. La differenza è un'altra. Malaga ha smesso di trattare il caldo come un'emergenza che torna ogni estate. Lo affronta come un fatto permanente, con gli strumenti dell'urbanistica. L'ombra è diventata infrastruttura, un bene da censire e gestire come la rete dell'acqua o quella della luce. Non si mappa ciò che è passeggero. Si mappa ciò che resta. Lo stesso sguardo si ritrova in un parcheggio d'asfalto del campus universitario, dove la calura morde più che altrove. Lì la Fondazione Todobarro, con l'Università di Malaga, ha trasformato una vecchia casa sperimentale, nata per una gara internazionale nel 2012, in un laboratorio. Si chiama Lab Patio 2.12. È una casa di fango. Dentro, la sensazione di calore scende fino a dieci gradi sotto l'esterno, senza un solo impianto acceso. Pannelli di terracotta stampati in tre dimensioni catturano il vento e lo accelerano per spingere fuori l'aria calda. Quando il caldo stringe, la ceramica si inumidisce e l'aria che la attraversa si raffredda evaporando. Un giardino verticale, panche di terra cruda che assorbono il calore di giorno e lo restituiscono di notte. I ricercatori tolgono la tecnologia attiva, che consuma corrente, e la sostituiscono con la terra, l'acqua, l'ombra, il vento. Le stesse cose che l'architettura mediterranea usava da secoli, prima dei condizionatori. La mappa lavora sull'oggi, la casa di fango sul domani. Ma l'idea è una sola. Il caldo si combatte con la pianta della città e con il modo di costruire, non solo con il bollettino di allerta. Perché questo conta lo dicono i morti. In questi giorni l'ondata di calore che stringe l'Europa occidentale non è più solo un fatto meteorologico. Il 23 giugno l'Organizzazione Mondiale della Sanità ha alzato il livello di allerta per l'intera regione europea, cinquantatré paesi, parlando di emergenza sanitaria. Hans Kluge, il direttore per l'Europa, ha ricordato che il continente si scalda al doppio della media globale. Negli ultimi quattro anni il caldo ha ucciso più di duecentomila persone nella regione.

    text: `A quarantacinque metri di profondità il Lago Lemano è a sette gradi. D’estate, d’inverno, sempre. Sopra, in superficie, i battelli turistici tracciano scie bianche tra il Jet d’Eau e la riva di Montreux. I cigni galleggiano nel porto delle Eaux-Vives. I diplomatici attraversano il Pont du Mont-Blanc con la giacca sbottonata nel caldo di luglio. A giugno di quest'anno Ginevra ha registrato una delle ondate di calore più lunghe mai documentate. Trentasei gradi. Allerta di livello 4, la massima. Oltre due settimane di giorni tropicali consecutivi. Notti senza tregua. Il cantone ha sospeso le attività all’aperto per i lavoratori, come aveva già fatto nell’estate del 2023. Anche qui il caldo non è più un’eccezione. È il nuovo clima. Sotto la città, invisibile, scorre la risposta. Chilometri di condotte sotterranee aspirano l'acqua fredda dal fondo del lago e la portano dentro gli edifici. Si chiama GeniLac. Il più grande sistema idrotermico mai costruito a Ginevra. Il principio è elementare. L’acqua a sette gradi sale attraverso le pompe, entra negli scambiatori di calore, assorbe il caldo degli edifici e li raffredda. Poi torna nel lago, appena più tiepida. Un grado e mezzo in più, non oltre. È il limite fissato dall’autorizzazione cantonale. Se la SIG lo supera, viene sanzionata. Nella fase che gli ingegneri chiamano free cooling, quando l’acqua del lago è abbastanza fredda da raffreddare gli edifici senza bisogno di compressori, non serve nemmeno energia meccanica per la refrigerazione. Il sistema va avanti senza refrigeranti chimici, senza combustibili fossili. L’elettricità che alimenta le pompe è certificata rinnovabile al cento per cento. Il lago fa il lavoro che in qualsiasi altra città fanno migliaia di condizionatori. Con l’80 per cento di energia in meno. Il primo a crederci è stato il Palais des Nations. La sede europea delle Nazioni Unite si è allacciata nel 2009, quando il sistema si chiamava ancora GLN, Genève-Lac-Nations, ed era poco più di una stazione di pompaggio e cinque chilometri di tubi. L’organizzazione che pubblica i rapporti sul riscaldamento globale è stata la prima a raffreddarsi con il lago. Poi sono arrivate l’Organizzazione Mondiale della Sanità, l’Organizzazione Mondiale del Commercio, l’Unione Internazionale delle Telecomunicazioni, l’Organizzazione Meteorologica Mondiale. Ciascuna ha smontato i propri impianti di climatizzazione e si è collegata alla rete sotterranea. Le bollette energetiche per il raffreddamento sono scese dell’80 per cento. A gestire tutto è la SIG, Services Industriels de Genève, l’azienda pubblica che fornisce alla città elettricità, gas, acqua e teleriscaldamento. Il cuore del sistema è al Vengeron, sotto la bretella autostradale, dove nessun turista si ferma. Una stazione di pompaggio scavata nel sottosuolo. Pompe, scambiatori, quadri elettrici, il ronzio basso dei motori. I tecnici della SIG la chiamano “la cattedrale”. È stata messa in funzione nel 2024. Da lì le condotte si biforcano in due reti. La prima, a circuito aperto, porta l’acqua fredda verso il centro storico fino al Rodano. La seconda, a circuito chiuso, raggiunge l’aeroporto e il quartiere dell’Étang a Meyrin. GeniLac non raffredda soltanto. Con l’aggiunta di pompe di calore nei singoli edifici, la stessa acqua del lago produce riscaldamento. D’inverno l’acqua a sette gradi diventa la sorgente termica da cui le pompe estraggono calore e lo amplificano fino alla temperatura necessaria per i termosifoni.
Lo stesso tubo che d’estate toglie il caldo dagli uffici d’inverno scalda gli appartamenti. Un sistema bidirezionale. Una rete fatta di acqua. Nel quartiere della Jonction, dove il Rodano e l’Arve si incontrano sotto i platani, nel 2025 sono stati allacciati novanta edifici. Il Bâtiment des Forces Motrices, vecchia centrale idroelettrica trasformata in teatro. L’Hôtel des Finances. I padiglioni universitari di Scienze. La caserma dei pompieri. La scuola del quartiere. Perfino l’Usine, il centro culturale autogestito in riva al Rodano. Solo per la Jonction, la riduzione è di 10.600 tonnellate di CO2 all’anno. Il 13 febbraio 2022 i ginevrini hanno votato. Referendum popolare, come si usa qui. Il progetto è passato. La SIG ha preso l’impegno e lo sta realizzando. Il cantiere più recente è partito il 12 maggio 2025 in rue Pierre Fatio, riva destra, quartiere di Rive. Durerà tre anni. Una stazione di scambio sotterranea collegherà il centro città alla rete del lago. Da lì le condotte arriveranno fino alla zona degli ospedali universitari. Ginevra ha 200.000 abitanti, 600.000 nell’area metropolitana. Non è nell’Unione Europea ma è nel cuore dell’Europa. Le tariffe di GeniLac sono regolate dal Conseil d’État cantonale. Il freddo costa in media 21,9 centesimi svizzeri al kilowattora. Dal primo gennaio 2026 il calore è sceso di mezzo centesimo. Il costo di allacciamento per le piccole utenze è stato ridotto del 30 per cento, a 70.000 franchi svizzeri, circa 73.000 euro. Non è poco. Ma un condizionatore convenzionale consuma cinque volte di più. Durante i lavori al quai du Seujet, per posare le condotte, sono stati abbattuti 34 alberi. A cantiere concluso ne sono stati ripiantati 43. Nove in più. Oggi GeniLac serve più di cento edifici tra organizzazioni internazionali, uffici pubblici, scuole e abitazioni. Nella sola Jonction ha tagliato 10.600 tonnellate di CO2 in un anno. La rete cresce a ogni cantiere. I tubi corrono sotto le strade, sotto i parchi, sotto il letto del Rodano. In superficie non si vede nulla. Solo il lago, i cigni, il Jet d’Eau. E sotto, a quarantacinque metri, l’acqua a sette gradi che rinfresca e riscalda la città.`,

    text: `Sul quai d'Arenc, a Marsiglia, un tubo pesca l'acqua di mare a sette metri di profondità. D'estate è intorno ai ventidue gradi. Alcune macchine, le termofrigopompe, le tolgono calore, e ne esce acqua fredda a cinque gradi, che corre sottoterra fino alla torre La Marseillaise, ai Docks, all'hotel Golden Tulip, al centro commerciale Les Terrasses du Port. Presto sarà allacciato alla rete anche l'Hôpital Européen. Sui tetti di quei palazzi non c'è niente. Né condizionatori né torri di raffreddamento. Il freddo arriva dal mare. A giugno 2026 la Francia arrostisce. Il 24 giugno è il giorno più caldo mai misurato nel paese, con una media nazionale di 29,9 gradi tra giorno e notte. La notte prima è la più calda dal 1947. Settantadue dipartimenti in allerta rossa, oltre cinquanta milioni di persone. In una settimana la canicola provoca centinaia di morti, secondo il ministero della Salute. E quando fa caldo, tutti accendono il condizionatore nello stesso momento. Un condizionatore è una pompa di calore. Prende il caldo dall'interno di una stanza e lo butta fuori, nell'aria della strada, e per spostarlo consuma energia elettrica. Molta. Un apparecchio mobile, in una casa mal isolata, può aggiungere fino a 87 euro al mese alla bolletta. Il 21 e il 22 giugno le case con il climatizzatore hanno consumato il 31 per cento di elettricità in più del solito. Al culmine dell'ondata, la sola climatizzazione ha aggiunto circa dodici gigawatt alla domanda francese. La rete ha tenuto, dice il gestore RTE. Ma il conto si è visto altrove. Il prezzo all'ingrosso dell'elettricità è passato da 85 euro a megawattora a fine maggio, a quasi 280 il 23 giugno. Il 26 giugno, in un solo giorno, è salito da 114 euro a mezzogiorno a 333 alle otto di sera, quando il sole cala e i pannelli smettono di produrre ma i condizionatori restano accesi. E diversi reattori nucleari sono stati rallentati. Le centrali sul fiume devono ridurre la potenza quando i fiumi diventano troppo caldi per ricevere altro calore, come già nel 2022. Il caldo che il nucleare non riesce a scaricare nei fiumi. È lo stesso principio, rovesciato. Il condizionatore scarica il calore nell'aria della città, che è già rovente, e la scalda ancora. Più condizionatori accesi, più caldo fuori, più condizionatori. Marsiglia, in un quartiere, scarica quel calore nel mare. La centrale si chiama Thassalia. Sta sul molo del Grand Port, dentro una scatola di cemento con una specie di arpa di metallo davanti alle canne fumarie, disegnata dall'architetto Roland Carta. In funzione dal 2016, produce caldo e freddo insieme, dalla stessa acqua. D'estate cede il calore al mare per fare freddo, d'inverno glielo prende per fare caldo. La maggior parte delle reti francesi sa fare solo una delle due cose. L'acqua salata non entra mai nei palazzi. Passa in uno scambiatore, dove cede o prende calore, e torna al porto. Due volte l'anno, per impedire alle cozze di crescere dentro le macchine, viene trattata con il cloro ricavato dal suo stesso sale. Per ogni ufficio collegato al sistema, Engie stima fino al 40 per cento di elettricità consumata in meno. Non è un'idea nuova. Il Principato di Monaco si scalda e rinfresca con l'acqua di mare dal 1963, da quando venne installata una pompa di calore per riscaldare la piscina dello stadio nautico. Oggi la talassotermia copre il 17 per cento dell'energia termica del Principato. Il vincolo vero è la geografia. Serve il mare vicino, e gli edifici devono essere grandi e ravvicinati, perché ogni metro di tubo sottoterra costa. Il Cerema, l'ente pubblico francese che studia queste reti, fissa un raggio massimo di tre chilometri tra dove si produce il freddo e dove si consuma. Oltre, il beneficio si perde per strada.
Sul quai d'Arenc, l'acqua torna al porto qualche grado più calda di com'è entrata. Nella torre di vetro, sopra, nessuno la sente. Altrove, sui fiumi, l'acqua è già troppo calda per i reattori nucleari.`,
    spunti: "Il mare come fonte di energia per il raffrescamento urbano; le reti di teleraffrescamento nelle città portuali mediterranee.",

  {
    num: 85, title: "Salisburgo Si Rinfresca Con Un Condizionatore Di 900 Anni Fa", city: "Salisburgo", country: "Austria",

    text: `Alle 19, mentre il sole di luglio scende dietro il Mönchsberg, nel Festspielhaus si ascolta Mozart. Nella grande sala si cerca la "temperatura di benessere", nella prassi ventuno o ventidue gradi. Nessun condizionatore. Quattro metri sotto il palco scorre l'acqua che porta via il calore, fino a cinquantacinque litri al secondo. La stessa acqua attraversa la città da nove secoli. È l'Almkanal. L'acqua arriva dalla Königsseeache, il torrente che scende dal confine bavarese. Anche a luglio ha in media quindici, diciassette gradi. Freddo di montagna, sempre uguale. Per questo la si preferisce a un compressore. Una pergamena del Capitolo del Duomo, scritta intorno al 1150, racconta come nacque il tunnel. Tra il 1136 e il 1143 i canonici e i monaci di San Pietro fecero bucare il Mönchsberg da parte a parte. Quattrocento metri nella roccia, larghi un metro, alti due. Serviva acqua per le case, i mulini, le fontane. Serviva anche un modo per fuggire dalla città quando ce n'era bisogno. Per rivestire la galleria presero pietra dove ce n'era. Lapidi dai cimiteri, marmi dalle tombe, blocchi delle rovine romane di Iuvavum. Sono ancora lì, incastrati nelle pareti. Chi scende oggi legge nomi di morti sepolti mille anni fa. Il monte però non stava fermo. Nel 1596 il tunnel crollò. Crollò di nuovo nel 1709. Nel 1790 il cedimento fu enorme, molti tratti andarono rifatti. Ogni volta i costruttori tiravano su il condotto con la tecnica del loro secolo. Chi cammina nella galleria passa da un tratto all'altro e cambia epoca. Blocchi trapezoidali, volte a sesto acuto, archi a tutto sesto. La stessa acqua sotto tetti costruiti a trecento anni di distanza. L'acqua era anche un bene conteso. Nel 1566 l'arcivescovo pretese un terzo della portata e diventò il terzo padrone del canale, accanto al Duomo e a San Pietro. Tra Seicento e Settecento il canale alimentò le nuove fontane barocche, la Pferdeschwemme del 1693 e la Kapitelschwemme rifatta nel 1732. Nel 1803 lo Stato prese il posto della Chiesa. Nel 1878 sul registro risultavano 353 diritti d'acqua e 63 opifici. Ognuno voleva la sua parte di liquido prezioso. Nel 1899 sull'Almkanal fu costruita una centrale idroelettrica, la Eichetmühle. Una linea a tremila volt portava la corrente in città. È la più antica centrale ad acqua fluente del Land. La ruota di legno e i macchinari montati nel 1908 girano ancora oggi, fermi a quell'anno come un monumento. Alla fine dell'Ottocento l'acqua muoveva fino a centoventi ruote di mulino. La Eichetmühle non macina grano. Produce corrente elettrica. Ottocento anni dopo il primo tunnel, il monte fu bucato di nuovo. Tra il 1943 e il 1945 nel Mönchsberg furono scavati diciotto sistemi di rifugio antiaereo, ognuno con due ingressi, per quindicimila persone. Erano gallerie diverse, accanto a quella dell'acqua, che intanto continuava a scorrere. Il 16 ottobre 1944 ci fu il primo bombardamento, il più pesante. Morirono 245 persone. Molte non erano scese nei rifugi. Pensavano a un falso allarme. Oggi l'acqua non entra direttamente nelle sale. Passa in uno scambiatore, una parete di metallo che tiene divisi due circuiti. Da un lato l'acqua fredda del canale. Dall'altro l'acqua che gira dentro l'edificio, scaldata dalle luci, dai corpi, dai motori. Il calore attraversa il metallo, l'acqua del canale lo prende e lo porta via. Nessun gas refrigerante, nessun compressore. Qualche pompa, poca corrente. Nel canale principale, dodici chilometri, scorrono 5500 litri al secondo. Il Festspielhaus ne toglie al massimo cinquantacinque, e con quelli tiene fresca la sala più grande.
Lo stesso canale raffredda la Haus der Natur, il museo di storia naturale, e il Salzburg Museum. Quell'impianto fu costruito nel 1990 per un centro di calcolo in Mozartplatz. Quando il museo aprì, nel 2007, trovò l'acqua già lì e la riusò. Un'altra città avrebbe scavato per infilarci compressori, torri di raffreddamento, tubi del gas. Salisburgo ha alzato una paratia su un canale di novecento anni. Nessun rumore, poca corrente, niente da smaltire. Il freddo era già lì, bastava lasciarlo passare. A settembre il canale si ferma. Per tre settimane le chiuse restano chiuse, l'acqua non passa, gli operai scendono a pulire il fondo e a controllare le pareti. È l'Almabkehr. In quei giorni i tunnel si aprono ai visitatori. I salisburghesi scendono con le torce, i bambini camminano sul letto asciutto. Le lapidi riemergono dal buio. Poi gli operai risalgono, le paratie si alzano, il torrente torna sotto la montagna. Quindici gradi anche in piena estate. E nella sala, per la sera, si ristabilisce la "temperatura di benessere”.`,
    spunti: "Le infrastrutture idrauliche storiche riusate in chiave contemporanea; il patrimonio idrico come risorsa energetica di lunga durata.",

    summary: "Nel Festspielhaus di Salisburgo, dove ogni sera d'estate si ascolta Mozart, la sala resta fresca senza un solo condizionatore: quattro metri sotto il palco scorre l'acqua dell'Almkanal, un canale che attraversa la città da novecento anni portando via il calore, fino a cinquantacinque litri al secondo, un sistema di raffrescamento medievale ancora perfettamente funzionante."

    text: `A sud di Grenoble, oltre l'ultima rotonda industriale, la strada entra in un'area dove non c'è niente da vedere. Prati, filari, recinzioni basse. Nessun capannone, nessun campo arato, nessuna casa nuova. Duemilatrecento ettari così, il perimetro di protezione più esteso d'Europa attorno a un campo di captazione. Sotto ci sono i pozzi di Rochefort. L'acqua sale già potabile. Nessuno la clora, nessuno la tratta con l'elettrolisi. Un laboratorio sul posto la analizza tutti i giorni. In meno di quarantotto ore è nei rubinetti della città, ancora fredda, senza sapore. L’acqua viene da lontano. Nasce dai ghiacciai degli Écrins, a tremila metri, scende con il Drac e la Romanche e filtra nelle falde alluvionali che alimentano il 90 per cento degli abitanti della metropoli. Ma le Alpi si scaldano più in fretta del resto della Francia, oltre due gradi sopra il livello preindustriale contro una media nazionale di 1,4. Il regime del Drac sta cambiando. La piena di fusione nevosa arriva prima e pesa meno, finisce a giugno invece che a fine luglio, e la magra si presenta con settimane di anticipo. Per questo quei 2300 ettari restano vuoti. Vincolarli costa ogni anno. Clorare a valle costerebbe meno. A dicembre 2025 la Métropole pubblica la tariffa, 3,41 euro al metro cubo tutto compreso. La media francese, secondo l'osservatorio pubblico SISPEA, sta a 4,69 sui dati 2023. Ventisette punti di differenza. Il servizio è di una régie, azienda interamente pubblica, senza soci privati e senza azionisti da pagare. Ci sono voluti trentotto anni per arrivarci. Il 3 ottobre 1987 il sindaco Alain Carignon incontra i dirigenti della Lyonnaise des Eaux. Governa Grenoble dal 1983 con una maggioranza di destra, è gaullista, allora nel RPR e oggi in Les Républicains. Il 30 ottobre 1989 il consiglio comunale lo autorizza a firmare venticinque anni di concessione. L'acqua della città passa a una filiale del gruppo Suez. Negli stessi anni arrivano il rifinanziamento di due giornali a lui riconducibili, un appartamento di 280 metri quadri a Parigi, viaggi in aereo taxi, una crociera. Il tribunale conterà 2,9 milioni di euro. Carignon viene arrestato nell'ottobre 1994 e il 9 luglio 1996 la corte d'appello di Lyon chiude la partita, quattro anni di carcere e cinque di ineleggibilità. L'ex sindaco resta in carcere ventinove mesi, la pena più lunga mai scontata da un politico francese per corruzione. Qui la storia dovrebbe finire. Invece nel 1995 la sinistra si prende il municipio. Sindaco è Michel Destot, socialista, e nel programma della coalizione il ritorno dell'acqua al pubblico è scritto nero su bianco. Non succede. Il contratto con la Lyonnaise non viene rescisso, viene rinominato. Nasce la Société des Eaux de Grenoble, società a economia mista, il Comune dentro e il privato pure. La SEG affida poi la gestione operativa alla SGEA, controllata al cento per cento dalla Lyonnaise des Eaux. Sulla carta l'acqua è tornata ai grenoblesi. Nei fatti la fa girare la stessa azienda di prima, dietro una sigla nuova. Chi porta il Comune in tribunale non è l'opposizione. Raymond Avrillier e Vincent Comparat, ecologisti di ADES, sono consiglieri della maggioranza di Destot. Si presentano al tribunale amministrativo come utenti e contribuenti e impugnano le delibere del proprio sindaco, per anni, mentre il servizio continua a funzionare come prima.
Il 1° ottobre 1997 il Consiglio di Stato dà loro ragione. Annulla la delibera con cui, otto anni prima, il consiglio comunale aveva autorizzato Carignon a firmare. Cade l'atto di partenza e cadono tutti quelli costruiti sopra. Il 20 marzo 2000 il consiglio comunale vota il ritorno alla gestione pubblica. L'anno dopo nasce la régie. Il resto è amministrazione. Nel 2015 il servizio passa dal Comune alla Métropole. Il 1° gennaio 2025 viene assorbita l'ultima società rimasta, quella che si occupava della distribuzione. Grenoble è la prima grande città francese a fare marcia indietro verso l’acqua pubblica. L'hanno seguita Parigi nel 2010, Rennes, Brest, Nizza, Nantes, oltre quaranta comuni in venticinque anni. Il 22 marzo 2026 Grenoble va al ballottaggio per il municipio. Alain Carignon ha settantasei anni e al primo turno è arrivato primo. La sera dello spoglio si ferma a 22.297 voti, il 43,41 per cento. Vince Laurence Ruffin. Nel giugno 2011 ventisei milioni di italiani votano sì a due referendum sull'acqua. Il primo cancella l'obbligo di mettere il servizio idrico a gara. Il secondo toglie dalla bolletta la remunerazione garantita del capitale investito, cioè il profitto assicurato a chi gestisce, indipendentemente da come gestisce. Quei due sì non sono mai stati applicati. Nemmeno abrogati. Il testo unico sui servizi pubblici locali, dicembre 2022, prevede fra i modi ordinari di affidare l'acqua la società mista, cioè il Comune e un socio privato dentro la stessa azienda. È la formula che a Grenoble ha lasciato la Lyonnaise al suo posto per cinque anni dopo la condanna del sindaco. Al Comune che voglia invece un'azienda tutta sua il testo unico chiede una motivazione rafforzata, un piano economico-finanziario, la prova che il pubblico costa meno del mercato. Per la gara e per la società mista quella prova non serve. Napoli ha scelto la forma più difficile da smontare. ABC è un'azienda speciale, ente di diritto pubblico, e non ha azioni da vendere. L'Acquedotto Pugliese, il più grande d'Europa, è una società per azioni a capitale interamente pubblico, l'87 per cento alla Regione. Il capitale è tutto pubblico, ma le azioni esistono, e le azioni si possono cedere. Intanto in Puglia le fonti danno il 28 per cento in meno di acqua rispetto alla media del decennio e gli invasi hanno perso il sessantuno per cento delle riserve. AQP la definisce la crisi più grave del millennio. Dal 20 ottobre 2025 la pressione è ridotta su tutta la rete, per abbassare lo stress sulle condotte e contenere le perdite. Una legge regionale pugliese del 2024 sposta ai Comuni il venti per cento delle quote di AQP, a titolo gratuito, e vincola la gestione pubblica per vent'anni. Al 21 luglio 2026 hanno deliberato in 76 su 257, gli altri dovrebbero seguire. A Rochefort intanto i pozzi continuano a tirare su acqua. Acqua azzurra, acqua chiara, acqua pubblica.`,

    text: `Quaranta gradi. È la terza canicola dell'anno. In Place de Catalogne, XIV arrondissement, la gente cerca l'ombra e la trova. Quattrocentosettanta alberi, 270 grandi e medi, 200 giovani. Oltre quattromila metri quadrati di foresta urbana, 860 dei quali lasciati a radura. Sotto le chiome il termometro segna quattro gradi in meno che al sole. È un dato misurato. A marzo ha aperto la rue du Commandant Mouchotte, che prolunga la foresta. Centonovantatré alberi, tremila metri quadrati di piena terra, una pista ciclabile. Hanno pochi mesi, sono sottili, non fanno ancora ombra. Otto anni fa, qui, il verde non lo vedeva quasi nessuno. Al questionario che il Comune tenne aperto da maggio a settembre 2018 risposero 1.043 persone. Solo il 3 per cento indicò Maine- Montparnasse come un luogo naturale, dove trovare vegetazione. Per il 65 per cento era il simbolo di una concezione urbana e architettonica superata. Tra chi ci passava, il 78 per cento non si fermava: non è un posto piacevole per camminare, risposero nel questionario. Alla riunione di lancio, il 25 maggio 2018, si presentarono in quattrocento. Sul registro digitale, aperto dal 2019 al 2022, finirono 110 proposte, votate 1.735 volte. Una sola richiesta metteva d'accordo tutti. Alberi, piena terra, acqua piovana trattenuta nel suolo invece che dispersa nei tombini. Maine-Montparnasse è figlio degli anni Cinquanta-Settanta. Grandi altezze. Urbanistica su piastre di cemento sopraelevate che separano i pedoni dal traffico. Un centro commerciale chiuso su sé stesso, che taglia il quartiere in due. I cittadini chiedevano di tornare al livello stradale. Nel luglio 2019 la consultazione internazionale se l'aggiudica lo studio britannico Rogers Stirk Harbour + Partners. Duemila alberi promessi, ottocento milioni di euro, cantiere fino al 2030. Poi tutto si inceppa. Il progetto esce dal perimetro edificabile, non rispetta il regolamento urbanistico, non regge sui conti. La committenza pubblico-privata si scioglie. Il Comune prosegue da solo sugli spazi pubblici. I privati chiamano un altro architetto. È Renzo Piano Building Workshop, incaricato nel 2022, fermato nel 2023, ripartito nel 2025. Il 7 gennaio 2026 Comune e proprietari firmano il protocollo. Piano mostra le prime immagini e commenta i suoi alberi senza enfasi. Non è geniale, dice, ma non è nemmeno male. Sono 151 alberi. Quelli di Rogers erano duemila. Il resto sta in poche righe. Settantatremilaquattrocento metri quadrati tra centro commerciale e torre CIT, un terzo in più di oggi. Cinquemilaseicento di alloggi per studenti, il 30 per cento a canone sociale. Il commercio si riduce del 28 per cento. Al centro, una piazza di quaranta metri per quaranta, alberata. Poche demolizioni: la struttura degli anni Sessanta resta come ossatura, per non emettere altra CO2 oltre quella già spesa a costruirla. Volumi nuovi in legno. Cantiere dal 2028 al 2032. Poi è arrivato il 2026. La Francia ha attraversato tre ondate di calore in sei mesi. La prima a fine maggio, la più precoce mai osservata. La seconda a giugno, la più intensa mai registrata: il 24 giugno la media nazionale ha toccato i trenta gradi. La terza a luglio, oltre quaranta, notti senza fresco. I suoli sono più secchi che nel 1976. Il 15 luglio novantanove dipartimenti hanno razionato l'acqua. Parigi soffre il caldo più di quasi ogni altra capitale europea. Nel 2021 il 90 per cento dei parigini viveva dentro un'isola di calore da tre a sei gradi sopra la campagna intorno. Il cemento accumula il sole di giorno e lo restituisce di notte.

    num: 88, title: "Che Spreco L’Acqua Depurata Che Non Si Riusa", city: "Murcia", country: "Spagna",

    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid0wAic6BPHXGZcAUhyCZ9D9C3tQuFX2xYxw9zg3jRcKZFwJ32eAjwoVsWGHpnXR1DSl",
    text: `Da tre mesi ormai il caldo asfissia gran parte dell'Europa. Il Po è in stato di severità idrica alta. Reno, Loira e Danubio scendono a livelli eccezionalmente bassi, come si vede dalle immagini satellitari di Copernicus, il programma di osservazione della Terra dell'Unione europea. Coldiretti stima che oltre il 60 per cento del territorio italiano sia colpito dalla siccità, aggravata dalla crisi climatica. La siccità è arrivata in pochi mesi, dopo un inverno piovoso. Il caldo prosciuga terreni e fiumi più in fretta di quanto le piogge li ricarichino. Contro un fenomeno che torna e si aggrava, l'Unione europea ha pochi strumenti immediati. Uno dei più concreti non prevede nuovi prelievi e consumo aggiuntivo di acqua, bensì il riuso di quella già depurata. Ogni giorno gli impianti puliscono le acque di scarico, poi quasi ovunque le lasciano finire in mare. È una delle politiche ambientali su cui l'Europa ha lavorato di più e anche una delle più snobbate. Con qualche eccezione positiva. Nella Región de Murcia, nel sud est della Spagna, l'acqua che esce dai depuratori non va in mare. Va ai campi. L'ente pubblico della depurazione, ESAMUR, riusa il 98 per cento dell'acqua che rigenera. Nel 2023 ne ha data agli agricoltori per 121 milioni di metri cubi. Oggi un settimo dell'acqua che irriga la regione arriva da lì. Va avanti così da oltre vent'anni. C'è un secondo ciclo, nello stesso impianto. I fanghi finiscono in vasche chiuse, dove i batteri li digeriscono senza ossigeno. Ne esce biogas. I depuratori di Murcia ne ricavano oltre dieci milioni di chilowattora di elettricità l'anno, e la usano per far funzionare gli impianti. Parte dell'energia che serve a trattare l'acqua deriva dall'acqua stessa. Murcia fa da sola quello che gran parte d'Europa non fa. L'Unione europea ricicla circa un miliardo di metri cubi di acque reflue l'anno. È il 2,4 per cento di quanto esce dai depuratori. Il potenziale è sei volte tanto, ha ricordato il 30 luglio l'agenzia europea CINEA. Lo strumento normativo c'è. Da giugno 2023 il regolamento 2020/741 fissa in tutta l'Unione i requisiti di qualità per usare le acque reflue nei campi. L'acqua esce già dagli impianti. Va trattata un'ultima volta, con filtri e disinfezione, fino al grado adatto all'agricoltura. Si chiama acqua affinata. Dove questo processo viene adottato, i vantaggi sono evidenti. A Cipro funziona quasi ovunque. L'isola riusa oltre il 90 per cento delle sue acque reflue. Il motivo è anche economico. L'acqua affinata costa meno della metà di quella potabile, perché lo Stato ne sostiene il prezzo. L'agricoltore la compra perché conviene. Malta arriva al 60 per cento. Non è solo questione di Mediterraneo. Dal 1954 a Braunschweig, nel nord della Germania, i campi si irrigano con l'acqua depurata della città. Circa 2.700 ettari, dieci milioni di metri cubi l'anno. Con l'acqua arrivano azoto e fosforo, che concimano. Dai fanghi si ricava il biogas che alimenta la centrale. Acqua, nutrienti ed energia nello stesso ciclo, da settant'anni. Sull'energia il caso più evidente è danese. Il depuratore di Marselisborg, ad Aarhus, produce più energia di quanta ne consumi. Trenta per cento in più di elettricità, settantacinque in più di calore, dal biogas dei fanghi. Abbastanza da coprire il ciclo idrico di una città di duecentomila abitanti. Un impianto che alleggerisce la bolletta invece di gonfiarla. In Italia il riferimento resta Milano. Il depuratore di Nosedo lavora dal 2003. Nel 2025 i due impianti gestiti dalla municipalizzata MM hanno trattato 241,7 milioni di metri cubi. Cinquantuno sono andati all'irrigazione. Il 21 per cento sull'anno, il cento per cento durante la stagione irrigua. L'acqua di Nosedo alimenta una novantina di aziende agricole, quattromila ettari, mais e foraggio. Oltre Milano e pochi altri impianti, il Paese è fermo. L'Italia riusa solo il quattro per cento delle sue acque depurate, a fronte di un potenziale di nove miliardi di metri cubi l'anno.
Il Mezzogiorno, dove la siccità morde più spesso e più duramente, ha le reti più vecchie e i depuratori fermi al trattamento di base. Manca il passaggio che rende l'acqua riusabile. Uno spreco inaccettabile.`,
    spunti: "Il riuso dell'acqua depurata come risorsa contro la siccità; il confronto tra le crisi idriche dei grandi fiumi europei.",
    attivita: "Cerca i livelli attuali del Po, del Reno, della Loira e del Danubio (siti di monitoraggio idrologico) e confrontali con le medie storiche. Localizza la Región de Murcia sulla carta della Spagna.",
    summary: "Da tre mesi il caldo asfissia gran parte d'Europa: Po, Reno, Loira e Danubio scendono a livelli eccezionalmente bassi, e oltre il 60% del territorio italiano è colpito dalla siccità. Nella Región de Murcia, nel sud-est della Spagna, invece, l'acqua depurata dagli impianti non finisce in mare come quasi ovunque: l'ente pubblico ESAMUR ne riusa il 98% per irrigare i campi."
  },
  {
    num: 89, title: "Berlino Gli Alberi L’Acqua E Gli Open Data", city: "Berlino", country: "Germania",
    lat: 52.52, lon: 13.405, category: "verde",
    link: "https://www.facebook.com/pinobruno.giornalista/posts/pfbid02sdwyJBzoEhkKqQ1L8gg1UTZLnKrdgbmeRFiqLsnrR6ubysnsN1H8xmbkJeH2pHgNl",
    text: `A Berlino ogni albero ha un numero. Un codice tecnico li identifica uno per uno nel catasto comunale: la specie, l'anno della messa a dimora, quanta acqua gli serve. Di schede così ne esistono 885.825, quanti sono gli alberi tra strade e parchi. Da qualche anno si possono consultare su una mappa in rete, e vedere punto per punto quali hanno sete. La mappa si chiama Gieß den Kiez, "annaffia il quartiere". L'ha costruita nel maggio 2020 il CityLAB Berlin, il laboratorio pubblico di innovazione digitale della città. Lo gestisce la Technologiestiftung, una fondazione finanziata dal governo cittadino. Denaro pubblico, quindi. Il cittadino adotta un albero, registra quanti litri gli ha dato e quando, e vede sulla mappa chi ha già bevuto e chi aspetta ancora. I dati vengono dal catasto comunale, aggiornato ogni anno dai dodici uffici del verde di quartiere. La pioggia caduta negli ultimi trenta giorni arriva dal servizio meteorologico federale, il Deutscher Wetterdienst, e si aggiorna ogni notte. Le informazioni sulle pompe pubbliche, più di milleottocento, con lo stato di funzionamento, vengono da OpenStreetMap. Il codice è aperto, pubblicato su GitHub. C'è un nome per tutto questo: Open Data. Dati pubblici, aperti, che chiunque può scaricare e riusare senza chiedere permesso e senza pagare. Il catasto degli alberi, le misure della pioggia, la posizione delle pompe. E la fondazione che ha costruito la mappa gestisce anche l'ufficio comunale che apre i dati di Berlino, l'ODIS. La stessa mano che libera i dati realizza lo strumento per usarli. Quando dati e codice sono liberi, il lavoro fatto una volta serve a molti: la mappa è arrivata a Lipsia, che l'ha chiamata Leipzig gießt, e poi a Magdeburgo. Copiare da chi fa bene dovrebbe essere la formula magica per ogni amministrazione pubblica. Gli uffici del verde curano gli alberi giovani fino a cinque anni. Poi si fermano, perché le squadre non bastano. Restano scoperti gli alberi tra i cinque e i dieci anni, quelli che hanno ancora bisogno d'acqua ma non rientrano più nella manutenzione ordinaria. È quella la fascia che i volontari coprono. Non è partecipazione simbolica. È supplenza a un limite del servizio pubblico, ammesso senza giri di parole. La stessa app avverte che la stima della sete è solo un'approssimazione. Quanti siano, questi volontari, lo dicono gli Open Data. Dal 2020 si sono iscritte circa 4.500 persone, e poco più di quattromila hanno annaffiato almeno una volta. Insieme, in sei anni, hanno versato oltre due milioni di litri su circa undicimila alberi. È un lavoro vero. Ma gli alberi mappati sono quasi 886.000: quelli toccati dai volontari sono poco più dell'uno per cento. La cittadinanza attiva aiuta ma non sostituisce. Annaffiare un tiglio è il gesto di uno. Tenere in vita gli alberi di una città intera è un compito di tutti, e in una città quel tutti ha un nome: servizio pubblico. Il motivo per cui tutto questo esiste sta nei numeri degli alberi. Alla fine del 1990 Berlino ne aveva circa 370.000 lungo le strade. Nel 2016 erano quasi 438.000. Poi la curva si è rovesciata. Prima la tempesta dell'autunno 2017. Subito dopo il 2018, l'anno più secco e più caldo che la Germania avesse mai registrato dal 1881: a Berlino non piovve per mesi, e la temperatura media dell'anno toccò 11,4 gradi, la più alta tra le regioni tedesche. Gli alberi giovani, con le radici ancora corte, furono i primi a seccare. Un albero secco non torna verde: i rami si spezzano, il tronco si svuota, e sotto ci passa la gente. Va abbattuto. Tra il 2018 e il 2019 Berlino ne ha tolti più di settemila. Non tutti per la siccità, ma la siccità ci ha messo del suo. Da allora, quattro estati aride una dietro l'altra, fino al 2022.
Non è un episodio passeggero. L'analisi del rischio climatico presentata il 2 marzo 2026 dall'amministrazione ambientale di Berlino misura la temperatura media della città salita di 2,1 gradi rispetto al trentennio con cui sono cominciate le rilevazioni, dopo il 1881. Gli alberi che seccano d'estate sono la conseguenza di quei due gradi. Dietro l'albero che ha sete c'è la questione dell'acqua, e qui Berlino è un caso quasi unico. Da più di centosessant'anni la capitale beve dalla propria falda, dentro il perimetro cittadino. Lo impone la legge sull'acqua del Land. L'acqua per l'uso pubblico va presa in larga misura dalle riserve del proprio territorio. Circa 660 pozzi profondi, tra i trenta e i centoquaranta metri, alimentano nove impianti. La rete di distribuzione è lunga 7.892 chilometri. Ogni giorno servono in media 600.000 metri cubi d'acqua. Ma quella falda va riempita, e la pioggia da sola non basta più. Così Berlino cerca di trattenere ogni goccia che cade. Nel maggio 2018 il Land e le aziende dell'acqua hanno fondato la Regenwasseragentur, l'agenzia dell'acqua piovana. Dallo stesso anno vale una regola per i nuovi cantieri. La pioggia va fatta infiltrare, evaporare o riusare sul posto, non scaricata in fogna. Sotto il Gendarmenmarkt, la piazza monumentale nel centro, durante il restauro sono state interrate vasche drenanti che ogni anno riportano nel terreno circa ottomila metri cubi d'acqua. La città che assorbe come una spugna, invece di respingere. Nel catasto ci sono anche alberi che hanno più di trecento anni. Sulla mappa non diventano quasi mai rossi. Le radici sono scese così in fondo da pescare da sole nella falda, la stessa da cui beve la città. A restare in rosso sono gli alberi giovani, piantati da meno di dieci anni, ancora troppo piccoli per arrivare all'acqua. Il progetto vive di soldi pubblici, rinnovati di anno in anno. Come ogni cosa che dipende da un bilancio, dura finché qualcuno decide che deve durare. E Berlino ha scelto di curare i suoi alberi con l’aiuto dei cittadini più consapevoli.`,
    spunti: "Il catasto digitale del patrimonio arboreo urbano; la partecipazione dei cittadini alla cura del verde pubblico tramite dati aperti.",
    attivita: "Cerca se esiste una mappa digitale degli alberi della tua città come 'Gieß den Kiez'. Calcola quanti alberi ci sono in un parco vicino a te, anche solo stimandoli.",
    summary: "A Berlino ogni albero ha un numero: un codice tecnico identifica ciascuno dei 885.825 alberi tra strade e parchi della città, con specie, anno di piantumazione e fabbisogno d'acqua. Dal 2020 questi dati sono consultabili su una mappa online, \"Gieß den Kiez\" (annaffia il quartiere), che permette a chiunque di vedere quali alberi hanno sete e magari di dargli da bere."

  {
    num: 90, title: "Amsterdam Le Auto Sotto Il Canale", city: "Amsterdam", country: "Paesi Bassi",
    lat: 52.3676, lon: 4.9041, category: "mobilita",

    text: `Sulla Marnixstraat, verso le sei di sera, un'auto rallenta davanti alla piscina comunale. Imbocca una rampa, la sbarra si alza, la macchina scende e sparisce. Sopra, adesso, c'è un canale. Barche ormeggiate, acqua ferma. Il conducente ha parcheggiato nel Singelgracht, due piani sotto la superficie, insieme ad altre ottocento automobili che nessuno vede. Il turista conta le biciclette e crede di aver capito tutto di Amsterdam. Sbaglia. Le biciclette ci sono, un terzo degli spostamenti in città avviene in sella, dice l'ufficio statistico del Comune. A fine anni Novanta erano meno di un quarto. Ma gli altri due terzi si muovono a piedi, coi mezzi, in automobile. Le auto esistono anche qui, come dappertutto. La differenza è che non si vedono, o se ne vedono meno. Bisogna sapere dove guardare. Per costruire questo garage hanno fatto una cosa semplice da dire e complicata da fare. Hanno tolto l'acqua dal canale. Pareti d'acciaio piantate nel fondale a delimitare il tratto, l'acqua pompata via, e al posto del canale un fosso asciutto lungo quattrocento metri. Lì dentro, per tre anni e mezzo, hanno scavato e gettato cemento. La terra, centomila metri cubi, non ha mai toccato le strade del quartiere. È uscita in chiatta, navigando sul canale stesso. Finito il guscio, hanno rimesso l'acqua sopra il tetto e tolto le pareti d'acciaio. Il quartiere ha pagato il conto a modo suo. Durante i lavori decine di cantine si sono allagate, e qualcuno ancora chiama l'opera "il garage dell'alluvione". Il giorno dell'apertura, 27 febbraio 2024, il Comune ha regalato ombrelli all'ingresso. Umorismo olandese. Ottocento posti, l'80 per cento riservato ai residenti con permesso, uno su dieci con la ricarica elettrica. Murales alle entrate pedonali, dipinti da un'artista a partire dalle storie degli abitanti. Il visitatore paga 0,65 euro ogni 6 minuti, massimo 65 euro al giorno. Proprietario e gestore, il Comune di Amsterdam. E qui sta il punto, perché il garage da solo non spiega niente. Amsterdam non ha aggiunto ottocento posti auto alla città. Li ha soltanto spostati. Per ogni posto aperto sotto il canale ne sparisce uno in superficie. I residenti con permesso della Frederik Hendrikbuurt e del Jordaan parcheggiano sotto senza spese in più. Nelle loro strade, ridisegnate, i posti auto lasciano spazio a marciapiedi, rastrelliere per le bici, vegetazione. Chi teneva l'auto davanti al portone ora la tiene sotto l'acqua. Davanti al portone è tornato il marciapiede. Nel solo 1971 il traffico uccise nei Paesi Bassi 3.200 persone. Quattrocento erano bambini sotto i quattordici anni. Nacque una fondazione dal nome inequivocabile, Stop de Kindermoord!, fermate la strage dei bambini! Due anni dopo la crisi petrolifera impose le domeniche senza auto, la prima il 4 novembre 1973. Gli olandesi videro le strade vuote e i bambini al sicuro. Da allora la questione non è mai stata se odiare o amare l'automobile. È stata dove metterla perché desse meno fastidio. Oggi la risposta ha un nome di quelli che i burocrati amano inventare per farci soffrire. Agenda Amsterdam Autoluw, il programma per la città a basso traffico, presentato nel 2019 e adottato dal consiglio nel gennaio 2020. Prevede di cancellare 7.000-10.000 posti auto dalla strada, circa 1.500 permessi in meno l'anno. Non è rimasto sulla carta. Una ricerca universitaria con analisi cartografica ha contato 9.665 posti su strada riassegnati tra il 2017 e il 2024 a verde, biciclette, case. Il conto è pubblico.
Per il Marnix il consiglio ha stanziato 74,7 milioni di euro e mette in bilancio circa 6 milioni l'anno di disavanzo di gestione, coperti dal fondo comunale per la mobilità. I comitati si sono opposti per anni, centomila euro a posto auto, dicevano, e nel 2010 il quartiere votò contro in una consultazione locale. Il Comune costruì lo stesso. C'è chi sostiene che i parcheggi interrati nei centri storici attirino traffico. Ad Amsterdam l'obiezione cade sull'aritmetica. La capacità non cresce, cala ogni anno. E i registri delle targhe, che contano auto e non opinioni, dicono 0,4 auto per famiglia, il valore più basso di tutti i comuni olandesi, dove la media nazionale è di un'auto a famiglia. Intanto il modello si replica a trenta minuti di treno. A Utrecht la bici copre il 44 per cento degli spostamenti urbani, l'auto è scesa al 17. Le auto private registrate, 109.513 al 1° gennaio 2024, calano dello 0,7 per cento l'anno, in una città che cresce. Eppure proprio lì sorge Merwede, il più grande quartiere senza auto dei Paesi Bassi, 6.000 alloggi per 12.000 abitanti, parcheggi solo nei garage interrati ai bordi. Ad Amsterdam, intanto, sul Singelgracht le barche ondeggiano appena sull’acqua. Due piani più sotto, ottocento automobili aspettano il mattino. Nessuno le vede.`,
    spunti: "I parcheggi sotterranei sotto i canali storici; la convivenza tra patrimonio storico dell'acqua e mobilità contemporanea.",
    attivita: "Cerca quanti parcheggi sotterranei sotto i canali esistono ad Amsterdam. Localizza il Singelgracht sulla mappa storica della città e rifletti sul rapporto tra canali e mobilità.",
    summary: "Sulla Marnixstraat, un'auto rallenta davanti alla piscina comunale, imbocca una rampa e scompare sotto un canale: è entrata nel parcheggio sotterraneo del Singelgracht, due piani sotto la superficie, insieme ad altre ottocento automobili invisibili ai turisti che, contando solo le biciclette, credono di aver capito tutto di Amsterdam."
