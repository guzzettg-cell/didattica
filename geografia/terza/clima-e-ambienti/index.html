<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clima e ambienti della Terra – Lezioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --paper:#FAFBF9; --ink:#1D2A30; --muted:#5B6B70; --line:#C9D2CE;
  --accent:#2F6E57; --soft:#DCE9E2; --ocean:#2C5872; --no:#B3412F;
  --warm:#E3A64B; --temp:#8DBF8B; --cold:#A9C7DE;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141C1F; --paper:#1B2529; --ink:#E4EAE7; --muted:#9AAAA9; --line:#2F3C40;
    --accent:#62B08E; --soft:#22332D; --ocean:#80B1CC; --no:#E07A66;
    --warm:#B98236; --temp:#5E8E5C; --cold:#5E7F98;
  }
}
:root[data-theme="dark"]{
  --bg:#141C1F; --paper:#1B2529; --ink:#E4EAE7; --muted:#9AAAA9; --line:#2F3C40;
  --accent:#62B08E; --soft:#22332D; --ocean:#80B1CC; --no:#E07A66;
  --warm:#B98236; --temp:#5E8E5C; --cold:#5E7F98;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.125rem;line-height:1.65}
a{color:var(--ocean)}
:focus-visible{outline:3px solid var(--ocean);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);line-height:1.1;margin:0}
p{max-width:68ch}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:4px solid var(--accent)}
.top-in{max-width:56rem;margin:0 auto;padding:.6rem 1.25rem .4rem;display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;justify-content:space-between}
.brand{font-family:var(--cond);font-weight:700;font-size:1.4rem;line-height:1.1;color:var(--ink);text-decoration:none}
.brand small{display:block;font-weight:500;font-size:.95rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;font-family:var(--cond);color:var(--muted)}
.tools label{display:flex;align-items:center;gap:.4rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:600 1rem var(--cond);background:transparent;color:var(--muted);border:0;padding:.3rem .65rem;cursor:pointer;min-width:2.4rem}
.seg button+button,.seg span+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:disabled{opacity:.35;cursor:default}
.seg .lvl{font:600 .95rem var(--cond);padding:.3rem .5rem;border-left:1px solid var(--line);min-width:3.4rem;text-align:center}
nav.les{max-width:56rem;margin:0 auto;padding:0 1.25rem;display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
nav.les::-webkit-scrollbar{display:none}
nav.les a{font-family:var(--cond);font-weight:600;font-size:1.05rem;color:var(--muted);text-decoration:none;padding:.4rem .7rem .45rem;border-bottom:3px solid transparent;white-space:nowrap}
nav.les a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:56rem;margin:0 auto;padding:1.8rem 1.25rem 4rem}
.lhead{display:flex;gap:1rem;align-items:baseline}
.lhead .n{font-family:var(--cond);font-weight:700;font-size:3.4rem;color:var(--accent);line-height:.9}
.lhead h1{font-size:clamp(1.9rem,4.5vw,2.8rem)}
.question{margin:1.4rem -1.25rem 0;padding:1.6rem 1.25rem 1.7rem;background:var(--accent);color:#fff}
.question span{font-family:var(--cond);font-size:1.05rem;opacity:.85}
.question p{font-style:italic;font-size:clamp(1.45rem,3.4vw,2.05rem);line-height:1.3;margin:.3rem 0 0;max-width:30ch}
:root[data-theme="dark"] .question{color:#10201A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .question{color:#10201A}}

section.step{margin-top:2.4rem}
.tag{display:inline-block;font-family:var(--cond);font-weight:600;font-size:1rem;color:var(--accent);border:1.5px solid var(--accent);border-radius:20px;padding:0 .7rem;margin-bottom:.5rem}
section.step h2{font-size:1.8rem;margin-bottom:.4rem}
.chain{font-family:var(--cond);font-size:1.22rem;font-weight:600;background:var(--soft);border-radius:8px;padding:.75rem 1rem;margin:.8rem 0;line-height:1.5}
.box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;margin:1rem 0}
.box h3{font-size:1.25rem;margin-bottom:.3rem}
.box p{margin:.3rem 0}
.tbl{overflow-x:auto;margin:.8rem 0}
table{border-collapse:collapse;width:100%;min-width:30rem;font-size:1rem;background:var(--paper)}
th,td{text-align:left;padding:.5rem .65rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--cond);font-weight:600;font-size:1.08rem}
ul{padding-left:1.2rem} li{margin:.2rem 0}
figure{margin:1rem 0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1rem}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:.95rem;color:var(--muted);margin-top:.5rem}

.places{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin:1rem 0}
.places figure{margin:0;padding:0;overflow:hidden}
.places img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.places figcaption{padding:.5rem .8rem .6rem;margin:0;color:var(--ink);font-family:var(--cond);font-size:1.1rem;font-weight:600}
.places figcaption span{display:block;font-family:var(--serif);font-weight:400;font-size:.92rem;color:var(--muted)}
@media (max-width:640px){.places{grid-template-columns:1fr}}
.chips{list-style:none;padding:0;margin:.4rem 0 0;display:flex;flex-wrap:wrap;gap:.45rem}
.chips li{font-family:var(--cond);font-weight:600;font-size:1.08rem;background:var(--soft);border-radius:20px;padding:.15rem .8rem;margin:0}
/* esercizi */
.ex{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:1rem 1.2rem;margin:1rem 0}
.ex .cons{font-weight:600;margin:0 0 .6rem}
.item{display:grid;grid-template-columns:1fr minmax(11rem,auto);gap:.4rem 1rem;align-items:center;padding:.55rem 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.item p{margin:0}
select{font:1rem var(--serif);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;max-width:100%}
.fb{grid-column:1/-1;font-family:var(--cond);font-size:1.02rem;margin:0}
.ok{color:var(--accent)} .no{color:var(--no)}
.item.ok select{border-color:var(--accent);outline:2px solid var(--accent)}
.item.no select{border-color:var(--no);outline:2px solid var(--no)}
.btn{font:600 1.05rem var(--cond);background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:.45rem 1rem;cursor:pointer;margin-top:.7rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:.4rem}
.result{font-family:var(--cond);font-size:1.15rem;margin:.6rem 0 0}
ol.ord{list-style:none;padding:0;margin:.4rem 0;counter-reset:o}
ol.ord li{counter-increment:o;display:grid;grid-template-columns:2rem 1fr auto;gap:.6rem;align-items:center;background:var(--bg);border-radius:8px;padding:.5rem .7rem;margin:.35rem 0}
ol.ord li::before{content:counter(o);font-family:var(--cond);font-weight:700;font-size:1.3rem;color:var(--accent)}
ol.ord li.ok{outline:2px solid var(--accent)} ol.ord li.no{outline:2px solid var(--no)}
.mv{display:flex;gap:.3rem}
.mv button{font:600 1rem var(--cond);width:2.2rem;height:2.2rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;cursor:pointer}
.mv button:disabled{opacity:.3;cursor:default}
textarea{width:100%;min-height:6rem;font:1rem/1.5 var(--serif);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.7rem}
.saved{font-family:var(--cond);font-size:.95rem;color:var(--muted)}

.book{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:1rem 1.2rem}
.book .row{margin-top:.5rem}
.book b{font-family:var(--cond);font-size:1.15rem;display:block}
body[data-book="geo"] .bk-vivi,body[data-book="vivi"] .bk-geo{display:none}
.exit{background:var(--soft);border-radius:10px;padding:1.1rem 1.2rem}
.exit p{font-style:italic;font-size:1.15rem;margin:0 0 .6rem}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line)}
.pager a{font-family:var(--cond);font-weight:600;font-size:1.15rem;text-decoration:none}
.pager small{display:block;color:var(--muted);font-weight:500;font-size:.95rem}

/* home */
.hero h1{font-size:clamp(2.3rem,6vw,3.6rem)}
.hero p{font-size:1.2rem;color:var(--muted)}
.tiles{display:grid;gap:.7rem;margin:2rem 0;padding:0;list-style:none}
.tiles a{display:grid;grid-template-columns:3.2rem 1fr;gap:1rem;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;text-decoration:none;color:inherit}
.tiles a:hover{border-color:var(--accent)}
.tiles .n{font-family:var(--cond);font-weight:700;font-size:2.4rem;color:var(--accent);line-height:1}
.tiles b{font-family:var(--cond);font-size:1.35rem;display:block;line-height:1.15}
.tiles span{color:var(--muted);font-style:italic;font-size:1rem}

/* glossario */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.term:hover,.term[aria-expanded="true"]{color:var(--accent)}
#tip{position:fixed;z-index:40;max-width:min(22rem,calc(100vw - 1.5rem));background:var(--ink);color:var(--paper);border-radius:8px;padding:.7rem .9rem;font-size:.97rem;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip b{font-family:var(--cond);font-size:1.12rem;display:block;margin-bottom:.15rem}
#tip[hidden]{display:none}

@media (max-width:640px){
  .item{grid-template-columns:1fr}
  .tools>label>span{display:none}
}
@media print{
  .top,.btn,.mv,.pager,.tools{display:none!important}
  body{background:#fff}
  .question{color:#000;background:#eee}
}
</style>
</head>
<body data-book="both">
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home">Clima e ambienti della Terra<small>Geografia 3, Modulo I</small></a>
    <div class="tools">
      <label><span>Il mio libro</span>
        <span class="seg" role="group" aria-label="Il mio libro">
          <button type="button" data-b="both" aria-pressed="true">Tutti e due</button>
          <button type="button" data-b="geo" aria-pressed="false">Geoagenda</button>
          <button type="button" data-b="vivi" aria-pressed="false">Vivi la Geo</button>
        </span>
      </label>
      <label><span>Testo</span>
        <span class="seg" role="group" aria-label="Dimensione del testo">
          <button type="button" id="zOut" aria-label="Riduci il testo">A−</button>
          <span class="lvl" id="zLvl" aria-live="polite">100%</span>
          <button type="button" id="zIn" aria-label="Ingrandisci il testo">A+</button>
        </span>
      </label>
    </div>
  </div>
  <nav class="les" aria-label="Lezioni" id="nav"></nav>
</header>

<main id="app" tabindex="-1"></main>
<div id="tip" role="tooltip" hidden></div>

<script>
/* ================= GLOSSARIO ================= */
const GLOSS={
  tempo:["Tempo atmosferico","Le condizioni dell'atmosfera (temperatura, piogge, vento) in un luogo e in un momento precisi. Cambia da un giorno all'altro."],
  clima:["Clima","Le condizioni atmosferiche medie di un luogo, calcolate osservando il tempo atmosferico per almeno 30 anni."],
  latitudine:["Latitudine","La distanza di un punto dall'Equatore, misurata in gradi lungo un meridiano: da 0° all'Equatore a 90° ai poli, Nord o Sud. È il fattore principale del clima."],
  longitudine:["Longitudine","La distanza di un punto dal meridiano di Greenwich, misurata in gradi lungo un parallelo: da 0° a 180°, Est o Ovest. Serve a localizzare un luogo e a calcolare i fusi orari, ma non influisce direttamente sul clima."],
  insolazione:["Insolazione","La quantità di energia solare che arriva su una superficie. È maggiore quando i raggi del Sole arrivano perpendicolari, minore quando arrivano inclinati."],
  asse:["Inclinazione dell'asse","L'asse terrestre è inclinato di circa 23° rispetto alla perpendicolare al piano dell'orbita. Per questo, durante l'anno, i raggi del Sole colpiscono gli emisferi in modo diverso e si alternano le stagioni."],
  rivoluzione:["Moto di rivoluzione","Il movimento della Terra intorno al Sole. Dura circa 365 giorni e 6 ore e, insieme all'inclinazione dell'asse, produce le stagioni."],
  zone:["Zone astronomiche","Le fasce della Terra delimitate dai tropici e dai circoli polari: una zona torrida, due zone temperate e due zone polari (o glaciali)."],
  altitudine:["Altitudine","L'altezza di un luogo sul livello del mare. Salendo la temperatura diminuisce di circa 0,6 °C ogni 100 metri."],
  correnti:["Correnti oceaniche","Grandi masse d'acqua che si spostano negli oceani. Le correnti calde rendono più miti le coste che raggiungono, quelle fredde le raffreddano."],
  sopravvento:["Sopravvento e sottovento","Il versante sopravvento di un rilievo è quello esposto al vento umido e riceve più piogge; il versante sottovento è quello riparato, più secco."],
  escursione:["Escursione termica","La differenza tra la temperatura più alta e quella più bassa in un periodo (un giorno, un anno). Vicino al mare è minore, nell'interno dei continenti è maggiore."],
  precipitazioni:["Precipitazioni","L'acqua che cade dal cielo: pioggia, neve, grandine. Si misurano in millimetri (mm) all'anno."],
  bioma:["Bioma","Un grande ambiente naturale, caratterizzato da vegetazione e animali adattati a un certo clima. Lo stesso bioma può trovarsi in continenti diversi."],
  zonaclimatica:["Zona climatica","Un'area della Terra in cui temperature e precipitazioni sono simili durante l'anno."],
  pluviale:["Foresta pluviale","Foresta fittissima e sempreverde delle zone equatoriali, dove fa caldo e piove tutto l'anno. Gli alberi formano diversi strati, i più alti superano i 40 metri."],
  savana:["Savana","Distesa di erbe alte con alberi sparsi, come acacie e baobab. Il clima è caldo, con una stagione delle piogge e una stagione secca."],
  deserto:["Deserto","Ambiente in cui cadono meno di 250 mm di pioggia all'anno. Nei deserti caldi le temperature sono altissime di giorno e scendono molto di notte."],
  predeserto:["Predeserto","Fascia ai margini dei deserti, con piogge scarse e irregolari e vegetazione bassa e rada."],
  macchia:["Macchia mediterranea","Vegetazione di arbusti e piccoli alberi sempreverdi (leccio, corbezzolo, mirto), adattata a estati calde e secche."],
  latifoglie:["Foresta di latifoglie","Bosco di alberi con foglie larghe che cadono in autunno, come querce, faggi e castagni. Tipica dei climi temperati con piogge regolari."],
  prateria:["Prateria (o steppa)","Grande distesa d'erba con pochi alberi, nelle zone temperate interne dove piove poco e c'è una forte escursione termica."],
  taiga:["Taiga","Immensa foresta di conifere (abeti, pini, larici) delle zone fredde continentali, con inverni lunghissimi e gelidi."],
  tundra:["Tundra","Ambiente subpolare senza alberi: crescono muschi, licheni e piccoli arbusti. Sotto la superficie il terreno resta gelato tutto l'anno (permafrost)."],
  permafrost:["Permafrost","Terreno che rimane gelato in profondità per tutto l'anno."],
  deforestazione:["Deforestazione","Il taglio o l'incendio delle foreste per fare spazio a pascoli, coltivazioni, miniere o strade."],
  desertificazione:["Desertificazione","Il processo per cui un terreno fertile perde la sua fertilità e diventa simile a un deserto, per cause naturali e umane."],
  cementificazione:["Cementificazione","La copertura del suolo con cemento e asfalto per costruire case, strade e parcheggi."],
  erosione:["Erosione","L'asportazione del suolo da parte di acqua e vento. È più forte dove il terreno non è protetto dalla vegetazione."],
  habitat:["Habitat","L'ambiente in cui una specie vive e trova cibo, riparo e condizioni adatte."],
  glaciazione:["Glaciazione","Un lungo periodo freddo in cui i ghiacci si estendono su gran parte dei continenti. L'ultima ha raggiunto il massimo circa 20.000 anni fa."],
  interglaciale:["Periodo interglaciale","Il periodo più caldo tra due glaciazioni. Oggi viviamo in un periodo interglaciale."],
  serra:["Effetto serra","Alcuni gas dell'atmosfera trattengono parte del calore della Terra, come i vetri di una serra. Senza questo effetto naturale la Terra sarebbe gelata; se aumentano i gas serra, aumenta anche la temperatura."],
  gasserra:["Gas serra","I gas che trattengono il calore nell'atmosfera, come l'anidride carbonica (CO₂) e il metano. Aumentano soprattutto bruciando petrolio, carbone e gas."],
  riscaldamento:["Riscaldamento globale","L'aumento della temperatura media della Terra osservato dalla fine dell'Ottocento, dovuto soprattutto all'aumento dei gas serra prodotti dalle attività umane."],
  fossili:["Combustibili fossili","Petrolio, carbone e gas naturale: si sono formati in milioni di anni da resti di organismi. Bruciandoli si libera CO₂."]
};
const T=(k,label)=>`<button type="button" class="term" data-term="${k}">${label||GLOSS[k][0].toLowerCase()}</button>`;

/* ================= ESERCIZI ================= */
const EX={};
function SEL(id,cons,opts,items){
  EX[id]={type:"sel",items};
  return `<div class="ex" data-ex="${id}"><p class="cons">${cons}</p>
  ${items.map((it,i)=>`<div class="item" data-i="${i}"><p>${it[0]}</p>
    <select data-sel="${id}:${i}" aria-label="Risposta"><option value="">Scegli…</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select>
    <p class="fb" aria-live="polite"></p></div>`).join("")}
  <button class="btn" type="button" data-check="${id}">Controlla</button><button class="btn ghost" type="button" data-reset="${id}">Ricomincia</button>
  <p class="result" aria-live="polite"></p></div>`;
}
function ORD(id,cons,items,show){
  EX[id]={type:"ord",items,show};
  return `<div class="ex" data-ex="${id}"><p class="cons">${cons}</p><ol class="ord" id="ord-${id}"></ol>
  <button class="btn" type="button" data-check="${id}">Controlla</button><button class="btn ghost" type="button" data-reset="${id}">Ricomincia</button>
  <p class="result" aria-live="polite"></p></div>`;
}
function TXT(id,cons,ph){
  return `<div class="ex"><p class="cons">${cons}</p><textarea data-txt="${id}" aria-label="${cons.replace(/<[^>]+>/g,"").replace(/"/g,"")}" placeholder="${ph||"Scrivi qui"}"></textarea><span class="saved">La risposta resta salvata su questo dispositivo.</span></div>`;
}

/* ================= SVG lezione 1 ================= */
const SVG1=`<svg viewBox="0 0 600 320" role="img" aria-labelledby="s1t">
<title id="s1t">I raggi del Sole arrivano perpendicolari all'Equatore e inclinati vicino ai poli; le fasce colorate sono le zone astronomiche.</title>
<defs><clipPath id="earth"><circle cx="230" cy="165" r="120"/></clipPath>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#E3A64B"/></marker></defs>
<polygon points="0,150 191,150 191,180 0,180" fill="#E3A64B" opacity=".35"/>
<polygon points="0,52 269.6,52 221.5,84 0,84" fill="#E3A64B" opacity=".35"/>
<line x1="0" y1="165" x2="184" y2="165" stroke="#E3A64B" stroke-width="3" marker-end="url(#ar)"/>
<line x1="0" y1="68" x2="235" y2="68" stroke="#E3A64B" stroke-width="3" marker-end="url(#ar)"/>
<g transform="translate(80,0)">
<g clip-path="url(#earth)">
<rect x="100" y="40" width="260" height="15" fill="var(--cold)"/>
<rect x="100" y="55" width="260" height="62" fill="var(--temp)"/>
<rect x="100" y="117" width="260" height="96" fill="var(--warm)"/>
<rect x="100" y="213" width="260" height="62" fill="var(--temp)"/>
<rect x="100" y="275" width="260" height="15" fill="var(--cold)"/>
</g>
<circle cx="230" cy="165" r="120" fill="none" stroke="var(--ink)" stroke-width="2"/>
<line x1="110" y1="165" x2="350" y2="165" stroke="var(--ink)" stroke-dasharray="5 4"/>
<path d="M111,150 A120,120 0 0 0 111,180" fill="none" stroke="var(--no)" stroke-width="5"/>
<path d="M189.6,52 A120,120 0 0 0 141.5,84" fill="none" stroke="var(--no)" stroke-width="5"/>
</g>

const L=[];

L.push({n:1,title:"Perché sulla Terra esistono climi diversi?",
q:"Perché alla stessa ora in alcuni luoghi fa molto caldo e in altri molto freddo?",
geo:"Capitolo 20, §1 Le zone astronomiche e le stagioni",
vivi:"Unità 2, Lezione 2 I moti della Terra; Unità 3, Lezione 1 I climi e gli ambienti",
body:`
<section class="step"><span class="tag">Osserva</span><h2>Quattro luoghi, quattro climi</h2>
<p>Guarda questi quattro luoghi. In questo momento, nello stesso giorno, le temperature sono completamente diverse.</p>
${PLACES}
${TXT("1-ipotesi","Da che cosa può dipendere una differenza così grande? Scrivi la tua ipotesi prima di continuare.","Secondo me dipende da…")}
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Tempo o clima?</h2>
<p>Quando diciamo «oggi piove» parliamo del ${T("tempo")}: com'è l'atmosfera in un luogo e in un momento preciso. Quando diciamo «in Sicilia le estati sono calde e secche» parliamo del ${T("clima")}: le condizioni medie di un luogo, osservate per molti anni.</p>
${SEL("1-tc","Tempo o clima? Scegli per ogni frase.",["Tempo","Clima"],[
 ["Domani a Milano è prevista neve.","Tempo","È una previsione per un giorno preciso."],
 ["Nel deserto del Sahara piove pochissimo durante tutto l'anno.","Clima","Descrive una caratteristica che si ripete ogni anno."],
 ["Ieri il vento forte ha fatto cadere un albero.","Tempo","Riguarda un evento di un giorno."],
 ["A Londra piove spesso in tutte le stagioni.","Clima","È una caratteristica media, che si ripete negli anni."],
 ["Questa mattina a Roma c'è nebbia.","Tempo","Riguarda solo questa mattina."],
 ["Nella foresta del Congo fa caldo e piove in tutte le stagioni.","Clima","Descrive com'è il Congo anno dopo anno."],
 ["Sabato scorso una grandinata ha rovinato i raccolti.","Tempo","È un evento avvenuto in un giorno preciso."],
 ["In Lapponia gli inverni sono lunghi e gelidi.","Clima","Descrive come sono sempre gli inverni in quella regione."],
 ["Oggi a Torino la temperatura massima è di 18 °C.","Tempo","È la misura di una sola giornata."],
 ["In montagna, d'estate, fa più fresco che in pianura.","Clima","È una differenza che si ripete ogni estate: dipende dall'altitudine."]])}
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Il Sole non scalda tutti allo stesso modo</h2>
<p>La Terra è una sfera. Vicino all'Equatore i raggi del Sole arrivano quasi perpendicolari: la loro energia si concentra su una superficie piccola e scalda molto. Vicino ai poli i raggi arrivano inclinati: la stessa energia si distribuisce su una superficie più ampia e scalda poco. Per questo la ${T("latitudine")}, cioè la distanza dall'Equatore, è il primo fattore del clima.</p>
<figure>${SVG1}<figcaption>Due fasci di raggi uguali: all'Equatore colpiscono un piccolo tratto di superficie (in rosso), vicino al polo un tratto molto più lungo.</figcaption></figure>
<p>In più l'asse terrestre è inclinato e la Terra gira intorno al Sole: durante l'anno i raggi colpiscono i due emisferi in modo diverso, e nascono le stagioni.</p>
<div class="chain">forma della Terra + ${T("asse")} + ${T("rivoluzione")} → diversa ${T("insolazione")} → temperature diverse → ${T("zone")}</div>
<p>Le zone astronomiche sono cinque: una <b>zona torrida</b> tra i due tropici, due <b>zone temperate</b> tra i tropici e i circoli polari, due <b>zone polari</b> oltre i circoli polari.</p>
<div class="box"><h3>Attenzione a non confondere</h3><p>La ${T("longitudine")} serve a localizzare un luogo e a calcolare i fusi orari, ma non cambia il clima: due città alla stessa latitudine e a longitudini diverse possono avere climi simili.</p></div>
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Gli altri fattori del clima</h2>
<p>La latitudine non basta. Luoghi alla stessa latitudine possono avere climi molto diversi, perché intervengono altri fattori.</p>
<div class="tbl"><table><thead><tr><th>Fattore</th><th>Che cosa fa</th></tr></thead><tbody>
<tr><th scope="row">${T("altitudine","Altitudine")}</th><td>Salendo di quota la temperatura diminuisce: circa 0,6 °C ogni 100 metri.</td></tr>
<tr><th scope="row">Distanza dal mare</th><td>Il mare si scalda e si raffredda lentamente: vicino alla costa gli inverni sono più miti e le estati più fresche, cioè c'è una minore ${T("escursione")}.</td></tr>
<tr><th scope="row">${T("correnti","Correnti oceaniche")}</th><td>Le correnti calde rendono più miti le coste, quelle fredde le raffreddano.</td></tr>
<tr><th scope="row">Venti</th><td>Portano aria calda o fredda, umida o secca.</td></tr>
<tr><th scope="row">Rilievi</th><td>Le montagne fermano i venti umidi: il versante ${T("sopravvento")} riceve molte piogge, quello sottovento resta secco.</td></tr>
<tr><th scope="row">Vegetazione</th><td>Le foreste trattengono umidità e fanno ombra, rendendo il clima locale più fresco e umido.</td></tr>
</tbody></table></div>
</section>

<section class="step"><span class="tag">Mettiti alla prova</span><h2>Qual è il fattore?</h2>
<div class="box"><h3>I fattori tra cui scegliere</h3><ul class="chips">
<li>${T("latitudine","Latitudine")}</li><li>${T("altitudine","Altitudine")}</li><li>Distanza dal mare</li><li>${T("correnti","Correnti oceaniche")}</li><li>Rilievi</li><li>Vegetazione</li></ul></div>
${SEL("1-fatt","Leggi ogni caso e scegli il fattore che spiega la differenza.",["Latitudine","Altitudine","Distanza dal mare","Correnti oceaniche","Rilievi","Vegetazione"],[
 ["Due città alla stessa latitudine: una è sulla costa, l'altra nell'interno del continente. Nella seconda gli inverni sono molto più freddi.","Distanza dal mare","Il mare mitiga le temperature delle coste."],
 ["La Paz, in Bolivia, è vicina all'Equatore ma ha temperature fresche tutto l'anno: si trova a più di 3.600 metri.","Altitudine","Salendo di quota la temperatura diminuisce."],
 ["I porti della Norvegia restano liberi dal ghiaccio anche d'inverno, pur essendo vicini al Circolo polare.","Correnti oceaniche","Una corrente calda che arriva dall'Atlantico addolcisce il clima della costa."],
 ["Su un lato di una catena montuosa piove moltissimo, sull'altro lato il clima è secco.","Rilievi","Il versante sopravvento riceve le piogge, quello sottovento resta all'asciutto."],
 ["In estate in una piazza senza alberi fa più caldo che nel parco lì accanto.","Vegetazione","Gli alberi fanno ombra e trattengono umidità."]])}
${TXT("1-catena","Scegli uno dei casi e completa la catena: fattore → che cosa modifica → conseguenza sul clima.","Esempio: altitudine → …")}
</section>`,
exit:["Indica tre fattori che determinano il clima e spiega l'effetto di uno di essi."]});

L.push({n:2,title:"Dal clima ai biomi",
q:"Se conosco temperatura e precipitazioni di un luogo, posso immaginare che paesaggio troverò?",
geo:"Capitolo 20, §2 Le zone climatiche e i biomi",
vivi:"Unità 3, Lezione 1 I climi e gli ambienti",
body:`
<section class="step"><span class="tag">Osserva</span><h2>Indovina il paesaggio</h2>
${SEL("2-dati","Leggi i dati e scegli la vegetazione che ti aspetti.",["Foresta fitta e sempreverde","Poche piante, adattate alla siccità","Boschi di alberi che perdono le foglie","Muschi, licheni e piccoli arbusti"],[
 ["Caldo tutto l'anno + molte piogge","Foresta fitta e sempreverde","Con caldo e acqua abbondanti le piante crescono senza sosta."],
 ["Caldo + pochissime piogge","Poche piante, adattate alla siccità","Senza acqua possono vivere solo piante specializzate."],
 ["Temperature moderate + piogge regolari","Boschi di alberi che perdono le foglie","D'inverno fa freddo e gli alberi si fermano, perdendo le foglie."],
 ["Molto freddo + poche precipitazioni","Muschi, licheni e piccoli arbusti","Con il freddo intenso gli alberi non riescono a crescere."]])}
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Clima e bioma non sono la stessa cosa</h2>
<p>Il clima descrive l'atmosfera: temperature e ${T("precipitazioni")}. Il ${T("bioma")} descrive l'ambiente che si forma in quel clima: le piante e gli animali che ci vivono. Un'area con temperature e precipitazioni simili forma una ${T("zonaclimatica")}.</p>
<div class="chain">CLIMA = temperatura + precipitazioni + altri fattori<br>↓<br>BIOMA = grande ambiente naturale con vegetazione e animali adattati a quel clima</div>
<p>Per questo lo stesso bioma si trova in continenti lontanissimi, se il clima è simile: la savana c'è in Africa, ma anche in Sud America e in Australia.</p>
<div class="tbl"><table><thead><tr><th>Zone</th><th>Clima in breve</th><th>Biomi</th></tr></thead><tbody>
<tr><th scope="row">Caldo-umide</th><td>caldo tutto l'anno, piogge abbondanti o stagionali</td><td>${T("pluviale")}, ${T("savana")}</td></tr>
<tr><th scope="row">Aride</th><td>piogge scarsissime</td><td>deserti caldi e freddi, ${T("predeserto","predeserti")}</td></tr>
<tr><th scope="row">Temperate</th><td>stagioni ben distinte, temperature moderate</td><td>${T("macchia")}, ${T("latifoglie","foreste di latifoglie")}, ${T("prateria","praterie")}</td></tr>
<tr><th scope="row">Fredde</th><td>inverni lunghi e gelidi</td><td>${T("taiga")}, ${T("tundra")}, ghiacci</td></tr>
</tbody></table></div>
</section>

<section class="step"><span class="tag">Mettiti alla prova</span><h2>A quale zona appartiene?</h2>
${SEL("2-zone","Per ogni bioma scegli la zona climatica.",["Caldo-umida","Arida","Temperata","Fredda"],[
 ["Foresta pluviale","Caldo-umida"],["Savana","Caldo-umida"],["Deserto","Arida"],["Macchia mediterranea","Temperata"],
 ["Foresta di latifoglie","Temperata"],["Prateria","Temperata"],["Taiga","Fredda"],["Tundra","Fredda"]])}
${TXT("2-carta","Osserva la carta dei biomi del mondo (in classe o sul libro): in quali continenti trovi la foresta pluviale? E la taiga? Perché, secondo te?")}
</section>`,
exit:["Spiega in una frase perché clima e bioma non sono sinonimi."]});

L.push({n:3,title:"Gli ambienti caldi: troppa acqua o troppo poca?",
q:"Com'è possibile che vicino ai tropici esistano sia foreste fittissime sia deserti quasi senza vegetazione?",
geo:"Capitolo 20, §3 Le zone caldo-umide e §4 Le zone aride",
vivi:"Unità 3, Lezioni 2 La foresta pluviale e la giungla, 3 La savana, 4 I deserti caldi, 5 Le oasi del Sahara",
body:`
<section class="step"><span class="tag">Osserva</span><h2>Tre paesaggi caldi</h2>
<p>Pensa alla foresta del Congo, alla savana del Kenya e al deserto del Sahara. In tutti e tre fa caldo.</p>
${SEL("3-acqua","Che cosa cambia davvero fra questi tre ambienti?",["Soprattutto la temperatura","Soprattutto l'acqua disponibile"],[
 ["La differenza principale è…","Soprattutto l'acqua disponibile","Le temperature sono alte in tutti e tre: a cambiare è la quantità di pioggia."]])}
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Stesso caldo, acqua diversa</h2>
<div class="chain">stessa fascia calda → quantità di acqua molto diversa → ambienti completamente diversi</div>
<div class="tbl"><table><thead><tr><th>Ambiente</th><th>Temperature</th><th>Precipitazioni</th><th>Vegetazione</th></tr></thead><tbody>
<tr><th scope="row">${T("pluviale")}</th><td>elevate tutto l'anno</td><td>abbondanti tutto l'anno</td><td>fitta, sempreverde, a più strati</td></tr>
<tr><th scope="row">${T("savana")}</th><td>elevate</td><td>stagionali: una stagione piovosa e una secca</td><td>erbe alte e alberi sparsi</td></tr>
<tr><th scope="row">${T("deserto")}</th><td>altissime di giorno, basse di notte</td><td>meno di 250 mm all'anno</td><td>molto rada</td></tr>
</tbody></table></div>
<div class="box"><h3>Come si sopravvive</h3>
<p><b>Nella foresta</b> le piante competono per la luce: gli alberi più alti superano i 40 metri, sotto crescono strati sempre più bassi.</p>
<p><b>Nella savana</b> molti animali migrano seguendo le piogge; alberi come il baobab accumulano acqua nel tronco.</p>
<p><b>Nel deserto</b> le piante hanno radici lunghissime o fusti che conservano acqua; molti animali sono attivi solo di notte. Ci sono anche deserti freddi, come il Gobi, e fasce di ${T("predeserto")} ai loro margini. Dove l'acqua affiora, l'uomo ha creato le oasi.</p></div>
</section>

<section class="step"><span class="tag">Mettiti alla prova</span><h2>Indovina il bioma</h2>
${SEL("3-dossier","Leggi ogni dossier e riconosci il bioma.",["Foresta pluviale","Savana","Deserto caldo","Predeserto"],[
 ["Temperatura media di 27 °C, piogge durante tutto l'anno, vegetazione altissima.","Foresta pluviale"],
 ["Temperature elevate, sei mesi secchi e sei mesi piovosi, erba alta e alberi sparsi.","Savana"],
 ["Meno di 250 mm di pioggia all'anno, di giorno oltre 40 °C, di notte molto fresco.","Deserto caldo"],
 ["Ai margini del deserto, piogge scarse e irregolari, cespugli bassi e radi.","Predeserto"]])}
${TXT("3-indizio","Scegli un dossier e spiega quale indizio ti ha fatto riconoscere il bioma.")}
</section>`,
exit:["Completa: «Foresta pluviale e deserto possono trovarsi entrambi in zone calde, ma…»"]});

L.push({n:4,title:"Dalle zone temperate ai poli",
q:"Che cosa succede al paesaggio man mano che ci allontaniamo dai tropici?",
geo:"Capitolo 20, §5 Le zone temperate e §6 Le zone fredde",
vivi:"Unità 3, Lezioni 6 Gli ambienti temperati e 7 Gli ambienti freddi",
body:`
<section class="step"><span class="tag">Osserva</span><h2>Un viaggio verso nord</h2>
${ORD("4-viaggio","Immagina di partire dalla Grecia e viaggiare verso il Polo Nord, attraverso l'Europa orientale e la Russia. Metti gli ambienti nell'ordine in cui li incontreresti, usando le frecce.",
 ["Macchia mediterranea","Foresta di latifoglie","Prateria (steppa)","Taiga","Tundra","Ghiacci perenni"],[3,0,5,2,1,4])}
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Tre climi temperati</h2>
<div class="tbl"><table><thead><tr><th>Clima</th><th>Caratteristiche</th><th>Ambiente</th></tr></thead><tbody>
<tr><th scope="row">Mediterraneo</th><td>estati calde e secche, inverni miti e piovosi</td><td>${T("macchia")}</td></tr>
<tr><th scope="row">Oceanico</th><td>temperature miti, piogge in tutte le stagioni</td><td>${T("latifoglie","foreste di latifoglie")}</td></tr>
<tr><th scope="row">Continentale</th><td>estati calde, inverni freddi, forte ${T("escursione")}</td><td>foreste di latifoglie e ${T("prateria","praterie")}</td></tr>
</tbody></table></div>
<h2 style="margin-top:1.6rem">Tre climi freddi</h2>
<div class="chain">continentale freddo → ${T("taiga")}<br>subpolare → ${T("tundra")}<br>polare → ghiacci perenni</div>
<p>Più ci si avvicina al polo, più l'estate si accorcia. Prima scompaiono gli alberi a foglia larga, poi le conifere; nella tundra il terreno resta gelato in profondità (${T("permafrost")}) e crescono solo muschi e licheni. Oltre, solo ghiaccio.</p>
<div class="box"><h3>Lo stesso succede salendo in montagna</h3><p>Salendo di quota il paesaggio cambia come andando verso il polo: boschi di latifoglie, poi conifere, poi prati d'alta quota, rocce e ghiacciai.</p></div>
</section>

<section class="step"><span class="tag">Mettiti alla prova</span><h2>Riconosci la tappa</h2>
${SEL("4-tappe","Leggi la descrizione e scegli l'ambiente.",["Macchia mediterranea","Foresta di latifoglie","Prateria","Taiga","Tundra","Ghiacci perenni"],[
 ["Estati calde e secche, inverni miti: arbusti sempreverdi come il leccio e il corbezzolo.","Macchia mediterranea"],
 ["Piogge regolari, alberi che in autunno perdono le foglie, come querce e faggi.","Foresta di latifoglie"],
 ["Distese d'erba senza alberi, estati calde e inverni rigidi, poche piogge.","Prateria"],
 ["Inverni lunghissimi e gelidi, foreste sconfinate di abeti, pini e larici.","Taiga"],
 ["Il terreno è gelato in profondità tutto l'anno; crescono muschi e licheni.","Tundra"],
 ["Temperature quasi sempre sotto zero, nessuna vegetazione.","Ghiacci perenni"]])}
${TXT("4-difficolta","Per ogni tappa del viaggio scrivi una difficoltà per la vita delle persone.")}
</section>`,
exit:["Qual è la differenza fondamentale tra taiga e tundra?"]});

L.push({n:5,title:"Come trasformiamo gli ambienti?",
q:"Un ambiente naturale resta naturale quando arriva l'uomo?",
geo:"Capitolo 20, §2, parte conclusiva",
vivi:"Unità 4, Lezioni 1 La crisi degli ecosistemi terrestri, 2 I limiti del pianeta, 4 La riduzione delle specie viventi e il degrado del pianeta",
body:`
<section class="step"><span class="tag">Osserva</span><h2>Prima e dopo</h2>
<p>Una foresta viene trasformata in un campo coltivato. Un pendio naturale diventa un quartiere di case e strade.</p>
${TXT("5-effetti","Quali effetti possono avere queste trasformazioni, oltre a cambiare il paesaggio?")}
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Trasformare non è sempre degradare</h2>
<p>Gli esseri umani hanno sempre trasformato gli ambienti: con l'agricoltura, le città, le strade. Si parla di <b>degrado</b> quando la trasformazione danneggia l'ambiente in modo grave o difficile da recuperare.</p>
<div class="chain">azione umana → modifica dell'ambiente → conseguenza</div>
<ul>
<li>${T("deforestazione")} → perdita di vegetazione → perdita di ${T("habitat")} ed ${T("erosione")} del suolo</li>
<li>${T("cementificazione")} → il suolo non assorbe più la pioggia → maggiore rischio di allagamenti e frane</li>
<li>uso eccessivo delle risorse → consumiamo più in fretta di quanto la natura ricostituisca → le risorse si esauriscono</li>
</ul>
<div class="box"><h3>Le principali pressioni sull'ambiente</h3><p>Deforestazione, estensione dei pascoli, degrado del suolo e ${T("desertificazione")}, cementificazione, inquinamento, sfruttamento eccessivo delle risorse, produzione di rifiuti.</p></div>
</section>

<section class="step"><span class="tag">Mettiti alla prova</span><h2>Costruisci la catena</h2>
${ORD("5-amazzonia","Amazzonia: metti in ordine i passaggi, dalla causa alla conseguenza finale.",
 ["Si tagliano e si bruciano alberi per fare spazio a pascoli e coltivazioni","Il suolo resta scoperto","Le piogge portano via lo strato fertile del terreno","Il suolo si impoverisce e piante e animali perdono il loro habitat"],[2,0,3,1])}
${ORD("5-citta","Città e consumo di suolo: metti in ordine i passaggi.",
 ["Si costruiscono case, strade e parcheggi","Il suolo viene coperto da asfalto e cemento","La pioggia non riesce a penetrare nel terreno","Aumenta il rischio di allagamenti"],[3,1,0,2])}
${TXT("5-gruppo","Ora il caso del tuo gruppo (desertificazione, inquinamento, rifiuti…): scrivi una catena di quattro passaggi, senza cercare ancora le soluzioni.")}
</section>`,
exit:["Scrivi una relazione causa-effetto usando le parole: azione umana – ambiente – conseguenza."]});

L.push({n:6,title:"Il clima è sempre cambiato. Che cosa cambia oggi?",
q:"Ma il clima non è sempre cambiato?",
geo:"Capitolo 20, §7 I cambiamenti climatici e §8 Il riscaldamento globale",
vivi:"Unità 4, Lezioni 3 Il cambiamento climatico e 6 Salviamo il pianeta",
body:`
<section class="step"><span class="tag">Osserva</span><h2>Vero o falso?</h2>
${SEL("6-vf","«Il clima della Terra è sempre cambiato.»",["Vero","Falso"],[
 ["Questa affermazione è…","Vero","Vero: il clima è sempre cambiato. Ma, come vedremo, questo non basta a spiegare quello che succede oggi."]])}
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Il clima ha una storia</h2>
<p>Nel passato si sono alternate ${T("glaciazione","glaciazioni")} e ${T("interglaciale","periodi interglaciali")}. Durante l'ultima glaciazione, circa 20.000 anni fa, i ghiacci coprivano gran parte del Nord Europa e il livello del mare era più basso di oltre 100 metri. Questi cambiamenti sono avvenuti in decine di migliaia di anni.</p>
${SEL("6-indizi","Fai il detective del clima: che cosa ci racconta ogni indizio?",["Com'era l'aria del passato","Che temperatura avevano i mari","Quali piante e animali vivevano in un luogo","Se un anno è stato piovoso o secco"],[
 ["Le bolle d'aria intrappolate nelle carote di ghiaccio","Com'era l'aria del passato"],
 ["I gusci microscopici nei sedimenti oceanici","Che temperatura avevano i mari"],
 ["I fossili","Quali piante e animali vivevano in un luogo"],
 ["Gli anelli di accrescimento degli alberi","Se un anno è stato piovoso o secco"]])}
</section>

<section class="step"><span class="tag">Capiamo</span><h2>Che cosa cambia oggi</h2>
<p>Una giornata fredda, un inverno mite, l'eruzione di un vulcano che raffredda il clima per un anno: sono variazioni temporanee. Il ritiro dei ghiacciai che dura da decenni è un'altra cosa.</p>
<p>Il punto è la <b>velocità</b>. Dalla fine dell'Ottocento la temperatura media della Terra è aumentata di più di 1 °C: un cambiamento che in natura richiederebbe migliaia di anni è avvenuto in poco più di un secolo. È il ${T("riscaldamento")}.</p>
<div class="chain">${T("fossili")} e deforestazione → più ${T("gasserra")} nell'atmosfera → ${T("serra")} più intenso → aumento delle temperature</div>
</section>

<section class="step"><span class="tag">Mettiti alla prova</span><h2>Quattro colonne</h2>
${SEL("6-colonne","Prova, causa, conseguenza o risposta? Classifica ogni elemento.",["Prova","Causa","Conseguenza","Risposta"],[
 ["Il ritiro dei ghiacciai","Prova"],["L'aumento delle temperature misurate","Prova"],["Lo spostamento degli habitat di piante e animali","Prova"],
 ["L'aumento dei gas serra","Causa"],["L'uso di petrolio, carbone e gas","Causa"],["Il taglio delle foreste","Causa"],
 ["L'innalzamento del livello dei mari","Conseguenza"],["Eventi meteorologici estremi più frequenti","Conseguenza"],["L'avanzata della desertificazione","Conseguenza"],
 ["La riduzione delle emissioni","Risposta"],["L'energia da fonti rinnovabili","Risposta"]])}
</section>`,
exit:["Da che cosa dipende il clima?","In che modo il clima influenza i biomi?","Perché il cambiamento climatico attuale non coincide semplicemente con le normali variazioni del clima?"]});

/* ================= STATO ================= */
const KEY="geo3-studenti";
let state={book:"both",zoom:1,ans:{},ord:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)state=Object.assign(state,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* ================= VISTE ================= */
const app=document.getElementById("app");
document.getElementById("nav").innerHTML=`<a href="#home">Inizio</a>`+L.map(l=>`<a href="#lezione-${l.n}">Lezione ${l.n}</a>`).join("");

function home(){
  app.innerHTML=`<div class="hero"><h1>Clima e ambienti della Terra</h1>
  <p>Sei lezioni per capire perché sulla Terra esistono climi diversi, come nascono i grandi ambienti naturali e come li stiamo cambiando.</p></div>
  <ul class="tiles">${L.map(l=>`<li><a href="#lezione-${l.n}"><span class="n">${l.n}</span><span><b>${l.title}</b><span>${l.q}</span></span></a></li>`).join("")}</ul>
  <div class="box"><h3>Come funziona</h3><p>Ogni lezione parte da una domanda. Osservi, capisci, ti metti alla prova con gli esercizi, poi apri il tuo libro. Le parole sottolineate a puntini hanno una spiegazione: passaci sopra o toccale. Scegli in alto il tuo libro: vedrai solo le pagine che ti servono.</p></div>`;
}

function lesson(n){
  const l=L[n-1],prev=L[n-2],next=L[n];
  app.innerHTML=`<div class="lhead"><span class="n">${l.n}</span><h1>${l.title}</h1></div>
  <div class="question"><span>La domanda di oggi</span><p>${l.q}</p></div>
  ${l.body}
  <section class="step"><span class="tag">Nel tuo libro</span><h2>Adesso apri il libro</h2>
    <div class="book"><div class="row bk-geo"><b>Geoagenda</b>${l.geo}</div><div class="row bk-vivi"><b>Vivi la Geo 3</b>${l.vivi}</div></div>
    <p>Leggi le pagine indicate: ritroverai quello che hai appena capito, con nuovi esempi e approfondimenti.</p></section>
  <section class="step"><span class="tag">Prima di uscire</span><h2>${l.exit.length>1?"Le domande finali del modulo":"La domanda finale"}</h2>
    <div class="exit">${l.exit.map((q,i)=>`<p>${q}</p><textarea data-txt="exit-${l.n}-${i}" aria-label="${q.replace(/"/g,"")}" placeholder="Scrivi qui"></textarea>`).join("")}</div></section>
  <nav class="pager" aria-label="Altre lezioni">${prev?`<a href="#lezione-${prev.n}"><small>Lezione precedente</small>${prev.title}</a>`:"<span></span>"}${next?`<a href="#lezione-${next.n}" style="text-align:right"><small>Lezione successiva</small>${next.title}</a>`:`<a href="#home" style="text-align:right"><small>Fine del modulo</small>Torna all'inizio</a>`}</nav>`;
  restore();
}

function restore(){
  app.querySelectorAll("[data-txt]").forEach(t=>t.value=state.ans[t.dataset.txt]||"");
  app.querySelectorAll("[data-sel]").forEach(s=>s.value=state.ans[s.dataset.sel]||"");
  Object.keys(EX).forEach(id=>{if(EX[id].type==="ord"&&document.getElementById("ord-"+id))renderOrd(id)});
}

/* ---- ordinamento ---- */
function curOrder(id){return state.ord[id]||EX[id].show.slice()}
function renderOrd(id,marks){
  const ol=document.getElementById("ord-"+id),o=curOrder(id),items=EX[id].items;
  ol.innerHTML=o.map((k,i)=>`<li class="${marks?(k===i?"ok":"no"):""}"><span>${items[k]}${marks?(k===i?" ✓":" ✗"):""}</span><span class="mv">
    <button type="button" data-mv="${id}:${i}:-1" aria-label="Sposta su" ${i===0?"disabled":""}>↑</button>
    <button type="button" data-mv="${id}:${i}:1" aria-label="Sposta giù" ${i===o.length-1?"disabled":""}>↓</button></span></li>`).join("");
}

/* ---- controllo ---- */
function check(id){
  const box=app.querySelector(`[data-ex="${id}"]`),ex=EX[id];let ok=0,tot;
  if(ex.type==="sel"){
    tot=ex.items.length;
    box.querySelectorAll(".item").forEach((row,i)=>{
      const v=row.querySelector("select").value,it=ex.items[i],fb=row.querySelector(".fb");
      row.classList.remove("ok","no");
      if(!v){fb.textContent="Manca la risposta.";fb.className="fb no";return}
      if(v===it[1]){ok++;row.classList.add("ok");fb.className="fb ok";fb.textContent="✓ Giusto."+(it[2]?" "+it[2]:"")}
      else{row.classList.add("no");fb.className="fb no";fb.textContent="✗ Non è questa. Rileggi e riprova."}
    });
  }else{
    const o=curOrder(id);tot=o.length;o.forEach((k,i)=>{if(k===i)ok++});renderOrd(id,true);
  }
  box.querySelector(".result").textContent=ok===tot?`Tutto giusto: ${ok} su ${tot}.`:`${ok} ${ok===1?"risposta giusta":"risposte giuste"} su ${tot}.`+(ex.type==="ord"?" Sposta le righe segnate e controlla di nuovo.":"");
}
function reset(id){
  const box=app.querySelector(`[data-ex="${id}"]`),ex=EX[id];
  if(ex.type==="sel"){box.querySelectorAll("select").forEach(s=>{s.value="";delete state.ans[s.dataset.sel]});box.querySelectorAll(".item").forEach(r=>{r.classList.remove("ok","no");r.querySelector(".fb").textContent=""})}
  else{delete state.ord[id];renderOrd(id)}
  box.querySelector(".result").textContent="";save();
}

app.addEventListener("click",e=>{
  const c=e.target.closest("[data-check]");if(c)return check(c.dataset.check);
  const r=e.target.closest("[data-reset]");if(r)return reset(r.dataset.reset);
  const m=e.target.closest("[data-mv]");
  if(m){const [id,i,d]=m.dataset.mv.split(":");const o=curOrder(id),a=+i,b=a+(+d);[o[a],o[b]]=[o[b],o[a]];state.ord[id]=o;save();renderOrd(id);
    const btn=document.querySelector(`[data-mv="${id}:${b}:${d}"]`)||document.querySelector(`[data-mv="${id}:${b}:${-d}"]`);if(btn)btn.focus();
    app.querySelector(`[data-ex="${id}"] .result`).textContent="";}
});
app.addEventListener("change",e=>{const s=e.target.closest("[data-sel]");if(s){state.ans[s.dataset.sel]=s.value;save()}});
app.addEventListener("input",e=>{const t=e.target.closest("[data-txt]");if(t){state.ans[t.dataset.txt]=t.value;save()}});

/* ---- navigazione ---- */
function route(){
  const h=(location.hash||"#home").slice(1);const m=h.match(/^lezione-(\d)$/);
  const n=m&&L[+m[1]-1]?+m[1]:0;
  n?lesson(n):home();
  document.querySelectorAll("#nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+(n?"lezione-"+n:"home")?"page":"false"));
  window.scrollTo(0,0);hideTip();
}

/* ---- libro e dimensione testo ---- */
function setBook(b){state.book=b;document.body.dataset.book=b;save();document.querySelectorAll("[data-b]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.b===b))}
document.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>setBook(b.dataset.b)));
const ZOOM=[0.85,1,1.15,1.3,1.5,1.75,2];
function setZoom(i){i=Math.max(0,Math.min(ZOOM.length-1,i));state.zoom=i;save();
  document.documentElement.style.fontSize=(ZOOM[i]*100)+"%";
  document.getElementById("zLvl").textContent=Math.round(ZOOM[i]*100)+"%";
  document.getElementById("zOut").disabled=i===0;document.getElementById("zIn").disabled=i===ZOOM.length-1}
document.getElementById("zOut").addEventListener("click",()=>setZoom(state.zoom-1));
document.getElementById("zIn").addEventListener("click",()=>setZoom(state.zoom+1));
document.getElementById("zLvl").addEventListener("dblclick",()=>setZoom(1));

/* ---- tooltip ---- */
const tip=document.getElementById("tip");let tipFor=null,pinned=false;
function showTip(el){
  const g=GLOSS[el.dataset.term];if(!g)return;
  if(tipFor&&tipFor!==el)tipFor.setAttribute("aria-expanded","false");
  tipFor=el;el.setAttribute("aria-expanded","true");el.setAttribute("aria-describedby","tip");
  tip.innerHTML=`<b>${g[0]}</b>${g[1]}`;tip.hidden=false;
  const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8);
  let y=r.bottom+8;if(y+h>window.innerHeight-8)y=r.top-h-8;
  tip.style.left=x+"px";tip.style.top=Math.max(8,y)+"px";
}
function hideTip(){if(tipFor){tipFor.setAttribute("aria-expanded","false");tipFor.removeAttribute("aria-describedby")}tipFor=null;pinned=false;tip.hidden=true}
app.addEventListener("mouseover",e=>{const t=e.target.closest(".term");if(t&&!pinned)showTip(t)});
app.addEventListener("mouseout",e=>{const t=e.target.closest(".term");if(t&&!pinned&&!t.contains(e.relatedTarget))hideTip()});
app.addEventListener("focusin",e=>{const t=e.target.closest(".term");if(t)showTip(t)});
app.addEventListener("focusout",e=>{if(e.target.closest(".term")&&!pinned)hideTip()});
document.addEventListener("click",e=>{const t=e.target.closest(".term");
  if(t){e.preventDefault();if(pinned&&tipFor===t)hideTip();else{showTip(t);pinned=true}return}
  if(!e.target.closest("#tip"))hideTip()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!tip.hidden)hideTip()});
window.addEventListener("scroll",()=>{if(!tip.hidden)hideTip()},{passive:true});

setBook(state.book||"both");setZoom(typeof state.zoom==="number"?state.zoom:1);
window.addEventListener("hashchange",route);route();
</script>
</body>
