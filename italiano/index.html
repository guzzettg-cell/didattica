<!doctype html>
<html lang="it">
<head>

<title>Italiano · Didattica</title>
<link rel="stylesheet" href="../assets/stile.css">

<body data-materia="italiano" data-base="../">

    <div id="materiali"></div>

  <footer class="piede"><a href="../">Torna a tutte le materie</a></footer>
