<p class="q">I mesi passano… e poi?</p>

<script>
(function(){
  var KEY='bambole-verbi';
  var z=100, zv=document.getElementById('zv');
  try{ z=parseInt(localStorage.getItem(KEY+'-zoom'))||100 }catch(e){}
  function setZ(v){ z=Math.max(70,Math.min(200,v)); document.documentElement.style.fontSize=z+'%'; zv.textContent=z+'%'; try{localStorage.setItem(KEY+'-zoom',z)}catch(e){} }

  document.getElementById('zm').onclick=function(){setZ(z-10)};
  setZ(z);

  function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e}

  /* ---------- dati ----------
     [verbo] = forma verbale; ~parola = parte facoltativa (es. il «si»); [verbo?] = forma facoltativa (participio-aggettivo)
     codici: F|modo|tempo|quando|ausiliare  oppure  I|modo  */
  var MODI={ind:'indicativo',cong:'congiuntivo',cond:'condizionale',imp:'imperativo',inf:'infinito',part:'participio',ger:'gerundio'};
  var MODI_F=['indicativo','congiuntivo','condizionale','imperativo','infinito','participio','gerundio'];
  var TEMPI={indicativo:['presente','imperfetto','passato remoto','passato prossimo','trapassato prossimo','trapassato remoto','futuro semplice','futuro anteriore'],
    congiuntivo:['presente','imperfetto','passato','trapassato'],condizionale:['presente','passato'],imperativo:['presente']};
  var AUX=['indicativo presente','indicativo imperfetto','indicativo passato remoto','indicativo futuro','congiuntivo presente','congiuntivo imperfetto','condizionale presente'];
  var IMP='F|ind|imperfetto|passato', PR='F|ind|passato remoto|passato';

  var PARTS={
    p1:[
      {t:"Fin da quando [riusciva] a [ricordare], Peter [aveva diviso] con Kate la camera da letto.",
       v:[IMP,'I|inf','F|ind|trapassato prossimo|passato|indicativo imperfetto'],
       n:{0:"«Riusciva»: l'imperfetto racconta una situazione che è durata a lungo, senza un inizio e una fine precisi.",2:"Il trapassato prossimo racconta un fatto avvenuto prima di un altro fatto passato: Peter divideva la camera con Kate da sempre, già prima del momento in cui comincia la storia."}},
      {t:"Per lo più la cosa non gli [dava] fastidio.", v:[IMP]},
      {t:"Anzi, certe notti [risvegliandosi] da un incubo, [era stato] persino contento di [avere] qualcuno nella stanza, anche se [~si trattava] solo di una sorellina di sette anni che di sicuro non [sarebbe stata] di grande aiuto contro quelle creature [coperte?] di sangue e di bava che gli [davano] la caccia nei sogni.",
       v:['I|ger','F|ind|trapassato prossimo|passato|indicativo imperfetto','I|inf',IMP,'F|cond|passato||condizionale presente','I|part',IMP],
       n:{4:"Il condizionale passato dice una cosa che non sarebbe successa: Kate non avrebbe aiutato Peter contro i mostri.",5:"«Coperte» è un participio passato usato come aggettivo (creature coperte di sangue): va bene anche se non l'hai segnato."}},
      {t:"Al suo risveglio, i mostri [andavano] a [nascondersi] dietro le tende, oppure [~si infilavano] nell’armadio.",
       v:[IMP,'I|inf',IMP], s:"Attenzione: «risveglio» è un nome, non un verbo.",
       n:{0:"«Al suo risveglio» vuol dire «ogni volta che si svegliava»: un'abitudine, per questo l'imperfetto."}},
      {t:"Grazie alla presenza di Kate, comunque, [era] un tantino più facile [uscire] dal letto e [sfrecciare] di corsa fino alla camera di mamma e papà.", v:[IMP,'I|inf','I|inf']},
      {t:"Altre volte invece gli [dispiaceva] eccome di [dover] [dividere] la stanza.", v:[IMP,'I|inf','I|inf'],
       n:{1:"«Dover dividere»: «dovere» è un verbo servile; insieme a «dividere» forma un solo predicato."}},
      {t:"[~Si incominciava] con un dispetto che [diventava] un bisticcio che [diventava] una rissa, a suon di pugni, graffi, tirate di capelli eccetera.",
       v:[IMP,IMP,IMP], s:"Attenzione: «tirate» (di capelli) qui è un nome. Tre imperfetti di fila: succedeva sempre così, una volta dopo l'altra."}
    ],
    p2:[
      {t:"In teoria [avrebbero dovuto] [essere] dei neonati, ma gli occhi le [tradivano].",
       v:['F|cond|passato||condizionale presente','I|inf',IMP],
       n:{0:"Il condizionale passato dice una cosa che doveva essere e invece non è: le bambole dovevano sembrare neonati, ma gli occhi dicono altro."}},
      {t:"I neonati non [guardano] in quel modo nessuno.", v:['F|ind|presente|presente'],
       n:{0:"Un presente in mezzo al passato! Qui il narratore esce dalla storia e dice una cosa che è vera sempre, ieri come oggi."}},
      {t:"[Passando] accanto alle bambole, Peter [~si sentiva] [scrutato?] e, [uscendo] dalla stanza, [sospettava] sempre che [~si mettessero] a [parlare] di lui, tutte e sessanta.",
       v:['I|ger',IMP,'I|part','I|ger',IMP,'F|cong|imperfetto','I|inf'],
       n:{2:"«Scrutato» è un participio passato usato quasi come aggettivo: va bene anche se non l'hai segnato.",5:"Il congiuntivo esprime ciò che Peter sospetta, non una cosa certa."}},
      {t:"Le [metteva] paura, talmente tanta che non [aveva] il coraggio di [buttarla], caso mai quella [fosse tornata] nel cuore della notte a [vendicarsi].",
       v:[IMP,IMP,'I|inf','F|cong|trapassato||congiuntivo imperfetto','I|inf'],
       n:{3:"Il congiuntivo trapassato esprime una possibilità che fa paura a Kate: e se la Cattiva tornasse a vendicarsi?"}},
      {t:"La Cattiva chiunque l’[avrebbe riconosciuta] al primo sguardo.", v:['F|cond|passato||condizionale presente'],
       n:{0:"Chiunque, se l'avesse vista, l'avrebbe riconosciuta: il condizionale passato descrive la Cattiva con un'ipotesi."}}
    ],
    p3:[
      {t:"La linea invisibile [funzionava] benissimo, finché [~si ricordavano] che [c’era].", v:[IMP,IMP,IMP]},
      {t:"[Dovevano] [chiedere] permesso per [passare] dall’altra parte.", v:[IMP,'I|inf','I|inf'], s:"Le regole di ogni giorno: ancora imperfetto."},
      {t:"Tutto [andò] bene finché un piovoso pomeriggio di domenica non [scoppiò] una lite delle peggiori su dove esattamente [~si trovasse] la linea immaginaria.",
       v:[PR,PR,'F|cong|imperfetto'],
       n:{0:"Ecco il primo passato remoto! Fino a qui era tutto all'imperfetto.",1:"«Un piovoso pomeriggio di domenica»: un giorno preciso, una volta sola."}},
      {t:"Peter [era] sicuro che [fosse] più lontana rispetto al suo letto.", v:[IMP,'F|cong|imperfetto'],
       n:{0:"Che cosa pensava Peter: lo sfondo della lite, all'imperfetto."}},
      {t:"Quella volta Kate non [ebbe] bisogno di [diventare] viola, né di [far] finta di [morire], o di [strillare].",
       v:[PR,'I|inf','I|inf','I|inf','I|inf'], n:{0:"«Quella volta»: una volta sola, diversa dal solito. Per questo il passato remoto."}},
      {t:"Le [bastò] [dare] un bel colpo sul naso a Peter con la Cattiva.", v:[PR,'I|inf']},
      {t:"L’[afferrò] per la sua unica gamba cicciona e gliela [scaraventò] sulla faccia.", v:[PR,PR], s:"Azioni una dopo l'altra, veloci: passato remoto."},
      {t:"Perciò, [toccò] a Peter [correre] al piano di sotto [piangendo].", v:[PR,'I|inf','I|ger']},
      {t:"Il naso non gli [faceva] poi tanto male, ma [sanguinava] e non [voleva] [perdersi] un’occasione del genere.",
       v:[IMP,IMP,IMP,'I|inf'], s:"Di nuovo l'imperfetto: la storia si ferma un attimo per descrivere come stava Peter e che cosa voleva."},
      {t:"Mentre [~si precipitava] di sotto, [~si passò] il dorso della mano su tutta la faccia e [arrivato] in cucina, [~si gettò] a terra di fronte a sua madre [gemendo] e [ululando] e [contorcendosi] tutto.",
       v:[IMP,PR,'I|part',PR,'I|ger','I|ger','I|ger'],
       n:{0:"«Mentre si precipitava»: un'azione in corso, sullo sfondo. Intanto succedono le azioni in primo piano, al passato remoto."}},
      {t:"Kate [sarebbe finita] in un bel guaio davvero, [era] certo.", v:['F|cond|passato||condizionale presente',IMP],
       n:{0:"Il condizionale passato qui indica un fatto futuro rispetto al momento del racconto (futuro nel passato): Peter pensa a che cosa succederà dopo a Kate."}}
    ],
    p4:[
      {t:"E così i mesi [passavano], e Peter e Kate [~si abituarono] all’idea di [avere] camere separate e non ci [pensarono] più granché.",
       v:[IMP,PR,'I|inf',PR]},
      {t:"I giorni importanti [arrivavano] e [finivano]: il compleanno di Peter, la sera dei fuochi d’artificio, Natale, il compleanno di Kate, e infine la Pasqua.",
       v:[IMP,IMP], s:"Il tempo scorre, le feste arrivano e finiscono tutte uguali: imperfetto."},

      {t:"Peter [era] sul letto in camera sua, pronto a [mangiarsi] l’ultimo uovo [rimasto?].", v:[IMP,'I|inf','I|part'],
       n:{2:"«Rimasto» è un participio passato usato come aggettivo: va bene anche se non l'hai segnato."}}
    ]
  };

  function info(code){var p=code.split('|'); if(p[0]==='I')return {fin:false,modo:MODI[p[1]]};
    return {fin:true,modo:MODI[p[1]],tempo:p[2],quando:p[3]||'',aux:p[4]||''}}

  /* ---------- parsing ---------- */
  var RE=/\[([^\]]+)\]|[A-Za-zÀ-ÿ]+['’]|[A-Za-zÀ-ÿ]+|\s+|[^\sA-Za-zÀ-ÿ\[]+/g;
  function parse(t){
    var out=[], vi=0, m; RE.lastIndex=0;
    while((m=RE.exec(t))){
      if(m[1]){
        var c=m[1], opt=false; if(c.slice(-1)==='?'){opt=true;c=c.slice(0,-1)}
        c.split(' ').forEach(function(w,k){
          if(k)out.push({sp:' '});
          var o=w[0]==='~'; out.push({w:o?w.slice(1):w,v:vi,optw:o,optv:opt});
        });
        vi++;
      } else if(/^\s+$/.test(m[0])) out.push({sp:m[0]});
      else if(/^[A-Za-zÀ-ÿ]/.test(m[0])) out.push({w:m[0],v:-1});
      else out.push({sp:m[0]});
    }
    return out;
  }
  function plain(t){return t.replace(/\[|\]|~|\?\]/g,'').replace(/\?/g,'')}

  /* ---------- stepper frase per frase ---------- */
  function seg(opts,onpick){var s=el('div','seg'); opts.forEach(function(o){var b=el('button'); b.type='button'; b.textContent=o; b.setAttribute('aria-pressed','false');
      b.onclick=function(){s.dataset.v=o; s.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')}); if(onpick)onpick(o)}; s.appendChild(b)}); return s}
  function setSeg(s,v){s.dataset.v=v; s.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x.textContent===v?'true':'false')})}
  function sel(opts,label){var s=el('select'); s.setAttribute('aria-label',label); s.appendChild(new Option('scegli…','')); opts.forEach(function(o){s.appendChild(new Option(o,o))}); return s}
  function camp(lab,ctrl){var c=el('div','camp'); c.append(el('small','',lab),ctrl); return c}

  function buildSentence(S,idx,onDone){
    var box=el('div','frasebox'), toks=parse(S.t), nV=S.v.length, verbs=[];
    for(var i=0;i<nV;i++)verbs.push({info:info(S.v[i]),words:[],opt:false,nota:(S.n||{})[i]});
    var sent=el('div','sent'); sent.setAttribute('aria-label','Frase da analizzare');
    toks.forEach(function(t){
      if(t.sp!=null){sent.appendChild(document.createTextNode(t.sp));return}
      var b=el('button','tok'); b.type='button'; b.textContent=t.w; t.btn=b;
      if(t.v>=0){verbs[t.v].words.push(t); verbs[t.v].opt=t.optv}
      b.onclick=function(){ if(sent.classList.contains('locked'))return; b.classList.toggle('sel'); b.classList.remove('miss','wrong')};
      sent.appendChild(b);
    });
    verbs.forEach(function(v){v.label=v.words.map(function(t){return t.w}).join(' ')});
    box.appendChild(sent);

    /* passo 1 */
    var s1=el('div','step'); s1.appendChild(el('h3','','<span class="n">1</span>Quali sono i verbi?'));
    s1.appendChild(el('p','q','Clicca su tutte le parole che sono verbi (anche i verbi all’infinito, al gerundio, al participio).'));
    var a1=el('div','azioni'), c1=el('button','btn main','Controlla'), m1=el('button','btn','Mostra i verbi'), f1=el('span','esito');
    c1.type=m1.type='button'; a1.append(c1,m1,f1); s1.appendChild(a1); box.appendChild(s1);

    /* passo 2 */
    var s2=el('div','step'); s2.hidden=true;
    s2.appendChild(el('h3','','<span class="n">2</span>Finito o indefinito? In che modo?'));
    var r2=el('div','rows'); s2.appendChild(r2);
    var a2=el('div','azioni'), c2=el('button','btn main','Controlla'), m2=el('button','btn','Mostra la soluzione'), f2=el('span','esito');
    c2.type=m2.type='button'; a2.append(c2,m2,f2); s2.appendChild(a2); box.appendChild(s2);

    /* passo 3 */
    var s3=el('div','step'); s3.hidden=true;
    s3.appendChild(el('h3','','<span class="n">3</span>I verbi finiti: quando? che tempo?'));
    s3.appendChild(el('p','q','Per l’indicativo: passato, presente o futuro? Poi il tempo verbale. Per i tempi composti: in che tempo è l’ausiliare?'));
    var r3=el('div','rows'); s3.appendChild(r3);
    var a3=el('div','azioni'), c3=el('button','btn main','Controlla'), m3=el('button','btn','Mostra la soluzione'), f3=el('span','esito');
    c3.type=m3.type='button'; a3.append(c3,m3,f3); s3.appendChild(a3); box.appendChild(s3);

    var notes=el('div','notes'); notes.hidden=true; box.appendChild(notes);

    function show1(){
      verbs.forEach(function(v){v.words.forEach(function(t){t.btn.classList.add('sel')})});
      toks.forEach(function(t){if(t.btn){t.btn.classList.remove('miss','wrong'); if(t.v<0)t.btn.classList.remove('sel')}});
      sent.classList.add('locked'); c1.disabled=m1.disabled=true; f1.className='esito ok'; f1.textContent='Verbi trovati: '+verbs.length+'.';
      openStep2();
    }
    c1.onclick=function(){
      var miss=0,wrong=0,found=0,req=0;
      toks.forEach(function(t){if(!t.btn)return; t.btn.classList.remove('miss','wrong'); if(t.v<0&&t.btn.classList.contains('sel')){wrong++;t.btn.classList.add('wrong')}});
      verbs.forEach(function(v){ if(v.opt)return; req++;
        var ok=v.words.every(function(t){return t.optw||t.btn.classList.contains('sel')});
        if(ok)found++; else {miss++; v.words.forEach(function(t){if(!t.optw)t.btn.classList.add('miss')})}});
      if(!miss&&!wrong){show1(); return}
      f1.className='esito'; f1.textContent='Verbi trovati: '+found+' su '+req+'.'+(wrong?' Parole che non sono verbi: '+wrong+' (barrate).':'')+(miss?' Il bordo rosso indica i verbi che mancano.':'');
    };
    m1.onclick=show1;

    var rows2=[], rows3=[];
    function openStep2(){
      if(!s2.hidden)return; s2.hidden=false;
      verbs.forEach(function(v){
        var r=el('div','row'), fi=seg(['finito','indefinito']), mo=sel(MODI_F,'Modo di «'+v.label+'»'), fb=el('div','fb');
        r.append(el('span','vb',v.label),camp('tipo',fi),camp('modo',mo),fb); r2.appendChild(r); rows2.push({r:r,fi:fi,mo:mo,fb:fb,v:v});
      });
      if(S.s){var ns=el('p','nota alt',S.s); notes.appendChild(ns); notes.hidden=false}
    }
    function mark2(x,force){
      if(force){setSeg(x.fi,x.v.info.fin?'finito':'indefinito'); x.mo.value=x.v.info.modo}
      var g=(x.fi.dataset.v===(x.v.info.fin?'finito':'indefinito'))&&x.mo.value===x.v.info.modo;
      x.r.className='row '+(g?'ok':'ko');
      x.fb.innerHTML=g?'':'Soluzione: <b>'+(x.v.info.fin?'modo finito':'modo indefinito')+', '+x.v.info.modo+'</b>.';
      return g;
    }
    function done2(){
      c2.disabled=m2.disabled=true; f2.className='esito ok'; f2.textContent='Fatto!';
      rows2.forEach(function(x){x.fi.querySelectorAll('button').forEach(function(b){b.disabled=true}); x.mo.disabled=true});
      verbs.forEach(function(v){v.words.forEach(function(t){t.btn.classList.remove('sel'); t.btn.classList.add(v.info.fin?'fin':'ind')})});
      openStep3();
    }
    c2.onclick=function(){var ok=0; rows2.forEach(function(x){if(mark2(x))ok++}); if(ok===rows2.length)done2(); else {f2.className='esito'; f2.textContent='Giuste: '+ok+' su '+rows2.length+'.'}};
    m2.onclick=function(){rows2.forEach(function(x){mark2(x,true)}); done2()};

    function openStep3(){
      s3.hidden=false;
      var fin=verbs.filter(function(v){return v.info.fin});
      fin.forEach(function(v){
        var r=el('div','row'), fb=el('div','fb'), x={r:r,fb:fb,v:v};
        r.appendChild(el('span','vb',v.label+' <small style="font-weight:400;color:var(--muted);font-family:var(--body);font-size:.85rem">('+v.info.modo+')</small>'));
        if(v.info.quando){x.q=seg(['passato','presente','futuro']); r.appendChild(camp('quando?',x.q))}
        x.t=sel(TEMPI[v.info.modo],'Tempo di «'+v.label+'»'); r.appendChild(camp('tempo verbale',x.t));
        if(v.info.aux){x.a=sel(AUX,'Tempo dell’ausiliare di «'+v.label+'»'); r.appendChild(camp('ausiliare: «'+v.words[0].w+'» è al…',x.a))}
        r.appendChild(fb); r3.appendChild(r); rows3.push(x);
      });
    }
    function mark3(x,force){
      var I=x.v.info;
      if(force){ if(x.q)setSeg(x.q,I.quando); x.t.value=I.tempo; if(x.a)x.a.value=I.aux }
      var g=(!x.q||x.q.dataset.v===I.quando)&&x.t.value===I.tempo&&(!x.a||x.a.value===I.aux);
      x.r.className='row '+(g?'ok':'ko');
      x.fb.innerHTML=g?'':'Soluzione: <b>'+(I.quando?I.quando+', ':'')+I.modo+' '+I.tempo+'</b>'+(I.aux?' (ausiliare al '+I.aux+')':'')+'.';
      return g;
    }
    function done3(){
      c3.disabled=m3.disabled=true; f3.className='esito ok'; f3.textContent='Frase completata!';
      rows3.forEach(function(x){ if(x.q)x.q.querySelectorAll('button').forEach(function(b){b.disabled=true}); x.t.disabled=true; if(x.a)x.a.disabled=true});
      verbs.forEach(function(v){ if(v.nota){notes.appendChild(el('p','nota','<b>'+v.label+'</b>: '+v.nota))} });
      notes.hidden=!notes.children.length;
      onDone();
    }
    c3.onclick=function(){var ok=0; rows3.forEach(function(x){if(mark3(x))ok++}); if(ok===rows3.length)done3(); else {f3.className='esito'; f3.textContent='Giuste: '+ok+' su '+rows3.length+'.'}};
    m3.onclick=function(){rows3.forEach(function(x){mark3(x,true)}); done3()};

    return box;
  }

  function buildPart(host,key){
    var list=PARTS[key], st=el('div','stepper'), nav=el('div','nav'), pos=el('span','pos'), dots=el('div','dots');
    var prev=el('button','btn','← Frase precedente'), next=el('button','btn main','Frase successiva →'); prev.type=next.type='button';
    nav.append(pos,prev,next); st.append(nav,dots);
    st.appendChild(el('div','legenda','<span><b class="f">verbo</b> modo finito</span><span><b class="i">verbo</b> modo indefinito</span>'));
    var boxes=[], cur=0;
    list.forEach(function(S,i){
      var d=el('button','',String(i+1)); d.type='button'; d.setAttribute('aria-label','Frase '+(i+1)); d.onclick=function(){go(i)}; dots.appendChild(d);
      var b=buildSentence(S,i,function(){d.classList.add('done')}); b.hidden=true; st.appendChild(b); boxes.push(b);
    });
    function go(i){cur=i; boxes.forEach(function(b,k){b.hidden=k!==i}); dots.querySelectorAll('button').forEach(function(d,k){d.classList.toggle('cur',k===i)});
      pos.textContent='Frase '+(i+1)+' di '+list.length; prev.disabled=i===0; next.disabled=i===list.length-1}
    prev.onclick=function(){if(cur>0){go(cur-1); st.scrollIntoView({block:'start',behavior:'smooth'})}};
    next.onclick=function(){if(cur<list.length-1){go(cur+1); st.scrollIntoView({block:'start',behavior:'smooth'})}};
    go(0); host.appendChild(st);
  }
  document.querySelectorAll('[data-part]').forEach(function(h){buildPart(h,h.dataset.part)});

  /* bilancio dei verbi finiti */
  document.querySelectorAll('[data-bil]').forEach(function(d){
    var cnt={},order=[];
    PARTS[d.dataset.bil].forEach(function(S){S.v.forEach(function(c){var I=info(c); if(!I.fin)return;
      var k=(I.modo==='indicativo'?'':I.modo+' ')+I.tempo; if(!(k in cnt)){cnt[k]=0;order.push(k)} cnt[k]++})});
    order.sort(function(a,b){return cnt[b]-cnt[a]});
    var max=Math.max.apply(null,order.map(function(k){return cnt[k]}));
    var b=el('div','bil'); b.appendChild(el('p','q','Verbi finiti, tempo per tempo (indicativo, se non è scritto altro):'));
    order.forEach(function(k){var r=el('div','bar'), bar=el('span','b'+(k==='imperfetto'?'':k==='passato remoto'?' pr':' al')); bar.style.width=(cnt[k]/max*100)+'%';
      r.append(el('span','',k),el('span','',''),el('span','',cnt[k])); r.children[1].appendChild(bar); b.appendChild(r)});
    var tot=order.reduce(function(s,k){return s+cnt[k]},0);
    var imp=cnt['imperfetto']||0, pr=cnt['passato remoto']||0;
    b.appendChild(el('p','',imp>pr?'Su '+tot+' verbi finiti, <b>'+imp+'</b> sono all’imperfetto'+(pr?' e '+pr+' al passato remoto':'')+'.':'Su '+tot+' verbi finiti, <b>'+pr+'</b> sono al passato remoto e '+imp+' all’imperfetto. Che cosa è cambiato?'));
    d.appendChild(b);
  });

  /* ---------- domande a scelta ---------- */
  function quiz(id,opts,items){
    var box=document.getElementById(id), arr=[]; if(!box)return;
    items.forEach(function(d){var it=el('div','item'),fr=el('div','frase',d[0]),s=seg(d[3]||opts),fb=el('div','fb'); it.append(fr,s,fb); box.appendChild(it); arr.push([it,s,d,fb])});
    var a=el('div','azioni'), c=el('button','btn main','Controlla'), m=el('button','btn','Mostra la soluzione'), f=el('span','esito'); c.type=m.type='button'; a.append(c,m,f); box.appendChild(a);
    function mark(force){var ok=0; arr.forEach(function(x){ if(force)setSeg(x[1],x[2][1]); var g=x[1].dataset.v===x[2][1]; x[0].className='item '+(g?'ok':'ko');
        x[3].innerHTML=(g?'Giusto! ':'Risposta: <b>'+x[2][1]+'</b>. ')+(x[2][2]||''); if(g)ok++}); f.textContent=force?'':'Giuste: '+ok+' su '+arr.length+'.'}
    c.onclick=function(){mark(false)}; m.onclick=function(){mark(true)};
  }

  quiz('q-riscaldamento',['finito','indefinito'],[
    ['<i>cantavamo</i>','finito','Si capisce chi canta: noi.'],
    ['<i>cantando</i>','indefinito','Gerundio: chi canta? Non si sa.'],
    ['<i>cantassero</i>','finito','Congiuntivo: loro.'],
    ['<i>cantato</i>','indefinito','Participio passato.'],
    ['<i>canterebbero</i>','finito','Condizionale: loro.'],
    ['<i>cantare</i>','indefinito','Infinito.'],
    ['<i>avevano cantato</i>','finito','Trapassato prossimo: loro.'],
    ['<i>avere cantato</i>','indefinito','Infinito passato: chi? Non si sa.']
  ]);

  quiz('q-quando',['passato','presente','futuro'],[
    ['Peter <b>divideva</b> la camera con Kate.','passato','Imperfetto.'],
    ['Kate <b>strilla</b> più forte di tutti.','presente',''],
    ['Domani Peter <b>dormirà</b> nella stanza nuova.','futuro','Futuro semplice.'],
    ['Peter <b>aveva</b> sempre <b>diviso</b> la camera con Kate.','passato','Trapassato prossimo: un passato ancora più lontano.'],
    ['Le bambole lo <b>guardano</b> con gli occhi di vetro.','presente',''],
    ['Quel giorno Kate <b>tornò</b> tardi.','passato','Passato remoto.']
  ]);

  quiz('q-funzioni',['descrizione','abitudine'],[
    ['«Al suo risveglio, i mostri <b>andavano</b> a nascondersi dietro le tende»','abitudine','Ogni volta che si svegliava.'],
    ['«In teoria avrebbero dovuto essere dei neonati, ma gli occhi le <b>tradivano</b>»','descrizione','Com’erano le bambole.'],
    ['«<b>Si incominciava</b> con un dispetto che <b>diventava</b> un bisticcio»','abitudine','Le liti andavano sempre così.'],
    ['«Le <b>metteva</b> paura»','descrizione','Un sentimento di Kate.'],
    ['«<b>sospettava</b> sempre che si mettessero a parlare di lui»','abitudine','«Sempre»: ogni volta che usciva dalla stanza.'],
    ['«non <b>aveva</b> il coraggio di buttarla»','descrizione','Com’era Kate, che cosa provava.']
  ]);

  quiz('q-cambio',null,[
    ['L’imperfetto lascia il posto a quale tempo?','passato remoto','',['passato prossimo','passato remoto','presente','trapassato prossimo']],
    ['Quale espressione annuncia che sta per succedere un fatto preciso, una volta sola?','un piovoso pomeriggio di domenica','Un giorno preciso: non «di solito», ma «quella domenica».',['benissimo','finché si ricordavano','un piovoso pomeriggio di domenica','dall’altra parte']],
    ['Perché il narratore cambia tempo?','per raccontare un fatto preciso che fa andare avanti la storia','L’imperfetto descriveva le abitudini; il passato remoto racconta l’evento: la lite.',['perché il fatto è successo più di recente','per raccontare un fatto preciso che fa andare avanti la storia','per non ripetere sempre lo stesso tempo']]
  ]);

  quiz('q-sfondo',['sfondo','primo piano'],[
    ['«Perciò, <b>toccò</b> a Peter correre al piano di sotto»','primo piano','Un’azione: passato remoto.'],
    ['«Il naso non gli <b>faceva</b> poi tanto male»','sfondo','Come stava Peter: imperfetto.'],
    ['«ma <b>sanguinava</b>»','sfondo','Una situazione che dura: imperfetto.'],
    ['«<b>Mentre si precipitava</b> di sotto»','sfondo','Un’azione in corso mentre ne succede un’altra: imperfetto.'],
    ['«<b>si passò</b> il dorso della mano su tutta la faccia»','primo piano','Passato remoto.'],
    ['«<b>si gettò</b> a terra di fronte a sua madre»','primo piano','Passato remoto.']
  ]);

  quiz('q-accadde',null,[
    ['«Accadde due giorni dopo la consueta caccia all’uovo di Pasqua.» Che cosa accadde?','non lo sappiamo ancora','Il narratore annuncia un fatto importante, ma non dice quale: ci fa aspettare.',['Peter mangiò l’ultimo uovo','Kate tornò a casa','non lo sappiamo ancora']],
    ['In che tempo è «accadde»?','passato remoto','',['imperfetto','passato remoto','passato prossimo']],
    ['Perché «accadde» colpisce il lettore?','arriva dopo tante frasi all’imperfetto e annuncia un fatto unico','I mesi «passavano», i giorni «arrivavano e finivano»: tutto uguale. Poi, d’improvviso, un passato remoto.',['è un verbo difficile','arriva dopo tante frasi all’imperfetto e annuncia un fatto unico','racconta un’abitudine di Peter']]
  ]);

  /* ---------- trova il punto del cambio ---------- */
  (function(){
    var host=document.getElementById('passo-cambio'); if(!host)return; var txt=PARTS.p3.slice(0,3).map(function(S){return S.t}).join(' ');
    var target=null, chosen=null, fb=document.getElementById('cambio-fb');
    parse(txt).forEach(function(t){
      if(t.sp!=null){host.appendChild(document.createTextNode(t.sp));return}
      var b=el('button','tok'); b.type='button'; b.textContent=t.w; if(t.w==='andò')target=b;
      b.onclick=function(){if(host.classList.contains('locked'))return; host.querySelectorAll('.tok').forEach(function(x){x.classList.remove('sel','wrong')}); b.classList.add('sel'); chosen=b};
      host.appendChild(b);
    });
    function ok(){host.className='passo ok locked'; target.classList.add('sel'); fb.className='esito ok'; fb.textContent='Sì: «andò», passato remoto. Subito dopo arriva «scoppiò».'}
    document.getElementById('cambio-check').onclick=function(){
      if(!chosen){fb.className='esito'; fb.textContent='Clicca prima su un verbo.';return}
      if(chosen===target)ok(); else {host.className='passo ko'; chosen.classList.add('wrong'); fb.className='esito'; fb.textContent='Non ancora: «'+chosen.textContent+'» non è il primo verbo finito che cambia tempo. Riprova.'}
    };
    document.getElementById('cambio-sol').onclick=function(){host.querySelectorAll('.tok').forEach(function(x){x.classList.remove('sel','wrong')}); ok()};
  })();
})();
