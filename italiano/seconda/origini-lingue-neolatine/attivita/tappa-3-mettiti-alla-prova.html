<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tappa 3 · Mettiti alla prova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Alegreya+Sans:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FAF8F3; --ink:#2A2420; --soft:#6B625A; --lapis:#233D8C; --lapis-ink:#FFFFFF;
  --gold:#B8892B; --verde:#3E7B6A; --rubric:#A3291F; --tint:#EEF1F8; --line:#DDD6CA;
  --ok:#2F7A4F; --no:#A3291F; --land:#F1EDE4; --sea:#DCE6F0; --viola:#7A4E8C; --anglo:#5E8A2A; --arabo:#C98AA6; --arabo-ink:#94446B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#17181D; --ink:#ECE6DC; --soft:#ABA397; --lapis:#8FA6F0; --lapis-ink:#10131C;
    --gold:#D9AE55; --verde:#7CC1AC; --rubric:#E07A6E; --tint:#21253A; --line:#34363F;
    --ok:#7CC79A; --no:#E07A6E; --land:#2A2B31; --sea:#1B2333; --viola:#C49AD6; --anglo:#9BC25A; --arabo:#9C5F7C; --arabo-ink:#E3A9C5;
  }
}
:root[data-theme="dark"]{
  --page:#17181D; --ink:#ECE6DC; --soft:#ABA397; --lapis:#8FA6F0; --lapis-ink:#10131C;
  --gold:#D9AE55; --verde:#7CC1AC; --rubric:#E07A6E; --tint:#21253A; --line:#34363F;
  --ok:#7CC79A; --no:#E07A6E; --land:#2A2B31; --sea:#1B2333; --viola:#C49AD6; --anglo:#9BC25A; --arabo:#9C5F7C; --arabo-ink:#E3A9C5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Alegreya",Georgia,"Times New Roman",serif;font-size:1.15rem;line-height:1.6}
img,svg{max-width:100%}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem}
h1,h2,h3{font-weight:800;line-height:1.15;margin:0}
h2{font-size:clamp(1.6rem,4.5vw,2.1rem);margin:3.5rem 0 1rem;color:var(--lapis)}
h3{font-size:1.25rem;margin:1.6rem 0 .4rem}
p{margin:0 0 1rem}
.ui{font-family:"Alegreya Sans",system-ui,-apple-system,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* hero */
header{background:var(--lapis);color:var(--lapis-ink);padding:3rem 0 2.5rem}
.hero{display:grid;grid-template-columns:auto 1fr;gap:1.25rem;align-items:center}
.capo{font-family:"UnifrakturMaguntia",serif;font-size:clamp(6rem,22vw,9.5rem);line-height:.8;color:var(--gold);
  border:3px solid var(--gold);padding:.5rem .9rem .9rem;border-radius:4px;animation:gild 1.4s ease-out both}
@keyframes gild{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
header h1{font-size:clamp(1.9rem,6vw,3rem)}
header p{margin:.6rem 0 0;font-style:italic;opacity:.9}
nav{border-bottom:1px solid var(--line);overflow-x:auto}
nav ol{display:flex;gap:1.2rem;list-style:none;margin:0 auto;padding:.8rem 1.25rem;max-width:46rem;white-space:nowrap;font-size:.95rem}
nav a{color:var(--soft);text-decoration:none}
nav a:hover{color:var(--lapis)}

/* novità */
.novita{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.75rem;margin:1.25rem 0}
.flip{background:none;border:1.5px solid var(--line);border-radius:6px;padding:1rem;text-align:left;color:var(--ink);min-height:8.5rem}
.flip b{display:block;font-size:1.15rem;color:var(--lapis)}
.flip .prima{color:var(--soft);font-size:.95rem}
.flip .dopo{display:none;font-size:.95rem}
.flip[aria-pressed="true"]{border-color:var(--gold);background:var(--tint)}
.flip[aria-pressed="true"] .prima{text-decoration:line-through}
.flip[aria-pressed="true"] .dopo{display:block}
.hint{font-size:.9rem;color:var(--soft)}

/* lingue */
.albero{margin:1.5rem 0;overflow-x:auto}
.albero svg{display:block;min-width:30rem;width:100%;height:auto}
.albero text{font-family:"Alegreya Sans",sans-serif;fill:var(--ink)}

/* mappa */
.mappa{margin:1.5rem 0;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sea)}
.mappa svg{display:block;width:100%;height:auto}
.mappa .terra{fill:var(--land)}
.mappa .costa{fill:none;stroke:var(--soft);stroke-width:.8;opacity:.6}
.mappa text{font-family:"Alegreya Sans",sans-serif;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
.mappa text.mare{fill:var(--soft);stroke:var(--sea);font-weight:400;font-style:italic}
.controlli{display:flex;gap:.9rem;align-items:center;margin:1rem 0 .75rem}
.play{border:none;background:var(--lapis);color:var(--lapis-ink);border-radius:999px;padding:.45rem 1.1rem;font-weight:700;min-width:6.5rem}
.controlli input{flex:1;accent-color:var(--gold);height:2rem}
.mappa text.anno{font-family:"Alegreya",serif;font-weight:800;fill:var(--lapis);stroke:var(--sea);stroke-width:5px}
.spiega h3{margin-top:.6rem;color:var(--lapis)}
.spiega{min-height:9rem}
.domanda{font-size:1.25rem;font-weight:600;margin:.8rem 0 .5rem}
.domanda::before{content:"?";display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--gold);color:var(--page);font-weight:800;margin-right:.5rem;font-size:1rem;vertical-align:.1rem}
.rivela{border:1.5px solid var(--lapis);background:none;color:var(--lapis);border-radius:999px;padding:.3rem 1rem;font-size:.95rem}
.mappa.celato text:not(.mare):not(.fisso){visibility:hidden}
.legenda.celato{visibility:hidden}
.risposta{border-left:3px solid var(--lapis);padding-left:1rem;margin-top:.6rem}
.legenda{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.95rem;margin-top:.5rem}
.legenda span::before{content:"";display:inline-block;width:.85rem;height:.85rem;border-radius:2px;margin-right:.35rem;vertical-align:-.1rem;background:var(--c)}

.periodi{position:relative;margin:1rem 0 .5rem}
.asse{display:grid;grid-template-columns:7.5rem 1fr;font-size:.8rem;color:var(--soft)}
.asse .scala{position:relative;height:1.2rem}
.asse .scala span{position:absolute;transform:translateX(-50%)}
.riga{display:grid;grid-template-columns:7.5rem 1fr;align-items:start;padding:.55rem 0;border-top:1px solid var(--line)}
.riga b{font-size:1rem;padding-top:.1rem}
.traccia-l{position:relative;height:1.3rem}
.barra{position:absolute;top:.3rem;height:.7rem;border-radius:4px;opacity:.45}
.punto{position:absolute;top:.15rem;width:1rem;height:1rem;transform:translateX(-50%);border:2px solid var(--page)}
.punto.doc{border-radius:50%}
.punto.lett{transform:translateX(-50%) rotate(45deg);width:.85rem;height:.85rem;top:.22rem}
.nota{grid-column:2;font-size:.9rem;color:var(--soft);margin:.2rem 0 0;line-height:1.4}
@media (max-width:560px){.asse,.riga{grid-template-columns:6rem 1fr}.nota{grid-column:1/-1}}
.cursore{position:absolute;top:0;bottom:0;width:2px;background:var(--rubric);pointer-events:none}
.sim::before{background:var(--ink)!important}
.sim.doc::before{border-radius:50%!important}
.sim.lett::before{transform:rotate(45deg) scale(.8)}

.annobox{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:.25rem 0 .6rem}
.anno-grande{font-weight:800;font-size:clamp(1.7rem,5vw,2.2rem);line-height:1;color:var(--lapis);font-variant-numeric:tabular-nums;min-width:5.5ch}
.epoca{font-family:"Alegreya Sans",sans-serif;font-size:1.05rem;color:var(--soft)}

.salto{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:50%;width:2.3rem;height:2.3rem;font-size:1.4rem;line-height:1;padding:0}
.attesa{flex-basis:100%;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.attesa div{height:100%;width:0;background:var(--gold)}

.spinta{animation:spinge 1.1s ease-in-out infinite alternate}
@keyframes spinge{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}

.parole{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.4rem 1.2rem;margin:.6rem 0}
.parole h4{margin:.3rem 0 0;font-size:.95rem;color:var(--anglo)}
.parole p{margin:0;font-size:1rem}
.parole div:last-child{grid-column:1/-1}
.gioco-tit{font-weight:600;margin:.8rem 0 .4rem}
.gioco{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.8rem}
.gioco button{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:.3rem .9rem;font-size:1rem}
.gioco button.L{border-color:var(--anglo);color:var(--anglo);font-weight:700}
.gioco button.L::after{content:" (longobarda)";font-size:.8em;font-weight:400}
.gioco button.A{border-color:var(--arabo-ink);color:var(--arabo-ink);font-weight:700}
.gioco button.A::after{content:" (araba)";font-size:.8em;font-weight:400}
.parole h4.ar{color:var(--arabo-ink)}
.gioco button.T{border-color:var(--lapis);color:var(--lapis)}
.gioco button.T::after{content:" (latina)";font-size:.8em}
.spiega a{color:var(--lapis)}

.cartina-it{max-width:27rem;margin:.8rem auto 1rem}
.affianco{display:grid;grid-template-columns:1fr;gap:0 1.4rem;align-items:start}
@media (min-width:700px){.affianco{grid-template-columns:.85fr 1.15fr}.affianco .cartina-it{margin:.2rem 0 0}}
.cartina-it svg{display:block;width:100%;height:auto;border:1.5px solid var(--line);border-radius:6px}
.cartina-it text{font-family:"Alegreya Sans",sans-serif;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.cartina-it figcaption{justify-content:center}

.topo-tit{font-size:1.15rem;margin:1.2rem 0 .3rem}
.radici{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .8rem}
.radici button{border:1.5px solid var(--c);background:none;color:var(--ink);border-radius:999px;padding:.25rem .8rem;font-size:.95rem}
.radici button b{color:var(--c)}
.radici button.on{background:var(--c);color:var(--page)}
.radici button.on b{color:var(--page)}
.cartina-sic{margin:0}
.cartina-sic svg{display:block;width:100%;height:auto;border:1.5px solid var(--line);border-radius:6px}
.cartina-sic text{font-family:"Alegreya Sans",sans-serif;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.cartina-sic text.pal{font-weight:400;fill:var(--soft)}
.topo{cursor:pointer;transition:opacity .3s}
.topo.spento{opacity:.15}
.topo.sel circle{r:9}
.topo:focus{outline:none}.topo:focus-visible circle{stroke:var(--gold);stroke-width:3}
.topo-scheda{border-left:3px solid var(--arabo-ink);padding-left:1rem;min-height:6rem}
.topo-scheda h4{margin:.1rem 0 .3rem;font-size:1.2rem;color:var(--arabo-ink)}
.topo-scheda p{margin:0 0 .4rem;font-size:1rem}
@media (min-width:700px){.topo-box{grid-template-columns:1.25fr .75fr}}

.video{display:inline-block;background:var(--rubric);color:var(--page)!important;text-decoration:none;border-radius:999px;padding:.4rem 1.1rem;font-family:"Alegreya Sans",sans-serif;font-weight:700}
.video:hover{opacity:.9}

.indizi{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.5rem;margin:.5rem 0 .8rem}
.meta{border:1.5px dashed var(--gold);background:none;color:var(--ink);border-radius:6px;padding:.5rem .7rem;text-align:left;font:inherit;font-size:1rem}
.meta::after{content:"?";display:block;color:var(--soft);font-size:.9rem}
.meta.on{border-style:solid;background:var(--tint)}
.meta.on::after{content:"= " attr(data-sol);color:var(--verde);font-weight:700}
.sol{background:var(--tint);padding:.7rem 1rem;border-radius:6px}
.fine1{margin-top:1.4rem;border:2px solid var(--lapis);border-radius:8px;padding:1rem 1.2rem}
.fine1 p{margin-bottom:.7rem}
.prosegui{border:none;background:var(--lapis);color:var(--lapis-ink);border-radius:999px;padding:.45rem 1.2rem;font-weight:700;font-size:1rem}

.guida{margin:.4rem 0 .7rem;padding-left:1.4rem}
.guida li{margin:.35rem 0;padding:.4rem .7rem;background:var(--tint);border-radius:6px}
.guida li::marker{color:var(--gold);font-weight:800}
.prossimo{border:1.5px solid var(--gold);background:none;color:var(--ink);border-radius:999px;padding:.3rem 1rem;font-size:.95rem;margin-bottom:.6rem}

.tavolo{margin:.6rem 0 .2rem;max-width:26rem}
.tavolo svg{display:block;width:100%;height:auto;border-radius:6px}

.dimensione{position:fixed;top:calc(env(safe-area-inset-top,0px) + .6rem);right:.6rem;z-index:20;display:flex;background:var(--page);border:1.5px solid var(--line);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden}
.dimensione button{border:none;background:none;color:var(--ink);font-weight:700;padding:.35rem .7rem;min-width:2.6rem;font-size:16px}
.dimensione button+button{border-left:1px solid var(--line)}
.dimensione button:disabled{opacity:.35;cursor:default}
#tMeno{font-size:13px}#tPiu{font-size:19px}

/* placito */
.pergamena{border-left:4px solid var(--gold);background:var(--tint);padding:1.25rem 1.25rem 1rem;margin:1.25rem 0;border-radius:0 6px 6px 0}
.verso{font-size:1.35rem;font-style:italic;line-height:2.1}
.w{background:none;border:none;border-bottom:2px dotted var(--gold);padding:0 .1rem;color:var(--ink);font-style:italic}
.w[aria-pressed="true"]{border-bottom-style:solid;color:var(--rubric)}
.w[aria-pressed="true"]::after{content:" (" attr(data-oggi) ")";font-style:normal;font-size:.85em;color:var(--verde)}

/* francia */
.due{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1.25rem}
.due > div{border-top:3px solid var(--lapis);padding-top:.75rem}
.due > div:nth-child(2){border-color:var(--rubric)}

blockquote{margin:1.25rem 0;padding:0 0 0 1.25rem;border-left:3px solid var(--rubric);font-style:italic}
blockquote cite{display:block;font-size:.9rem;font-style:normal;color:var(--soft);margin-top:.3rem}

/* linea del tempo */
.tempo{list-style:none;margin:1.5rem 0;padding:0;position:relative}
.tempo::before{content:"";position:absolute;left:5.2rem;top:.4rem;bottom:.4rem;width:2px;background:var(--gold)}
.tempo li{display:grid;grid-template-columns:4.6rem 1fr;gap:1.4rem;margin-bottom:1.1rem;position:relative}
.tempo li::after{content:"";position:absolute;left:4.95rem;top:.45rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--page);border:2px solid var(--gold)}
.anno{font-weight:800;color:var(--lapis);text-align:right;font-size:1rem}
.tempo span{font-size:1rem}

/* domande guida */
.dg{margin:1.25rem 0;border-bottom:1px solid var(--line);padding-bottom:1rem}
.dg label{display:block;font-weight:600;margin-bottom:.4rem}
textarea{width:100%;min-height:5.5rem;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-size:1rem;padding:.6rem}
.traccia-btn{background:none;border:none;color:var(--verde);padding:.3rem 0;font-size:.95rem;text-decoration:underline}
.traccia{display:none;font-size:.98rem;color:var(--soft);margin-top:.3rem}
.traccia.on{display:block}

/* quiz */
.q{margin:1.4rem 0}
.q p{font-weight:600;margin-bottom:.5rem}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:.4rem 1rem;font-size:1rem}
.opt.giusta{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.sbagliata{border-color:var(--no);color:var(--no);text-decoration:line-through}
.esito{font-size:.95rem;margin-top:.4rem;min-height:1.4rem}
.punteggio{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--lapis);color:var(--lapis-ink);padding:.7rem 1.25rem;text-align:center;font-weight:700;margin-top:2rem;border-radius:6px 6px 0 0}
.reset{background:none;border:1.5px solid var(--lapis-ink);color:var(--lapis-ink);border-radius:999px;padding:.15rem .8rem;margin-left:.8rem;font-size:.9rem}
footer{padding:3rem 0 4rem;color:var(--soft);font-size:.9rem}

.tappa-n{display:block;margin:0 0 .45rem!important;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-style:normal!important;opacity:.85}
main section>h2:first-child{margin-top:2.2rem}
</style>
</head>
<body>

<div class="dimensione ui" role="group" aria-label="Dimensione del testo">
  <button id="tMeno" aria-label="Testo più piccolo">A−</button>
  <button id="tReset" aria-label="Dimensione normale del testo">A</button>
  <button id="tPiu" aria-label="Testo più grande">A+</button>
</div>
<header>
  <div class="wrap hero">
    <div class="capo" aria-hidden="true">L</div>
    <div>
      <p class="tappa-n">Tappa 3 di 3</p>
      <h1>Le origini della lingua italiana</h1>
    </div>
  </div>
</header>

<main class="wrap">
<section id="quiz">
  <h2>Mettiti alla prova</h2>
  <div id="qz" class="ui"></div>
  <div class="punteggio ui" aria-live="polite"><span id="score">Risposte giuste: 0 su 0</span><button class="reset" id="reset">Ricomincia</button></div>
</section>
</main>
<footer class="wrap ui">Lezione di italiano, classe terza. Unità 1: Le origini e Dante. · Tappa 3 di 3</footer>

<script>
// Dimensione del testo
(function(){
  const passi=[85,100,115,130,150,175]; let i=1;
  try{const v=+localStorage.getItem('origini-testo');if(passi.includes(v))i=passi.indexOf(v);}catch(e){}
  const meno=document.getElementById('tMeno'),piu=document.getElementById('tPiu');
  function applica(){document.documentElement.style.fontSize=passi[i]+'%';meno.disabled=i===0;piu.disabled=i===passi.length-1;
    try{localStorage.setItem('origini-testo',passi[i])}catch(e){}}
  meno.addEventListener('click',()=>{if(i>0){i--;applica();}});
  piu.addEventListener('click',()=>{if(i<passi.length-1){i++;applica();}});
  document.getElementById('tReset').addEventListener('click',()=>{i=1;applica();});
  applica();
})();
// Quiz
const quiz=[
  ["Perché le lingue volgari si chiamano così?",["Perché erano lingue rozze","Perché le parlava il popolo","Perché le usava la Chiesa"],1,"Volgare viene da volgus, il popolo."],
  ["Quale di queste NON è una lingua romanza?",["Romeno","Portoghese","Tedesco","Ladino"],2,"Il tedesco è una lingua germanica, non deriva dal latino."],
  ["Qual è il più antico documento del volgare italiano?",["Il Placito di Capua","La Chanson de Roland","Il Cantico di frate Sole"],0,"Il Placito di Capua è del 960."],
  ["In che lingua è scritta la Chanson de Roland?",["Lingua d'oc","Latino","Lingua d'oïl"],2,"La lingua d'oïl si parlava nella Francia del centro-nord."],
  ["Dove si sviluppa la lirica d'amore provenzale?",["Nelle corti della Provenza","Nei monasteri","Nelle università"],0,"I trovatori cantavano nelle corti del sud della Francia."],
  ["Qual è il primo testo della letteratura italiana?",["Il Placito di Capua","Il Cantico di frate Sole","Un sonetto di Dante"],1,"Il Placito è un documento giuridico, non un'opera letteraria."],
  ["Quale corrente porta in Italia l'amor cortese dei trovatori?",["La Scuola siciliana","L'epica carolingia","Il Dolce Stil Novo"],0,"Alla corte di Federico II, nella prima metà del Duecento."],
  ["In quale corrente poetica si forma il giovane Dante?",["Scuola siciliana","Dolce Stil Novo","Lirica provenzale"],1,"Il Dolce Stil Novo nasce a Firenze."]
];
const qz=document.getElementById('qz');let giuste=0,date=0;
function score(){document.getElementById('score').textContent=`Risposte giuste: ${giuste} su ${date}`;}
function build(){
  qz.innerHTML='';giuste=0;date=0;score();
  quiz.forEach(([d,opts,ok,spieg],i)=>{
    const q=document.createElement('div');q.className='q';
    q.innerHTML=`<p>${i+1}. ${d}</p><div class="opts"></div><div class="esito" aria-live="polite"></div>`;
    const o=q.querySelector('.opts'),es=q.querySelector('.esito');
    opts.forEach((t,j)=>{
      const b=document.createElement('button');b.className='opt';b.textContent=t;
      b.addEventListener('click',()=>{
        if(q.dataset.fatto)return;q.dataset.fatto=1;date++;
        o.children[ok].classList.add('giusta');
        if(j===ok){giuste++;es.textContent='Esatto. '+spieg;es.style.color='var(--ok)';}
        else{b.classList.add('sbagliata');es.textContent='Non proprio. '+spieg;es.style.color='var(--no)';}
        score();
      });
      o.append(b);
    });
    qz.append(q);
  });
}
document.getElementById('reset').addEventListener('click',build);
build();
