<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parole giovani</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: un tavolo su cui sono stese le card; in alto testata e viste (alfabetico, nuvola, campi, edizioni), sotto il mazzo; una card aperta si ingrandisce al centro e si gira */
:root{
  --scale:1;
  --bg:#eef1f5; --table:#e4e8ef; --surface:#ffffff; --ink:#1b2230; --muted:#5b6578; --rule:#d5dbe4; --accent:#2b4fa3; --shade:rgb(20 30 50 / .14);
  --e23:#7a5aa6; --e24:#2f7d6d; --e25:#b5652b; --e26:#2b4fa3; --empty:#e6e9ef; --c-sig:#2f6f8f; --c-lex:#8a5a1f; --tint-sig:#eaf2f6; --tint-lex:#f6efe4;
  --c-emozioni:#c2410c; --c-relazioni:#be185d; --c-famiglia:#a16207; --c-scuola:#1d4ed8; --c-carattere:#6d28d9; --c-mente:#4338ca;
  --c-natura:#15803d; --c-tempo:#0e7490; --c-luoghi:#9a3412; --c-gioco:#b45309; --c-parole:#7e22ce; --c-societa:#334155;
  --f-lemma:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --table:#161b24; --surface:#1d2330; --ink:#e7eaf0; --muted:#9aa3b4; --rule:#2e3544; --accent:#8fa9ec; --shade:rgb(0 0 0 / .45);
  --e23:#b49ae0; --e24:#6cc3ae; --e25:#e8a46e; --e26:#8fa9ec; --empty:#262d3a; --c-sig:#7cc0e0; --c-lex:#e0b277; --tint-sig:#18242c; --tint-lex:#2a2318;
  --c-emozioni:#fb923c; --c-relazioni:#f472b6; --c-famiglia:#facc15; --c-scuola:#60a5fa; --c-carattere:#a78bfa; --c-mente:#818cf8;
  --c-natura:#4ade80; --c-tempo:#22d3ee; --c-luoghi:#fdba74; --c-gioco:#fbbf24; --c-parole:#d8b4fe; --c-societa:#94a3b8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --table:#161b24; --surface:#1d2330; --ink:#e7eaf0; --muted:#9aa3b4; --rule:#2e3544; --accent:#8fa9ec; --shade:rgb(0 0 0 / .45);
  --e23:#b49ae0; --e24:#6cc3ae; --e25:#e8a46e; --e26:#8fa9ec; --empty:#262d3a; --c-sig:#7cc0e0; --c-lex:#e0b277; --tint-sig:#18242c; --tint-lex:#2a2318;
  --c-emozioni:#fb923c; --c-relazioni:#f472b6; --c-famiglia:#facc15; --c-scuola:#60a5fa; --c-carattere:#a78bfa; --c-mente:#818cf8;
  --c-natura:#4ade80; --c-tempo:#22d3ee; --c-luoghi:#fdba74; --c-gioco:#fbbf24; --c-parole:#d8b4fe; --c-societa:#94a3b8; color-scheme:dark}
html{font-size:calc(16px * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5}
.wrap{max-width:72rem;margin:0 auto;padding-block:1.5rem 5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:1.25rem}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-lemma);font-weight:700;font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.15;margin:.2rem 0 0;text-wrap:balance}
.lede{color:var(--muted);margin:.4rem 0 0;max-width:44rem}

/* link edizioni */
.edlinks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-top:1rem;max-width:44rem}
@media (max-width:520px){.edlinks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.edlinks a{display:flex;flex-direction:column;gap:.1rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--c);border-radius:8px;padding:.55rem .7rem}
.edlinks a b{font-family:var(--f-lemma);font-size:1.25rem;color:var(--c)}
.edlinks a span{font-size:.82rem;color:var(--muted)}
.edlinks a:hover span{color:var(--accent);text-decoration:underline}
.where-h{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
.where{list-style:none;margin:0 0 1rem;padding:0;display:flex;flex-direction:column;gap:.45rem}
.where li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center;border:1px solid var(--rule);border-left:5px solid var(--c);border-radius:8px;padding:.5rem .7rem}
.where .wy{font-family:var(--f-mono);font-weight:500;color:var(--c)}
.where .wt{font-size:.9rem}
.where a{font-size:.85rem;color:var(--accent);white-space:nowrap}
.note2{font-size:.9rem;color:var(--muted);margin:-.4rem 0 1rem}
.try{border-top:1px dashed var(--rule);padding-top:.9rem;font-family:var(--f-lemma);font-size:.98rem;line-height:1.55}
.try ol{margin:.3rem 0 .8rem;padding-left:1.3rem}
.hint2{font-size:.88rem;color:var(--muted);margin:0}
/* copertine */
.covers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:1.2rem;max-width:44rem}
@media (max-width:520px){.covers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cover{display:flex;flex-direction:column;gap:.1rem;text-decoration:none;color:var(--ink);min-width:0}
.cover img{width:100%;height:auto;aspect-ratio:368/520;border-radius:4px;box-shadow:0 2px 8px var(--shade);border-bottom:4px solid var(--c);margin-bottom:.35rem;background:var(--empty)}
@media (prefers-reduced-motion:no-preference){.cover img{transition:transform .15s,box-shadow .15s}.cover:hover img{transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 18px var(--shade)}}
.cover .cy{font-family:var(--f-mono);font-size:.8rem;font-weight:500;color:var(--c)}
.cover .cn{font-size:.85rem;line-height:1.25}
.cover .cl{font-size:.78rem;color:var(--accent)}
.cover:hover .cl{text-decoration:underline}

/* barra viste + filtri */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:.6rem;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:.55rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:.25rem;background:var(--table);border-radius:8px;padding:.25rem}
.tab{font:inherit;font-size:.92rem;border:0;background:transparent;color:var(--muted);padding:.35rem .8rem;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px var(--shade)}
input[type=search],select{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.4rem .6rem}
input[type=search]{flex:1 1 12rem;min-width:0}
.chip{font:inherit;font-size:.85rem;cursor:pointer;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:.25rem .7rem;display:inline-flex;gap:.4rem;align-items:center}
.chip .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip[aria-pressed="false"] .dot{background:var(--empty);outline:1px solid var(--c)}
.count{font-size:.85rem;color:var(--muted);margin-left:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* il mazzo */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.8rem}
.mini{position:relative;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:.85rem .85rem .7rem;min-height:7.6rem;display:flex;flex-direction:column;gap:.3rem;cursor:pointer;box-shadow:0 1px 2px var(--shade);overflow:hidden}
.mini::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--cf)}
@media (prefers-reduced-motion:no-preference){.mini{transition:transform .15s,box-shadow .15s}.mini:hover{transform:translateY(-3px) rotate(-.6deg);box-shadow:0 8px 18px var(--shade)}}
.mini .lm{font-family:var(--f-lemma);font-weight:600;font-size:1.25rem;line-height:1.2;overflow-wrap:anywhere}
.mini .ct{font-family:var(--f-lemma);font-style:italic;color:var(--muted);font-size:.85rem}
.mini .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.dots{display:flex;gap:.2rem}
.dots i{width:.55rem;height:.55rem;border-radius:2px;background:var(--empty)}
.dots i.on{background:var(--c)}
.ndef{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.section-h{display:flex;align-items:baseline;gap:.6rem;margin:1.4rem 0 .6rem;border-bottom:1px solid var(--rule);padding-bottom:.25rem;scroll-margin-top:9rem}
.section-h h2{font-family:var(--f-lemma);font-size:1.35rem;margin:0}
.section-h .sw{width:.8rem;height:.8rem;border-radius:3px;background:var(--cf);align-self:center}
.section-h span{color:var(--muted);font-size:.85rem}
.letters{display:flex;flex-wrap:wrap;gap:.1rem}
.letters a{font-family:var(--f-lemma);font-weight:600;text-decoration:none;color:var(--accent);padding:.05rem .32rem;border-radius:4px}
.letters a:hover{background:var(--table)}

/* campi a scomparsa */
.foldtools{display:flex;gap:.4rem;justify-content:flex-end;margin:.8rem 0 .4rem}
.fold{border:1px solid var(--rule);border-left:6px solid var(--cf);border-radius:10px;background:var(--surface);margin-bottom:.6rem}
.fold summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.15rem .7rem;align-items:baseline;padding:.8rem 1rem}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";grid-column:3;grid-row:1;font-family:var(--f-mono);font-size:1.2rem;color:var(--muted);justify-self:end}
.fold[open] summary::after{content:"−"}
.fold .sw{width:.8rem;height:.8rem;border-radius:3px;background:var(--cf);align-self:center}
.fold .ft1{font-family:var(--f-lemma);font-weight:700;font-size:1.2rem}
.fold .fn{grid-column:2;font-size:.82rem;color:var(--muted)}
.fold .fx{grid-column:2;font-family:var(--f-lemma);font-style:italic;font-size:.9rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open] .fx{display:none}
.fold .deck{padding:0 1rem 1rem}

/* nuvola */
.cloud{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1.5rem 1.2rem;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:.35rem .9rem;line-height:1.1}
.cloud button{font-family:var(--f-lemma);border:0;background:none;padding:.1rem .15rem;cursor:pointer;color:var(--cf);font-weight:600;border-radius:4px}
.cloud button:hover{background:var(--table)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.82rem;color:var(--muted);margin-top:.6rem}
.legend span{display:inline-flex;gap:.35rem;align-items:center}
.legend i{width:.7rem;height:.7rem;border-radius:3px;background:var(--cf)}
.cloudnote{font-size:.85rem;color:var(--muted);margin:.4rem 0 0}

.empty{color:var(--muted);padding:2rem 0;text-align:center}

/* card aperta */
.scrim{position:fixed;inset:0;z-index:30;background:rgb(10 14 22 / .55);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.stage{width:min(100%,36rem);height:min(100%,42rem);display:flex;flex-direction:column;gap:.6rem;perspective:1600px}
.flip{position:relative;flex:1;min-height:0;transform-style:preserve-3d}
@media (prefers-reduced-motion:no-preference){.flip{transition:transform .6s cubic-bezier(.3,.7,.2,1)}}
.flip.back{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:16px;box-shadow:0 20px 50px rgb(0 0 0 / .35);overflow:hidden;display:flex;flex-direction:column}
.face::before{content:"";flex:0 0 10px;background:var(--cf)}
.front{align-items:stretch;cursor:pointer}
.front .inner{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.8rem;padding:2rem 1.5rem;text-align:center}
.front .big{font-family:var(--f-lemma);font-weight:700;font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.05;overflow-wrap:anywhere}
.front .ct{font-family:var(--f-lemma);font-style:italic;color:var(--muted);font-size:1.1rem}
.front .campo{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cf)}
.front .eds{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center}
.edtag{font-family:var(--f-mono);font-size:.75rem;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.hint{font-size:.85rem;color:var(--muted);padding:.8rem;text-align:center;border-top:1px dashed var(--rule)}
.backf{transform:rotateY(180deg)}
.bhead{display:flex;flex-direction:column;gap:.4rem;padding:.9rem 1.2rem .6rem;border-bottom:1px solid var(--rule)}
.bhead .t{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.bhead .lm{font-family:var(--f-lemma);font-weight:700;font-size:1.5rem}
.dtabs{display:flex;gap:.3rem;flex-wrap:wrap}
.dtab{font-family:var(--f-mono);font-size:.75rem;padding:.2rem .55rem;border-radius:999px;border:1px solid var(--c);color:var(--c);background:transparent;cursor:pointer}
.dtab[aria-selected="true"]{background:var(--c);color:var(--surface);font-weight:500}
.bbody{flex:1;overflow-y:auto;padding:1rem 1.2rem 1.4rem;overscroll-behavior:contain}
.def{max-width:62ch}
.def .meta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin:0 0 .5rem}
.def .hd{font-family:var(--f-lemma);font-size:.92rem;color:var(--muted);margin:0 0 .7rem;line-height:1.45}
.def .bd{font-family:var(--f-lemma);font-size:1.02rem;line-height:1.62;margin:0}
.def .sy{font-size:.88rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:.6rem;margin:.9rem 0 0}
.def + .def{margin-top:1.4rem;padding-top:1.2rem;border-top:3px double var(--rule)}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.ctrl button{font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:.45rem .9rem;cursor:pointer}
.ctrl .pos{font-family:var(--f-mono);font-size:.78rem;color:#e7eaf0}
.ctrl .flipbtn{font-weight:700}


/* parole della rete */
.rete-intro{color:var(--muted);max-width:46rem;margin:.6rem 0 0}
.rete-q{background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--c-parole);border-radius:10px;padding:.8rem 1rem;margin:1rem 0 .4rem;max-width:46rem}
.rete-q h3{margin:0 0 .3rem;font-family:var(--f-lemma);font-size:1.05rem}
.rete-q ul{margin:.2rem 0 0;padding-left:1.2rem;font-size:.95rem}
.rete-sub{color:var(--muted);font-size:.9rem;margin:-.3rem 0 .7rem}
.miss{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 0}
.miss span{font-family:var(--f-lemma);font-size:.95rem;border:1.5px dashed var(--rule);border-radius:8px;padding:.25rem .6rem;color:var(--muted)}
/* thesaurus */
.thes-intro{color:var(--muted);max-width:46rem;margin:0 0 .8rem}
.thes-pick{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem}
.thes-pick button{font-family:var(--f-lemma);font-size:.95rem;font-weight:600;border:1px solid var(--rule);border-left:4px solid var(--cf);background:var(--surface);color:var(--ink);border-radius:6px;padding:.25rem .6rem;cursor:pointer}
.thes-pick button[aria-pressed="true"]{background:var(--cf);color:var(--surface);border-color:var(--cf)}
.thes-pick button[style*="--muted"]{font-weight:400}
.pick-h{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .4rem}
.thes-more{border:1px solid var(--rule);border-radius:10px;background:var(--surface);margin-bottom:1rem}
.thes-more summary{cursor:pointer;padding:.6rem .9rem;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.thes-more[open] summary{border-bottom:1px solid var(--rule);margin-bottom:.6rem}
.pick-row{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.4rem;padding:0 .9rem}
.pick-row .thes-pick{margin-bottom:.5rem}
.pick-l{font-family:var(--f-lemma);font-weight:700;color:var(--muted);padding-top:.2rem}
.wheel{position:relative;height:48rem;background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.wheel svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wheel svg.links line{stroke:var(--rule);stroke-width:1.5}
.wheel .half{position:absolute;top:0;bottom:0;width:50%;pointer-events:none}
.wheel .half.l{left:0;background:radial-gradient(circle at 100% 50%,transparent 9rem,var(--tint-sig) 9rem)}
.wheel .half.r{right:0;background:radial-gradient(circle at 0% 50%,transparent 9rem,var(--tint-lex) 9rem)}
.wheel .zone{position:absolute;top:.8rem;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wheel .zone.l{left:1rem}.wheel .zone.r{right:1rem;text-align:right}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9rem;height:9rem;border-radius:50%;background:var(--cf);color:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:0;cursor:pointer;font:inherit;box-shadow:0 6px 20px var(--shade);z-index:2}
.hub b{font-family:var(--f-lemma);font-size:1.45rem;line-height:1.1;padding:0 .4rem;overflow-wrap:anywhere}
.hub small{font-size:.7rem;opacity:.9;margin-top:.3rem}
.box{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:14.5rem;background:var(--surface);border:1.5px solid var(--bc);border-radius:10px;padding:.45rem .65rem .55rem;box-shadow:0 2px 6px var(--shade);z-index:1}
.box h3{margin:0 0 .25rem;font-family:var(--f-mono);font-size:.68rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--bc)}
.box p{margin:0;font-family:var(--f-lemma);font-size:.92rem;line-height:1.4}
.box .lk{font:inherit;border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;cursor:pointer;font-weight:600}
.lk2{font:inherit;border:0;background:none;padding:0;color:var(--ink);text-decoration:underline dashed;text-decoration-color:var(--muted);text-underline-offset:3px;cursor:pointer}
.box.sig{--bc:var(--c-sig)}.box.lex{--bc:var(--c-lex)}
.thes-legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.85rem;color:var(--muted);margin-top:.6rem}
.thes-legend .lk{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;font-weight:600}
@media (max-width:760px){
  .wheel{height:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
  .wheel svg.links,.wheel .half{display:none}
  .wheel .zone{position:static;margin-top:.6rem}
  .hub{position:static;transform:none;margin:0 auto .4rem;width:8rem;height:8rem}
  .box{position:static;transform:none;max-width:none;width:auto}
}
.thesbtn{font:inherit;font-size:.85rem;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:.25rem .7rem;cursor:pointer;align-self:flex-start}

/* zoom */
.zoom{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:.35rem;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:.3rem;box-shadow:0 2px 10px var(--shade)}

function render(){

      ORDER.push(...g)});

  if(state.view==="rete"){
    const ks=new Set(list.map(w=>w.k)); let used=new Set();
    h+=`<p class="rete-intro">Le parole del Piccolo Dizionario nate nei social e nelle chat, o che le classi hanno definito pensando alla vita online. Un punto di partenza per lavorare sulla <b>cittadinanza digitale</b> e sulla comunicazione non ostile.</p>
      <div class="rete-q"><h3>Per ogni parola, chiediti</h3><ul><li>Dove la usi: chat, social, videogiochi, a voce?</li><li>Che effetto fa su chi la riceve: include o esclude, ferisce o fa ridere?</li><li>Esiste un modo più rispettoso per dire la stessa cosa?</li><li>Da dove viene? Molte arrivano dall'inglese: qual è la parola originale?</li></ul></div>`;
    RETE.forEach(([t,sub,keys])=>{const g=keys.filter(k=>ks.has(k)&&BYK[k]).map(k=>BYK[k]); if(!g.length)return; g.forEach(w=>used.add(w.k));

      ORDER.push(...g)});
    h+=`<div class="section-h"><i class="sw" style="--cf:var(--rule)"></i><h2>Parole che mancano</h2><span>da definire in classe</span></div><p class="rete-sub">Non sono ancora nel Piccolo Dizionario. Sceglietene una e scrivetene la definizione seguendo lo schema delle card.</p><div class="miss">${RETE_MANCANTI.map(x=>`<span>${x}</span>`).join("")}</div>`;
  }
  if(state.view==="nuvola"){

    const max=Math.max(...list.map(weight));
    h=`<div class="cloud">${sh.map(w=>{const s=0.9+ (weight(w)-1)/(Math.max(max-1,1))*2.1;return `<button type="button" data-k="${w.k}" style="--cf:${fcol(w.cp)};font-size:${s.toFixed(2)}rem" title="${w.d.length} definizion${w.d.length>1?"i":"e"} · ${w.eds.join(", ")}">${w.f}</button>`}).join("")}</div>

      <div class="legend">${DATA.campi.map(([k,n])=>`<span style="--cf:${fcol(k)}"><i></i>${n}</span>`).join("")}</div>`;
    ORDER=sh;
  }
  out.innerHTML=h; save();
  if(state.view==="campi"){
    out.querySelectorAll("details.fold").forEach(d=>d.addEventListener("toggle",()=>{d.open?openFolds.add(d.dataset.c):openFolds.delete(d.dataset.c)}));
    $("openall").onclick=()=>out.querySelectorAll("details.fold").forEach(d=>d.open=true);
    $("closeall").onclick=()=>out.querySelectorAll("details.fold").forEach(d=>d.open=false);
  }
}

const THES=DATA.thes||[];

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wordHTML(x){const k=strip(x);
  if(BYK[k]) return `<button type="button" class="lk" data-lk="${k}" title="Apri la card del Piccolo Dizionario">${esc(x)}</button>`;

let otherOpen=false;
function chipTH(h){const w=BYK[strip(h.p)];return `<button type="button" data-th="${strip(h.p)}" style="--cf:${w?fcol(w.cp):"var(--muted)"}" aria-pressed="${strip(h.p)===state.thes}">${esc(w?w.f:h.p)}</button>`}
function pickHTML(heads){
  if(!heads.length) return `<p class="empty">Nessuna ruota per questa ricerca.</p>`;
  const dic=heads.filter(h=>BYK[strip(h.p)]), oth=heads.filter(h=>!BYK[strip(h.p)]).sort((a,b)=>strip(a.p).localeCompare(strip(b.p),"it"));
  const sel=THK[state.thes], selOther=sel&&!BYK[strip(sel.p)];
  const groups={}; oth.forEach(h=>{const L=strip(h.p)[0].toUpperCase();(groups[L]=groups[L]||[]).push(h)});
  return `${dic.length?`<p class="pick-h">Parole del Piccolo Dizionario · ${dic.length}</p><div class="thes-pick" role="group" aria-label="Ruote delle parole del dizionario">${dic.map(chipTH).join("")}</div>`:""}

function renderThes(){

  const tm=$("thesmore"); if(tm) tm.addEventListener("toggle",()=>{otherOpen=tm.open});
  const links=[...new Set([strip(t.p),...[...$("wheel").querySelectorAll("[data-lk]")].map(b=>b.dataset.lk)])].filter(k=>BYK[k]);
  ORDER=links.map(k=>BYK[k]);
  placeWheel();

function placeWheel(){
  const wh=$("wheel"); if(!wh) return;
  const svg=$("wlinks"); svg.innerHTML="";
  if(matchMedia("(max-width:760px)").matches){wh.querySelectorAll(".box").forEach(b=>{b.style.left=b.style.top=""});return}
  const W0=wh.clientWidth,H0=wh.clientHeight,cx=W0/2,cy=H0/2;
  const put=(boxes,a0,a1)=>{const n=boxes.length;boxes.forEach((b,i)=>{
    const a=(n===1?(a0+a1)/2:a0+(a1-a0)*i/(n-1))*Math.PI/180;
    const rx=Math.min(W0/2-b.offsetWidth/2-14, W0*0.36), ry=H0/2-b.offsetHeight/2-34;
    const x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    b.style.left=x+"px"; b.style.top=y+"px";
    svg.insertAdjacentHTML("beforeend",`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`)})};
  const sig=[...wh.querySelectorAll(".box.sig")], lex=[...wh.querySelectorAll(".box.lex")];
  put(sig,-125,-235); put(lex,-62,62);
}
addEventListener("resize",()=>{if(state.view==="thes")placeWheel()});
$("out").addEventListener("click",e=>{
  const th=e.target.closest("[data-th]"); if(th){const fromWheel=th.classList.contains("lk2");state.thes=th.dataset.th;render();if(fromWheel&&$("wheel"))$("wheel").scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  const lk=e.target.closest("[data-lk]"); if(lk){e.stopPropagation();openCard(lk.dataset.lk)}
},true);
function goThes(k){closeCard();state.view="thes";state.thes=k;render();window.scrollTo({top:0})}

const weight=w=>w.d.length+w.eds.length-1;
function hash(s){let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))%9973;return x}

$("out").addEventListener("click",e=>{const b=e.target.closest("[data-k]"); if(b) openCard(b.dataset.k)});

/* card aperta */
let cur=-1,lastFocus=null;
function openCard(k){cur=ORDER.findIndex(w=>w.k===k); if(cur<0)return; lastFocus=document.activeElement; show(false); $("scrim").hidden=false; document.body.style.overflow="hidden"; $("front").focus()}
function closeCard(){ $("scrim").hidden=true; document.body.style.overflow=""; if(lastFocus)lastFocus.focus()}
function show(back){
  const w=ORDER[cur]; const col=fcol(w.cp);
  $("front").style.setProperty("--cf",col); $("backf").style.setProperty("--cf",col);
  $("front").innerHTML=`<div class="inner"><span class="campo">${CAMPI[w.cp]}</span><span class="big" id="bigword">${w.f}</span><span class="ct">${w.c}</span><span class="eds">${w.eds.map(y=>`<span class="edtag" style="--c:${ECOL[y]}">${y}</span>`).join("")}</span></div><div class="hint">${w.d.length>1?`${w.d.length} definizioni da leggere · `:""}tocca per girare</div>`;
  $("backf").innerHTML=`<div class="bhead"><div class="t"><span class="lm">${w.f}</span><span class="ct" style="font-family:var(--f-lemma);font-style:italic;color:var(--muted)">${w.c}</span></div>${THK[w.k]?`<button type="button" class="thesbtn" id="gothes">Ruota nel Thesaurus →</button>`:""}</div>
    <div class="bbody" id="bbody">
      <p class="where-h">Leggi la definizione scritta dalle classi</p>
      <ul class="where">${w.d.map(d=>`<li style="--c:${ECOL[d.ed]}"><span class="wy">${d.ed}</span><span class="wt">${EDNAME[d.ed]} · pagina ${d.pag}</span><a href="${PDF[d.ed]}#page=${d.pag}" target="_blank" rel="noopener">Apri il PDF ↗</a></li>`).join("")}</ul>
      ${w.d.length>1?`<p class="note2">Questa parola ha ${w.d.length} definizioni diverse: confrontale!</p>`:""}
      <div class="try"><p class="where-h">Prova tu</p><p>Scrivi la tua definizione di <b>${w.f}</b> seguendo lo schema del dizionario:</p>
      <ol><li>la parola con l'accento: <i>${w.f}</i></li><li>la categoria grammaticale: <i>${w.c}</i></li><li>l'etimologia, tra parentesi quadre: da dove viene la parola?</li><li>i significati, numerati 1., 2., 3.…</li><li>che cosa significa <b>per te</b> e per la tua classe</li><li>sinonimi e contrari</li></ol>
      <p class="hint2">Campo semantico: <b style="color:${fcol(w.cp)}">${CAMPI[w.cp]}</b></p></div>
    </div>`;
  if($("gothes")) $("gothes").onclick=ev=>{ev.stopPropagation();goThes(w.k)};
  $("flip").classList.toggle("back",!!back);
  $("flipbtn").textContent=back?"Torna alla parola":"Gira";
  $("pos").textContent=`${cur+1} / ${ORDER.length}`;
}
const flip=()=>{const b=!$("flip").classList.contains("back");$("flip").classList.toggle("back",b);$("flipbtn").textContent=b?"Torna alla parola":"Gira"};
$("front").onclick=flip; $("flipbtn").onclick=flip;
$("front").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
$("prev").onclick=()=>{cur=(cur-1+ORDER.length)%ORDER.length;show(false)};
$("next").onclick=()=>{cur=(cur+1)%ORDER.length;show(false)};
$("close").onclick=closeCard;
$("scrim").onclick=e=>{if(e.target===$("scrim"))closeCard()};
document.addEventListener("keydown",e=>{if($("scrim").hidden)return;
  if(e.key==="Escape")closeCard(); else if(e.key==="ArrowRight")$("next").click(); else if(e.key==="ArrowLeft")$("prev").click()});

render();

/* zoom */
let z=1; try{z=parseFloat(localStorage.getItem("pdz-zoom"))||1}catch(e){}
function setZ(v){z=Math.min(1.8,Math.max(0.7,Math.round(v*10)/10));document.documentElement.style.setProperty("--scale",z);$("zval").textContent=Math.round(z*100)+"%";try{localStorage.setItem("pdz-zoom",z)}catch(e){}}
$("zin").onclick=()=>setZ(z+.1); $("zout").onclick=()=>setZ(z-.1); setZ(z);
</script>

</body>
</html>
